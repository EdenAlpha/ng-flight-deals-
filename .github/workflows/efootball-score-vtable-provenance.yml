name: eFootball score vtable provenance

on:
  pull_request:
    branches: [ efootball-score-analysis-base-2026-08-24 ]
    types: [opened, synchronize, reopened]

jobs:
  vtable-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: efootball-score-wire-bridge-v3-2026-08-24
      - name: Download current arm64 binary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl binutils-aarch64-linux-gnu >/dev/null
          mkdir -p /tmp/ef/bundle /tmp/ef/native /tmp/out
          curl -L --fail --retry 5 -A 'Mozilla/5.0' -o /tmp/ef/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          unzip -q /tmp/ef/efootball.xapk -d /tmp/ef/bundle
          NATIVE=$(find /tmp/ef/bundle -type f -name 'config.arm64_v8a.apk' | head -n1)
          unzip -q "$NATIVE" -d /tmp/ef/native
      - name: Find function-pointer and relocation references to score composite
        run: |
          LIB=/tmp/ef/native/lib/arm64-v8a/libUE4.so
          OUT=/tmp/out/efootball-score-vtable-provenance.txt
          python3 - "$LIB" > "$OUT" <<'PY'
          import sys,struct,subprocess,re
          p=sys.argv[1]; data=open(p,'rb').read(); target=0x7d46058
          print('=== RAW 64-BIT POINTER HITS FOR 0x7d46058 ===')
          pat=struct.pack('<Q',target)
          hits=[]; pos=0
          while True:
              pos=data.find(pat,pos)
              if pos<0: break
              hits.append(pos); print(f'file_off=0x{pos:x}')
              pos+=1
          print(f'raw_hit_count={len(hits)}')
          print('\n=== RELOCATION HITS ===')
          rel=subprocess.run(['aarch64-linux-gnu-readelf','-rW',p],text=True,capture_output=True).stdout
          rows=[x for x in rel.splitlines() if '7d46058' in x.lower()]
          print('\n'.join(rows) if rows else 'NONE')
          print('\n=== NEARBY QWORDS AROUND RAW HITS ===')
          for h in hits:
              print(f'-- around file_off=0x{h:x} --')
              for off in range(max(0,h-0x80),min(len(data)-8,h+0x88),8):
                  v=struct.unpack_from('<Q',data,off)[0]
                  mark=' <TARGET>' if off==h else ''
                  print(f'0x{off:x}: 0x{v:x}{mark}')
          PY
          echo '=== ELF SECTIONS ===' >> "$OUT"
          aarch64-linux-gnu-readelf -SW "$LIB" >> "$OUT"
          grep -nE 'TARGET|raw_hit_count|7d46058|\.data|\.rodata|\.rela' "$OUT" || true
      - uses: actions/upload-artifact@v4
        with:
          name: efootball-score-vtable-provenance
          path: /tmp/out/efootball-score-vtable-provenance.txt
          retention-days: 7
