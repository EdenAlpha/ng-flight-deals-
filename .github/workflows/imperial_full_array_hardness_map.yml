name: Imperial full-array hardness map

on:
  pull_request:
    paths:
      - 'research/imperial_full_array_hardness_map.py'
      - '.github/workflows/imperial_full_array_hardness_map.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Map local hardness statistics
        run: python research/imperial_full_array_hardness_map.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-full-array-hardness-map
          path: imperial_full_array_hardness_map.json
          retention-days: 7
