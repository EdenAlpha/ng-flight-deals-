name: Imperial dense AR32 state feedback

on:
  pull_request:
    paths:
      - 'research/imperial_ar32_state_feedback_dense_lattice.py'
      - '.github/workflows/imperial_ar32_state_feedback_dense_lattice.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Search dense legal AR32 decoder-state trajectories
        run: python research/imperial_ar32_state_feedback_dense_lattice.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_state_feedback_dense_lattice.json'))
          for region in ('hard','easy'):
              r=[q for q in d['rows'] if q['region']==region]
              g=min(q['same_step_greedy_bytes'] for q in r if q['step']==267)
              b=min(r,key=lambda q:q['bytes'])
              print(f"::notice title=dense-state {region}::best={b['bps']:.5f} step={b['step']} mode={b['mode']} sameStepGain={b['same_step_gain']:.5f} vs267={g/b['bytes']:.5f} changed={100*b['changed_fraction']:.1f}% candidates={b['mean_candidates_per_step']:.2f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-dense-ar32-state-feedback
          path: imperial_ar32_state_feedback_dense_lattice.json
          retention-days: 7
