name: General seismic codec portfolio gate

on:
  pull_request:
    branches:
      - general-seismic-benchmark-v1
  workflow_dispatch:

jobs:
  codec-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install codec dependencies
        run: pip install --quiet numpy zstandard
      - name: Run exact portfolio encode/decode gate
        run: |
          python research/general_seismic_codec_portfolio.py \
            --self-test \
            --config benchmarks/general_seismic_codec_portfolio_v1.json \
            | tee general_seismic_codec_portfolio_gate.json
      - name: Validate router exercised both engine families
        run: |
          python - <<'PY'
          import json
          x=json.load(open('general_seismic_codec_portfolio_gate.json'))
          engines={r['selected_engine'] for r in x}
          assert 'spectral_topn' in engines, engines
          assert 'ar32_zsm' in engines, engines
          for r in x:
              assert r['maxerr'] <= r['eps'], r
          print('PASS engines=',sorted(engines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: general-seismic-codec-portfolio-gate
          path: general_seismic_codec_portfolio_gate.json
