name: PeerLink multi-transport terminal detector validation

on:
  pull_request:
    branches: [ peerlink-score-reader-base-2026-08-24 ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  detector-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peerlink-score-reader-2026-08-24
          fetch-depth: 0

      - name: Apply multi-transport detector patch
        run: |
          set -euo pipefail
          STAGE=.github/workflows/peerlink-score-detector-v2.yml
          if [ ! -f "$STAGE" ]; then
            echo "Detector stage already consumed; validating committed source."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          y = Path('.github/workflows/peerlink-score-detector-v2.yml').read_text()
          marker = "python3 - <<'PY'\n"
          raw = y.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(compile(code, '<multi-transport-detector-stage>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd peerlink-source
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Commit verified detector source
        run: |
          set -euo pipefail
          rm -f .github/workflows/peerlink-score-detector-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No detector source changes to commit."
            exit 0
          fi
          git commit -m "Support custom-P2P and DTLS match-end score triggers"
          git push origin HEAD:peerlink-score-reader-2026-08-24
