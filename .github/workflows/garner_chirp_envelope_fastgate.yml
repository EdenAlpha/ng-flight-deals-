name: Garner chirp-envelope controlled-source fast gate
on:
  pull_request:
    branches: [garner-valley-das-independent-gate]
permissions: {contents: read}
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy h5py segyio zstandard pysz
      - run: curl -L --fail --retry 4 --retry-delay 3 -o garner.sgy 'https://gdr.openei.org/files/481/large%20shaker%20NEES_130910161319%20%281%29.sgy'
      - run: python research/garner_chirp_envelope_fastgate.py garner.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: garner-chirp-envelope-fastgate
          path: garner_chirp_envelope_fastgate.json
          retention-days: 7
