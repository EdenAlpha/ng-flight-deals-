name: Build CLM Tulu3 fresh holdout

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_clm_tulu_fresh_holdout.py'
      - '.github/workflows/build-clm-tulu-fresh-holdout.yml'

concurrency:
  group: clm-tulu-fresh-holdout
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install 'datasets>=3.0' huggingface_hub 'sentencepiece>=0.2' zstandard
      - name: Reuse frozen CLM tokenizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9243128836/zip" -o /tmp/clm-general.zip
          unzip -j /tmp/clm-general.zip clm_general_16k.model -d /tmp
      - name: Build never-used post-100M holdout
        env:
          CLM_TOKENIZER: /tmp/clm_general_16k.model
          HF_HUB_ENABLE_HF_TRANSFER: '0'
        run: python scripts/build_clm_tulu_fresh_holdout.py
      - name: Show manifest
        if: always()
        run: test -f clm_tulu3_fresh_holdout/manifest.json && cat clm_tulu3_fresh_holdout/manifest.json || true
      - name: Upload holdout
        uses: actions/upload-artifact@v4
        with:
          name: clm-tulu3-fresh-10m
          path: clm_tulu3_fresh_holdout/
          compression-level: 6
          retention-days: 7
