name: Soda Lake raw-land Brady-transfer benchmark
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  raw-land:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install benchmark dependencies
        run: pip install --quiet numpy segyio zstandard pysz boto3
      - name: Select and download three deterministic raw shots
        shell: bash
        run: |
          python - <<'PY'
          import boto3,json,os
          from botocore import UNSIGNED
          from botocore.config import Config
          bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/'
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          keys=[]
          for page in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in page.get('Contents',[]):
              k=o['Key'];kl=k.lower()
              if kl.endswith(('.sgy','.segy','.seg')) and o['Size']>3600: keys.append((k,int(o['Size'])))
          keys.sort()
          if len(keys)<3: raise SystemExit(f'only {len(keys)} SEG-Y objects found')
          inds=sorted(set([round((len(keys)-1)*p) for p in (0.1,0.5,0.9)]))
          while len(inds)<3: inds.append(min(len(keys)-1,inds[-1]+1))
          chosen=[keys[i] for i in inds[:3]]
          os.makedirs('shots',exist_ok=True);local=[]
          for j,(k,n) in enumerate(chosen):
            fn=f'shots/shot{j}.sgy';print('DOWNLOAD',j,k,n,flush=True);s3.download_file(bucket,k,fn);local.append({'index':inds[j],'key':k,'size':n,'local':fn})
          meta={'total_segy_objects':len(keys),'selected':local};json.dump(meta,open('soda_selection.json','w'),indent=2);print(json.dumps(meta,indent=2))
          PY
      - name: Run exact-byte top-N benchmark
        run: python research/soda_raw_land_topn.py shots/shot0.sgy shots/shot1.sgy shots/shot2.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-raw-land-results
          path: |
            soda_selection.json
            soda_raw_topn_results.json
          retention-days: 7
