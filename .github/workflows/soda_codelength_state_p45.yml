name: Soda Lake coded-cost legal-state p45 screen
on:
  pull_request:
    branches: [soda-minchange-legal-state]
permissions: {contents: read}
jobs:
  p45:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba segyio zstandard pysz boto3
      - name: Download deterministic p45 shot
        shell: bash
        run: |
          python - <<'PY'
          import boto3,json
          from botocore import UNSIGNED
          from botocore.config import Config
          p=45;s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*p/100);k,n=keys[i]
          if k!='soda_lake/raw_seismic/2010/v1.0.0/F4371R1.SGY':raise RuntimeError(('p45 selection drift',i,k,n))
          print('SHOT',p,i,k,n,flush=True);s3.download_file(bucket,k,'shot.sgy');json.dump({'percentile':p,'index':i,'key':k,'size':n,'total':len(keys)},open('selection.json','w'),indent=2)
          PY
      - name: Run exact coded-cost state DP and byte audit
        run: python research/soda_codelength_state.py shot.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-codelength-state-p45
          path: |
            selection.json
            soda_codelength_state.json
          retention-days: 7
