name: Temporary seismic data transfer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-field-segy:
    runs-on: ubuntu-latest
    steps:
      - name: Download second public marine reflection SEG-Y
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            -o Tie_shots.sgy \
            'https://zenodo.org/records/18407436/files/Tie_shots.sgy?download=1'
          ls -lh Tie_shots.sgy
          echo '3ad8937d783a3090dbb73de918282692  Tie_shots.sgy' | md5sum -c -
      - name: Upload field SEG-Y
        uses: actions/upload-artifact@v4
        with:
          name: Tie-field-segy
          path: Tie_shots.sgy
          compression-level: 0
          retention-days: 1
