name: Imperial global structure hunt
on:
  pull_request:
    branches: [imperial-information-floor-audit]
permissions: {contents: read}
jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy h5py zstandard boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Hunt global hidden structure
        run: python research/imperial_global_structure_hunt.py imperial.h5
      - name: Surface strongest global diagnostic
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_global_structure_hunt.json')); b=d['summary']['best_heldout_global_predictor']
          print(f"::notice title=Global Imperial structure hunt::{b['name']} H0={b['residual_h0_bps']:.6f} derived={b['h0_minus_log2_267_bps']:.6f} target={d['summary']['target_2x_bps']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-global-structure-hunt
          path: imperial_global_structure_hunt.json
          if-no-files-found: ignore
          retention-days: 7
