name: Imperial hardbox residual VQ
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Fetch Imperial
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run direct hard-box vector codebooks
        run: python research/imperial_hardbox_residual_vq.py imperial.h5
      - name: Surface result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_hardbox_residual_vq.json'))
          for r in d['rows']:
            b=r['best']
            print(f"::notice title=hardbox-VQ {r['region']}::g={b['group']}, M={b['M']}, bps={b['bps']:.5f}, baseline={r['step267_bps']:.5f}, gain={b['gain_vs_step267']:.6f}, hit={b['tail_hit_fraction']:.4f}, escape={b['escape_fraction']:.4f}, ratio2x={b['ratio_to_2x']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-hardbox-residual-vq
          path: imperial_hardbox_residual_vq.json
          retention-days: 7