name: Imperial easy adaptive AR setcode
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run adaptive-law setcode sweep
        run: python research/imperial_easy_adaptive_ar_setcode.py imperial.h5
      - name: Surface best result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_easy_adaptive_ar_setcode.json'));b=d['best']
          msg=(f"best step={b['step']} L={b['L']}, set={b['bytes']} bytes ({b['bps']:.5f} bps), "
               f"incumbent267={d['step267_arithmetic_bps']:.5f} bps, SZ3={d['sz3_bps']:.5f} bps, "
               f"success={b['success_fraction']:.5f}, escapes={b['escape_blocks']}/{b['blocks']}, "
               f"gain_vs_267={b['gain_vs_step267_arithmetic']:.6f}, gain_vs_SZ3={b['gain_vs_sz3']:.6f}, ratio_2x={b['ratio_to_2x_sz3_target']:.6f}")
          level='notice' if b['gain_vs_step267_arithmetic']>1 else 'warning'
          print(f"::{level} title=easy adaptive setcode::{msg}")
          for r in d['rows']:
              print(f"::notice title=setcode step{r['step']} L{r['L']}::bps={r['bps']:.5f}, success={r['success_fraction']:.5f}, hit_mean={r['mean_hit_index']}, gain267={r['gain_vs_step267_arithmetic']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-easy-adaptive-ar-setcode
          path: imperial_easy_adaptive_ar_setcode.json
          if-no-files-found: ignore
          retention-days: 7
