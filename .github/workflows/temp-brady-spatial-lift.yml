name: Temporary Brady spectral carrier probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spectral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy pysz zstandard
      - run: curl -L --fail --retry 5 --retry-delay 2 -o land.sgy 'https://gdr.openei.org/files/849/PoroTomo_iDAS16043_160325140118.sgy'
      - name: Benchmark low-frequency complex carrier plus certified corrections
        shell: bash
        run: |
          cat > spec.py <<'PY'
          import os,json,numpy as np,zstandard as zstd
          from pysz import sz,szConfig,szErrorBoundMode
          f='land.sgy';size=os.path.getsize(f);h=open(f,'rb').read(3600);ns=int.from_bytes(h[3220:3222],'big');dt=int.from_bytes(h[3216:3218],'big');st=240+4*ns;n=(size-3600)//st;mm=np.memmap(f,np.uint8,'r');X=np.ndarray((n,ns),dtype='>f4',buffer=mm,offset=3840,strides=(st,4)).astype(np.float32,copy=True);global_std=float(X.std());eps=.1*global_std;fs=1e6/dt
          Z=zstd.ZstdCompressor(level=3);zc=lambda b:Z.compress(b)
          def enc_int(A):
            A=A.astype(np.int32,copy=False);opts={}
            for tag,B in [('raw',A)]:
              for tr,V in [('C',B),('T',B.T)]:
                V=np.ascontiguousarray(V)
                if V.min()>=-128 and V.max()<=127:opts[f'{tag}_i8{tr}']=len(zc(V.astype(np.int8).tobytes()))
                if V.min()>=-32768 and V.max()<=32767:opts[f'{tag}_i16{tr}']=len(zc(V.astype(np.int16).tobytes()))
            if A.shape[0]>1 and A.shape[1]>1:
              L=np.empty_like(A);L[0]=A[0];L[1:,0]=A[1:,0]-A[:-1,0];L[1:,1:]=A[1:,1:]-A[1:,:-1]-A[:-1,1:]+A[:-1,:-1]
              for tr,V in [('C',L),('T',L.T)]:
                V=np.ascontiguousarray(V)
                if V.min()>=-128 and V.max()<=127:opts[f'lor_i8{tr}']=len(zc(V.astype(np.int8).tobytes()))
                if V.min()>=-32768 and V.max()<=32767:opts[f'lor_i16{tr}']=len(zc(V.astype(np.int16).tobytes()))
            k=min(opts,key=opts.get);return int(opts[k]),k
          def residual_cost(Y,P):
            C=np.rint((Y-P)/(2*eps)).astype(np.int16);K=np.empty_like(C);K[:,0]=C[:,0];K[:,1:]=C[:,1:]-C[:,:-1];R=P+C.astype(np.float32)*(2*eps);m=K!=0;v=K[m];mb=len(zc(np.packbits(m.T.reshape(-1)).tobytes()));vb=len(zc((v.astype(np.int8) if v.size and v.min()>=-128 and v.max()<=127 else v.astype(np.int16)).tobytes()));return mb+vb,float(v.size/K.size),float(np.max(np.abs(Y-R))),mb,vb
          blocks=[]
          for lo in [512,4096,7680]:
            hi=min(lo+384,n);Y=X[lo:hi];F=np.fft.rfft(Y,axis=1);freq=np.fft.rfftfreq(ns,d=dt/1e6);pow=np.mean(np.abs(F[::8])**2,axis=0);tot=float(pow.sum());energy={str(c):float(pow[freq<=c].sum()/tot) for c in [20,30,40,60,100,200]};cfg=szConfig();cfg.errorBoundMode=szErrorBoundMode.ABS;cfg.absErrorBound=eps;sb,_=sz.compress(Y,cfg);best=None;trials=[]
            for cutoff in [20,30,40,60,100]:
              ids=np.where(freq<=cutoff)[0];G=F[:,ids]/ns
              for qmul in [0.125,0.25,0.5,1.0,2.0]:
                q=eps*qmul;Qr=np.rint(G.real/q).astype(np.int32);Qi=np.rint(G.imag/q).astype(np.int32);br,mr=enc_int(Qr);bi,mi=enc_int(Qi);Fq=np.zeros_like(F);Fq[:,ids]=(Qr.astype(np.float64)+1j*Qi.astype(np.float64))*q*ns;P=np.fft.irfft(Fq,n=ns,axis=1).astype(np.float32);rb,ef,me,mb,vb=residual_cost(Y,P);total=br+bi+rb+128;row={'cutoff':cutoff,'qmul':qmul,'carrier_bytes':br+bi,'carrier_modes':[mr,mi],'residual_bytes':rb,'topology_bytes':mb,'value_bytes':vb,'event_fraction':ef,'total_bytes':total,'ratio':Y.nbytes/total,'maxerr':me};trials.append(row)
                if best is None or total<best['total_bytes']:best=row
            blocks.append({'block':[lo,hi],'block_std':float(Y.std()),'global_std':global_std,'epsilon':eps,'spectral_energy':energy,'sz3_ratio':Y.nbytes/int(sb.size),'sz3_bytes':int(sb.size),'best_spectral':best,'trials':trials})
          out={'global_std':global_std,'epsilon':eps,'fs':fs,'blocks':blocks};print(json.dumps(out,indent=2));open('spectral.json','w').write(json.dumps(out,indent=2))
          PY
          python spec.py
      - uses: actions/upload-artifact@v4
        with:
          name: brady-spectral-results
          path: spectral.json
          retention-days: 1
