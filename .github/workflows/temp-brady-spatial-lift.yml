name: Temporary Brady fast exact spatial lifting

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lifting-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy pysz zstandard
      - run: curl -L --fail --retry 5 --retry-delay 2 -o land.sgy 'https://gdr.openei.org/files/849/PoroTomo_iDAS16043_160325140118.sgy'
      - name: Fast exact lifting diagnostic
        shell: bash
        run: |
          cat > fast.py <<'PY'
          import os,json,numpy as np,zstandard as zstd
          from pysz import sz,szConfig,szErrorBoundMode
          f='land.sgy';size=os.path.getsize(f);h=open(f,'rb').read(3600);ns=int.from_bytes(h[3220:3222],'big');st=240+4*ns;n=(size-3600)//st;mm=np.memmap(f,np.uint8,'r');X=np.ndarray((n,ns),dtype='>f4',buffer=mm,offset=3840,strides=(st,4)).astype(np.float32,copy=True)
          valid=np.zeros(n,bool)
          for k in range(n):
            o=3600+k*st;th=bytes(mm[o:o+240]);valid[k]=(int.from_bytes(th[80:84],'big',signed=True)!=0 or int.from_bytes(th[84:88],'big',signed=True)!=0)
          ids=np.where(valid)[0];lo=int(ids[0]);hi=min(lo+768,int(ids[-1])+1);Y=X[lo:hi];std=float(Y.std());eps=.1*std;step=2*eps;Q=np.rint(Y/step).astype(np.int32);maxerr=float(np.max(np.abs(Y.astype(np.float64)-Q.astype(np.float64)*step)));Z=zstd.ZstdCompressor(level=3);zc=lambda b:Z.compress(b)
          def enc(A):
            A=A.astype(np.int32,copy=False);mn,mx=int(A.min()),int(A.max());opts={}
            for tag,B in [('raw',A),('dt',np.c_[A[:,0],np.diff(A,axis=1)])]:
              if B.min()>=-128 and B.max()<=127:
                opts[tag+'_i8C']=len(zc(np.ascontiguousarray(B.astype(np.int8)).tobytes()));opts[tag+'_i8T']=len(zc(np.ascontiguousarray(B.T.astype(np.int8)).tobytes()))
              opts[tag+'_i16C']=len(zc(np.ascontiguousarray(B.astype(np.int16)).tobytes()));opts[tag+'_i16T']=len(zc(np.ascontiguousarray(B.T.astype(np.int16)).tobytes()))
            best=min(opts,key=opts.get);return {'bytes':int(opts[best]),'mode':best,'zero':float(np.mean(A==0)),'min':mn,'max':mx}
          cur=Q;bands=[]
          while cur.shape[0]>1:
            ev=cur[::2];od=cur[1::2];pred=np.empty_like(od)
            pred[:]=ev[:od.shape[0]]
            m=min(od.shape[0],ev.shape[0]-1)
            if m>0:pred[:m]=(ev[:m]+ev[1:m+1])//2
            d=od-pred;bands.append(enc(d));cur=ev
          root=enc(cur);total=sum(x['bytes'] for x in bands)+root['bytes']+64*len(bands)
          # direct quantized 2D Lorenzo
          L=np.empty_like(Q);L[0]=Q[0];L[1:,0]=Q[1:,0]-Q[:-1,0];L[1:,1:]=Q[1:,1:]-Q[1:,:-1]-Q[:-1,1:]+Q[:-1,:-1];lor=enc(L)
          cfg=szConfig();cfg.errorBoundMode=szErrorBoundMode.ABS;cfg.absErrorBound=eps;sb,_=sz.compress(Y,cfg);S,_=sz.decompress(sb,np.float32,Y.shape)
          out={'shape':list(Y.shape),'std':std,'eps':eps,'maxerr_quantized':maxerr,'sz3_ratio':Y.nbytes/int(sb.size),'sz3_bytes':int(sb.size),'sz3_maxerr':float(np.max(np.abs(Y-S))),'lorenzo_quantized_ratio':Y.nbytes/lor['bytes'],'lorenzo':lor,'lifting_ratio':Y.nbytes/total,'lifting_bytes':int(total),'levels':len(bands),'bands':bands,'root':root};print(json.dumps(out,indent=2));open('fast.json','w').write(json.dumps(out,indent=2))
          PY
          python fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: brady-fast-lifting
          path: fast.json
          retention-days: 1
