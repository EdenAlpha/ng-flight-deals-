name: Imperial AR32 zero sign magnitude arithmetic

on:
  pull_request:
    paths:
      - 'research/imperial_ar32_zero_sign_magnitude_arithmetic.py'
      - '.github/workflows/imperial_ar32_zero_sign_magnitude_arithmetic.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run zero sign magnitude arithmetic gate
        run: python research/imperial_ar32_zero_sign_magnitude_arithmetic.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_zero_sign_magnitude_arithmetic.json'))
          for r in d['rows']:
              b=r['best_zsm'];c=r['best_activity_control'];level='notice' if r['gain_zsm_vs_best_activity']>1 else 'warning'
              print(f"::{level} title=zero-sign-mag {r['region']}::zsm={b['bps']:.5f} W={b['window']}, activity={c['bps']:.5f} W={c['window']}, baseline={r['baseline_bps']:.5f}, SZ3={r['sz3_bps']:.5f}, gainActivity={r['gain_zsm_vs_best_activity']:.6f}, gainBase={b['gain_vs_baseline']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-zero-sign-magnitude-arithmetic
          path: imperial_ar32_zero_sign_magnitude_arithmetic.json
          retention-days: 7
