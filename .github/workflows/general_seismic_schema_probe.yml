name: General seismic remaining-format probe

on:
  pull_request:
    branches:
      - general-seismic-benchmark-v1
  workflow_dispatch:

permissions: {contents: read}

jobs:
  schema-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: pip install --quiet numpy boto3 h5py 's3fs<2027' pysegd3 pysegd
      - name: Download one frozen Crescent Valley SEG-D object
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          os.makedirs('probe_data',exist_ok=True)
          k='wholescale/subter_seismic/crescent_valley/1359.sgd'
          print('DOWNLOAD',k,flush=True);s3.download_file('gdr-data-lake',k,'probe_data/crescent.sgd')
          PY
      - name: Probe all remaining frozen schemas without headline compression
        run: python research/general_seismic_schema_probe.py probe_data/crescent.sgd | tee general_seismic_schema_probe_stdout.json
      - name: Require HDF5 schemas and at least identify raw tar members
        run: |
          python - <<'PY'
          import json
          x=json.load(open('general_seismic_schema_probe.json'))
          assert x['forge_h5'],x
          assert x['egs_h5'],x
          assert x['san_emidio_datacube_tar']['members'],x
          assert x['san_emidio_smartsolo_tar']['members'],x
          print('FORGE',x['forge_h5'][:5])
          print('EGS',x['egs_h5'][:5])
          print('DATACUBE',x['san_emidio_datacube_tar']['members'][:10])
          print('SMARTSOLO',x['san_emidio_smartsolo_tar']['members'][:10])
          print('SEGD',x['crescent_segd'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: general-seismic-remaining-format-probe
          path: general_seismic_schema_probe.json
          retention-days: 14
