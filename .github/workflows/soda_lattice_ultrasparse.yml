name: Soda Lake ultra-sparse lattice sweep
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  sparse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard pysz boto3
      - name: Download deterministic three raw shots
        shell: bash
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          keys=['soda_lake/raw_seismic/2010/v1.0.0/F1750R1.SGY','soda_lake/raw_seismic/2010/v1.0.0/F4746R1.SGY','soda_lake/raw_seismic/2010/v1.0.0/F7741R1.SGY']
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));os.makedirs('shots',exist_ok=True)
          for i,k in enumerate(keys):s3.download_file('gdr-data-lake',k,f'shots/shot{i}.sgy')
          PY
      - name: Run ultra-sparse exact-byte sweep
        run: |
          python research/patch_soda_lattice_collision.py
          sed -i 's/\[0.0005,0.001,0.002,0.004\]/[0.0000625,0.000125,0.00025,0.0005]/' research/soda_lattice_kxyf.py
          python research/soda_lattice_kxyf.py shots/shot0.sgy shots/shot1.sgy shots/shot2.sgy
          mv soda_lattice_kxyf_results.json soda_lattice_ultrasparse_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: soda-lattice-ultrasparse-results
          path: soda_lattice_ultrasparse_results.json
          retention-days: 7
