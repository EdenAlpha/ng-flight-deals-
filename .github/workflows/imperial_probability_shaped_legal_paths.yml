name: Imperial probability-shaped legal paths
on:
  pull_request:
    branches: [imperial-crossminute-cyclostationary-regime]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py boto3
      - name: Download three consecutive Imperial records
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';prefix='imperialvalleydas/v1.0.0/';target=prefix+'DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));rows=[]
          for pg in s.get_paginator('list_objects_v2').paginate(Bucket=b,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].endswith('.h5'):rows.append((o['Key'],int(o['Size'])))
          rows.sort();keys=[x[0] for x in rows];i=keys.index(target);sel=rows[i-2:i+1]
          for j,(k,n) in enumerate(sel):s.download_file(b,k,f'r{j}.h5');assert os.path.getsize(f'r{j}.h5')==n
          print(sel)
          PY
      - name: Synthesize target legal paths under decoder-known prior
        run: python research/imperial_probability_shaped_legal_paths.py r0.h5 r1.h5 r2.h5
      - name: Surface legal-set rates
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_probability_shaped_legal_paths.json'));a=d['aggregate']
          msg=(f"nearest={a['nearest_model_bps']:.6f} bps, MAP={a['map_legal_path_bps']:.6f} bps, "
               f"SET_MASS={a['legal_path_mass_bps']:.6f} bps, MAP_gain_vs_SZ3={a['map_gain_vs_fullfile_sz3']:.6f}, "
               f"SET_gain_vs_SZ3={a['mass_gain_vs_fullfile_sz3']:.6f}, SET_ratio_to_2x_target={a['mass_ratio_to_2x_target']:.6f}")
          print(f"::notice title=legal-set aggregate::{msg}")
          for r in d['rows']:
              if r.get('aggregate'):
                  msg=(f"MAP={r['map_legal_path_bps']:.6f} bps, SET_MASS={r['legal_path_mass_bps']:.6f} bps, "
                       f"MAP_gain_vs_SZ3={r['map_gain_vs_fullfile_sz3_bps']:.6f}, SET_gain_vs_SZ3={r['mass_gain_vs_fullfile_sz3_bps']:.6f}")
                  print(f"::notice title=legal-set region {r['region_c0']}::{msg}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-probability-shaped-legal-paths
          path: imperial_probability_shaped_legal_paths.json
          if-no-files-found: ignore
          retention-days: 7
