name: Imperial Gaussian RD waterfill audit
on:
  pull_request:
    branches: [imperial-persistent-ar32-step267-full-array]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py pysz boto3 zstandard
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Compute 2D Gaussian reverse-waterfilling rate
        run: python research/imperial_gaussian_rd_waterfill_audit.py imperial.h5
      - name: Surface Gaussian RD result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_gaussian_rd_waterfill_audit.json'))
          for r in d['rows']:
            print(f"::notice title=Gaussian-RD {r['region']}::RD={r['gaussian_2d_mse_RD_bps']:.6f} bps, SZ3={r['matched_sz3_bps']:.6f}, 2x_target={r['two_x_sz3_target_bps']:.6f}, RD/2x={r['gaussian_RD_over_2x_target']:.6f}, flatness={r['spectral_flatness']:.6f}, kurtosis={r['excess_kurtosis']:.3f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-gaussian-rd-waterfill-audit
          path: imperial_gaussian_rd_waterfill_audit.json
          retention-days: 7
