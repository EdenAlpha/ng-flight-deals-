name: FORGE HPEZ line-scoped residual feedback
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read, actions: read}
jobs:
  alpha:
    strategy:
      fail-fast: false
      matrix:
        alpha: ['0.0','0.0625','0.125','0.1875','0.25','0.375','0.5','-0.0625','-0.125','-0.25']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {name: forge-subcube-cache, path: data, github-token: '${{ github.token }}', repository: EdenAlpha/ng-flight-deals-, run-id: 31459619473}
      - run: |
          pip install --quiet numpy
          git clone --depth 1 https://github.com/JLiu-1/HPEZ-QoZ2.0.git hpez-src
          python research/patch_hpez_line_feedback.py
          python research/patch_hpez_3d_sync.py
          cmake -S hpez-src -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/install -DCMAKE_CXX_FLAGS="-include cstdint -include array -DHPEZ_RESIDUAL_ALPHA=${{ matrix.alpha }}" >/dev/null
          cmake --build build -j2 >/dev/null && cmake --install build >/dev/null
      - run: |
          EPS=$(python -c "import json;print(json.load(open('data/forge_subcube_meta.json'))['eps_10pct_std'])")
          install/bin/hpez -f -i data/forge_subcube_f32.bin -z out.hpez -3 512 64 64 -M ABS "$EPS" -q 4 >/dev/null
          install/bin/hpez -f -z out.hpez -o rec.bin -3 512 64 64 >/dev/null
          python - <<'PY'
          import json,os,numpy as np
          a=float('${{ matrix.alpha }}'); m=json.load(open('data/forge_subcube_meta.json'));eps=float(m['eps_10pct_std'])
          x=np.fromfile('data/forge_subcube_f32.bin','<f4');r=np.fromfile('rec.bin','<f4');b=os.path.getsize('out.hpez');me=float(np.max(np.abs(x-r)))
          out={'alpha':a,'bytes':b,'ratio':x.nbytes/b,'maxerr':me,'eps':eps,'valid':bool(me<=eps*1.00001)}
          print('LINE_RESULT',json.dumps(out),flush=True);json.dump(out,open('result.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: line-feedback-${{ strategy.job-index }}
          path: result.json
          retention-days: 7
