name: Imperial exact Waka rANS transfer v1
on:
  pull_request:
    branches: [waka-unseen-rans-independent-3block-v1]
    paths:
      - 'research/imperial_exact_waka_rans_transfer_v1.py'
      - '.github/workflows/waka_unseen_rans_independent_3block_v1.yml'
  workflow_dispatch:
env:
  BENCHMARK_DEFINITION_SHA: 9b304e262182caa29a2c93e7e74e09ccb5715e92
jobs:
  exact-transfer:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: |
          pip install --quiet numpy boto3 h5py pysz zstandard brotli
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize frozen benchmark manifest
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_manifest.json
      - name: Download canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,hashlib,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run exact PR718 system on Imperial
        env: {PYTHONPATH: research}
        run: |
          python research/imperial_exact_waka_rans_transfer_v1.py \
            --manifest frozen_manifest.json \
            --eps benchmarks/migrated_volume_global_eps_v1.json \
            --imperial imperial.h5 \
            --out imperial_exact_waka_rans_transfer_v1.json
      - name: Surface result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_exact_waka_rans_transfer_v1.json'));r=d['imperial']
          print('verified Waka gain',d['verified_waka_actual_gain_vs_sz3'])
          print('Imperial gain vs SZ3',r['gain_vs_sz3'])
          print('Imperial gain vs current',r['gain_vs_current_imperial'])
          print('bytes',r['actual_total_bytes'],'SZ3',r['sz3_bytes'],'current',r['current_imperial_bytes'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-exact-waka-rans-transfer-v1
          path: imperial_exact_waka_rans_transfer_v1.json
          if-no-files-found: warn
          retention-days: 30
