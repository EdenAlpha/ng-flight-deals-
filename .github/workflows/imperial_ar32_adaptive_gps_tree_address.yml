name: Imperial AR32 Adaptive GPS tree address
on:
  pull_request:
    branches: [imperial-ar32-autocomplexity-address]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Build and decode exact adaptive location trees
        run: python research/imperial_ar32_adaptive_gps_tree_address.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_adaptive_gps_tree_address.json'));a=next(x for x in d['rows'] if x['kind']=='adaptive_gps');b=next(x for x in d['rows'] if x['kind']=='autocomplexity')
          print(f"::notice title=Adaptive GPS hard::adaptive={a['bytes']} B, AUTO={b['bytes']} B, SZ3={d['sz3']['bytes']} B, gainAUTO={b['bytes']/a['bytes']:.6f}x, gainSZ3={d['sz3']['bytes']/a['bytes']:.6f}x")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-ar32-adaptive-gps-tree-address
          path: imperial_ar32_adaptive_gps_tree_address.json
          if-no-files-found: ignore
          retention-days: 7
