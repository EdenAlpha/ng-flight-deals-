name: Migrated native four-survey corpus export v1
on:
  pull_request:
    branches: [migrated-volume-geometry-engine-v1]
    paths:
      - 'research/migrated_native_corpus_export_trigger_v1.txt'
      - '.github/workflows/migrated_native_corpus_export_v1.yml'
      - 'research/migrated_volume_native_tile_corpus.py'
  workflow_dispatch:

env:
  BENCHMARK_DEFINITION_SHA: 9b304e262182caa29a2c93e7e74e09ccb5715e92

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - marine_waka_3d
          - marine_kahu_3d
          - marine_opunake_3d
          - marine_tui_3d
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --quiet numpy boto3 pysz zstandard brotli
      - name: Materialize frozen benchmark manifest
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_manifest.json
      - name: Export deterministic native corpus
        env:
          PYTHONPATH: research
        run: |
          python research/migrated_volume_native_tile_corpus.py \
            --manifest frozen_manifest.json \
            --eps benchmarks/migrated_volume_global_eps_v1.json \
            --dataset "${{ matrix.dataset }}" \
            --out "${{ matrix.dataset }}_native_corpus_v1.npz"
      - name: Upload corpus
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-corpus-${{ matrix.dataset }}-v1
          path: |
            ${{ matrix.dataset }}_native_corpus_v1.npz
            ${{ matrix.dataset }}_native_corpus_v1.npz.json
          if-no-files-found: warn
          retention-days: 30
