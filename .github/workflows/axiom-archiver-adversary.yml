name: AXIOM archiver adversary
on:
  push:
    branches: [axiom-v02-beast]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install strong archivers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full zpaq brotli xz-utils git
      - name: Build exact Android benchmark TAR
        run: |
          git clone -q https://github.com/android/architecture-samples.git src
          cd src
          git checkout -q ee66e1526b84c026615df032c705842b7d2a521f
          rm -rf .git
          cd ..
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 -cf android.tar -C src app build.gradle.kts settings.gradle.kts gradle.properties 2>/dev/null || tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 -cf android.tar -C src app
          sha256sum android.tar
          stat -c 'ORIGINAL %s' android.tar
      - name: Strong compressor matrix
        run: |
          set +e
          xz -9e -k -f android.tar
          brotli -q 11 -c android.tar > android.br
          7z a -bd -y -t7z -mx=9 -m0=LZMA2 android_lzma2.7z android.tar >/dev/null
          7z a -bd -y -t7z -mx=9 -m0=PPMd android_ppmd.7z android.tar >/dev/null
          zpaq a android.zpaq android.tar -method 5 >/tmp/zpaq.log 2>&1
          for f in android.tar.xz android.br android_lzma2.7z android_ppmd.7z android.zpaq; do if [ -f "$f" ]; then stat -c '%n %s' "$f"; fi; done | tee results.txt
          cat /tmp/zpaq.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-archiver-adversary
          path: results.txt
          retention-days: 7
