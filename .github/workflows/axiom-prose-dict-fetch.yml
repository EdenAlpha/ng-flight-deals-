name: AXIOM prose dictionary fetch
on:
  pull_request:
    branches: [main]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -L --retry 3 -sS https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt -o en_50k.txt
          sha256sum en_50k.txt > en_50k.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-prose-dictionary
          path: |
            en_50k.txt
            en_50k.sha256
          retention-days: 7
