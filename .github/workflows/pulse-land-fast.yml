name: Fast exact PULSE land test
on:
  pull_request:
    branches: [seismic-bench-base]
permissions:
  contents: read
jobs:
  pulse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          pip install --quiet numpy
      - run: |
          curl -L --fail --retry 5 --retry-delay 2 -o land.sgy 'https://gdr.openei.org/files/849/PoroTomo_iDAS16043_160325140048.sgy'
      - name: Exact PULSE M52 at 10 percent RMS
        run: |
          cat > run.py <<'PY'
          import os,json,subprocess,numpy as np
          fn='land.sgy';size=os.path.getsize(fn);p=open(fn,'rb').read(3600);cand=[]
          for bo,nb in [('big','>'),('little','<')]:
              dt=int.from_bytes(p[3216:3218],bo);ns=int.from_bytes(p[3220:3222],bo);fmt=int.from_bytes(p[3224:3226],bo)
              if fmt==5 and dt>0 and ns>0:
                  stride=240+4*ns
                  if (size-3600)%stride==0:cand.append((bo,nb,dt,ns,(size-3600)//stride,stride))
          bo,nb,dt,ns,ntr,stride=cand[0];nch=1024
          mm=np.memmap(fn,np.uint8,'r');H=np.empty((nch,240),np.uint8)
          for i in range(nch):H[i]=mm[3600+i*stride:3600+i*stride+240]
          X=np.ndarray((ntr,ns),dtype=np.dtype(nb+'f4'),buffer=mm,offset=3840,strides=(stride,4))[:nch].astype(np.float32,copy=True)
          rms=float(np.sqrt(np.mean(X.astype(np.float64)**2)));eps=.1*rms;M=52
          idx=np.arange(0,ns,M,dtype=np.int32)
          if idx[-1]!=ns-1:idx=np.r_[idx,ns-1]
          Ai=np.rint(X[:,idx]/eps).astype(np.int32);adt=np.int16 if Ai.min()>=-32768 and Ai.max()<=32767 else np.int32;A=Ai.astype(adt)
          Ad=A.astype(np.float32)*np.float32(eps);P=np.empty_like(X)
          for j in range(len(idx)-1):
              a,b=int(idx[j]),int(idx[j+1]);L=b-a;u=np.arange(L,dtype=np.float32)/np.float32(L)
              P[:,a:b]=Ad[:,j,None]*(1-u)[None,:]+Ad[:,j+1,None]*u[None,:]
          P[:,-1]=Ad[:,-1]
          Ci=np.rint((X-P)/(2*eps)).astype(np.int32);cdt=np.int16 if Ci.min()>=-32768 and Ci.max()<=32767 else np.int32;C=Ci.astype(cdt)
          K=np.empty_like(C);K[:,0]=C[:,0];K[:,1:]=C[:,1:]-C[:,:-1]
          DA=A.copy();DA[:,1:]=A[:,1:]-A[:,:-1]
          def zc(b):return subprocess.run(['zstd','-q','-f','-19','-c'],input=b,stdout=subprocess.PIPE,check=True).stdout
          pb=zc(p);prev=np.vstack([np.zeros((1,240),np.int16),H[:-1].astype(np.int16)]);HD=((H.astype(np.int16)-prev)&255).astype(np.uint8);hb=zc(np.ascontiguousarray(HD.T).tobytes())
          ar=zc(np.ascontiguousarray(A).tobytes());ad=zc(np.ascontiguousarray(DA).tobytes());ab=min(len(ar),len(ad));kb=len(zc(np.ascontiguousarray(K).tobytes()))
          R=P+C.astype(np.float32)*np.float32(2*eps);maxerr=float(np.max(np.abs(X-R)));rmse=float(np.sqrt(np.mean((X.astype(np.float64)-R.astype(np.float64))**2)))
          full=98+len(pb)+len(hb)+ab+kb;pilot_full=3600+nch*stride;raw=X.nbytes
          out={'dataset':'Brady PoroTomo land DAS','shape':[nch,ns],'rms':rms,'eps_abs':eps,'alpha':.1,'M':52,'anchor_bytes':ab,'correction_bytes':kb,'prefix_bytes':len(pb),'trace_header_bytes':len(hb),'full_bytes':full,'full_ratio':pilot_full/full,'sample_ratio':raw/(ab+kb),'maxerr':maxerr,'rmse':rmse,'correction_transition_fraction':float(np.count_nonzero(K))/K.size}
          open('pulse_fast.json','w').write(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
          python run.py
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-fast-land
          path: pulse_fast.json
          retention-days: 1
