name: Imperial local low-rank oracle
on:
  pull_request:
    branches: [imperial-information-floor-audit]
permissions: {contents: read}
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Measure local low-rank oracle
        run: python research/imperial_local_lowrank_oracle.py imperial.h5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-local-lowrank-oracle
          path: imperial_local_lowrank_oracle.json
          if-no-files-found: ignore
          retention-days: 7
