name: Imperial channel-conditioned activity screen
on:
  pull_request:
    branches: [imperial-activity6-full-array]
permissions: {contents: read}
jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        cb: [10,14,28,46,53,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          bucket='gdr-data-lake';key='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          boto3.client('s3',config=Config(signature_version=UNSIGNED)).download_file(bucket,key,'das.h5')
          if os.path.getsize('das.h5')!=415030456: raise RuntimeError(('size',os.path.getsize('das.h5')))
          h=hashlib.md5(open('das.h5','rb').read()).hexdigest()
          if h!='8cb7ea8466ab48880f876fc43cb5ce75': raise RuntimeError(('md5',h))
          PY
      - name: Test decoder-known channel groups
        run: python research/imperial_channel_conditioned_activity.py das.h5 ${{ matrix.cb }}
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-channel-conditioned-${{ matrix.cb }}
          path: imperial_channel_conditioned_${{ matrix.cb }}.json
          retention-days: 7
