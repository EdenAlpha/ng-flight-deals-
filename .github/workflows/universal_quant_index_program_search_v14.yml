name: Universal quant index program search v14
on:
  pull_request:
    branches: [universal-auto-entropy-context-v7]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py boto3 pysz zstandard brotli numba
      - run: python research/download_imperial_v14.py imperial.h5
      - run: PYTHONPATH=research python research/universal_quant_index_program_search_v14.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: universal-quant-index-program-search-v14
          path: universal_quant_index_program_search_v14.json
          retention-days: 30
