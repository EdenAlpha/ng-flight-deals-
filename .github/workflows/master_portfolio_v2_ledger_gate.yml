name: Master Portfolio V2 ledger gate

on:
  pull_request:
  push:
    branches: [general-seismic-master-portfolio-v2]

concurrency:
  group: master-portfolio-v2-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ledger-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify protected winners, historical facts, and completed current-protocol evidence
        run: python research/master_portfolio_v2_current_ledger_gate.py
      - name: Verify exact frozen V1 implementation remains the protected floor
        run: python research/master_portfolio_v2_monotonicity_gate.py
      - name: Verify rejected historical lineages stay rejected unless explicitly re-audited
        run: python research/master_portfolio_v2_negative_gate.py
