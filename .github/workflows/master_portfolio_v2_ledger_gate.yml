name: Master Portfolio V2 ledger gate

on:
  pull_request:
  push:
    branches: [general-seismic-master-portfolio-v2]

permissions:
  contents: read

jobs:
  ledger-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify protected winners and audit classifications
        run: python research/master_portfolio_v2_ledger_gate.py
