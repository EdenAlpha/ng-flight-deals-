name: eFootball native LAN/result xref analysis

on:
  push:
    branches: [ efootball-apk-analysis-2026-08-23 ]

permissions:
  contents: write

jobs:
  xref:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: efootball-apk-analysis-2026-08-23
      - name: Install analysis tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip file python3 python3-pip binutils
          python3 -m pip install --break-system-packages pyelftools==0.32 capstone==5.0.6
      - name: Download current arm64 eFootball binary
        run: |
          set -euxo pipefail
          rm -rf xref-work xref-output
          mkdir -p xref-work/bundle xref-work/native xref-output
          curl -L --fail --retry 5 --retry-delay 3 -A 'Mozilla/5.0' -o xref-work/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          unzip -q xref-work/efootball.xapk -d xref-work/bundle
          NATIVE="$(find xref-work/bundle -type f -name 'config.arm64_v8a.apk' | head -n1)"
          test -n "$NATIVE"
          unzip -q "$NATIVE" -d xref-work/native
          test -f xref-work/native/lib/arm64-v8a/libUE4.so
          file xref-work/native/lib/arm64-v8a/libUE4.so | tee xref-output/binary_identity.txt
          sha256sum xref-work/native/lib/arm64-v8a/libUE4.so | tee -a xref-output/binary_identity.txt
      - name: Resolve strings to ARM64 code xrefs
        run: |
          cat > xref-work/xref.py <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM, arm64
          import struct, re

          so_path=Path('xref-work/native/lib/arm64-v8a/libUE4.so')
          raw=so_path.read_bytes()
          terms=[
            'P2P_ADHOC_WIFIDIRECTLAN','P2P_ADHOC_WIFIDIRECTLAN_LOW_LEVEL','P2P_ADHOC_WIFIDIRECTLAN_HIGH_LEVEL',
            'P2P_ADHOC_LAN','P2P_ADHOC_LAN_LOW_LEVEL','direct_online_turn_mode',
            'LOCAL_GAMERELAY','CMD_SET_LOCAL_GAMERELAY_LIST','TaskEvCompeLocalGamerelay',
            'CMD_CHANGE_GAMEPHASE','CMD_GET_GAME_RESULT','CMD_SET_GAME_RESULT','CMD_ADD_SCORE',
            'MatchScoreChanged','m_homeScore','m_awayScore','GetGameScore','SetHomeScore','SetAwayScore',
            'EPKR_GamePhase::GameplayFinished','EPKR_GamePhase::ResultPresentation',
            'EMatchFlowTask::SendServerMatchEnd','MatchResultTimeUpDemo','Match/End/MatchEnd',
            'NUM_GUESTS_END_MATCH','ROOM_GAME_PHASE_END','ADDED_TIME','m_isExtraTime',
            'PUNCHING_FINISHED','HOST_DIRECT','HOST_RELAY','START_UDP_HOLE_PUNCHING',
            'OnlineSystemMultiplaySessionStrategyP2pFullMeshWithTurn.cpp'
          ]

          with so_path.open('rb') as f:
            elf=ELFFile(f)
            loads=[]
            exec_segments=[]
            for seg in elf.iter_segments():
              if seg['p_type']=='PT_LOAD':
                loads.append((int(seg['p_offset']),int(seg['p_filesz']),int(seg['p_vaddr']),int(seg['p_memsz']),int(seg['p_flags'])))
                if int(seg['p_flags']) & 1:
                  exec_segments.append(seg)
            text=elf.get_section_by_name('.text')
            if text is None:
              raise SystemExit('no .text')
            text_off=int(text['sh_offset']); text_va=int(text['sh_addr']); text_bytes=text.data()

          def off_to_va(off):
            for po,pfs,pv,pms,pfl in loads:
              if po <= off < po+pfs:
                return pv+(off-po)
            return None
          def va_to_off(va):
            for po,pfs,pv,pms,pfl in loads:
              if pv <= va < pv+pfs:
                return po+(va-pv)
            return None

          # Find all exact strings and their VAs.
          target_instances=[]
          for term in terms:
            b=term.encode()
            start=0
            while True:
              off=raw.find(b,start)
              if off<0: break
              va=off_to_va(off)
              target_instances.append((term,off,va))
              start=off+1

          # Pointer locations that contain exact target addresses (for indirect references).
          ptr_targets={}
          target_vas={va:(term,off) for term,off,va in target_instances if va is not None}
          for va,(term,off) in target_vas.items():
            pat=struct.pack('<Q',va)
            s=0
            found=[]
            while True:
              p=raw.find(pat,s)
              if p<0: break
              pva=off_to_va(p)
              if pva is not None: found.append((p,pva))
              s=p+1
              if len(found)>=100: break
            ptr_targets[va]=found

          # Build all address forms we want code to resolve to.
          addr_labels={}
          for term,off,va in target_instances:
            if va is not None:
              addr_labels.setdefault(va,[]).append(f'STR:{term}@file+0x{off:x}')
              for po,pva in ptr_targets.get(va,[]):
                addr_labels.setdefault(pva,[]).append(f'PTR->{term}@file+0x{po:x}')
          pages={a & ~0xfff for a in addr_labels}

          md=Cs(CS_ARCH_ARM64, CS_MODE_ARM)
          md.detail=True
          xrefs=[]
          # Track ADRP bases for a short instruction window per register.
          reg_pages={}
          insn_index=0
          for ins in md.disasm(text_bytes,text_va):
            insn_index += 1
            # expire stale ADRP state
            for r,(pg,idx) in list(reg_pages.items()):
              if insn_index-idx>10: reg_pages.pop(r,None)
            try:
              ops=ins.operands
            except Exception:
              continue
            if ins.mnemonic=='adr' and len(ops)>=2 and ops[1].type==arm64.ARM64_OP_IMM:
              a=int(ops[1].imm)
              if a in addr_labels:
                xrefs.append((ins.address,a,'ADR',ins.mnemonic+' '+ins.op_str))
            elif ins.mnemonic=='adrp' and len(ops)>=2 and ops[0].type==arm64.ARM64_OP_REG and ops[1].type==arm64.ARM64_OP_IMM:
              pg=int(ops[1].imm)
              if pg in pages:
                reg_pages[ops[0].reg]=(pg,insn_index)
            elif ins.mnemonic=='add' and len(ops)>=3 and ops[0].type==arm64.ARM64_OP_REG and ops[1].type==arm64.ARM64_OP_REG and ops[2].type==arm64.ARM64_OP_IMM:
              base=reg_pages.get(ops[1].reg)
              if base:
                a=base[0]+int(ops[2].imm)
                if a in addr_labels:
                  xrefs.append((ins.address,a,'ADRP+ADD',ins.mnemonic+' '+ins.op_str))
            elif ins.mnemonic.startswith('ldr') and len(ops)>=2 and ops[0].type==arm64.ARM64_OP_REG:
              # LDR [base,#imm] after ADRP can load a pointer slot.
              op=ops[1]
              if op.type==arm64.ARM64_OP_MEM and op.mem.base in reg_pages:
                a=reg_pages[op.mem.base][0]+int(op.mem.disp)
                if a in addr_labels:
                  xrefs.append((ins.address,a,'ADRP+LDR',ins.mnemonic+' '+ins.op_str))
              elif op.type==arm64.ARM64_OP_IMM:
                a=int(op.imm)
                if a in addr_labels:
                  xrefs.append((ins.address,a,'LDR_LITERAL',ins.mnemonic+' '+ins.op_str))

          def disasm_window(center, before=0x80, after=0x140):
            start=max(text_va, center-before)
            start &= ~3
            end=min(text_va+len(text_bytes), center+after)
            bo=start-text_va
            out=[]
            for i in md.disasm(text_bytes[bo:bo+(end-start)],start):
              mark='>>' if i.address==center else '  '
              out.append(f'{mark} 0x{i.address:016x}: {i.mnemonic:8s} {i.op_str}')
            return '\n'.join(out)

          rep=[]
          rep.append('# eFootball arm64 native xref map')
          rep.append(f'text_va=0x{text_va:x} text_size=0x{len(text_bytes):x}')
          rep.append('\n## Exact target locations')
          for term,off,va in target_instances:
            rep.append(f'{term}\tfile_off=0x{off:x}\tva={"0x%x"%va if va is not None else "NONE"}')
            for po,pva in ptr_targets.get(va,[])[:20] if va is not None else []:
              rep.append(f'  pointer file_off=0x{po:x} va=0x{pva:x}')
          rep.append('\n## Code xrefs')
          if not xrefs: rep.append('NO_DIRECT_XREFS_FOUND')
          for pc,a,kind,src in xrefs:
            rep.append('\n'+'='*90)
            rep.append(f'XREF pc=0x{pc:x} kind={kind} target_va=0x{a:x}')
            rep.append('labels='+' | '.join(addr_labels[a]))
            rep.append('trigger='+src)
            rep.append(disasm_window(pc))
          Path('xref-output/xref_report.md').write_text('\n'.join(rep),errors='ignore')

          # Printable neighborhoods around exact strings, valuable for enum/registry order.
          hood=[]
          for term,off,va in target_instances:
            lo=max(0,off-1400); hi=min(len(raw),off+1400)
            chunk=raw[lo:hi]
            ss=[]
            for m in re.finditer(rb'[ -~]{4,}',chunk):
              ss.append((lo+m.start(),m.group().decode('ascii','ignore')))
            hood.append('\n'+'='*90+f'\nTERM={term} OFF=0x{off:x} VA={va and hex(va)}')
            hood.extend(f'0x{o:x} {s}' for o,s in ss)
          Path('xref-output/string_neighborhoods.txt').write_text('\n'.join(hood),errors='ignore')
          PY
          python3 xref-work/xref.py
      - name: Search command/result families and source-path clusters
        run: |
          set -euxo pipefail
          SO=xref-work/native/lib/arm64-v8a/libUE4.so
          strings -a -t x -n 4 "$SO" > xref-work/all_strings.txt
          grep -Ei 'CMD_(ADD_SCORE|CHANGE_GAMEPHASE|GET_GAME_RESULT|SET_GAME_RESULT|END|GAME)|GameplayFinished|ResultPresentation|SendServerMatchEnd|MatchScoreChanged|m_homeScore|m_awayScore|LOCAL_GAMERELAY|GAMERELAY|P2P_ADHOC_(WIFIDIRECTLAN|LAN)|WIFIDIRECTLAN|Match/End/MatchEnd|NUM_GUESTS_END_MATCH' xref-work/all_strings.txt > xref-output/command_family_strings.txt || true
          grep -Ei 'PES22HC.*(Multiplay|SessionStrategy|MatchFlow|Match/Result|GamePhase|Gamerelay|GameRelay).*\.(cpp|h)' xref-work/all_strings.txt > xref-output/source_path_clusters.txt || true
          readelf -Ws "$SO" | grep -Ei 'P2P|Turn|Stun|Match|Score|GamePhase|Gamerelay' > xref-output/dynamic_symbol_hits.txt || true
      - name: Commit textual xref findings
        run: |
          set -euxo pipefail
          {
            echo '# Native xref analysis summary'; date -u
            echo; cat xref-output/binary_identity.txt
            echo; echo '## High-value command/result/LAN strings'; cat xref-output/command_family_strings.txt
            echo; echo '## Source path clusters'; cat xref-output/source_path_clusters.txt
            echo; echo '## Xref report'; cat xref-output/xref_report.md
            echo; echo '## String neighborhoods'; cat xref-output/string_neighborhoods.txt
          } > xref-output/report.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xref-output
          git commit -m 'Add eFootball LAN and result native xref findings' || exit 0
          git push origin HEAD:efootball-apk-analysis-2026-08-23
