name: Imperial exact2 rich hard panel
on:
  pull_request:
    branches: [imperial-exact2-fair-rich-ar32]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run twelve-tile exact2 versus rich-AR panel
        run: python research/imperial_exact2_rich_hard_panel.py imperial.h5
      - name: Surface aggregate
        if: success()
        run: |
          python - <<'PY'
          import json
          a=json.load(open('imperial_exact2_rich_hard_panel.json'))['aggregate'];level='notice' if a['nova_bytes']<a['rich_ar32_bytes'] else 'warning'
          print(f"::{level} title=exact2 rich hard panel::NOVA={a['nova_bytes']} B, richAR32={a['rich_ar32_bytes']} B, SZ3={a['sz3_bytes']} B, gainAR={a['gain_vs_rich_ar32']:.6f}x, wins={a['wins_rich_ar32']}/{a['tiles']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-exact2-rich-hard-panel
          path: imperial_exact2_rich_hard_panel.json
          if-no-files-found: ignore
          retention-days: 7
