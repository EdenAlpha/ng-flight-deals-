name: Frozen Brady transfer to full Imperial Valley DAS file
on:
  pull_request:
    branches: [imperial-valley-das-large3-screen]
permissions: {contents: read}
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard boto3
      - name: Download exact PR204 slot2 full HDF5 file
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          bucket='gdr-data-lake';key='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5';expected=415030456
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));s3.download_file(bucket,key,'das.h5')
          if os.path.getsize('das.h5')!=expected:raise RuntimeError(('file drift',os.path.getsize('das.h5'),expected))
          PY
      - name: Apply frozen independent Brady topN definition to entire Acoustic array
        run: python research/imperial_valley_frozen_brady_transfer.py das.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-valley-frozen-brady-transfer
          path: imperial_valley_frozen_brady_transfer.json
          retention-days: 7
