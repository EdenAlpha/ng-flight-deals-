name: Imperial AR32 interval projection corrections
on:
  pull_request:
    branches: [imperial-ar32-nonlocal-zsm-stack]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run exact interval-projection correction gate
        run: python research/imperial_ar32_interval_projection_corrections.py imperial.h5
      - name: Surface compact result
        if: always()
        run: |
          if [ -f imperial_ar32_interval_projection_corrections.json ]; then
            python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_interval_projection_corrections.json'))
          for r in d['rows']:
              print(r['region'], {'step267_bps':r['step267_zsm']['bps'],'projection_bps':r['interval_projection_zsm']['bps'],'gain':r['gain_projection_vs_step267'],'zero267':r['step267_zero_fraction'],'zero_projection':r['projection_zero_fraction'],'sz3_bps':r['sz3_bps']})
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-ar32-interval-projection-corrections
          path: imperial_ar32_interval_projection_corrections.json
          if-no-files-found: ignore
          retention-days: 7
