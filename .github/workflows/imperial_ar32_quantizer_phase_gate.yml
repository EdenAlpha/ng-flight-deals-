name: Imperial AR32 quantizer phase gate

on:
  pull_request:
    branches:
      - imperial-huber-ar32-coldstart-arithmetic-regions
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run phase gate
        run: python research/imperial_ar32_quantizer_phase_gate.py imperial.h5
      - name: Surface compact result
        if: always()
        run: |
          python - <<'PY'
          import json,os
          p='imperial_ar32_quantizer_phase_gate.json'
          if not os.path.exists(p):raise SystemExit(0)
          d=json.load(open(p))
          for r in d['rows']:
              b=r['best_phase'];base=r['baseline'];sz=r['sz3']
              level='notice' if b['gain_vs_incumbent']>1 else 'warning'
              print(f"::{level} title=phase {r['region']}::{b['mode']} bps={b['bps']:.5f}, base={base['bps']:.5f}, SZ3={sz['bps']:.5f}, gainAR={b['gain_vs_incumbent']:.6f}, gainSZ3={b['gain_vs_sz3']:.6f}, zero={b['zero_fraction']:.5f}, phasebytes={b['phase_map_bytes']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-ar32-quantizer-phase-gate
          path: imperial_ar32_quantizer_phase_gate.json
          if-no-files-found: ignore
          retention-days: 7
