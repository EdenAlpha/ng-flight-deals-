name: Soda Lake three-shot geometry-aware baseline fairness
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  fairness:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build official HPEZ
        run: |
          git clone --depth 1 https://github.com/JLiu-1/HPEZ-QoZ2.0.git hpez-src
          cmake -S hpez-src -B hpez-src/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/hpez-install -DCMAKE_CXX_FLAGS="-include cstdint -include array"
          cmake --build hpez-src/build -j2
          cmake --install hpez-src/build
      - run: pip install --quiet numpy segyio zstandard pysz boto3
      - name: Download deterministic 10/50/90 percentile shots
        shell: bash
        run: |
          python - <<'PY'
          import boto3,os,json
          from botocore import UNSIGNED
          from botocore.config import Config
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();inds=[round((len(keys)-1)*p) for p in (.1,.5,.9)];os.makedirs('shots',exist_ok=True);sel=[]
          for j,i in enumerate(inds):
            k,n=keys[i];fn=f'shots/shot{j}.sgy';print('SHOT',j,i,k,n,flush=True);s3.download_file(bucket,k,fn);sel.append({'slot':j,'index':i,'key':k,'size':n})
          json.dump({'total':len(keys),'selected':sel},open('soda_3shot_fair_selection.json','w'),indent=2)
          PY
      - name: Run strongest geometry-aware HPEZ/SZ3 dictionary on all shots
        shell: bash
        run: |
          set -euo pipefail
          export BIN=$PWD/hpez-install/bin/hpez
          for I in 0 1 2; do
            rm -rf fair
            python research/soda_grid_fairness.py prepare "shots/shot${I}.sgy"
            export EPS=$(python -c "import json;print(json.load(open('fair/prep.json'))['eps'])")
            bash fair/run_hpez.sh
            python research/soda_grid_fairness.py analyze "shots/shot${I}.sgy"
            mv soda_grid_fairness.json "soda_grid_fairness_shot${I}.json"
          done
          python - <<'PY'
          import json
          for i in range(3):
            r=json.load(open(f'soda_grid_fairness_shot{i}.json'));print('FAIR',i,r['strongest'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soda-3shot-fairness-results
          path: |
            soda_3shot_fair_selection.json
            soda_grid_fairness_shot0.json
            soda_grid_fairness_shot1.json
            soda_grid_fairness_shot2.json
          retention-days: 7
