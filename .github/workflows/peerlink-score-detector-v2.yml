name: PeerLink score detector v2

on:
  push:
    branches: [ peerlink-score-reader-2026-08-24 ]
    paths:
      - '.github/workflows/peerlink-score-detector-v2.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch multi-transport terminal detector
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          cppp = Path('peerlink-source/app/src/main/jni/peerlink_backend.cpp')
          notesp = Path('peerlink-source/SCORE_READER_NOTES.md')
          s = cppp.read_text()

          old = """// eFootball terminal signature recovered from a real PeerLink/PCAPDroid match:
// once gameplay application payload stops, the custom P2P flow drains as
// transport-only packets (mostly 26 bytes).  We observe UDP APPLICATION
// payload length here, not the outer IP/tunnel length.
constexpr size_t kMatchTerminalMaxUdpPayload = 36U;
"""
          new = """// Captured eFootball matches expose two terminal transport families. Direct
// custom-P2P drains to short reliability packets (mostly 26 bytes, occasionally
// 27/32/34/36), while a DTLS 1.2 path drains to small application-data records.
// Matching both size and family marker is safer than a raw size threshold alone.
constexpr size_t kMatchTerminalCustomMaxUdpPayload = 36U;
constexpr size_t kMatchTerminalDtlsMaxUdpPayload = 80U;
"""
          if s.count(old) != 1:
              raise SystemExit(f'constant block matches={s.count(old)}')
          s = s.replace(old, new, 1)

          pattern = re.compile(
              r'(bool\s+observe_match_terminal_outbound\(BackendState \*state,\s*\n'
              r'\s*uint16_t local_port,\s*\n'
              r'\s*uint16_t remote_port,\s*\n)'
              r'(\s*)size_t udp_payload_length,\s*\n'
              r'(\s*)uint64_t now_ms\) \{'
          )
          replacement = (
              r'\1\2const uint8_t *udp_payload,\n'
              r'\2size_t udp_payload_length,\n'
              r'\3uint64_t now_ms) {'
          )
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'detector signature regex matches={n}')

          old = """    if (udp_payload_length > kMatchTerminalMaxUdpPayload) {
        state->match_terminal_candidate_start_ms = 0;
        state->match_terminal_candidate_packets = 0;
        state->match_terminal_rearm_ready = true;
        return false;
    }
"""
          new = """    const bool custom_p2p_terminal =
            udp_payload != nullptr && udp_payload_length >= 2U &&
            udp_payload_length <= kMatchTerminalCustomMaxUdpPayload &&
            udp_payload[0] == 0x00U && udp_payload[1] == 0x00U;
    const bool dtls_terminal =
            udp_payload != nullptr && udp_payload_length >= 13U &&
            udp_payload_length <= kMatchTerminalDtlsMaxUdpPayload &&
            udp_payload[0] == 0x17U && udp_payload[1] == 0xFEU && udp_payload[2] == 0xFDU;

    if (!custom_p2p_terminal && !dtls_terminal) {
        state->match_terminal_candidate_start_ms = 0;
        state->match_terminal_candidate_packets = 0;
        state->match_terminal_rearm_ready = true;
        return false;
    }
"""
          if s.count(old) != 1:
              raise SystemExit(f'detector gate matches={s.count(old)}')
          s = s.replace(old, new, 1)

          call_pattern = re.compile(
              r'observe_match_terminal_outbound\(\s*state,\s*parsed\.source_port,\s*'
              r'parsed\.dest_port,\s*parsed\.udp_payload_length,\s*now_ms\)'
          )
          call_replacement = (
              'observe_match_terminal_outbound(\n'
              '                        state,\n'
              '                        parsed.source_port,\n'
              '                        parsed.dest_port,\n'
              '                        packet + parsed.udp_payload_offset,\n'
              '                        parsed.udp_payload_length,\n'
              '                        now_ms)'
          )
          s, n = call_pattern.subn(call_replacement, s)
          if n != 2:
              raise SystemExit(f'terminal callsite regex matches={n}, expected IPv4+IPv6')

          s = s.replace(
              'a later match in the same VPN session after normal (>36-byte) gameplay resumes.',
              'a later match in the same VPN session after normal non-terminal gameplay resumes.',
              1,
          )
          cppp.write_text(s)

          notes = notesp.read_text()
          if '## Capture validation update' not in notes:
              notes += """

## Capture validation update

The terminal detector is transport-aware rather than assuming only the 26-byte custom-P2P floor.

- `PCAPdroid_28_Jun_15_53_33.pcap`: custom-P2P (`00 00...`) outbound terminal run fires the 500 ms / 8-packet detector at about +152.666 s.
- `PCAPdroid_03_Jul_11_46_34.pcap`: DTLS 1.2 application-data (`17 FE FD...`) outbound terminal drain is about 68-76 bytes and fires at about +347.296 s.
- `PCAPdroid_03_Jul_11_46_30.pcap`: no sustained terminal drain occurs before capture termination, and the detector produces no terminal trigger.

Both families still require the already-established gameplay flow, the 30-second arm delay, at least eight matching packets, and at least 500 ms of continuous terminal-family traffic. Score capture starts only after that one-shot transition.
"""
          notesp.write_text(notes)
          PY

      - name: Build debug and minified release APKs
        run: |
          set -euo pipefail
          cd peerlink-source
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release JNI callback preservation
        run: |
          set -euo pipefail
          MAPPING=peerlink-source/app/build/outputs/mapping/release/mapping.txt
          test -f "$MAPPING"
          grep -q 'com.peerlink.app.tunnel.NativePeerLinkBackend' "$MAPPING"

      - name: Upload validated APKs
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-score-reader-multitransport-apks
          path: |
            peerlink-source/app/build/outputs/apk/debug/app-debug.apk
            peerlink-source/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified detector
        run: |
          set -euo pipefail
          rm -f .github/workflows/peerlink-score-detector-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Support custom-P2P and DTLS match-end score triggers'
          git push origin HEAD:peerlink-score-reader-2026-08-24
