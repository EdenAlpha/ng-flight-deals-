name: Temporary Brady 10pct diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy zfpy pysz zstandard
      - run: curl -L --fail --retry 5 --retry-delay 2 -o land.sgy 'https://gdr.openei.org/files/849/PoroTomo_iDAS16043_160325140048.sgy'
      - name: Diagnose 10pct std
        shell: bash
        run: |
          cat > d.py <<'PY'
          import os,json,numpy as np,zfpy,zstandard as zstd,time
          from pysz import sz,szConfig,szErrorBoundMode
          f='land.sgy';size=os.path.getsize(f);p=open(f,'rb').read(3600);C=[]
          for bo,nb in [('big','>'),('little','<')]:
            ns=int.from_bytes(p[3220:3222],bo);dt=int.from_bytes(p[3216:3218],bo);fmt=int.from_bytes(p[3224:3226],bo);bps={1:4,2:4,3:2,5:4,8:1}.get(fmt)
            if bps and ns>0 and dt>0:
              st=240+ns*bps
              if (size-3600)%st==0:C.append((bo,nb,dt,ns,fmt,(size-3600)//st,st))
          if len(C)!=1:raise RuntimeError(C)
          bo,nb,dt,ns,fmt,ntr,st=C[0];mm=np.memmap(f,np.uint8,'r')
          if fmt==1:
            r=np.empty((ntr,ns),'>u4')
            for i in range(ntr):o=3600+i*st+240;r[i]=np.frombuffer(mm[o:o+4*ns],'>u4',ns)
            u=r.astype(np.uint32);sg=np.where(u>>31,-1.,1.);ex=((u>>24)&127).astype(np.int32)-64;fr=(u&0xffffff).astype(np.float64)/16777216.;X=(sg*fr*np.power(16.,ex)).astype(np.float32);X[u==0]=0
          elif fmt==5:X=np.ndarray((ntr,ns),dtype=np.dtype(nb+'f4'),buffer=mm,offset=3840,strides=(st,4)).astype(np.float32,copy=True)
          else:
            typ={2:'i4',3:'i2',8:'i1'}[fmt];b={2:4,3:2,8:1}[fmt];X=np.empty((ntr,ns),np.float32)
            for i in range(ntr):o=3600+i*st+240;X[i]=np.frombuffer(mm[o:o+b*ns],np.dtype(nb+typ),ns).astype(np.float32)
          std=float(X.std());eps=.1*std;M=52;idx=np.arange(0,ns,M,dtype=np.int32);idx=np.r_[idx,ns-1] if idx[-1]!=ns-1 else idx;Ai=np.rint(X[:,idx]/eps).astype(np.int32);A=Ai.astype(np.int16);Ad=A.astype(np.float32)*eps;P=np.empty_like(X)
          for j in range(len(idx)-1):
            a,b=int(idx[j]),int(idx[j+1]);L=b-a;u=np.arange(L,dtype=np.float32)/L;P[:,a:b]=Ad[:,j,None]*(1-u)[None,:]+Ad[:,j+1,None]*u[None,:]
          P[:,-1]=Ad[:,-1];S=np.rint((X-P)/(2*eps)).astype(np.int16);K=np.empty_like(S);K[:,0]=S[:,0];K[:,1:]=S[:,1:]-S[:,:-1];R=P+S.astype(np.float32)*(2*eps);mask=K!=0;zc=zstd.ZstdCompressor(level=3).compress
          D=A.astype(np.int32);D[:,1:]-=A[:,:-1].astype(np.int32);zz=((D<<1)^(D>>31)).astype(np.uint16);ab=sum(len(zc(np.packbits(((zz>>bit)&1).astype(np.uint8).reshape(-1)).tobytes())) for bit in range(16));mb=len(zc(np.packbits(mask.T.reshape(-1)).tobytes()));v=K[mask];vb=len(zc((v.astype(np.int8) if v.size and v.min()>=-128 and v.max()<=127 else v.astype(np.int16)).tobytes()));pb=ab+mb+vb;raw=X.nbytes
          zb=zfpy.compress_numpy(X,tolerance=eps);Z=zfpy.decompress_numpy(zb);cfg=szConfig();cfg.errorBoundMode=szErrorBoundMode.ABS;cfg.absErrorBound=eps;sb,_=sz.compress(X,cfg);Q,_=sz.decompress(sb,np.float32,X.shape)
          out={'size':size,'ntr':ntr,'ns':ns,'dt_us':dt,'fmt':fmt,'std':std,'eps':eps,'M':M,'pulse_ratio_fastbackend':raw/pb,'pulse_bytes':pb,'pulse_maxerr':float(np.max(np.abs(X-R))),'event_fraction':float(v.size/X.size),'anchor_bytes':ab,'topology_bytes':mb,'value_bytes':vb,'zfp_ratio':raw/len(zb),'zfp_maxerr':float(np.max(np.abs(X-Z))),'sz3_ratio':raw/int(sb.size),'sz3_maxerr':float(np.max(np.abs(X-Q))),'pulse_vs_sz3':(raw/pb)/(raw/int(sb.size))};print(json.dumps(out,indent=2));open('diag.json','w').write(json.dumps(out,indent=2))
          PY
          python d.py
      - uses: actions/upload-artifact@v4
        with:
          name: brady-10pct-diagnostic
          path: diag.json
          retention-days: 1
