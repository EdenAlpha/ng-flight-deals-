name: Imperial address lattice search
on:
  pull_request:
    branches: [imperial-address-aware-pair-search]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Search reconstruction lattice for exact restricted address rate
        run: python research/imperial_address_lattice_search.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_address_lattice_search.json'));b=d['best']
          print(f"::notice title=lattice search hard::h={b['hfac']}eps, bytes={b['bytes']}, AR32={d['ar32']['bytes']}, SZ3={d['sz3']['bytes']}, gap={b['bytes']-d['ar32']['bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-address-lattice-search
          path: imperial_address_lattice_search.json
          if-no-files-found: ignore
          retention-days: 7
