name: Imperial hybrid rank 128x4096 hard
on:
  pull_request:
    branches: [imperial-ar32-hybrid-bitplane-rank]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run exact scale gate
        run: python research/imperial_ar32_hybrid_rank_128x4096.py imperial.h5
      - name: Surface result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_hybrid_bitplane_rank.json'));h=d['hybrid']
          print(f"::notice title=128x4096 hybrid hard::hybrid={h['bytes']} B, AR32={d['ar32']['bytes']} B, SZ3={d['sz3']['bytes']} B, gainAR={h['gain_vs_ar32']:.6f}x, gainSZ3={h['gain_vs_sz3']:.6f}x")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-hybrid-rank-128x4096
          path: imperial_ar32_hybrid_bitplane_rank.json
          if-no-files-found: ignore
          retention-days: 7
