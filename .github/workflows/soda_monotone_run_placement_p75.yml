name: Soda Lake monotone run-placement p75
on:
  pull_request:
    branches: [soda-intergap-context-refine]
permissions: {contents: read}
jobs:
  p75:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard brotli pysz boto3
      - name: Download deterministic p75 shot
        shell: bash
        run: |
          python - <<'PY'
          import boto3,json
          from botocore import UNSIGNED
          from botocore.config import Config
          p=.75;s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*p);k,n=keys[i]
          if len(keys)!=8321 or i!=6240 or k!='soda_lake/raw_seismic/2010/v1.0.0/F6618R1.SGY':raise RuntimeError(('p75 selection drift',len(keys),i,k,n))
          print('SHOT',i,k,n,flush=True);s3.download_file(bucket,k,'shot.sgy');json.dump({'percentile':75,'index':i,'key':k,'size':n,'total':len(keys)},open('selection.json','w'),indent=2)
          PY
      - name: Run exact Elias-Fano and combinadic placement sweep
        run: python research/soda_monotone_run_placement.py shot.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-monotone-run-placement-p75
          path: |
            selection.json
            soda_monotone_run_placement.json
          retention-days: 7
