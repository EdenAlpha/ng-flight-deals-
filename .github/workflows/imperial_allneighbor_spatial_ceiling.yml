name: Imperial all-neighbor spatial ceiling
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Fetch Imperial
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run all-neighbor linear ceiling
        run: python research/imperial_allneighbor_spatial_ceiling.py imperial.h5
      - name: Surface result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_allneighbor_spatial_ceiling.json'))
          for r in d['rows']:
            b=r['best']
            print(f"::notice title=all-neighbor ceiling {r['region']}::oracle={b['bps']:.5f} bps, real={r['real_bps']:.5f}, gain={b['gain_vs_real']:.6f}, SZ3={r['sz3_bps']:.5f}, gainSZ3={b['gain_vs_sz3']:.6f}, ratio2x={b['ratio_to_2x']:.6f}, zero={b['k_zero']:.4f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-allneighbor-spatial-ceiling
          path: imperial_allneighbor_spatial_ceiling.json
          retention-days: 7
