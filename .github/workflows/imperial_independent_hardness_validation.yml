name: Imperial independent hardness validation

on:
  pull_request:
    paths:
      - 'research/imperial_independent_hardness_validation.py'
      - '.github/workflows/imperial_independent_hardness_validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slot: [0,1,2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Validate frozen hardness formula on another Imperial minute
        run: python research/imperial_independent_hardness_validation.py ${{ matrix.slot }}
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-independent-hardness-${{ matrix.slot }}
          path: imperial_independent_hardness_validation_${{ matrix.slot }}.json
          retention-days: 7
