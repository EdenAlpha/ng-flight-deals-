name: eFootball direct xref inspection

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip python3 python3-pip file >/dev/null
          python3 -m pip install --break-system-packages -q pyelftools==0.32
      - name: Download current eFootball arm64 binary
        run: |
          mkdir -p /tmp/ef/bundle /tmp/ef/native
          curl -L --fail --retry 5 --retry-delay 2 -A 'Mozilla/5.0' -o /tmp/ef/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          unzip -q /tmp/ef/efootball.xapk -d /tmp/ef/bundle
          NATIVE="$(find /tmp/ef/bundle -type f -name 'config.arm64_v8a.apk' | head -n1)"
          unzip -q "$NATIVE" -d /tmp/ef/native
          test -f /tmp/ef/native/lib/arm64-v8a/libUE4.so
          file /tmp/ef/native/lib/arm64-v8a/libUE4.so
      - name: Fast exact string map and ARM64 xrefs
        run: |
          cat > /tmp/ef/x.py <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          import struct,re

          p=Path('/tmp/ef/native/lib/arm64-v8a/libUE4.so'); d=p.read_bytes()
          terms=[
            'P2P_ADHOC_WIFIDIRECTLAN','P2P_ADHOC_WIFIDIRECTLAN_LOW_LEVEL','P2P_ADHOC_WIFIDIRECTLAN_HIGH_LEVEL',
            'P2P_ADHOC_LAN','P2P_ADHOC_LAN_LOW_LEVEL','P2P_ADHOC_LAN_HIGH_LEVEL','direct_online_turn_mode',
            'LOCAL_GAMERELAY','CMD_SET_LOCAL_GAMERELAY_LIST','TaskEvCompeLocalGamerelay',
            'CMD_CHANGE_GAMEPHASE','CMD_GET_GAME_RESULT','CMD_SET_GAME_RESULT','CMD_ADD_SCORE',
            'MatchScoreChanged','m_homeScore','m_awayScore','GetGameScore','SetHomeScore','SetAwayScore',
            'EPKR_GamePhase::GameplayFinished','EPKR_GamePhase::ResultPresentation',
            'EMatchFlowTask::SendServerMatchEnd','EMatchFlowTask::WaitTimeup','EMatchFlowTask::DemoTimeupTrans',
            'MatchResultTimeUpDemo','Match/End/MatchEnd','ROOM_GAME_PHASE_END','NUM_GUESTS_END_MATCH','ADDED_TIME','m_isExtraTime',
            'HOST_DIRECT','HOST_RELAY','PUNCHING_FINISHED','START_UDP_HOLE_PUNCHING','MATCHING_STATE_STUN_CHECK',
            'OnlineSystemMultiplaySessionStrategyP2pFullMeshWithTurn.cpp'
          ]
          with p.open('rb') as f:
            e=ELFFile(f); text=e.get_section_by_name('.text'); tb=text.data(); tva=int(text['sh_addr'])
            loads=[(int(s['p_offset']),int(s['p_filesz']),int(s['p_vaddr'])) for s in e.iter_segments() if s['p_type']=='PT_LOAD']
          def ova(o):
            for po,sz,va in loads:
              if po<=o<po+sz:return va+o-po
          inst=[]
          for t in terms:
            s=0
            while True:
              o=d.find(t.encode(),s)
              if o<0:break
              inst.append((t,o,ova(o)));s=o+1
          labels={va:(t,o) for t,o,va in inst if va is not None}; pages={a&~0xfff for a in labels}
          refs={a:[] for a in labels}
          mv=memoryview(tb); words=len(tb)//4
          def sx(x,b): return x-(1<<b) if x&(1<<(b-1)) else x
          # Raw AArch64 ADRP -> ADD immediate scan. No full disassembler: ~25M words but very cheap.
          for idx in range(words):
            w=struct.unpack_from('<I',mv,idx*4)[0]
            if (w & 0x9f000000) != 0x90000000: continue
            rd=w&31; immlo=(w>>29)&3; immhi=(w>>5)&0x7ffff
            imm=sx((immhi<<2)|immlo,21)<<12
            pc=tva+idx*4; page=(pc&~0xfff)+imm
            if page not in pages: continue
            for j in range(1,9):
              if idx+j>=words: break
              w2=struct.unpack_from('<I',mv,(idx+j)*4)[0]
              # ADD (immediate), 32/64-bit; require source register == ADRP destination.
              if (w2 & 0x1f000000) != 0x11000000: continue
              if ((w2>>30)&1): continue  # SUB, not ADD
              rn=(w2>>5)&31
              if rn!=rd: continue
              imm12=(w2>>10)&0xfff; sh=(w2>>22)&1
              cand=page+(imm12<<(12 if sh else 0))
              if cand in refs: refs[cand].append((pc,tva+(idx+j)*4))
          print('=== TARGETS / FAST ADRP+ADD XREFS ===')
          for t,o,va in inst:
            rr=refs.get(va,[])
            print(f'{t}\toff=0x{o:x}\tva=0x{va:x}\txrefs={len(rr)}\t'+','.join(f'0x{a:x}->0x{b:x}' for a,b in rr[:40]))
          print('\n=== STRING NEIGHBORHOODS ===')
          for t,o,va in inst:
            print(f'\n--- {t} @ 0x{o:x} ---')
            lo=max(0,o-500);hi=min(len(d),o+500)
            for m in re.finditer(rb'[ -~]{4,}',d[lo:hi]):
              print(f'0x{lo+m.start():x} '+m.group().decode('ascii','ignore'))
          PY
          time python3 /tmp/ef/x.py
