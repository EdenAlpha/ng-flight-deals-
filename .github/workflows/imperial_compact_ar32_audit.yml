name: Imperial compact AR32 audit
on:
  pull_request:
    branches: [imperial-compact-nova-container]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Materialize and replay compact AR32 stream
        run: python research/imperial_compact_ar32_audit.py imperial.h5
      - name: Surface fair AR32 target
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_compact_ar32_audit.json'));r=d['compact_ar32']
          print(f"::notice title=compact-AR32 hard::old={d['old_ar32']['bytes']} B, compact={r['bytes']} B, delta={r['delta_vs_old']} B, model={r['model_bytes']} B, innovation={r['innovation_bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-compact-ar32-audit
          path: imperial_compact_ar32_audit.json
          if-no-files-found: ignore
          retention-days: 7
