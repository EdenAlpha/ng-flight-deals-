name: AXIOM context-stream v2 video benchmark
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xz-utils zstd brotli git
          python3 -m pip install -q numpy
      - name: Run context-stream v2 benchmark
        run: python3 video_context_v2_probe.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: axiom-video-context-v2-results
          path: video_context_v2_results.json
          retention-days: 7
