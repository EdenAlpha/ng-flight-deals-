name: AXIOM versus non-LSTM PAQ8px
on:
  pull_request:
    branches: [main]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake zlib1g-dev git curl
      - name: Build and run PAQ8px reference
        run: bash paq8px_adversarial_bench.sh
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: axiom-paq8px-results
          path: |
            paqbench/paq8px_results.json
            paqbench/wheel.log
            paqbench/csv.log
          retention-days: 7
