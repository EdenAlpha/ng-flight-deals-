name: Imperial exact auto-complexity defect rank
on:
  pull_request:
    branches: [imperial-defect-restricted-rank-address]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          h=hashlib.md5(open('imperial.h5','rb').read()).hexdigest();assert h=='8cb7ea8466ab48880f876fc43cb5ce75',h
          PY
      - name: Exact auto-complexity restrict and rank
        run: python research/imperial_defect_autocomplexity_rank.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_defect_autocomplexity_rank.json'));a=next(x for x in d['rows'] if x['rep']=='autocomplexity_rank')
          print(f"::notice title=auto-complexity hard::auto={a['bytes']} B, AR32={d['ar32']['bytes']} B, SZ3={d['sz3']['bytes']} B, auto/AR={d['ar32']['bytes']/a['bytes']:.6f}x, auto/SZ3={d['sz3']['bytes']/a['bytes']:.6f}x")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-defect-autocomplexity-rank
          path: imperial_defect_autocomplexity_rank.json
          if-no-files-found: ignore
          retention-days: 7
