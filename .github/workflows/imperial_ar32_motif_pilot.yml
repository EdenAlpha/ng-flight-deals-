name: Imperial motif compression pilot
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py pysz boto3 zstandard
      - name: Fetch test data
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run pilot
        run: python research/imperial_ar32_exact_motif_dictionary.py imperial.h5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-ar32-motif-pilot
          path: imperial_ar32_exact_motif_dictionary.json
          if-no-files-found: ignore
          retention-days: 7
