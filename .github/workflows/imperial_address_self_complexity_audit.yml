name: Imperial address self-complexity audit
on:
  pull_request:
    branches: [imperial-persistent-ar32-step267-full-array]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3, hashlib, os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake'; k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED)); s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5') == 415030456
          h=hashlib.md5()
          with open('imperial.h5','rb') as f:
            for x in iter(lambda:f.read(8<<20),b''): h.update(x)
          assert h.hexdigest() == '8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run exact recursive-address audit
        run: |
          PYTHONPATH=research python - <<'PY'
          import imperial_decoder_phase_automaton as m
          m.STEP = 267
          import imperial_address_self_complexity_audit as a
          a.main('imperial.h5')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-address-self-complexity-audit
          path: imperial_address_self_complexity_audit.json
          retention-days: 7
