name: Fast FORGE band-limited core codec
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read, actions: read}
jobs:
  bandcore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: forge-subcube-cache
          path: data
          github-token: ${{ github.token }}
          repository: EdenAlpha/ng-flight-deals-
          run-id: 31459619473
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          pip install --quiet numpy pysz
      - run: python research/forge_bandcore.py
      - uses: actions/upload-artifact@v4
        with:
          name: forge-bandcore-results
          path: forge_bandcore_results.json
          retention-days: 7
