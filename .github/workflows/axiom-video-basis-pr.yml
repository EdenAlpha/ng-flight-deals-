name: AXIOM lossy-basis exact-correction benchmark
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg brotli git
          python3 -m pip install -q numpy
      - name: Run exact basis-correction benchmark
        run: python3 video_basis_correction_probe.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: axiom-video-basis-results
          path: video_basis_correction_results.json
          retention-days: 7
