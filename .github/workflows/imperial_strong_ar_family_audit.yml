name: Imperial strong AR family audit
on:
  pull_request:
    branches: [imperial-causal-aware-rich-compact]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Search full-tile and prefix-fit shared AR orders with rich causal coding
        run: python research/imperial_strong_ar_family_audit.py imperial.h5
      - name: Surface strongest AR incumbent
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_strong_ar_family_audit.json'));b=d['best']
          print(f"::notice title=strong-AR hard::bytes={b['bytes']} B, order={b['order']}, fit={b['fit_scope']}, model={b['model_bytes']} B, field={b['field_bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-strong-ar-family-audit
          path: imperial_strong_ar_family_audit.json
          if-no-files-found: ignore
          retention-days: 7
