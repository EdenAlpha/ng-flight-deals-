name: Imperial strong AR family audit
on:
  pull_request:
    branches: [imperial-causal-aware-rich-compact]
permissions: {contents: read}
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        scope: [prefix256, full]
        order: [8, 16, 24, 32, 48, 64, 96]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Materialize exact AR candidate
        run: python research/imperial_strong_ar_one.py imperial.h5 ${{ matrix.order }} ${{ matrix.scope }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strong-ar-${{ matrix.scope }}-p${{ matrix.order }}
          path: imperial_strong_ar_${{ matrix.scope }}_p${{ matrix.order }}.json
          if-no-files-found: ignore
          retention-days: 7
