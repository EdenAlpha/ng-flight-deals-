name: Imperial long-history hard-error vector cover
on:
  pull_request:
    branches: [imperial-growing-waveform-language]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py s3fs boto3
      - name: Combine 32-minute corpus language with target tolerance boxes
        run: python research/imperial_longhistory_vector_cover.py
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-longhistory-vector-cover
          path: imperial_longhistory_vector_cover.json
          retention-days: 7
