name: General seismic Parihaka reader gate

on:
  pull_request:
    branches: [ general-seismic-benchmark-v1 ]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  parihaka-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy boto3 segyio
      - name: Stream real panels from all four Parihaka SEG-Y volumes
        env: {PYTHONPATH: research}
        run: |
          python - <<'PY'
          import boto3,json,numpy as np
          from botocore import UNSIGNED
          from botocore.config import Config
          from general_seismic_streaming_segy import s3_panels
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED,retries={'max_attempts':10}))
          bucket='open.source.geoscience';prefix='open_data/newzealand/Taranaiki_Basin/PARIHAKA-3D/'
          keys=['Parihaka_PSTM_full_angle.sgy','Parihaka_PSTM_near_stack.sgy','Parihaka_PSTM_mid_stack.sgy','Parihaka_PSTM_far_stack.sgy']
          out=[]
          for name in keys:
              key=prefix+name;size=int(s3.head_object(Bucket=bucket,Key=key)['ContentLength']);obj={'bucket':bucket,'key':key,'size':size}
              panels=list(s3_panels(s3,[obj],channels=128,time_samples=8192,max_panels=2))
              assert len(panels)==2,(name,len(panels))
              for P,m in panels:
                  assert P.shape==(128,1168),(name,P.shape,m)
                  assert P.dtype==np.float32 and np.all(np.isfinite(P)),(name,P.dtype,np.isfinite(P).mean())
                  assert m['binary_ns']==1168 and m['binary_stride']==4912 and m['binary_stride_exact'] is True,m
                  assert m['ns_policy']=='binary_exact_file_stride',m
              row={'key':key,'size':size,'panel_shapes':[list(P.shape) for P,_ in panels],'meta':panels[0][1],'min':float(min(P.min() for P,_ in panels)),'max':float(max(P.max() for P,_ in panels))}
              out.append(row);print(json.dumps(row,indent=2))
          json.dump(out,open('parihaka_reader_gate.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: parihaka-reader-gate, path: parihaka_reader_gate.json, retention-days: 14}
