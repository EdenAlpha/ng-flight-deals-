name: PeerLink direct terminal callback fix

on:
  push:
    branches: [ peerlink-score-reader-2026-08-24 ]
    paths:
      - '.github/workflows/peerlink-direct-terminal-callback-fix.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire the native detector directly to Kotlin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('peerlink-source/app/src/main/jni/peerlink_backend.cpp')
          s = p.read_text()

          old = '''    jmethodID prepare_peer_socket_mid = nullptr;\n    jmethodID fabricate_stun_mid = nullptr;\n    jmethodID native_log_mid = nullptr;\n'''
          new = '''    jmethodID prepare_peer_socket_mid = nullptr;\n    jmethodID fabricate_stun_mid = nullptr;\n    jmethodID native_log_mid = nullptr;\n    jmethodID match_terminal_mid = nullptr;\n'''
          assert old in s, 'BackendState callback fields changed unexpectedly'
          s = s.replace(old, new, 1)

          old = '''    state->prepare_peer_socket_mid = env->GetMethodID(callback_class, "preparePeerSocket", "(I)Z");\n    state->fabricate_stun_mid = env->GetMethodID(callback_class, "fabricateStunResponse", "([BI)[B");\n    state->native_log_mid = env->GetMethodID(callback_class, "onNativeLog", "(ILjava/lang/String;Z)V");\n    env->DeleteLocalRef(callback_class);\n    if (state->prepare_peer_socket_mid == nullptr || state->fabricate_stun_mid == nullptr || state->native_log_mid == nullptr) {\n        LOGE("Required callback methods were not found");\n'''
          new = '''    state->prepare_peer_socket_mid = env->GetMethodID(callback_class, "preparePeerSocket", "(I)Z");\n    state->fabricate_stun_mid = env->GetMethodID(callback_class, "fabricateStunResponse", "([BI)[B");\n    state->native_log_mid = env->GetMethodID(callback_class, "onNativeLog", "(ILjava/lang/String;Z)V");\n    state->match_terminal_mid = env->GetMethodID(callback_class, "onMatchTerminalDetected", "()V");\n    env->DeleteLocalRef(callback_class);\n    if (state->prepare_peer_socket_mid == nullptr ||\n        state->fabricate_stun_mid == nullptr ||\n        state->native_log_mid == nullptr ||\n        state->match_terminal_mid == nullptr) {\n        LOGE("Required callback methods were not found");\n'''
          assert old in s, 'nativeStart callback lookup changed unexpectedly'
          s = s.replace(old, new, 1)

          old = '''                observe_gameplay_flow(state, parsed.source_port, parsed.dest_port, now_ms);\n                observe_match_terminal_outbound(state, parsed.source_port, parsed.dest_port, parsed.udp_payload_length, now_ms);\n                const int new_stable_port = load_stable_game_port(state);\n'''
          new = '''                observe_gameplay_flow(state, parsed.source_port, parsed.dest_port, now_ms);\n                observe_match_terminal_outbound(state, parsed.source_port, parsed.dest_port, parsed.udp_payload_length, now_ms);\n                // The TUN reader is already attached to the JVM. Deliver the one-shot\n                // terminal event immediately instead of waiting for a timer/poll.\n                // exchange(false) consumes exactly this event; re-arm/cooldown state\n                // inside observe_match_terminal_outbound protects the next match.\n                if (state->match_terminal_detected.exchange(false, std::memory_order_acq_rel)) {\n                    env->CallVoidMethod(state->callbacks, state->match_terminal_mid);\n                    if (env->ExceptionCheck()) {\n                        env->ExceptionClear();\n                        LOGW("onMatchTerminalDetected callback threw; terminal event consumed");\n                    }\n                }\n                const int new_stable_port = load_stable_game_port(state);\n'''
          assert old in s, 'IPv4 gameplay observation hot path changed unexpectedly'
          s = s.replace(old, new, 1)
          p.write_text(s)

          notes = Path('peerlink-source/SCORE_READER_NOTES.md')
          n = notes.read_text()
          marker = '`Native TUN gameplay classification -> terminal detector -> one-shot Kotlin callback -> event-only screenshot burst -> upper-frame ML Kit OCR -> persisted latest score`'
          assert marker in n
          n = n.replace(
              marker,
              '`Native TUN gameplay classification -> terminal detector -> immediate JNI one-shot Kotlin callback -> event-only screenshot burst -> upper-frame ML Kit OCR -> persisted latest score`',
              1,
          )
          n += '''\n\n## Callback wiring audit\n\nThe first implementation exposed `NativeCallbacks.onMatchTerminalDetected()` in Kotlin but did not register that method ID in the C++ backend, so the detector flag could only be consumed through the unused polling method. This is now corrected: `nativeStart` resolves `onMatchTerminalDetected()`, and the already-JVM-attached TUN reader consumes the atomic terminal event and calls Kotlin immediately on the exact packet that satisfies the terminal signature. No periodic terminal polling is required.\n'''
          notes.write_text(n)
          PY

      - name: Build patched PeerLink APK
        run: |
          set -euo pipefail
          cd peerlink-source
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-score-reader-direct-callback-debug
          path: peerlink-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified callback wiring
        run: |
          set -euo pipefail
          rm -f .github/workflows/peerlink-direct-terminal-callback-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire terminal detector directly to score capture callback'
          git push origin HEAD:peerlink-score-reader-2026-08-24
