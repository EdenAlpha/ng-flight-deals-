name: AXIOM Sintel rate-residual sweep
on:
  push:
    branches: [axiom-sintel-crf-lab]
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: axiom-sintel-crf-lab}
      - name: Build real Sintel corpus and coder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg g++ curl
          curl -L --retry 3 -sS https://media.w3.org/2010/05/sintel/trailer.mp4 -o sintel.mp4
          ffmpeg -loglevel error -y -ss 0 -t 4 -i sintel.mp4 -vf scale=320:180 -r 24 -frames:v 96 -f rawvideo -pix_fmt yuv420p sintel.yuv
          g++ -O3 -std=c++17 axiom_video_residual_v2.cpp -o axiom_vres
          sha256sum sintel.yuv | tee sweep_results.txt
          stat -c 'RAW %s' sintel.yuv | tee -a sweep_results.txt
      - name: Sweep exact total objective
        run: |
          set -euo pipefail
          for q in 1 2 3 4 5 6 7 8 10 12 16; do
            ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i sintel.yuv -frames:v 96 -c:v libaom-av1 -crf $q -b:v 0 -cpu-used 4 -row-mt 1 -f ivf b$q.ivf
            ffmpeg -loglevel error -y -i b$q.ivf -f rawvideo -pix_fmt yuv420p b$q.yuv
            ./axiom_vres e sintel.yuv b$q.yuv r$q.axr 320 180 96 2>stats$q.txt
            B=$(stat -c%s b$q.ivf); R=$(stat -c%s r$q.axr); T=$((B+R+62)); echo "CRF $q BASIS $B RESIDUAL $R TOTAL $T $(cat stats$q.txt)" | tee -a sweep_results.txt
          done
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i sintel.yuv -frames:v 96 -c:v ffv1 -level 3 -coder 1 -context 0 -g 1 ffv1.mkv
          echo "FFV1 $(stat -c%s ffv1.mkv)" | tee -a sweep_results.txt
      - name: Persist results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sweep_results.txt
          git commit -m 'Record Sintel rate-residual sweep [skip ci]' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-sintel-rate-residual
          path: sweep_results.txt
          retention-days: 7
