name: Fetch real SEG-Y files for local GCA research

on:
  push:
    branches: [general-seismic-master-portfolio-v2]
    paths:
      - '.github/workflows/fetch_real_volve_segy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Sparse checkout public SEGYSak seismic samples
        uses: actions/checkout@v4
        with:
          repository: trhallam/segysak
          ref: main
          path: segysak_source
          sparse-checkout: |
            examples/data/3D_gathers_pstm_nmo.sgy
            examples/data/volve10-migvel-depth-sub3d.sgy
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Verify exact file sizes
        run: |
          test "$(stat -c%s segysak_source/examples/data/3D_gathers_pstm_nmo.sgy)" -eq 23947564
          test "$(stat -c%s segysak_source/examples/data/volve10-migvel-depth-sub3d.sgy)" -eq 1074384
          sha256sum segysak_source/examples/data/3D_gathers_pstm_nmo.sgy
          sha256sum segysak_source/examples/data/volve10-migvel-depth-sub3d.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: real-segysak-gather-and-migvel
          path: |
            segysak_source/examples/data/3D_gathers_pstm_nmo.sgy
            segysak_source/examples/data/volve10-migvel-depth-sub3d.sgy
          compression-level: 0
          retention-days: 7
