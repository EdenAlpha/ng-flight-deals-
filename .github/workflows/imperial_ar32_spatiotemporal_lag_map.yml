name: Imperial AR32 spatiotemporal lag map
on:
  pull_request:
    branches: [imperial-persistent-ar32-step267-full-array]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy h5py pysz boto3 zstandard
      - name: Download canonical Imperial Valley record
        run: python -c "import boto3;from botocore import UNSIGNED;from botocore.config import Config;boto3.client('s3',config=Config(signature_version=UNSIGNED)).download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')"
      - name: Search slanted spacetime dependence
        run: python research/imperial_ar32_spatiotemporal_lag_map.py imperial.h5
      - name: Surface slanted dependence
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_spatiotemporal_lag_map.json'))
          for r in d['rows']:
            fs=r['feature_results'];best=max((v['best_offaxis']['mi_bps'],k,v['best_offaxis']) for k,v in fs.items());ex=max((v['best_excess']['excess_over_axis'],k,v['best_excess']) for k,v in fs.items())
            print(f"::notice title=lagmap {r['region']}::bestMI={best[0]:.6f} feature={best[1]} dc={best[2]['dc']} dt={best[2]['dt']}; best_excess={ex[0]:.6f} feature={ex[1]} dc={ex[2]['dc']} dt={ex[2]['dt']} axis={ex[2]['axis_max_mi']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-spatiotemporal-lag-map
          path: imperial_ar32_spatiotemporal_lag_map.json
          retention-days: 7
