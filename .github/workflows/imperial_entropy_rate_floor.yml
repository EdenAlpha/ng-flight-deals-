name: Imperial entropy-rate floor audit
on:
  pull_request:
    branches: [imperial-gca-state-residue-fast]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy scikit-learn numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Rebuild exact incumbent and estimate block entropy rate
        run: PYTHONPATH=research python research/imperial_entropy_rate_floor.py imperial.h5
      - name: Surface diagnostic
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_entropy_rate_floor.json'))
          for z in d['blocks']:
            print(f"B={z['B']} hardbox268={z['mean_hardbox_268_diagnostic_bps']:.6f} bps corrected_h={z['mean_corrected_hper']:.6f}")
          print(f"incumbent={d['current_exact_bps']:.6f} target={d['two_x_target_bps']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-entropy-rate-floor
          path: imperial_entropy_rate_floor.json
          if-no-files-found: ignore
          retention-days: 7
