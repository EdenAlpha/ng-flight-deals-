name: Fetch bAbI reasoning benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-babi-benchmark.yml'

concurrency:
  group: clm-babi-benchmark
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download original bAbI 1-20 dataset
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/babi.tar.gz https://s3.amazonaws.com/text-datasets/babi_tasks_1-20_v1-2.tar.gz
          mkdir -p babi
          tar -xzf /tmp/babi.tar.gz -C babi
          find babi -type f | sort | head -50
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: babi-tasks-1-20-v1-2
          path: babi/
          compression-level: 6
          retention-days: 7
