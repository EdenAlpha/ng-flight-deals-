name: Standalone Soda SEG-Y sparse-grid container
on:
  pull_request:
    branches: [soda-grid-lattice]
permissions: {contents: read}
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard pysz boto3
      - name: Download deterministic median raw shot
        shell: bash
        run: |
          python - <<'PY'
          import boto3,json
          from botocore import UNSIGNED
          from botocore.config import Config
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*.5);k,n=keys[i];print('SHOT',i,k,n,flush=True);s3.download_file(bucket,k,'middle.sgy');json.dump({'total':len(keys),'index':i,'key':k,'size':n},open('standalone_selection.json','w'),indent=2)
          PY
      - name: Encode standalone container, decode exact-format SEG-Y, reopen and verify
        run: python research/soda_standalone_codec_v2.py middle.sgy middle.segc reconstructed.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-standalone-codec-results
          path: |
            standalone_selection.json
            soda_standalone_result.json
            middle.segc
          retention-days: 7
