name: Imperial cross-lag moveout oracle

on:
  pull_request:
    paths:
      - 'research/imperial_crosslag_moveout_oracle.py'
      - '.github/workflows/imperial_crosslag_moveout_oracle.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run impossible cross-lag moveout ceiling
        run: python research/imperial_crosslag_moveout_oracle.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_crosslag_moveout_oracle.json'))
          for r in d['rows']:
              t=r['temporal_same_boundary'];c=r['current_spatial_same_boundary'];m=r['crosslag_moveout_oracle']
              print(f"::notice title=moveout oracle {r['region']}::temporal={t['bps']:.5f}, currentSpatial={c['bps']:.5f}, crossLag={m['bps']:.5f}, gainLagVsCurrent={m['gain_vs_current_spatial']:.6f}, targetRatio={m['ratio_to_2x_target']:.5f}, zero={m['zero_fraction']:.4f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-crosslag-moveout-oracle
          path: imperial_crosslag_moveout_oracle.json
          retention-days: 7
