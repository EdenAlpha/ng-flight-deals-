name: Imperial hard partition coordinate sweep
on:
  pull_request:
    branches: [imperial-nova-ar-order-address-sweep]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Search channel partitions and AR coordinates on hard Imperial
        run: python research/imperial_hard_partition_coordinate_sweep.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_hard_partition_coordinate_sweep.json'));b=d['best']
          print(f"::notice title=hard partition search::best={b['bytes']} B width={b['width']} p={b['order']} restricted={b['restricted']}; legacyAR32={d['legacy_ar32_floor']['bytes']} B; SZ3={d['sz3']['bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-hard-partition-coordinate-sweep
          path: imperial_hard_partition_coordinate_sweep.json
          if-no-files-found: ignore
          retention-days: 7
