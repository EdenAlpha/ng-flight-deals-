name: Master Portfolio V2 marine structural gate

on:
  push:
    branches: [general-seismic-master-portfolio-v2]
    paths:
      - 'research/marine_carrier_pr6_v2.py'
      - 'research/master_portfolio_v2_compete.py'
      - '.github/workflows/master_portfolio_v2_marine_structural_gate.yml'
  workflow_dispatch:

jobs:
  structural-autodetect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pysz zstandard brotli
      - name: Build synthetic structurally eligible SEG-Y and verify auto geometry
        env:
          PYTHONPATH: research
        run: |
          python - <<'PY'
          import os
          import tempfile
          import numpy as np
          import marine_carrier_pr6_v2 as m

          shots, channels, ns = 3, 48, 64
          rng = np.random.default_rng(20260815)
          X = rng.normal(0, 3, size=(shots, channels, ns)).astype('<f4')

          fd, path = tempfile.mkstemp(suffix='.sgy')
          os.close(fd)
          try:
              hdr = bytearray(3600)
              # SEG-Y binary header samples/trace (big endian), format code 5.
              hdr[3220:3222] = int(ns).to_bytes(2, 'big')
              hdr[3224:3226] = (5).to_bytes(2, 'big')
              with open(path, 'wb') as f:
                  f.write(hdr)
                  for tr in X.reshape(-1, ns):
                      th = bytearray(240)
                      th[114:116] = int(ns).to_bytes(2, 'big')
                      f.write(th)
                      f.write(tr.tobytes(order='C'))

              Y, g = m.pr6_load_auto(path)
              assert g['shots'] == shots, g
              assert g['channels'] == channels, g
              assert g['samples'] == ns, g
              assert np.array_equal(X, Y)

              eps = 0.10 * float(X.astype(np.float64).std())
              best, rows = m.compete(X, eps, m_values=(16, 32, 64))
              assert best['valid'], best
              blob = m.encode_array(X, eps, best['M'])
              R, meta = m.decode_stream(blob)
              err = float(np.max(np.abs(X.astype(np.float64) - R.astype(np.float64))))
              assert err <= eps * (1.0 + 3e-6), (err, eps)
              assert meta['shots'] == shots and meta['channels'] == channels and meta['samples'] == ns
              print({'geometry': g, 'best': best, 'maxerr': err, 'epsilon': eps})
          finally:
              os.unlink(path)
          PY
