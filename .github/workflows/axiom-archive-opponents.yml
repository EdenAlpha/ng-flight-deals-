name: AXIOM archive opponents
on:
  pull_request:
    branches: [main]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full brotli zstd xz-utils git
      - name: Rebuild deterministic Android corpus and benchmark
        run: |
          set -euxo pipefail
          rm -rf /tmp/android-src
          git clone -q --depth 1 https://github.com/android/architecture-samples.git /tmp/android-src
          rm -rf /tmp/android-src/.git
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 -cf /tmp/android_app_raw.tar -C /tmp/android-src app build.gradle.kts settings.gradle.kts gradle.properties 2>/dev/null || tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 -cf /tmp/android_app_raw.tar -C /tmp/android-src app
          sha256sum /tmp/android_app_raw.tar | tee /tmp/sha.txt
          xz -9e -k -f /tmp/android_app_raw.tar
          brotli -q 11 -f /tmp/android_app_raw.tar -o /tmp/android.br
          zstd -22 --ultra -q -f /tmp/android_app_raw.tar -o /tmp/android.zst
          7z a -bd -y -t7z -m0=lzma2 -mx=9 -md=256m -mfb=273 -ms=on /tmp/android_lzma2.7z /tmp/android_app_raw.tar >/dev/null
          7z a -bd -y -t7z -m0=PPMd -mmem=256m -mo=16 /tmp/android_ppmd.7z /tmp/android_app_raw.tar >/dev/null || true
          python3 - <<'PY' | tee /tmp/results.txt
          import os,glob
          for p in ['/tmp/android_app_raw.tar','/tmp/android_app_raw.tar.xz','/tmp/android.br','/tmp/android.zst','/tmp/android_lzma2.7z','/tmp/android_ppmd.7z']:
              if os.path.exists(p): print(os.path.basename(p), os.path.getsize(p))
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: axiom-archive-opponents
          path: |
            /tmp/results.txt
            /tmp/sha.txt
          retention-days: 7
