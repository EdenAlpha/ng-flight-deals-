name: Migrated Waka multi-position tile corpus
on:
  push:
    branches: [migrated-volume-geometry-engine-v1]
    paths:
      - 'research/migrated_volume_native_tile_corpus.py'
      - '.github/workflows/migrated_volume_waka_tile_corpus.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/migrated_volume_native_tile_corpus.py'
      - '.github/workflows/migrated_volume_waka_tile_corpus.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  BENCHMARK_DEFINITION_SHA: 9b304e262182caa29a2c93e7e74e09ccb5715e92
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy zstandard brotli boto3 pysz
      - name: Materialize frozen survey manifest
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_manifest.json
      - name: Extract deterministic Waka corpus
        env: {PYTHONPATH: research}
        run: |
          python research/migrated_volume_native_tile_corpus.py \
            --manifest frozen_manifest.json \
            --eps benchmarks/migrated_volume_global_eps_v1.json \
            --dataset marine_waka_3d \
            --out waka_native_corpus.npz
      - uses: actions/upload-artifact@v4
        with:
          name: waka-native-multiposition-corpus
          path: |
            waka_native_corpus.npz
            waka_native_corpus.npz.json
          compression-level: 0
          retention-days: 30
