name: Imperial AR1 symbol histogram rank
on:
  pull_request:
    branches: [imperial-ar1-rich-adaptive-context-address]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Rank whole K sequence inside its exact symbol histogram class
        run: python research/imperial_ar1_symbol_histogram_rank.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar1_symbol_histogram_rank.json'))
          print(f"::notice title=AR1 symbol histogram rank::rich={d['rich_bitplanes']['bytes']} B symbol={d['symbol_histogram_rank']['bytes']} B chosen={d['chosen']} best={d['best_bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-ar1-symbol-histogram-rank
          path: imperial_ar1_symbol_histogram_rank.json
          if-no-files-found: ignore
          retention-days: 7
