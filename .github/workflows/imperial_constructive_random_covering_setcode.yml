name: Imperial constructive random-covering set code
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run constructive covering code
        run: python research/run_imperial_constructive_random_covering_setcode.py imperial.h5
      - name: Surface covering-code results
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_constructive_random_covering_setcode.json'))
          for r in d['rows']:
            msg=(f"bytes={r['container_bytes']}, bps={r['bps']:.5f}, heldout_bps={r['heldout_payload_bps']:.5f}, "
                 f"success={r['success_fraction']:.5f}, escapes={r['escape_blocks']}/{r['total_blocks']}, "
                 f"gain_vs_SZ3={r['gain_vs_sz3']:.6f}, ratio_to_2x_target={r['ratio_to_2x_target']:.6f}, "
                 f"mode={r['predictor_mode']}, mean_index={r['mean_index']}")
            level='notice' if r['gain_vs_sz3']>1 else 'warning'
            print(f"::{level} title=set-code {r['region']}::{msg}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-constructive-random-covering-setcode
          path: imperial_constructive_random_covering_setcode.json
          if-no-files-found: ignore
          retention-days: 7
