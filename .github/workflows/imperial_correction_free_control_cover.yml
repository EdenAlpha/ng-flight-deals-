name: Imperial correction-free checkerboard control cover
on:
  pull_request:
    branches: [imperial-spacetime-control-mesh]
permissions: {contents: read}
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy h5py zstandard pysz boto3
      - name: Download exact Imperial Valley HDF5 record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Solve global legal control assignments that erase omitted-sample corrections
        run: |
          python - <<'PY'
          p='research/imperial_correction_free_control_cover.py'
          s=open(p).read()
          s=s.replace("float(getattr(res,'fun',np.nan))","(float(res.fun) if res.fun is not None else None)")
          open(p,'w').write(s)
          PY
          python research/imperial_correction_free_control_cover.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-correction-free-control-cover
          path: imperial_correction_free_control_cover.json
          retention-days: 7
