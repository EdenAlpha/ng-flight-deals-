name: Imperial h2 phase-seeded rich search
on:
  pull_request:
    branches: [imperial-h2-rich-causal-headtohead]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Search all public h2 lattice phases and compare to rich AR32
        run: python research/imperial_h2_phase_seeded_rich.py imperial.h5
      - name: Surface exact phase winner
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_h2_phase_seeded_rich.json'));b=d['best'];a=d['ar32_rich'];level='notice' if b['bytes']<a['bytes'] else 'warning'
          print(f"::{level} title=h2-phase hard::phase={b['phase_index']}/{d['n_public_phases']}, NOVA={b['bytes']} B, AR32={a['bytes']} B, delta={b['delta_vs_ar32']} B, field={b['field_bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-h2-phase-seeded-rich
          path: imperial_h2_phase_seeded_rich.json
          if-no-files-found: ignore
          retention-days: 7
