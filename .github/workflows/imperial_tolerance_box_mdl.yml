name: Imperial tolerance box MDL screen
on:
  pull_request:
    branches: [imperial-valley-frozen-brady-transfer]
permissions: {contents: read}
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5';n=415030456
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'das.h5');assert os.path.getsize('das.h5')==n
          PY
      - run: python research/imperial_tolerance_box_mdl.py das.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-tolerance-box-mdl
          path: imperial_tolerance_box_mdl.json
          retention-days: 7
