name: Frozen Brady transfer across three full Imperial Valley DAS files
on:
  pull_request:
    branches: [imperial-valley-frozen-brady-transfer]
permissions: {contents: read}
jobs:
  file:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - slot: 0
            key: imperialvalleydas/v1.0.0/DF__UTC_20201112_000032.602.h5
            eps: '71.67200811097179'
            sz3: '104524070'
          - slot: 1
            key: imperialvalleydas/v1.0.0/DF__UTC_20201113_000032.602.h5
            eps: '79.49173775527834'
            sz3: '102424077'
          - slot: 2
            key: imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5
            eps: '133.69778037805762'
            sz3: '86361271'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard boto3
      - name: Download exact PR204 full HDF5 file
        env:
          KEY: '${{ matrix.key }}'
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          key=os.environ['KEY'];s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));s3.download_file('gdr-data-lake',key,'das.h5')
          if os.path.getsize('das.h5')!=415030456:raise RuntimeError(('file drift',key,os.path.getsize('das.h5')))
          PY
      - name: Apply exact frozen Brady N256 transfer
        env:
          EXPECTED_EPS: '${{ matrix.eps }}'
          SZ3_BYTES: '${{ matrix.sz3 }}'
          SLOT: '${{ matrix.slot }}'
        run: |
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path('research/imperial_valley_frozen_brady_transfer.py')
          s=p.read_text()
          s=s.replace('baseline_eps=133.69778037805762;baseline_sz3=86361271',f"baseline_eps={os.environ['EXPECTED_EPS']};baseline_sz3={os.environ['SZ3_BYTES']}")
          p.write_text(s)
          PY
          python research/imperial_valley_frozen_brady_transfer.py das.h5
          mv imperial_valley_frozen_brady_transfer.json result_${SLOT}.json
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-valley-brady-large3-${{ matrix.slot }}
          path: result_${{ matrix.slot }}.json
          retention-days: 7
  aggregate:
    needs: file
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: imperial-valley-brady-large3-*
          path: all
          merge-multiple: true
      - name: Aggregate exact three-file result
        run: |
          python - <<'PY'
          import glob,json,statistics
          rr=[json.load(open(p)) for p in sorted(glob.glob('all/result_*.json'))]
          if len(rr)!=3:raise RuntimeError(('missing results',len(rr)))
          if not all(r['valid'] for r in rr):raise RuntimeError('invalid file')
          raw=sum(r['native_numeric_bytes'] for r in rr);ours=sum(r['container_bytes'] for r in rr);sz3=sum(r['pr204_matched_block_sz3_bytes'] for r in rr)
          gains=[r['gain_vs_pr204_sz3'] for r in rr]
          out={'files':3,'native_numeric_bytes':raw,'brady_container_bytes':ours,'matched_sz3_bytes':sz3,'brady_ratio':raw/ours,'sz3_ratio':raw/sz3,'aggregate_gain_vs_sz3':sz3/ours,'min_file_gain_vs_sz3':min(gains),'median_file_gain_vs_sz3':statistics.median(gains),'max_file_gain_vs_sz3':max(gains),'all_valid':True,'definition':'frozen Brady PR56 128x1024 topN=256 int8 complex + exact correction; float32 transmitted scale only for dynamic range','scope':'three entire Acoustic arrays; HDF5 metadata excluded'}
          print(json.dumps(out,indent=2),flush=True);json.dump(out,open('imperial_valley_brady_large3_summary.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-valley-brady-large3-summary
          path: imperial_valley_brady_large3_summary.json
          retention-days: 7
