name: Standalone Utah FORGE lattice SEG-Y container
on:
  pull_request:
    branches: [forge-raw-lattice-pilot]
permissions: {contents: read}
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          pip install --quiet numpy zstandard pysz requests
      - name: CRC-extract deterministic p50 Utah FORGE gather
        shell: bash
        run: |
          python - <<'PY'
          import requests,struct
          url='https://gdr.openei.org/files/1015/1001-1122%20%281%29.zip';name=b'1511994193_1017_50500_16500_20171202_220556_570.sgy';fs=112237868;cs=102933340;crc=226598985;method=9;off=1647386036
          r=requests.get(url,headers={'Range':f'bytes={off}-{off+cs-1}'},timeout=120);r.raise_for_status();payload=r.content
          if len(payload)!=cs:raise RuntimeError((len(payload),cs))
          local=struct.pack('<IHHHHHIIIHH',0x04034b50,21,0,method,0,0,crc,cs,fs,len(name),0)+name;central=struct.pack('<IHHHHHHIIIHHHHHII',0x02014b50,20,21,0,method,0,0,crc,cs,fs,len(name),0,0,0,0,0,0)+name;cd=len(local)+len(payload);eocd=struct.pack('<IHHHHIIH',0x06054b50,0,0,1,1,len(central),cd,0);open('member.zip','wb').write(local+payload+central+eocd)
          PY
          7z t member.zip >/dev/null
          mkdir x && 7z x -y -ox member.zip >/dev/null
          mv x/1511994193_1017_50500_16500_20171202_220556_570.sgy forge_raw.sgy
      - name: Encode, decode, and independently verify both whole-file containers
        run: python research/forge_standalone_segc.py forge_raw.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: forge-standalone-segc-results
          path: |
            forge_standalone_result.json
            utah.segc
            utah_sz3.segz
          retention-days: 7
