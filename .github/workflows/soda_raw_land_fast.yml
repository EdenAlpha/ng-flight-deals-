name: Soda Lake raw-land cached fast sweep
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard pysz boto3
      - name: Select same deterministic three raw shots
        shell: bash
        run: |
          python - <<'PY'
          import boto3,json,os
          from botocore import UNSIGNED
          from botocore.config import Config
          bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));keys=[]
          for page in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in page.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();inds=[round((len(keys)-1)*p) for p in (0.1,0.5,0.9)];chosen=[keys[i] for i in inds];os.makedirs('shots',exist_ok=True);sel=[]
          for j,(k,n) in enumerate(chosen):
            fn=f'shots/shot{j}.sgy';print('DOWNLOAD',j,k,n,flush=True);s3.download_file(bucket,k,fn);sel.append({'index':inds[j],'key':k,'size':n,'local':fn})
          json.dump({'total_segy_objects':len(keys),'selected':sel},open('soda_fast_selection.json','w'),indent=2)
          PY
      - run: python research/soda_raw_land_fast.py shots/shot0.sgy shots/shot1.sgy shots/shot2.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-raw-land-fast-results
          path: |
            soda_fast_selection.json
            soda_raw_fast_results.json
          retention-days: 7
