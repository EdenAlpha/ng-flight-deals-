name: Migrated volume hierarchical 4x64 scale gate
on:
  push:
    branches: [migrated-volume-geometry-engine-v1]
    paths:
      - 'research/migrated_volume_hier64_screen.py'
      - '.github/workflows/migrated_volume_hier64.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  BENCHMARK_DEFINITION_SHA: 9b304e262182caa29a2c93e7e74e09ccb5715e92
jobs:
  hier64:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [marine_waka_3d, marine_opunake_3d, marine_tui_3d, marine_kahu_3d]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy zstandard brotli boto3 pysz
      - name: Materialize exact frozen survey manifest
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_manifest.json
      - name: Hierarchical native 3D versus whole-block SZ3
        env: {PYTHONPATH: research}
        run: |
          mkdir -p hier64_results
          python research/migrated_volume_hier64_screen.py \
            --manifest frozen_manifest.json \
            --eps benchmarks/migrated_volume_global_eps_v1.json \
            --dataset '${{ matrix.dataset }}' \
            --out 'hier64_results/${{ matrix.dataset }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hier64-${{ matrix.dataset }}
          path: hier64_results/${{ matrix.dataset }}.json
          if-no-files-found: warn
          retention-days: 30
