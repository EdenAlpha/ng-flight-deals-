name: General seismic sharded runner invariants

on:
  pull_request:
    branches: [ general-seismic-benchmark-v1 ]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  sharded-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy boto3
      - name: Exact-once shard partition and exact moment merge
        env: {PYTHONPATH: research}
        run: python research/general_seismic_sharded_runner.py selftest
