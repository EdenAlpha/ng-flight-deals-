name: Imperial h2 rich transfer panel
on:
  pull_request:
    branches: [imperial-h2-rich-causal-headtohead]
permissions: {contents: read}
jobs:
  object:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: hard_t2048, t0: 2048, c0: 512}
          - {name: hard_t8192, t0: 8192, c0: 512}
          - {name: hard_t14488, t0: 14488, c0: 512}
          - {name: hard_t22000, t0: 22000, c0: 512}
          - {name: easy_t14488, t0: 14488, c0: 2304}
          - {name: far_t14488, t0: 14488, c0: 6784}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run one frozen h2 transfer object
        run: python research/imperial_h2_rich_transfer_one.py imperial.h5 ${{ matrix.name }} ${{ matrix.t0 }} ${{ matrix.c0 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-transfer-${{ matrix.name }}
          path: imperial_h2_transfer_${{ matrix.name }}.json
          if-no-files-found: ignore
          retention-days: 7
