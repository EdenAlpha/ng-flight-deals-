name: Imperial h2 rich transfer panel
on:
  pull_request:
    branches: [imperial-h2-rich-causal-headtohead]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run precommitted h2 transfer panel
        run: python research/imperial_h2_rich_transfer_panel.py imperial.h5
      - name: Surface transfer result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_h2_rich_transfer_panel.json'));s=d['summary'];level='notice' if s['NOVA_total']<s['AR32_total'] else 'warning'
          print(f"::{level} title=h2 transfer::wins={s['wins_vs_AR32']}/{s['objects']}, NOVA={s['NOVA_total']} B, AR32={s['AR32_total']} B, delta={s['delta_total']} B, aggGain={s['aggregate_gain_vs_AR32']:.6f}x")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-h2-rich-transfer-panel
          path: imperial_h2_rich_transfer_panel.json
          if-no-files-found: ignore
          retention-days: 7
