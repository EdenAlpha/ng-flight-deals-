name: Imperial frozen lattice aggregate recovery

on:
  pull_request:
    paths:
      - '.github/workflows/imperial_frozen_lattice_aggregate_recovery.yml'
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download successful map artifacts from original run
        uses: actions/download-artifact@v4
        with:
          pattern: imperial-frozen-lattice-full-*
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 31793035596
      - name: Aggregate structural ceiling
        run: python research/imperial_frozen_lattice_full_array_map.py aggregate
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_frozen_lattice_full_aggregate.json'))
          print(f"::notice title=frozen full-array::SZ3={d['sz3_bps']:.5f} bps, frozen={d['frozen_bps']:.5f}, hybrid={d['oracle_hybrid_bps']:.5f}, hybridGainSZ3={d['oracle_hybrid_gain_vs_sz3']:.6f}, frozenWins={d['blocks_frozen_beats_sz3']}/54, 2xBlocks={d['blocks_frozen_meets_2x_sz3']}/54, change[min/med/mean/max]={d['change_fraction_min']:.5f}/{d['change_fraction_median']:.5f}/{d['change_fraction_mean']:.5f}/{d['change_fraction_max']:.5f}, stillNeed={100*d['fraction_reduction_still_needed_from_hybrid']:.2f}%")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-frozen-lattice-full-aggregate-recovered
          path: imperial_frozen_lattice_full_aggregate.json
          retention-days: 7
