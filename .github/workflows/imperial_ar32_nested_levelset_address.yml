name: Imperial AR32 nested level-set address
on:
  pull_request:
    branches: [imperial-persistent-ar32-step267-full-array]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          h=hashlib.md5(open('imperial.h5','rb').read()).hexdigest();assert h=='8cb7ea8466ab48880f876fc43cb5ce75',h
          PY
      - name: Build and decode nested constrained address
        run: python research/imperial_ar32_nested_levelset_address.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_nested_levelset_address.json'));b=d['best'];level='notice' if b['gain_vs_ar32']>1 else 'warning'
          print(f"::{level} title=nested-levelset hard::nested={b['bytes']} B, AR32={d['ar32']['bytes']} B, SZ3={d['sz3']['bytes']} B, gainAR={b['gain_vs_ar32']:.6f}x, gainSZ3={b['gain_vs_sz3']:.6f}x, address={b['address_bytes']} B, order={b['order_name']}, outer={b['outer_rep']}, modes={b['mode_counts']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-ar32-nested-levelset-address
          path: imperial_ar32_nested_levelset_address.json
          if-no-files-found: ignore
          retention-days: 7
