name: Fast FORGE warp-state automaton
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  warpstate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          pip install --quiet numpy pysz segyio
      - run: |
          curl -L --fail --retry 5 --retry-delay 2 -o forge.zip 'https://gdr.openei.org/files/1141/2018-19%20Reflection%20Processing.zip'
          python - <<'PY'
          import zipfile
          n='2018-19 Reflection Processing/3D Survey/Forge3d_ANI_PSDM_Stack_UnEnh.segy';z=zipfile.ZipFile('forge.zip');z.extract(n,'.')
          PY
          cat > /tmp/a.py <<'PY'
          import json,subprocess,numpy as np,segyio
          from pysz import sz,szConfig,szErrorBoundMode
          p='2018-19 Reflection Processing/3D Survey/Forge3d_ANI_PSDM_Stack_UnEnh.segy'
          with segyio.open(p,'r',strict=False,ignore_geometry=True) as f:T=np.asarray(f.trace.raw[:],dtype=np.float32).reshape(170,213,1001)
          std=float(np.std(T,dtype=np.float64));eps=.1*std;X=np.ascontiguousarray(T[53:117,74:138,244:756]);del T;raw=X.nbytes
          def z(a):return len(subprocess.run(['zstd','-q','-f','-19','-c'],input=np.ascontiguousarray(a).tobytes(),stdout=subprocess.PIPE,check=True).stdout)
          def si(a):
            lo=int(a.min()) if a.size else 0;hi=int(a.max()) if a.size else 0
            return a.astype(np.int8) if lo>=-128 and hi<=127 else a.astype(np.int16) if lo>=-32768 and hi<=32767 else a.astype(np.int32)
          def grid(n):
            g=list(range(0,n,2))
            if g[-1]!=n-1:g.append(n-1)
            return g
          def root(Q,E,L,U,i,j):
            q=0;old=0
            for t in range(Q.shape[2]):
              q=max(int(L[i,j,t]),min(int(U[i,j,t]),q));Q[i,j,t]=q;E[i,j,t]=q-old;old=q
          def base(A,B,t,s):
            ta=max(0,min(len(A)-1,t-s));tb=max(0,min(len(B)-1,t+s));return (int(A[ta])+int(B[tb]))//2
          def fill(Q,DS,DC,L,U,axis,target,left,right,fixed,SR,ws):
            A=Q[left,fixed] if axis==0 else Q[fixed,left];B=Q[right,fixed] if axis==0 else Q[fixed,right]
            s=0;c=0
            for t in range(Q.shape[2]):
              lo=int(L[target,fixed,t] if axis==0 else L[fixed,target,t]);hi=int(U[target,fixed,t] if axis==0 else U[fixed,target,t]);pv=base(A,B,t,s);q=pv+c
              if q<lo or q>hi:
                best=None
                for ss in range(-SR,SR+1):
                  pp=base(A,B,t,ss);clo=lo-pp;chi=hi-pp;cc=max(clo,min(chi,c))
                  key=(ws*(ss!=s)+abs(cc-c),abs(ss-s),abs(cc),abs(ss),ss,cc)
                  if best is None or key<best[0]:best=(key,ss,cc,pp)
                _,ns,nc,pv=best;ds=ns-s;dc=nc-c;s=ns;c=nc
                if axis==0:DS[target,fixed,t]=ds;DC[target,fixed,t]=dc
                else:DS[fixed,target,t]=ds;DC[fixed,target,t]=dc
              q=pv+c
              if axis==0:Q[target,fixed,t]=q
              else:Q[fixed,target,t]=q
          def run(alpha,SR,ws):
            step=alpha*eps;L=np.ceil((X-eps)/step-1e-7).astype(np.int32);U=np.floor((X+eps)/step+1e-7).astype(np.int32);Q=np.zeros(X.shape,np.int32);RE=np.zeros(X.shape,np.int32);DS=np.zeros(X.shape,np.int8);DC=np.zeros(X.shape,np.int32);gi=grid(X.shape[0]);gj=grid(X.shape[1])
            for i in gi:
              for j in gj:root(Q,RE,L,U,i,j)
            for i in gi:
              for k in range(len(gj)-1):
                a,b=gj[k],gj[k+1]
                if b-a>1:fill(Q,DS,DC,L,U,1,(a+b)//2,a,b,i,SR,ws)
            for k in range(len(gi)-1):
              a,b=gi[k],gi[k+1]
              if b-a>1:
                m=(a+b)//2
                for j in range(Q.shape[1]):fill(Q,DS,DC,L,U,0,m,a,b,j,SR,ws)
            rm=np.zeros(X.shape,bool);rm[np.ix_(gi,gj,range(X.shape[2]))]=True;R=RE[rm];rb=min(z(si(R)),z(np.packbits(R!=0,bitorder='little'))+(z(si(R[R!=0])) if np.any(R!=0) else 0))
            ev=(DS!=0)|(DC!=0);V=ev[~rm];top=z(np.packbits(V,bitorder='little'));dsv=DS[~rm][V];dcv=DC[~rm][V];vals=z(dsv.astype(np.int8))+(z(si(dcv)) if dcv.size else 0);detail=top+vals;total=rb+detail+80
            return {'alpha':alpha,'SR':SR,'ws':ws,'bytes':total,'ratio':raw/total,'root':rb,'detail':detail,'event_fraction':float(V.mean()),'shift_event_fraction':float(np.mean(dsv!=0)) if dsv.size else 0,'maxerr':float(np.max(np.abs(X-Q.astype(np.float32)*step)))}
          cfg=szConfig();cfg.errorBoundMode=szErrorBoundMode.ABS;cfg.absErrorBound=eps;b,_=sz.compress(X,cfg);Y,_=sz.decompress(b,np.float32,X.shape);print('BASE',json.dumps({'bytes':int(b.size),'ratio':raw/int(b.size),'maxerr':float(np.max(np.abs(X-Y)))}),flush=True)
          rows=[]
          for alpha in [1.95,1.75,1.5,1.25]:
            for SR in [1,2,3,4]:
              for ws in [0,1,3]:
                r=run(alpha,SR,ws);rows.append(r);print('WARPSTATE',json.dumps(r),flush=True)
          rows.sort(key=lambda r:r['bytes']);print('BEST',json.dumps(rows[:12],indent=2),flush=True)
          PY
          python /tmp/a.py
