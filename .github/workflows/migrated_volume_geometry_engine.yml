name: Migrated volume geometry engine

on:
  push:
    branches: [migrated-volume-geometry-engine-v1]
    paths:
      - 'research/migrated_volume_geometry_engine.py'
      - '.github/workflows/migrated_volume_geometry_engine.yml'
  workflow_dispatch:
    inputs:
      sample_panels:
        description: 'Deterministic reservoir panels per migrated survey'
        required: false
        default: '16'

env:
  BENCHMARK_DEFINITION_SHA: 9b304e262182caa29a2c93e7e74e09ccb5715e92

permissions: {contents: read}

jobs:
  sanity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy zstandard
      - name: Exact codec sanity
        env: {PYTHONPATH: research}
        run: python research/migrated_volume_geometry_engine.py sanity

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet boto3
      - name: Fetch exact frozen benchmark definition
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_benchmark_manifest.json
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1_execution_amendments.json" > frozen_execution_amendments.json
          git show "$BENCHMARK_DEFINITION_SHA:research/general_seismic_v1_preflight.py" > frozen_preflight.py
      - name: Materialize exact effective manifest
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open('frozen_benchmark_manifest.json'))
          a=json.load(open('frozen_execution_amendments.json'))
          for d in m['datasets']:
              if d['id'] in a.get('dataset_overrides',{}): d.update(a['dataset_overrides'][d['id']])
          m['execution_amendment']=a
          m['benchmark_definition_sha']=os.environ['BENCHMARK_DEFINITION_SHA']
          json.dump(m,open('general_seismic_v1_effective_manifest.json','w'),indent=2)
          PY
      - name: Resolve exact frozen objects
        run: python frozen_preflight.py general_seismic_v1_effective_manifest.json
      - name: Require migrated-volume targets
        run: |
          python - <<'PY'
          import json
          targets={'marine_waka_3d','marine_opunake_3d','marine_tui_3d','marine_kahu_3d'}
          x=json.load(open('general_seismic_v1_preflight.json'))
          rows={r['id']:r for r in x['datasets']}
          bad=[rows.get(k,{'id':k,'status':'missing'}) for k in targets if k not in rows or rows[k]['status']!='ok']
          assert not bad,bad
          print('TARGETS',[(k,rows[k]['selected_gb']) for k in sorted(targets)])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: migrated-volume-frozen-plan
          path: |
            general_seismic_v1_effective_manifest.json
            general_seismic_v1_preflight.json
          retention-days: 30

  survey:
    needs: [sanity, plan]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset:
          - marine_waka_3d
          - marine_opunake_3d
          - marine_tui_3d
          - marine_kahu_3d
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: migrated-volume-frozen-plan
          path: frozen_plan
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact benchmark dependencies
        run: pip install --quiet numpy zstandard brotli pybind11 boto3 h5py 's3fs<2027' segyio pysz obspy
      - name: Compile shared exact ZSM backend required by benchmark imports
        run: |
          EXT=$(python3-config --extension-suffix)
          c++ -O3 -march=x86-64 -shared -std=c++17 -fPIC $(python -m pybind11 --includes) research/general_seismic_fast_zsm.cpp -o research/general_seismic_fast_zsm${EXT}
      - name: Run geometry-aware migrated-volume engine
        env: {PYTHONPATH: research}
        shell: bash
        run: |
          mkdir -p results
          SP='${{ github.event.inputs.sample_panels }}'
          if [ -z "$SP" ]; then SP=16; fi
          python research/migrated_volume_geometry_engine.py survey \
            --manifest frozen_plan/general_seismic_v1_effective_manifest.json \
            --preflight frozen_plan/general_seismic_v1_preflight.json \
            --config benchmarks/general_seismic_codec_portfolio_v1.json \
            --dataset '${{ matrix.dataset }}' \
            --sample-panels "$SP" \
            --out 'results/${{ matrix.dataset }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrated-volume-${{ matrix.dataset }}
          path: results/${{ matrix.dataset }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: survey
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: migrated-volume-marine_*
          path: survey_results
          merge-multiple: true
      - name: Aggregate migrated-volume results
        env: {PYTHONPATH: research}
        run: python research/migrated_volume_geometry_engine.py aggregate --results survey_results --out migrated_volume_headline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrated-volume-headline
          path: migrated_volume_headline.json
          if-no-files-found: warn
          retention-days: 90
