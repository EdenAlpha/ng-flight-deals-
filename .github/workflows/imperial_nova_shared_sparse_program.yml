name: Imperial NOVA shared sparse program
on:
  pull_request:
    branches: [imperial-persistent-ar32-step267-full-array]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba scipy scikit-learn h5py zstandard pysz boto3
      - name: Download two prior records and exact target
        run: |
          python - <<'PY'
          import boto3,hashlib,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';prefix='imperialvalleydas/v1.0.0/';target=prefix+'DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));rows=[]
          for pg in s.get_paginator('list_objects_v2').paginate(Bucket=b,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].endswith('.h5'):rows.append((o['Key'],int(o['Size'])))
          rows.sort();keys=[x[0] for x in rows];i=keys.index(target);sel=rows[i-2:i+1]
          if len(sel)!=3 or sel[-1][0]!=target:raise RuntimeError(sel)
          for name,(k,n) in zip(('train0.h5','train1.h5','target.h5'),sel):
            s.download_file(b,k,name);assert os.path.getsize(name)==n
          assert os.path.getsize('target.h5')==415030456
          h=hashlib.md5()
          with open('target.h5','rb') as f:
            for x in iter(lambda:f.read(8<<20),b''):h.update(x)
          assert h.hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          print(sel)
          PY
      - name: Train frozen sparse generators and encode held-out target
        run: python research/imperial_nova_shared_sparse_program.py train0.h5 train1.h5 target.h5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-nova-shared-sparse-program
          path: imperial_nova_shared_sparse_program.json
          if-no-files-found: ignore
          retention-days: 7
