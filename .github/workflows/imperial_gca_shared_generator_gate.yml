name: Imperial GCA shared-generator gate

on:
  push:
    branches: [imperial-gca-shared-generator]
    paths:
      - 'research/imperial_gca_shared_generator_gate.py'
      - '.github/workflows/imperial_gca_shared_generator_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-slim
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley DAS record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run hard/easy GCA generalization gate
        run: PYTHONPATH=research python research/imperial_gca_shared_generator_gate.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-gca-shared-gate
          path: imperial_gca_shared_gate.json
          retention-days: 14
