name: Imperial latent potential screen
on:
  pull_request:
    branches: [imperial-valley-frozen-brady-transfer]
permissions: {contents: read}
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py pysz boto3
      - name: Download exact Imperial Valley file
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5';n=415030456
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'das.h5')
          assert os.path.getsize('das.h5')==n
          PY
      - run: python research/imperial_latent_potential_screen.py das.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-latent-potential-screen
          path: imperial_latent_potential_screen.json
          retention-days: 7
