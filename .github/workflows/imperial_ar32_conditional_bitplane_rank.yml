name: Imperial AR32 conditional bitplane rank
on:
  pull_request:
    branches: [imperial-persistent-ar32-step267-full-array]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Encode decoder-known higher-prefix conditional ranks
        run: python research/imperial_ar32_conditional_bitplane_rank.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_conditional_bitplane_rank.json'))
          print(f"::notice title=conditional-rank hard::conditional={d['conditional_bytes']} B, hybrid={d['hybrid_bytes']} B, AR32={d['ar32_bytes']} B, SZ3={d['sz3_bytes']} B, gainHybrid={d['gain_vs_hybrid']:.6f}x, gainAR={d['gain_vs_ar32']:.6f}x, gainSZ3={d['gain_vs_sz3']:.6f}x")
          for p in d['planes']:
            print(f"::notice title=plane {p['bit']}::{p['mode']} {p['detail']}, frame={p['bytes']} B, zstd={p['zstd']} B, enum={p['enum']} B, cond={p['best_cond']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-ar32-conditional-bitplane-rank
          path: imperial_ar32_conditional_bitplane_rank.json
          if-no-files-found: ignore
          retention-days: 7
