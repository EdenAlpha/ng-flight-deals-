name: General seismic fast ZSM equivalence and speed gate

on:
  pull_request:
    branches: [ general-seismic-benchmark-v1 ]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  fast-zsm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install build and codec dependencies
        run: pip install --quiet numpy zstandard pybind11 boto3 h5py
      - name: Compile optimized backend
        run: |
          EXT=$(python3-config --extension-suffix)
          c++ -O3 -march=x86-64 -shared -std=c++17 -fPIC \
            $(python -m pybind11 --includes) \
            research/general_seismic_fast_zsm.cpp \
            -o research/general_seismic_fast_zsm${EXT}
          ls -lh research/general_seismic_fast_zsm${EXT}
      - name: Require bit-for-bit equality against Python reference
        env: {PYTHONPATH: research}
        run: |
          python - <<'PY'
          import json
          import general_seismic_codec_portfolio as ref
          import general_seismic_fast_zsm as fast
          from general_seismic_fast_backend import equivalence
          x=equivalence(ref,fast)
          json.dump({'equivalence':x},open('fast_zsm_gate.json','w'),indent=2)
          print('BIT_EXACT_CASES',len(x))
          PY
      - name: Download one real Imperial HDF5 and measure ZSM hot loop
        run: |
          python - <<'PY'
          import boto3
          from botocore import UNSIGNED
          from botocore.config import Config
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s3.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          PY
      - name: Measure reference vs compiled on identical real K stream
        env: {PYTHONPATH: research}
        run: |
          python - <<'PY'
          import h5py,json,time,numpy as np
          import general_seismic_codec_portfolio as g
          import general_seismic_fast_zsm as f
          with h5py.File('imperial.h5','r') as h:
              X=np.asarray(h['Acoustic'][:8192,:128]).T
          eps=.1*float(X.astype(np.float64).std())
          mode,step=g.ar_step(eps,True);co=g.fit_huber_ar(X,32,1024,step,6);R,K=g.ar_quantize(X,co,32,step,True)
          rows=[]
          for W in (4,8,64):
              t=time.perf_counter();a,na=g.encode_zsm(K,W);tpy=time.perf_counter()-t
              t=time.perf_counter();b,nb=f.encode_zsm(K,W);tfast=time.perf_counter()-t
              assert a==b and na==nb,(W,len(a),len(b),na,nb)
              t=time.perf_counter();D=f.decode_zsm(b,nb,W,*K.shape);tdec=time.perf_counter()-t
              assert np.array_equal(D,K)
              row={'W':W,'shape':list(K.shape),'samples':int(K.size),'bytes':len(a),'python_seconds':tpy,'fast_seconds':tfast,'fast_decode_seconds':tdec,'encode_speedup':tpy/max(tfast,1e-12),'fast_encode_samples_per_second':K.size/max(tfast,1e-12)}
              print(row);rows.append(row)
          q=json.load(open('fast_zsm_gate.json'));q['imperial_real_k']=rows;json.dump(q,open('fast_zsm_gate.json','w'),indent=2)
          assert min(r['encode_speedup'] for r in rows)>=3.0,rows
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: general-seismic-fast-zsm-gate
          path: fast_zsm_gate.json
