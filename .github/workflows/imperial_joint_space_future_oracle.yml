name: Imperial joint space future oracle

on:
  pull_request:
    paths:
      - 'research/imperial_joint_space_future_oracle.py'
      - '.github/workflows/imperial_joint_space_future_oracle.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run impossible joint spatiotemporal oracle
        run: python research/imperial_joint_space_future_oracle.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_joint_space_future_oracle.json'))
          for r in d['rows']:
              o=r['best_joint_oracle']
              print(f"::notice title=joint oracle {r['region']}::oracle={o['bps']:.5f} bps, baseline={r['baseline']['bps']:.5f}, SZ3={r['sz3']['bps']:.5f}, gainBase={o['gain_vs_baseline']:.6f}, ratio2x={o['ratio_to_2x_target']:.6f}, zero={o['zero_fraction']:.5f}, ridge={o['ridge']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-joint-space-future-oracle
          path: imperial_joint_space_future_oracle.json
          retention-days: 7
