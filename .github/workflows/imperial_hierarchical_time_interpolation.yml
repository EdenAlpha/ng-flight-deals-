name: Imperial hierarchical time interpolation
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download Imperial
        run: python -c "import boto3;from botocore import UNSIGNED;from botocore.config import Config;boto3.client('s3',config=Config(signature_version=UNSIGNED)).download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')"
      - name: Run interpolation gate
        run: python research/imperial_hierarchical_time_interpolation.py imperial.h5
      - name: Surface result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_hierarchical_time_interpolation.json'))
          for r in d['rows']:
            b=r['best'];print(f"::notice title=Interpolation {r['region']}::stride={b['stride']}, bps={b['bps']:.5f}, AR={r['step267_bps']:.5f}, gainAR={b['gain_vs_step267']:.6f}, gainSZ3={b['gain_vs_sz3']:.6f}, ratio2x={b['ratio_to_2x_sz3_target']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-hierarchical-time-interpolation
          path: imperial_hierarchical_time_interpolation.json
          retention-days: 7
