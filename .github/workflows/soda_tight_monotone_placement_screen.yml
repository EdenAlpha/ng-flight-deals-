name: Tight-fidelity monotone run-placement screen
on:
  pull_request:
    branches: [soda-tight-refined-context-phase]
permissions: {contents: read}
jobs:
  placement:
    strategy:
      fail-fast: false
      matrix:
        p: [45,75]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard pysz boto3 brotli
      - name: Download deterministic 5pct shot
        shell: bash
        env: {P: '${{ matrix.p }}'}
        run: |
          python - <<'PY'
          import boto3,json,os
          from botocore import UNSIGNED
          from botocore.config import Config
          p=int(os.environ['P']);expected={45:(3744,'soda_lake/raw_seismic/2010/v1.0.0/F4371R1.SGY'),75:(6240,'soda_lake/raw_seismic/2010/v1.0.0/F6618R1.SGY')}
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*p/100);k,n=keys[i];ei,ek=expected[p]
          if len(keys)!=8321 or i!=ei or k!=ek:raise RuntimeError(('selection drift',p,len(keys),i,k))
          s3.download_file(bucket,k,'shot.sgy');json.dump({'percentile':p,'index':i,'key':k,'size':n,'total':len(keys)},open('selection.json','w'),indent=2)
          PY
      - name: Screen exact Elias-Fano and combinatorial placement bytes
        run: python research/soda_tight_monotone_placement_screen.py shot.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-tight-monotone-screen-p${{ matrix.p }}
          path: |
            selection.json
            soda_tight_monotone_placement_screen.json
          retention-days: 7
