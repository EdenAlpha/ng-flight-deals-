name: Imperial AR32 sign-magnitude constrained address
on:
  pull_request:
    branches: [imperial-ar32-hybrid-auto-symbol-address]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Separate magnitude universe from causal sign address
        run: python research/imperial_ar32_sign_magnitude_address.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_sign_magnitude_address.json'))
          print(f"::notice title=AR32 sign-magnitude::bytes={d['bytes']} B, hybrid={d['frozen_hybrid_bytes']} B, SZ3={d['sz3_bytes']} B, gainHybrid={d['gain_vs_frozen_hybrid']:.6f}x, gainSZ3={d['gain_vs_sz3']:.6f}x, mag={d['detail']['magnitude_bytes']} B, sign={d['detail']['sign_bytes']} B, signFamily={d['detail']['sign']['family']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-ar32-sign-magnitude-address
          path: imperial_ar32_sign_magnitude_address.json
          if-no-files-found: ignore
          retention-days: 7
