name: AXIOM decisive same-XZ payload control
on:
  pull_request:
    branches: [axiom-payload-control-base]

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git xz-utils python3-pip
          python3 -m pip install -q pillow fonttools brotli
      - name: Build same pinned app payload
        run: |
          set -euxo pipefail
          git clone -q https://github.com/android/architecture-samples.git /tmp/android-src
          cd /tmp/android-src
          git checkout -q ee66e1526b84c026615df032c705842b7d2a521f
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon >/dev/null
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | sort | head -1)
          mkdir -p /tmp/payload
          unzip -q "$APK" -d /tmp/payload
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 -cf /tmp/payload.tar -C /tmp/payload .
      - name: AXIOM transform and exact precompression verification
        run: |
          set -euxo pipefail
          git clone -q --depth 1 --branch axiom-v02-beast https://github.com/EdenAlpha/ng-flight-deals-.git /tmp/axiom
          PYTHONPATH=/tmp/axiom/axiom_beast python3 - <<'PY'
          import pathlib,hashlib
          import tar_graph_transform as T
          src=pathlib.Path('/tmp/payload.tar').read_bytes()
          rep=T.pack(src)
          assert rep is not None
          out=T.unpack(rep)
          assert out==src
          pathlib.Path('/tmp/payload.rep').write_bytes(rep)
          print('payload_raw',len(src))
          print('semantic_rep',len(rep))
          print('sha',hashlib.sha256(src).hexdigest())
          PY
      - name: Same XZ-9e on both representations
        run: |
          set -euxo pipefail
          xz -9e -c /tmp/payload.tar > /tmp/raw.xz
          xz -9e -c /tmp/payload.rep > /tmp/axiom.xz
          xz -dc /tmp/axiom.xz > /tmp/rep.dec
          PYTHONPATH=/tmp/axiom/axiom_beast python3 - <<'PY'
          import pathlib,os,hashlib
          import tar_graph_transform as T
          src=pathlib.Path('/tmp/payload.tar').read_bytes()
          rep=pathlib.Path('/tmp/rep.dec').read_bytes()
          out=T.unpack(rep)
          assert out==src
          raw=os.path.getsize('/tmp/raw.xz')
          ax=os.path.getsize('/tmp/axiom.xz')+96
          gain=(raw-ax)*100/raw
          txt=(f'payload_raw={len(src)}\nraw_xz9e={raw}\naxiom_same_xz9e={ax}\n'
               f'axiom_gain_vs_same_xz9e_pct={gain:.4f}\nexact_roundtrip=true\n'
               f'payload_sha256={hashlib.sha256(src).hexdigest()}\n'
               f'restored_sha256={hashlib.sha256(out).hexdigest()}\n')
          pathlib.Path('payload_xz_control.txt').write_text(txt)
          print(txt)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-payload-xz-control
          path: payload_xz_control.txt
          retention-days: 7
