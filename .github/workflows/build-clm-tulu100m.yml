name: Build CLM Tulu3 100M paired corpus

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_clm_tulu100m.py'
      - '.github/workflows/build-clm-tulu100m.yml'

concurrency:
  group: clm-tulu100m-build
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install 'datasets>=3.0' huggingface_hub 'sentencepiece>=0.2' zstandard
      - name: Reuse frozen CLM tokenizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9243128836/zip" \
            -o /tmp/clm-general.zip
          unzip -j /tmp/clm-general.zip clm_general_16k.model -d /tmp
          ls -lh /tmp/clm_general_16k.model
      - name: Build 100M paired instruction tokens
        env:
          CLM_TOKENIZER: /tmp/clm_general_16k.model
          HF_HUB_ENABLE_HF_TRANSFER: '0'
        run: python scripts/build_clm_tulu100m.py
      - name: Show manifest
        if: always()
        run: test -f clm_tulu3_100m/manifest.json && cat clm_tulu3_100m/manifest.json || true
      - name: Upload paired corpus
        uses: actions/upload-artifact@v4
        with:
          name: clm-tulu3-100m
          path: clm_tulu3_100m/
          compression-level: 6
          retention-days: 7
