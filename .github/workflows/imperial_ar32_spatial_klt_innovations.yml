name: Imperial AR32 spatial KLT innovations
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download Imperial
        run: python -c "import boto3;from botocore import UNSIGNED;from botocore.config import Config;boto3.client('s3',config=Config(signature_version=UNSIGNED)).download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')"
      - name: Run KLT gate
        run: python research/imperial_ar32_spatial_klt_innovations.py imperial.h5
      - name: Surface KLT result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_spatial_klt_innovations.json'))
          for r in d['rows']:
            b=r['best'];print(f"::notice title=KLT {r['region']}::g={b['g']}, basis={b['basis']}, bps={b['bps']:.5f}, step267={r['step267_bps']:.5f}, gain267={b['gain267']:.6f}, gainSZ3={b['gain_sz3']:.6f}, model={b['model_bytes']}, step={b['min_step']}..{b['max_step']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-spatial-klt-innovations
          path: imperial_ar32_spatial_klt_innovations.json
          retention-days: 7
