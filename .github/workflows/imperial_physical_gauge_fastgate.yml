name: Imperial physical gauge fast gate
on:
  pull_request:
    branches: [imperial-physical-gauge-operator]
permissions: {contents: read}
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5';s.download_file('gdr-data-lake',k,'imperial.h5');assert os.path.getsize('imperial.h5')==415030456
          PY
      - run: python research/imperial_physical_gauge_fastgate.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-physical-gauge-fastgate
          path: imperial_physical_gauge_fastgate.json
          retention-days: 7
