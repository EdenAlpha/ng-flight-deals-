name: Imperial full array Gaussian RD map
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-full-array]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py boto3 zstandard pysz
      - name: Download data
        run: python -c "import boto3;from botocore import UNSIGNED;from botocore.config import Config;boto3.client('s3',config=Config(signature_version=UNSIGNED)).download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')"
      - name: Run all cable slots
        run: |
          for s in 0 1 2 3 4 5 6 7 8; do
            python research/imperial_full_array_gaussian_rd_map.py imperial.h5 $s
          done
      - name: Report aggregate
        run: |
          python - <<'PY'
          import json
          a=[json.load(open('imperial_full_array_gaussian_rd_map_%d.json'%s)) for s in range(9)]
          r=sum(x['mean_rd_bps'] for x in a)/9
          t=a[0]['target_2x_bps']
          print('::notice title=Full array Gaussian RD::mean %.6f bps, 2x target %.6f bps, ratio %.6f'%(r,t,r/t))
          for x in a: print('::notice title=RD slot %d::mean %.6f bps, ratio %.6f'%(x['slot'],x['mean_rd_bps'],x['rd_over_2x']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-full-array-gaussian-rd
          path: imperial_full_array_gaussian_rd_map_*.json
          retention-days: 7
