name: Imperial AR32 quiet regime switch

on:
  pull_request:
    paths:
      - 'research/imperial_ar32_quiet_regime_switch.py'
      - '.github/workflows/imperial_ar32_quiet_regime_switch.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run quiet-regime predictor switch
        run: python research/imperial_ar32_quiet_regime_switch.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_quiet_regime_switch.json'))
          for r in d['rows']:
              b=r['best'];level='notice' if b['gain_vs_baseline']>1 else 'warning'
              print(f"::{level} title=quiet-switch {r['region']}::{b['mode']} W={b['window']} thr={b['threshold_eps']}eps, bps={b['bps']:.5f}, directAR={r['baseline']['bps']:.5f}, SZ3={r['sz3']['bps']:.5f}, gainAR={b['gain_vs_baseline']:.6f}, quiet={b['quiet_fraction']:.4f}, zero={b['zero_fraction']:.4f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-quiet-regime-switch
          path: imperial_ar32_quiet_regime_switch.json
          retention-days: 7
