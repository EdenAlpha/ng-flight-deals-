name: Imperial near2 fullhard strict
on:
  pull_request:
    branches: [imperial-near2-native128]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run strict full 128x30000 hard-region benchmark
        run: python research/imperial_near2_fullhard_strict.py imperial.h5
      - name: Surface strict result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_near2_fullhard_strict.json'))
          print(f"::notice title=full hard strict::ours={d['ours']['bytes']} B, persistent AR32={d['persistent_ar32']['bytes']} B, native SZ3={d['native_sz3']['bytes']} B, gainAR={d['gain_vs_persistent_ar32']:.6f}x, gainSZ3={d['gain_vs_native_sz3']:.6f}x")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-near2-fullhard-strict
          path: imperial_near2_fullhard_strict.json
          if-no-files-found: ignore
          retention-days: 7
