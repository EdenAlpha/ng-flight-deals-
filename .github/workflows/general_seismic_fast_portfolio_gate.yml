name: General seismic optimized portfolio equivalence and throughput

on:
  pull_request:
    branches: [ general-seismic-benchmark-v1 ]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  optimized-portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies and compile bit-exact backend
        run: |
          pip install --quiet numpy zstandard pybind11 boto3 h5py pysz
          EXT=$(python3-config --extension-suffix)
          c++ -O3 -march=x86-64 -shared -std=c++17 -fPIC $(python -m pybind11 --includes) research/general_seismic_fast_zsm.cpp -o research/general_seismic_fast_zsm${EXT}
      - name: Prove cached router is byte-identical to frozen reference
        env: {PYTHONPATH: research}
        run: |
          python - <<'PY'
          import json
          import general_seismic_codec_portfolio as g
          import general_seismic_fast_zsm as f
          from general_seismic_fast_backend import equivalence as zsm_equiv,install
          from general_seismic_portfolio_optimized import equivalence as router_equiv
          z=zsm_equiv(g,f)
          cfg=g.load_config('benchmarks/general_seismic_codec_portfolio_v1.json')
          r=router_equiv(g,cfg)
          # Only after reference equivalence do we install the compiled backend.
          install(g)
          json.dump({'zsm_bit_exact_cases':z,'cached_router_exact_cases':r},open('fast_portfolio_gate.json','w'),indent=2)
          print('ZSM_EXACT',len(z),'ROUTER_EXACT',r)
          PY
      - name: Download real Imperial file
        run: |
          python - <<'PY'
          import boto3
          from botocore import UNSIGNED
          from botocore.config import Config
          boto3.client('s3',config=Config(signature_version=UNSIGNED)).download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          PY
      - name: Measure end-to-end optimized portfolio on frozen-size real panel
        env: {PYTHONPATH: research}
        run: |
          python - <<'PY'
          import h5py,json,time,numpy as np
          import general_seismic_codec_portfolio as g
          from general_seismic_fast_backend import install
          from general_seismic_portfolio_optimized import encode_portfolio
          install(g);cfg=g.load_config('benchmarks/general_seismic_codec_portfolio_v1.json')
          with h5py.File('imperial.h5','r') as h:X=np.asarray(h['Acoustic'][:8192,:128]).T
          eps=.1*float(X.astype(np.float64).std())
          t=time.perf_counter();blob,m=encode_portfolio(g,X,eps,cfg,True);sec=time.perf_counter()-t
          R=g.decode_portfolio(blob);me=float(np.max(np.abs(X.astype(np.float64)-np.asarray(R,np.float64))));assert me<=eps,(me,eps)
          row={'shape':list(X.shape),'samples':int(X.size),'seconds':sec,'samples_per_second':X.size/max(sec,1e-12),'selected_id':m['selected_id'],'selected_engine':m['selected_engine'],'bytes':len(blob),'bps':8*len(blob)/X.size,'maxerr':me,'eps':eps}
          print(row);q=json.load(open('fast_portfolio_gate.json'));q['real_imperial_128x8192']=row;json.dump(q,open('fast_portfolio_gate.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: general-seismic-fast-portfolio-gate
          path: fast_portfolio_gate.json
