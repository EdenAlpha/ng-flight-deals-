name: Universal MDL causal program search v9
on:
  pull_request:
    branches: [universal-auto-entropy-context-v7]
    paths:
      - 'research/universal_mdl_causal_program_search_v9.py'
      - '.github/workflows/universal_mdl_causal_program_search_v9.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: pip install --quiet numpy h5py boto3 pysz zstandard brotli numba
      - name: Download canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,hashlib,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Search causal programs by MDL
        env: {PYTHONPATH: research}
        run: python research/universal_mdl_causal_program_search_v9.py imperial.h5
      - name: Surface result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('universal_mdl_causal_program_search_v9.json'));print('best',d['best']);print('SZ3',d['sz3_bytes'],'base',d['base_bytes'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-mdl-causal-program-search-v9
          path: universal_mdl_causal_program_search_v9.json
          if-no-files-found: warn
          retention-days: 30
