name: General seismic SEG-Y shard equivalence

on:
  pull_request:
    branches: [ general-seismic-benchmark-v1 ]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  segy-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy boto3 segyio
      - name: Compare monolithic and four-shard panel hashes on real Soda Lake SEG-Y
        env: {PYTHONPATH: research}
        run: |
          python - <<'PY'
          import boto3,hashlib,json,numpy as np
          from botocore import UNSIGNED
          from botocore.config import Config
          from general_seismic_streaming_segy import s3_panels
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED,retries={'max_attempts':10}))
          o={'bucket':'gdr-data-lake','key':'soda_lake/raw_seismic/2010/v1.0.0/F7733R1.SGY','size':7897520}
          def collect(**kw):
              d={};samples=0
              for P,m in s3_panels(s3,[o],channels=128,time_samples=8192,**kw):
                  k=(int(m['channel_group_index']),int(m['time0']))
                  assert k not in d,k
                  d[k]=hashlib.sha256(np.ascontiguousarray(P).tobytes()).hexdigest();samples+=P.size
                  assert m['binary_stride_exact'] is True,m
              return d,int(samples)
          full,ns=collect();merged={};nsm=0;counts=[]
          for i in range(4):
              q,n=collect(group_shard_index=i,group_shard_count=4);counts.append(len(q));nsm+=n
              overlap=set(merged)&set(q);assert not overlap,overlap;merged.update(q)
          assert merged==full,(len(merged),len(full),set(full)^set(merged))
          assert nsm==ns,(nsm,ns)
          out={'full_panels':len(full),'full_samples':ns,'shard_panel_counts':counts,'merged_samples':nsm,'sample_exact':True}
          print(json.dumps(out,indent=2));json.dump(out,open('segy_shard_equivalence.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: segy-shard-equivalence, path: segy_shard_equivalence.json, retention-days: 14}
