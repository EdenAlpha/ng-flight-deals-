name: Temporary nearstack transfer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-nearstack:
    runs-on: ubuntu-latest
    steps:
      - name: Download public near-stack SEG-Y
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            -o 3d_nearstack.sgy \
            'https://github.com/aadm/geophysical_notes/raw/refs/heads/master/3d_nearstack.sgy'
          ls -lh 3d_nearstack.sgy
          sha256sum 3d_nearstack.sgy
      - name: Upload SEG-Y
        uses: actions/upload-artifact@v4
        with:
          name: nearstack-segy
          path: 3d_nearstack.sgy
          compression-level: 0
          retention-days: 1
