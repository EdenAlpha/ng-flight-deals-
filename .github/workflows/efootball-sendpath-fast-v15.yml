name: eFootball sendpath fast v15

on:
  push:
    branches: [ efootball-p2p-crypto-fast-2026-08-25 ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sendpath:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl python3 python3-pip >/dev/null
          python3 -m pip install --break-system-packages -q pyelftools==0.32 capstone==5.0.6
      - name: Fetch native binary
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ef/x /tmp/ef/native /tmp/out
          curl -L --fail --retry 5 --retry-delay 2 -A 'Mozilla/5.0' -o /tmp/ef/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          unzip -q /tmp/ef/efootball.xapk -d /tmp/ef/x
          unzip -q /tmp/ef/x/config.arm64_v8a.apk -d /tmp/ef/native
          sha256sum /tmp/ef/native/lib/arm64-v8a/libUE4.so | tee /tmp/out/libue4_sha256.txt
      - name: Fast raw ARM64 sendpath trace
        run: |
          cat > /tmp/ef/sendfast.py <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          import struct,bisect,collections,hashlib,re
          p=Path('/tmp/ef/native/lib/arm64-v8a/libUE4.so'); raw=p.read_bytes()
          with p.open('rb') as f:
            e=ELFFile(f)
            text=e.get_section_by_name('.text'); tb=text.data(); tva=int(text['sh_addr']); tend=tva+len(tb)
            dyn=e.get_section_by_name('.dynsym'); plt=e.get_section_by_name('.plt'); relaplt=e.get_section_by_name('.rela.plt')
            symtargets={}
            if dyn is not None and plt is not None and relaplt is not None:
              base=int(plt['sh_addr'])+32
              for i,rel in enumerate(relaplt.iter_relocations()):
                name=dyn.get_symbol(rel['r_info_sym']).name
                if name in {'send','sendto','sendmsg','recv','recvfrom','recvmsg','write','read','connect','socket'}:
                  symtargets[base+i*16]=name
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM);md.detail=False
          def sx(v,b):return v-(1<<b) if v&(1<<(b-1)) else v
          # function prologue candidates: stp x29,x30,[sp,#imm]!
          starts=[]
          for i in range(0,len(tb)-4,4):
            w=struct.unpack_from('<I',tb,i)[0]
            if (w & 0xffc07fff)==0xa9807bfd:starts.append(tva+i)
          starts=sorted(set(starts))
          def fs(a):
            j=bisect.bisect_right(starts,a)-1
            return starts[j] if j>=0 else tva
          # Direct BL graph and socket-import hits.
          rev=collections.defaultdict(set); socket_hits=collections.defaultdict(list); total_bl=0
          for i in range(0,len(tb)-4,4):
            w=struct.unpack_from('<I',tb,i)[0]
            if (w & 0xfc000000)!=0x94000000:continue
            total_bl+=1; pc=tva+i; t=pc+(sx(w&0x03ffffff,26)<<2); caller=fs(pc)
            if t in symtargets:socket_hits[symtargets[t]].append((pc,caller,t))
            if tva<=t<tend:rev[t].add(caller)
          out=[f'SHA256={hashlib.sha256(raw).hexdigest()}',f'TEXT=0x{tva:x}-0x{tend:x}',f'PROLOGUES={len(starts)} TOTAL_BL={total_bl}']
          out.append('\n=== SOCKET PLT TARGETS ===')
          for a,n in sorted(symtargets.items()):out.append(f'0x{a:x} {n}')
          sinks=set();out.append('\n=== DIRECT SOCKET CALLERS ===')
          for n,h in sorted(socket_hits.items()):
            out.append(f'[{n}] count={len(h)}')
            for site,caller,t in h:out.append(f' site=0x{site:x} approx_fn=0x{caller:x} plt=0x{t:x}');sinks.add(caller)
          # Reverse ancestry, keeping explicit parent edges.
          frontier=set(sinks);seen=set(frontier);parents_by_depth=[]
          out.append('\n=== REVERSE ANCESTRY ===')
          for d in range(9):
            out.append(f'-- depth {d} count={len(frontier)} --')
            for f0 in sorted(frontier):out.append(f' fn=0x{f0:x}')
            nxt=set()
            for target in frontier:
              for par in rev.get(target,()):
                nxt.add(par);out.append(f' EDGE caller=0x{par:x} -> target=0x{target:x}')
            nxt-=seen; seen|=nxt;parents_by_depth.append(frontier);frontier=nxt
            if not frontier:break
          out.append('\n=== EFOOTBALL/P2P REGION ANCESTRY 0x7b00000-0x7dfffff ===')
          ef=[x for x in seen if 0x7b00000<=x<=0x7dfffff]
          for f0 in sorted(ef):out.append(f'0x{f0:x}')
          # Look for ancestry intersecting known P2P/score/config functions and nearby regions.
          known=[0x7bf9ecc,0x7c0dca0,0x7bbc4bc,0x7b390e8,0x7c088e4,0x7c05844]
          out.append('\n=== KNOWN TARGET MEMBERSHIP / PARENTS ===')
          for k in known:
            out.append(f'known=0x{k:x} seen={k in seen} direct_parents={[hex(x) for x in sorted(rev.get(k,()))[:100]]}')
          # Dump all eFootball-range ancestors (bounded local function) and immediate sink fns.
          dump=set(ef)|sinks
          for f0 in sorted(dump):
            # end at next prologue, capped 0x1000
            j=bisect.bisect_right(starts,f0); f1=starts[j] if j<len(starts) else tend; f1=min(f1,f0+0x1000)
            out.append(f'\n===== FN 0x{f0:x}-0x{f1:x} =====')
            for z in md.disasm(tb[f0-tva:f1-tva],f0):
              if z.mnemonic in ('bl','blr','br','ret','mov','add','sub','adrp','ldr','ldrb','ldrh','ldp','str','strb','strh','stp','cmp','cbz','cbnz','tbz','tbnz','eor','and','orr'):
                out.append(f'0x{z.address:x}: {z.mnemonic:9} {z.op_str}')
          Path('/tmp/out/sendpath_fast_v15.txt').write_text('\n'.join(out))
          print('\n'.join([x for x in out if x.startswith('SHA256=') or x.startswith('[') or x.startswith(' site=') or x.startswith('-- depth') or x.startswith('known=') or (re.fullmatch(r'0x7[b-d][0-9a-f]+',x) is not None)][:1500]))
          PY
          python3 /tmp/ef/sendfast.py
      - uses: actions/upload-artifact@v4
        with:
          name: efootball-sendpath-fast-v15
          path: /tmp/out/
          retention-days: 7
