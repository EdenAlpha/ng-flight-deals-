name: Migrated tiny causal quick-adapter LOSO v1
on:
  push:
    branches: [migrated-quick-adapter-loso-v1]
    paths:
      - 'research/migrated_volume_quick_adapter_loso_v1.py'
      - '.github/workflows/migrated_quick_adapter_loso_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  BENCHMARK_DEFINITION_SHA: 9b304e262182caa29a2c93e7e74e09ccb5715e92
jobs:
  quick-adapter-loso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --quiet numpy boto3 pysz zstandard brotli
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize frozen benchmark manifest
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_manifest.json
      - name: Run four-survey quick-adapter LOSO
        env:
          PYTHONPATH: research
        run: |
          python research/migrated_volume_quick_adapter_loso_v1.py \
            --manifest frozen_manifest.json \
            --eps benchmarks/migrated_volume_global_eps_v1.json \
            --out quick_adapter_loso_latest.json
      - name: Commit compact diagnostic result
        run: |
          mkdir -p benchmarks
          cp quick_adapter_loso_latest.json benchmarks/migrated_quick_adapter_loso_v1.json
          git config user.name 'seismic-benchmark-bot'
          git config user.email 'seismic-benchmark-bot@users.noreply.github.com'
          git add benchmarks/migrated_quick_adapter_loso_v1.json
          git commit -m 'Record tiny causal quick-adapter LOSO diagnostic' || exit 0
          git pull --rebase origin migrated-quick-adapter-loso-v1
          git push origin HEAD:migrated-quick-adapter-loso-v1
