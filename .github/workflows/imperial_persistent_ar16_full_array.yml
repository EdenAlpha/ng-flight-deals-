name: Imperial persistent AR16 full array
on:
  pull_request:
    branches: [imperial-valley-frozen-brady-transfer]
permissions: {contents: read}
jobs:
  part:
    strategy:
      fail-fast: false
      matrix: {slot: [0,1,2]}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download exact Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Encode 18 channel blocks with one persistent AR16 each
        run: python research/imperial_persistent_ar16_full_array.py imperial.h5 ${{ matrix.slot }}
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-persistent-ar16-full-${{ matrix.slot }}
          path: imperial_persistent_ar16_full_${{ matrix.slot }}.json
          retention-days: 7
  aggregate:
    needs: part
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: imperial-persistent-ar16-full-*
          path: all
          merge-multiple: true
      - name: Aggregate complete 414.72 MB numeric array
        run: |
          python - <<'PY'
          import glob,json,statistics
          rr=[json.load(open(p)) for p in sorted(glob.glob('all/imperial_persistent_ar16_full_*.json'))]
          if len(rr)!=3:raise RuntimeError(('parts',len(rr)))
          raw=sum(x['raw_bytes'] for x in rr);o=sum(x['ours_bytes'] for x in rr);s=sum(x['sz3_bytes'] for x in rr);rows=sum((x['rows'] for x in rr),[])
          if raw!=414720000:raise RuntimeError(('raw',raw))
          if len(rows)!=54:raise RuntimeError(('blocks',len(rows)))
          out={'parts':3,'channel_blocks':54,'raw_numeric_bytes':raw,'ours_bytes':o,'matched_tiled_sz3_bytes':s,'ours_ratio':raw/o,'sz3_ratio':raw/s,'gain_vs_matched_sz3':s/o,'ours_bps':16*o/raw,'sz3_bps':16*s/raw,'model_bytes_total':sum(r['model_bytes'] for r in rows),'min_block_gain':min(r['gain_vs_sz3'] for r in rows),'median_block_gain':statistics.median(r['gain_vs_sz3'] for r in rows),'max_block_gain':max(r['gain_vs_sz3'] for r in rows),'all_hard_error_verified':all(r['maxerr']<=rr[0]['eps']*(1+1e-12) for r in rows),'order':16,'step':256,'scope':'Entire 207,360,000-sample Imperial Acoustic array. One AR16 model per 128-channel block is learned only from that block first 1024 samples and reused across the full 30,000 times with continuous decoded state. Innovation frames are self-decoding Zstd-menu chunks; all model/framing bytes counted; matched SZ3 identical 128x1024 partition.'}
          print(json.dumps(out,indent=2));json.dump(out,open('imperial_persistent_ar16_full_summary.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-persistent-ar16-full-summary
          path: imperial_persistent_ar16_full_summary.json
          retention-days: 7
