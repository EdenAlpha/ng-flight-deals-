name: Imperial near2 hard panel
on:
  pull_request:
    branches: [imperial-address-lattice-near2]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run twelve-tile hard-region panel
        run: python research/imperial_near2_hard_panel.py imperial.h5
      - name: Surface aggregate
        if: success()
        run: |
          python - <<'PY'
          import json
          a=json.load(open('imperial_near2_hard_panel.json'))['aggregate']
          print(f"::notice title=near2 hard panel::ours={a['ours']} B, AR32={a['ar32']} B, SZ3={a['sz3']} B, gainAR={a['gain_ar32']:.6f}x, winsAR={a['wins_ar32']}/{a['tiles']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-near2-hard-panel
          path: imperial_near2_hard_panel.json
          if-no-files-found: ignore
          retention-days: 7
