name: Utah FORGE wavelet-surface annihilator
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          pip install --quiet numpy numba pysz segyio
      - run: |
          curl -L --fail --retry 5 --retry-delay 2 -o forge.zip 'https://gdr.openei.org/files/1141/2018-19%20Reflection%20Processing.zip'
          python - <<'PY'
          import zipfile
          n='2018-19 Reflection Processing/3D Survey/Forge3d_ANI_PSDM_Stack_UnEnh.segy'
          z=zipfile.ZipFile('forge.zip');z.extract(n,'.')
          PY
          python research/forge_waveann.py
      - uses: actions/upload-artifact@v4
        with: {name: forge-waveann, path: forge_waveann.json, retention-days: 2}
