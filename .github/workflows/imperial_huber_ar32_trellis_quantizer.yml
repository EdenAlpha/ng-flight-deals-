name: Imperial Huber AR32 trellis quantizer gate
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run trellis/noise-shaping gate
        run: python research/run_imperial_huber_ar32_trellis_debug.py imperial.h5
      - name: Surface compact trellis result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_huber_ar32_trellis_quantizer.json'))
          for r in d['rows']:
              b=r['best']
              msg=(f"best_step={b['step']}, trellis={b['trellis_bytes']} bytes ({b['trellis_bps']:.4f} bps), "
                   f"gain_vs_same_step_greedy={b['gain_trellis_vs_same_step_greedy']:.6f}, "
                   f"gain_vs_step267={b['gain_vs_trellis_step267']:.6f}, gain_vs_sz3={b['gain_trellis_vs_sz3']:.6f}")
              print(f"::notice title=trellis {r['region']}::{msg}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-huber-ar32-trellis-quantizer
          path: |
            imperial_huber_ar32_trellis_quantizer.json
            imperial_huber_ar32_trellis_error.txt
          if-no-files-found: ignore
          retention-days: 7
