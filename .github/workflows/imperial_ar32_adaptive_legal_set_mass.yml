name: Imperial AR32 adaptive legal-set mass
on:
  pull_request:
    branches: [imperial-ar32-exact-legal-path-mass]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Enumerate adaptive self-shaping legal path mass
        run: python research/imperial_ar32_adaptive_legal_set_mass.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-adaptive-legal-set-mass
          path: imperial_ar32_adaptive_legal_set_mass.json
          retention-days: 7
