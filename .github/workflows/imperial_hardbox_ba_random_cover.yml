name: Imperial hard-box BA random cover
on:
  pull_request:
    branches: [imperial-ar32-innovation-gaussian-rd]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley HDF5 record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Solve hard-box reproduction law and random cover
        run: python research/imperial_hardbox_ba_random_cover.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-hardbox-ba-random-cover
          path: imperial_hardbox_ba_random_cover.json
          retention-days: 7
