name: Imperial exact2 causal phase search
on:
  pull_request:
    branches: [imperial-exact2-fair-rich-ar32]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Search exact-2epsilon lattice phases under causal compact objective
        run: python research/imperial_exact2_phase_causal.py imperial.h5
      - name: Surface exact phase winner
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_exact2_phase_causal.json'));b=d['best'];a=d['rich_causal_ar32'];level='notice' if b['bytes']<a['bytes'] else 'warning'
          print(f"::{level} title=exact2 phase search::phase={b['phase_index']}/{d['phase_count']}, NOVA={b['bytes']} B, richAR32={a['bytes']} B, delta={b['bytes']-a['bytes']} B, SZ3={d['sz3']['bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-exact2-phase-causal
          path: imperial_exact2_phase_causal.json
          if-no-files-found: ignore
          retention-days: 7
