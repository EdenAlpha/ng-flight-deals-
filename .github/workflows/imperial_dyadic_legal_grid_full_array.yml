name: Imperial dyadic legal grid full array
on:
  pull_request:
    branches: [imperial-valley-frozen-brady-transfer]
permissions: {contents: read}
jobs:
  part:
    strategy:
      fail-fast: false
      matrix: {slot: [0,1,2]}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download exact Imperial Valley HDF5 record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Encode one third with fixed 256-grid codec
        run: python research/imperial_dyadic_legal_grid_full_array.py imperial.h5 ${{ matrix.slot }}
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-dyadic-legal-grid-full-${{ matrix.slot }}
          path: imperial_dyadic_legal_grid_full_${{ matrix.slot }}.json
          retention-days: 7
  aggregate:
    needs: part
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: imperial-dyadic-legal-grid-full-*
          path: all
          merge-multiple: true
      - name: Aggregate all 207,360,000 samples
        run: |
          python - <<'PY'
          import glob,json,statistics,collections
          rr=[json.load(open(p)) for p in sorted(glob.glob('all/imperial_dyadic_legal_grid_full_*.json'))]
          if len(rr)!=3:raise RuntimeError(('parts',len(rr)))
          raw=sum(r['raw_bytes'] for r in rr);o=sum(r['ours_bytes'] for r in rr);s=sum(r['sz3_bytes'] for r in rr);rows=sum((r['rows'] for r in rr),[])
          if raw!=414720000:raise RuntimeError(('raw',raw))
          reps=collections.Counter(x['rep'] for x in rows)
          out={'parts':3,'tiles':sum(r['tiles'] for r in rr),'raw_numeric_bytes':raw,'ours_bytes':o,'matched_tile_sz3_bytes':s,'ours_ratio':raw/o,'sz3_ratio':raw/s,'gain_vs_matched_sz3':s/o,'ours_bps':16*o/raw,'sz3_bps':16*s/raw,'dyadic_step':256,'worst_quantization_error':128,'public_eps':rr[0]['eps'],'min_tile_gain':min(x['gain'] for x in rows),'median_tile_gain':statistics.median(x['gain'] for x in rows),'max_tile_gain':max(x['gain'] for x in rows),'representation_counts':dict(reps),'all_hard_error_verified':all(x['maxerr']<=rr[0]['eps']*(1+1e-12) for x in rows),'scope':'Entire 207,360,000-sample Imperial Acoustic array. Fixed binary-native 256 reconstruction grid, worst possible int16 rounding error 128 < public 10%-std epsilon. Fixed self-decoding representation menu with per-tile mode overhead. Matched SZ3 gets identical 128x1024 tiling and best orientation.'}
          print(json.dumps(out,indent=2));json.dump(out,open('imperial_dyadic_legal_grid_full_summary.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-dyadic-legal-grid-full-summary
          path: imperial_dyadic_legal_grid_full_summary.json
          retention-days: 7
