name: Master Portfolio V2 Soda 10-shot global-epsilon gate

on:
  pull_request:
    branches: [ general-seismic-codec-portfolio-v1 ]
    paths:
      - 'research/master_portfolio_v2.py'
      - 'research/soda_hard4_frozen_record.py'
      - '.github/workflows/master_portfolio_v2_soda10_global.yml'
  workflow_dispatch:

concurrency:
  group: master-portfolio-v2-soda10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {contents: read}

jobs:
  shot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {p: 5,  key: 'soda_lake/raw_seismic/2010/v1.0.0/F1376R1.SGY'}
          - {p: 15, key: 'soda_lake/raw_seismic/2010/v1.0.0/F2124R1.SGY'}
          - {p: 25, key: 'soda_lake/raw_seismic/2010/v1.0.0/F2874R1.SGY'}
          - {p: 35, key: 'soda_lake/raw_seismic/2010/v1.0.0/F3622R1.SGY'}
          - {p: 45, key: 'soda_lake/raw_seismic/2010/v1.0.0/F4371R1.SGY'}
          - {p: 55, key: 'soda_lake/raw_seismic/2010/v1.0.0/F511R1.SGY'}
          - {p: 65, key: 'soda_lake/raw_seismic/2010/v1.0.0/F586R1.SGY'}
          - {p: 75, key: 'soda_lake/raw_seismic/2010/v1.0.0/F6618R1.SGY'}
          - {p: 85, key: 'soda_lake/raw_seismic/2010/v1.0.0/F7367R1.SGY'}
          - {p: 95, key: 'soda_lake/raw_seismic/2010/v1.0.0/F8115R1.SGY'}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard pysz brotli boto3
      - name: Download exact precommitted shot
        env:
          KEY: '${{ matrix.key }}'
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED,retries={'max_attempts':8}))
          s3.download_file('gdr-data-lake',os.environ['KEY'],'shot.sgy')
          print('DOWNLOADED',os.environ['KEY'])
          PY
      - name: Run exact recovered PR169 engine at frozen survey-global epsilon
        env: {PYTHONPATH: research}
        run: |
          python research/master_portfolio_v2.py soda-files \
            --epsilon 0.0816739073446828 \
            --files shot.sgy \
            --out result.json
          python - <<'PY'
          import json
          r=json.load(open('result.json')); q=r['rows'][0]
          assert r['all_valid'] and q['ours_maxerr'] <= q['epsilon']*(1+3e-6)
          print('GLOBAL_EPS_RESULT percentile=${{ matrix.p }} gain=',q['gain_sz3_over_ours'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soda-v2-global-p${{ matrix.p }}
          path: result.json
          retention-days: 30

  aggregate:
    needs: shot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: soda-v2-global-p*
          path: all
      - name: Aggregate all ten exact bytes
        run: |
          python - <<'PY'
          import glob,json,statistics
          rr=[]
          for p in glob.glob('all/**/result.json',recursive=True): rr += json.load(open(p))['rows']
          if len(rr)!=10: raise RuntimeError(('expected 10',len(rr)))
          gains=[r['gain_sz3_over_ours'] for r in rr]
          out={
            'shots':10,
            'epsilon':0.0816739073446828,
            'minimum_gain':min(gains),
            'median_gain':statistics.median(gains),
            'maximum_gain':max(gains),
            'byte_weighted_gain':sum(r['sz3_bytes'] for r in rr)/sum(r['ours_bytes'] for r in rr),
            'wins_over_2x':sum(g>2.0 for g in gains),
            'all_hard_error_valid':all(r['ours_maxerr']<=r['epsilon']*(1+3e-6) and r['sz3_maxerr']<=r['epsilon']*(1+3e-6) for r in rr),
            'rows':sorted(rr,key=lambda r:r['file'])
          }
          print(json.dumps(out,indent=2));json.dump(out,open('soda_v2_global_10shot_summary.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soda-v2-global-10shot-summary
          path: soda_v2_global_10shot_summary.json
          retention-days: 30
