name: Migrated volume 3D codec sanity
on:
  push:
    branches: [migrated-volume-geometry-engine-v1]
    paths:
      - 'research/migrated_volume_3d_codec.py'
      - '.github/workflows/migrated_volume_3d_sanity.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  sanity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy zstandard
      - name: Serialize decode and hard-bound all 3D candidates
        run: python research/migrated_volume_3d_codec.py sanity
