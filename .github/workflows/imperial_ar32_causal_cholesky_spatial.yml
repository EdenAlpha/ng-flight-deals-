name: Imperial AR32 causal Cholesky spatial
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download Imperial
        run: python -c "import boto3;from botocore import UNSIGNED;from botocore.config import Config;boto3.client('s3',config=Config(signature_version=UNSIGNED)).download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')"
      - name: Run causal spatial whitening
        run: python research/imperial_ar32_causal_cholesky_spatial.py imperial.h5
      - name: Surface result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_causal_cholesky_spatial.json'))
          for r in d['rows']:
            b=r['best'];print(f"::notice title=Cholesky {r['region']}::L={b['width']}, bps={b['bps']:.5f}, step267={r['step267_arithmetic_bps']:.5f}, gain={b['gain_vs_step267_arithmetic']:.6f}, gainSZ3={b['gain_vs_sz3']:.6f}, model={b['model_bytes']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-causal-cholesky-spatial
          path: imperial_ar32_causal_cholesky_spatial.json
          retention-days: 7
