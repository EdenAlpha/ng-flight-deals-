name: Soda Lake frozen record codec 10-shot survey validation
on:
  pull_request:
    branches: [soda-hard4-frozen-record]
permissions: {contents: read}
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        p: [5,15,25,35,45,55,65,75,85,95]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard pysz boto3 brotli
      - name: Download precommitted percentile shot
        shell: bash
        env: {P: '${{ matrix.p }}'}
        run: |
          python - <<'PY'
          import boto3,os,json
          from botocore import UNSIGNED
          from botocore.config import Config
          p=int(os.environ['P']);s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*p/100);k,n=keys[i]
          if len(keys)!=8321:raise RuntimeError(('collection drift',len(keys)))
          print('SHOT percentile',p,'index',i,k,n,flush=True);s3.download_file(bucket,k,'shot.sgy');json.dump({'percentile':p,'total':len(keys),'index':i,'key':k,'size':n},open('selection.json','w'),indent=2)
          PY
      - name: Run strict frozen PR165 codec and direct SZ3 audit
        run: python research/soda_hard4_frozen_record.py shot.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-record-frozen-p${{ matrix.p }}
          path: |
            selection.json
            soda_hard4_frozen_record.json
          retention-days: 7
