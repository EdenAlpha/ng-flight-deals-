name: Temporary eFootball deep analysis

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  analyze:
    if: github.head_ref == 'efootball-apk-analysis-2026-08-23'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip binutils file ripgrep python3 python3-pip openjdk-17-jre-headless
          curl -L --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip
          mkdir -p /opt/jadx && unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx /opt/jadx/bin/jadx-gui || true
          echo /opt/jadx/bin >> "$GITHUB_PATH"
          python3 -m pip install --break-system-packages androguard==4.1.3
      - name: Download and extract current package
        run: |
          set -euxo pipefail
          mkdir -p work/download work/bundle work/base work/native report hits
          curl -L --fail --retry 5 --retry-delay 3 -A 'Mozilla/5.0' -o work/download/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          unzip -q work/download/efootball.xapk -d work/bundle
          find work/bundle -type f -name 'jp.konami.pesam.apk' -exec cp '{}' work/base/base.apk \;
          find work/bundle -type f -name 'config.arm64_v8a.apk' -exec cp '{}' work/native/native.apk \;
          unzip -q work/native/native.apk -d work/native/unpacked
          test -f work/base/base.apk
          test -f work/native/unpacked/lib/arm64-v8a/libUE4.so
          ls -lh work/base/base.apk work/native/unpacked/lib/arm64-v8a/libUE4.so
      - name: Decompile base APK correctly
        run: |
          set -euxo pipefail
          mkdir -p work/jadx
          jadx --no-debug-info --show-bad-code --deobf -j 4 -d work/jadx work/base/base.apk 2>&1 | tee hits/jadx.log || true
          echo "JADX_FILES=$(find work/jadx -type f | wc -l)" | tee -a hits/jadx.log
          find work/jadx -type f | grep -Ei 'jp/konami/peerlink|BluetoothSwitch' > hits/peerlink_files.txt || true
          {
            echo '### peerlink file list'
            cat hits/peerlink_files.txt
            echo '### peerlink source content'
            while IFS= read -r f; do echo; echo "===== $f ====="; sed -n '1,1200p' "$f"; done < hits/peerlink_files.txt
          } > hits/peerlink_managed_sources.txt
          rg -n -i 'peerlink|BluetoothSwitch|wifi.?direct|bluetooth|stun|turn|p2p|score|match.?result|game.?phase|half.?time|full.?time' work/jadx/sources/jp/konami work/jadx/sources/com/epicgames 2>/dev/null > hits/managed_target_hits.txt || true
      - name: Decode peerlink activity manifest metadata
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from androguard.core.apk import APK
          from pathlib import Path
          a=APK('work/base/base.apk')
          out=[]
          out.append(f'package={a.get_package()} version={a.get_androidversion_name()} code={a.get_androidversion_code()}')
          for act in a.get_activities():
              if 'peerlink' in act.lower() or 'bluetooth' in act.lower():
                  out.append('ACTIVITY '+act)
                  try:
                      out.append('  exported='+str(a.get_attribute_value('activity','exported',name=act)))
                      out.append('  permission='+str(a.get_attribute_value('activity','permission',name=act)))
                  except Exception as e: out.append('  attr_error='+str(e))
                  try:
                      fs=a.get_intent_filters('activity', act)
                      out.append('  intent_filters='+repr(fs))
                  except Exception as e: out.append('  filter_error='+str(e))
          Path('hits/peerlink_manifest.txt').write_text('\n'.join(out))
          PY
      - name: Curated libUE4 networking and match-state map
        run: |
          set -euxo pipefail
          SO=work/native/unpacked/lib/arm64-v8a/libUE4.so
          strings -a -n 5 "$SO" > work/libUE4.strings
          strings -a -t x -n 5 "$SO" > work/libUE4.offset_strings
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('work/libUE4.strings').read_text(errors='ignore').splitlines()
          groups={
            'transport':['STUN','TURN','P2PTURNIO','UDP_HOLE_PUNCHING','PEER_STUN','TARGET_STUN_SERVER','TARGET_TURN_SERVER','RP_RELAYED_ADDRESS','XOR_RELAYED_ADDRESS','CHANNEL_BIND','ALLOCATE_REQUEST','REFRESH_REQUEST','NATTYPE','PEER_HOST','NODE_ID_PEER','TransportDump','PeerCtl'],
            'adhoc':['P2P_ADHOC','WIFIDIRECTLAN','Bluetooth','BLE','BTC'],
            'match_end':['EMatchFlowTask::WaitTimeup','EMatchFlowTask::DemoTimeupTrans','EMatchFlowTask::SendServerMatchEnd','ROOM_GAME_PHASE_END','EPKR_GamePhase::GameplayFinished','EPKR_GamePhase::ResultPresentation','match_to_match_result','MatchResultTimeUpDemo','MatchScoreChanged','m_homeScore','m_awayScore','GetGameScore','SetHomeScore','SetAwayScore','CMD_ADD_SCORE','CMD_CHANGE_GAMEPHASE','CMD_GET_GAME_RESULT','CMD_SET_GAME_RESULT','GAME_RESULT','ADDED_TIME','KIND_HALFTIME'],
            'source_paths':['P2pFullMeshWithTurn.cpp','P2pFullMeshTurnOnly.cpp','CommandObjectCmdChangeGamephase.cpp']
          }
          out=[]
          for g,terms in groups.items():
            out.append('\n######## '+g+' ########')
            seen=set()
            for i,s in enumerate(lines):
              if any(t.lower() in s.lower() for t in terms):
                lo=max(0,i-8); hi=min(len(lines),i+9)
                key=(lo,hi)
                if key in seen: continue
                seen.add(key)
                out.append(f'--- line {i+1}: {s} ---')
                out.extend(f'{j+1}: {lines[j]}' for j in range(lo,hi))
          Path('hits/libue4_curated_context.txt').write_text('\n'.join(out), errors='ignore')
          PY
          grep -n -E 'G:[\\/]PES22HC.*OnlineSystem|G:[\\/]PES22HC.*Match|OnlineSystem.*\.cpp|Match.*\.cpp' work/libUE4.strings > hits/source_path_clues.txt || true
          grep -n -E '^P2P_ADHOC|^P2PTURNIO|^EMatchFlowTask|^ERoomGamePhase|^EPKR_GamePhase|^CMD_(ADD_SCORE|CHANGE_GAMEPHASE|GET_GAME_RESULT|SET_GAME_RESULT)|^MatchScoreChanged$|^m_(home|away)Score$|^ADDED_TIME$' work/libUE4.strings > hits/exact_internal_symbols.txt || true
      - name: Locate protocol constants and high-value string file offsets
        run: |
          set -euxo pipefail
          SO=work/native/unpacked/lib/arm64-v8a/libUE4.so
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/native/unpacked/lib/arm64-v8a/libUE4.so'); d=p.read_bytes()
          pats={
            'STUN_MAGIC_BE':bytes.fromhex('2112a442'), 'STUN_MAGIC_LE':bytes.fromhex('42a41221'),
            'DTLS12_RECORD':bytes.fromhex('17fefd'),
            'STUN_BINDING_REQ':bytes.fromhex('0001'), 'STUN_ALLOCATE_REQ':bytes.fromhex('0003'), 'STUN_REFRESH_REQ':bytes.fromhex('0004'), 'STUN_CHANNELBIND_REQ':bytes.fromhex('0009')
          }
          o=[]
          for name,b in pats.items():
            pos=[]; start=0
            while True:
              x=d.find(b,start)
              if x<0:break
              pos.append(x); start=x+1
              if len(pos)>=1000:break
            o.append(f'{name}: count_at_least={len(pos)} first_offsets={[hex(x) for x in pos[:100]]}')
          Path('hits/protocol_constant_offsets.txt').write_text('\n'.join(o))
          PY
          for q in 'Requested stun method. (ALLOCATE_REQUEST)' 'Responded stun method. (ALLOCATE_SUCCESS_RESPONSE)' 'P2P_ADHOC_WIFIDIRECTLAN' 'OnlineSystemMultiplaySessionStrategyP2pFullMeshWithTurn.cpp' 'EMatchFlowTask::SendServerMatchEnd' 'MatchScoreChanged' 'CMD_ADD_SCORE' 'CMD_CHANGE_GAMEPHASE'; do
            echo "===== $q =====" >> hits/high_value_string_offsets.txt
            grep -F "$q" work/libUE4.offset_strings | head -30 >> hits/high_value_string_offsets.txt || true
          done
      - name: Inspect large game asset packs for match/result vocabulary
        run: |
          set -euxo pipefail
          mkdir -p hits/assets
          find work/bundle -type f \( -name '*.cpk' -o -name '*.pak' -o -name '*.ucas' -o -name '*.utoc' \) -print0 | while IFS= read -r -d '' f; do
            k=$(basename "$f")
            echo "FILE=$f size=$(stat -c%s "$f")" > "hits/assets/$k.hits.txt"
            strings -a -n 5 "$f" | grep -Ein 'match.?result|full.?time|half.?time|added.?time|score|winner|victory|defeat|draw|abbrev|team.?code|game.?phase' | head -5000 >> "hits/assets/$k.hits.txt" || true
          done
      - name: Assemble deep report
        run: |
          {
            echo '# eFootball deep pass 2'; date -u
            echo '## JADX'; cat hits/jadx.log
            echo '## Managed peerlink manifest'; cat hits/peerlink_manifest.txt
            echo '## Managed peerlink classes'; sed -n '1,2500p' hits/peerlink_managed_sources.txt
            echo '## Managed target hits'; sed -n '1,2500p' hits/managed_target_hits.txt
            echo '## Exact native internal names'; cat hits/exact_internal_symbols.txt
            echo '## Native curated context'; sed -n '1,6000p' hits/libue4_curated_context.txt
            echo '## Source path clues'; sed -n '1,2000p' hits/source_path_clues.txt
            echo '## Protocol constant offsets'; cat hits/protocol_constant_offsets.txt
            echo '## High-value string offsets'; cat hits/high_value_string_offsets.txt
            echo '## Asset pack hits'; for f in hits/assets/*.hits.txt; do echo "===== $f ====="; sed -n '1,800p' "$f"; done
          } > report/deep_report.md
          cat report/deep_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: efootball-deep-pass2
          path: |
            report/
            hits/
          retention-days: 7
