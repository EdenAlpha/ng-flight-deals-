name: Imperial near-2epsilon full hard-region audit
on:
  pull_request:
    branches: [imperial-near2eps-scale-128x4096]
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Fetch canonical Imperial record
        run: |
          python - <<'PY'
          import boto3, os, hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake'; k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED)); s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run full hard-region benchmark
        run: python research/imperial_near2eps_full_hard_128x30000.py imperial.h5
      - name: Surface result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_near2eps_full_hard_128x30000.json')); b=d['near2']
          print(f"::notice title=full-hard near2eps::ours={b['bytes']} B AR32={d['ar32']['bytes']} B SZ3={d['sz3']['bytes']} B gainAR={b['gain_vs_ar32']:.6f}x gainSZ3={b['gain_vs_sz3']:.6f}x")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-near2eps-full-hard-128x30000
          path: imperial_near2eps_full_hard_128x30000.json
          if-no-files-found: ignore
          retention-days: 7
