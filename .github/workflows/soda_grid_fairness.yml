name: Soda Lake geometry-aware HPEZ SZ3 fairness
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  fairness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build official HPEZ
        run: |
          git clone --depth 1 https://github.com/JLiu-1/HPEZ-QoZ2.0.git hpez-src
          cmake -S hpez-src -B hpez-src/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/hpez-install -DCMAKE_CXX_FLAGS="-include cstdint -include array"
          cmake --build hpez-src/build -j2
          cmake --install hpez-src/build
      - run: pip install --quiet numpy segyio zstandard pysz boto3
      - name: Download deterministic median raw shot
        shell: bash
        run: |
          python - <<'PY'
          import boto3,os,json
          from botocore import UNSIGNED
          from botocore.config import Config
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*.5);k,n=keys[i];os.makedirs('shots',exist_ok=True);s3.download_file(bucket,k,'shots/middle.sgy');json.dump({'total':len(keys),'index':i,'key':k,'size':n},open('fair_selection.json','w'),indent=2)
          PY
      - run: python research/soda_grid_fairness.py prepare shots/middle.sgy
      - name: Run official HPEZ q4 across all fair layouts
        shell: bash
        run: |
          export BIN=$PWD/hpez-install/bin/hpez
          export EPS=$(python -c "import json;print(json.load(open('fair/prep.json'))['eps'])")
          bash fair/run_hpez.sh
      - run: python research/soda_grid_fairness.py analyze shots/middle.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-grid-fairness-results
          path: |
            soda_grid_fairness.json
            fair/prep.json
            fair_selection.json
          retention-days: 7
