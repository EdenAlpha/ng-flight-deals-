name: Imperial near-2epsilon hybrid predictor ZSM
on:
  pull_request:
    branches: [imperial-near2eps-learned-zsm-fullhard]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Fetch canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Route decoder-shared learned and AR predictors then exact ZSM encode
        run: python research/imperial_near2eps_hybrid_predictor_zsm_fix.py imperial.h5
      - name: Surface result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_near2eps_hybrid_predictor_zsm.json'));b=d['best']
          print(f"::notice title=hybrid-ZSM full-hard::kind={b['kind']} bytes={b['bytes']} historical={d['historical_huber_ar32_zsm_bytes']} gain={d['gain_vs_historical']:.6f}x")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-near2eps-hybrid-predictor-zsm
          path: imperial_near2eps_hybrid_predictor_zsm.json
          if-no-files-found: ignore
          retention-days: 7
