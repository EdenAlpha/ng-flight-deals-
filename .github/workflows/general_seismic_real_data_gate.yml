name: General seismic real-data codec gate

on:
  pull_request:
    branches:
      - general-seismic-benchmark-v1
  workflow_dispatch:

permissions: {contents: read}

jobs:
  real-data-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install seismic codec dependencies
        run: pip install --quiet numpy zstandard boto3 h5py segyio pysz
      - name: Download deterministic real mechanics-gate files
        run: |
          python - <<'PY'
          import boto3,json,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED,retries={'max_attempts':10}))
          os.makedirs('gate_data',exist_ok=True)
          bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/'
          objs=[]
          for page in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
              for o in page.get('Contents',[]):
                  k=o['Key'];n=int(o['Size'])
                  if k.lower().endswith(('.sgy','.segy','.seg')) and n>1_000_000:
                      objs.append((k,n))
          if not objs: raise SystemExit('no Soda SEG-Y objects')
          # Gate-only choice: smallest real file minimizes CI I/O; it is not used in headline statistics.
          k,n=min(objs,key=lambda q:(q[1],q[0]))
          print('SODA_GATE',k,n,flush=True);s3.download_file(bucket,k,'gate_data/soda_gate.sgy')
          ik='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          r=s3.head_object(Bucket=bucket,Key=ik);print('IMPERIAL_GATE',ik,int(r['ContentLength']),flush=True)
          s3.download_file(bucket,ik,'gate_data/imperial_gate.h5')
          json.dump({'soda':{'key':k,'bytes':n},'imperial':{'key':ik,'bytes':int(r['ContentLength'])}},open('general_seismic_real_gate_inputs.json','w'),indent=2)
          PY
      - name: Run real SEG-Y and HDF5 portfolio vs matched SZ3 gate
        env:
          PYTHONPATH: research
        run: |
          python research/general_seismic_numeric_io.py \
            --gate \
            --segy gate_data/soda_gate.sgy \
            --h5 gate_data/imperial_gate.h5 \
            --h5-dataset Acoustic \
            --config benchmarks/general_seismic_codec_portfolio_v1.json \
            --out general_seismic_real_data_gate.json
      - name: Enforce exact hard-error and both real readers
        run: |
          python - <<'PY'
          import json
          x=json.load(open('general_seismic_real_data_gate.json'))
          assert len(x['rows'])==2,x
          assert {r['meta']['format'] for r in x['rows']}=={'SEG-Y','HDF5'},x
          for r in x['rows']:
              assert r['portfolio_maxerr'] <= r['eps'],r
              assert r['sz3_maxerr'] <= r['eps']*(1+3e-6),r
              assert r['portfolio_bytes']>0 and r['sz3_bytes']>0,r
              print(r['meta']['format'],r['selected_engine'],'ours_bps',r['portfolio_bps'],'sz3_bps',r['sz3_bps'],'gain',r['gain_sz3_over_portfolio'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: general-seismic-real-data-codec-gate
          path: |
            general_seismic_real_gate_inputs.json
            general_seismic_real_data_gate.json
          retention-days: 14
