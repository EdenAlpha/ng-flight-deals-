name: Imperial Huber AR32 coldstart arithmetic regions
on:
  pull_request:
    branches: [imperial-persistent-ar32-step267-full-array]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py pysz boto3 zstandard
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run Huber plus cold-start arithmetic candidate
        run: python research/imperial_huber_ar32_coldstart_arithmetic_regions.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-huber-ar32-coldstart-arithmetic-regions
          path: imperial_huber_ar32_coldstart_arithmetic_regions.json
          retention-days: 7
