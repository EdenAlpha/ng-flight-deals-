name: Imperial AR32 scale and group arithmetic contexts
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: python -c "import boto3;from botocore import UNSIGNED;from botocore.config import Config;boto3.client('s3',config=Config(signature_version=UNSIGNED)).download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')"
      - name: Run scale/group context gate
        run: python research/imperial_ar32_arithmetic_scale_group_contexts.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_arithmetic_scale_group_contexts.json'))
          for r in d['rows']:
            b=r['best']
            print(f"::notice title=scale-group {r['region']}::mode={b['mode']}, bps={b['bps']:.5f}, baseline={r['baseline_bps']:.5f}, SZ3={r['sz3_bps']:.5f}, gainAR={b['gain_vs_baseline']:.6f}, gainSZ3={b['gain_vs_sz3']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-scale-group-contexts
          path: imperial_ar32_arithmetic_scale_group_contexts.json
          retention-days: 7
