name: AXIOM monitored Sintel check
on:
  pull_request:
    branches: [main]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build real Sintel corpus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg g++ curl
          curl -L --retry 3 -sS https://media.w3.org/2010/05/sintel/trailer.mp4 -o sintel.mp4
          ffmpeg -loglevel error -y -ss 0 -t 4 -i sintel.mp4 -vf scale=320:180 -r 24 -frames:v 96 -f rawvideo -pix_fmt yuv420p sintel.yuv
          g++ -O3 -std=c++17 axiom_video_residual_v2.cpp -o axiom_vres
      - name: AXIOM exact video law
        run: |
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i sintel.yuv -frames:v 96 -c:v libaom-av1 -crf 7 -b:v 0 -cpu-used 2 -row-mt 1 -f ivf basis.ivf
          ffmpeg -loglevel error -y -i basis.ivf -f rawvideo -pix_fmt yuv420p basis.yuv
          ./axiom_vres e sintel.yuv basis.yuv residual.axr 320 180 96 2>axiom_stats.txt
          ./axiom_vres d residual.axr basis.yuv recon.yuv 320 180 96
          cmp sintel.yuv recon.yuv
      - name: Strong FFV1 variants
        run: |
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i sintel.yuv -frames:v 96 -c:v ffv1 -level 3 -coder 1 -context 1 -g 1 ffv1_ctx1.mkv
          ffmpeg -loglevel error -y -i ffv1_ctx1.mkv -f rawvideo -pix_fmt yuv420p f1.yuv
          cmp sintel.yuv f1.yuv
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i sintel.yuv -frames:v 96 -c:v ffv1 -level 3 -coder 1 -context 0 -g 1 ffv1_ctx0.mkv
          ffmpeg -loglevel error -y -i ffv1_ctx0.mkv -f rawvideo -pix_fmt yuv420p f0.yuv
          cmp sintel.yuv f0.yuv
          { sha256sum sintel.yuv; stat -c 'RAW %s' sintel.yuv; stat -c 'BASIS %s' basis.ivf; stat -c 'RESIDUAL %s' residual.axr; echo "AXIOM_TOTAL $(( $(stat -c%s basis.ivf) + $(stat -c%s residual.axr) + 62 ))"; cat axiom_stats.txt; stat -c 'FFV1_CTX1 %s' ffv1_ctx1.mkv; stat -c 'FFV1_CTX0 %s' ffv1_ctx0.mkv; } | tee monitored_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-sintel-monitored
          path: monitored_results.txt
          retention-days: 7
