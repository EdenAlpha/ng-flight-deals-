name: eFootball P2P vtable crypto sink v11

on:
  push:
    branches: [ efootball-score-wire-bridge-v3-2026-08-24 ]
    paths:
      - '.github/workflows/efootball-p2p-vtable-crypto-sink-v11.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl python3 python3-pip >/dev/null
          python3 -m pip install --break-system-packages -q pyelftools==0.32 capstone==5.0.6
      - name: Download current eFootball binary
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ef/bundle /tmp/ef/native /tmp/out
          curl -L --fail --retry 5 --retry-delay 2 -A 'Mozilla/5.0' -o /tmp/ef/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          unzip -q /tmp/ef/efootball.xapk -d /tmp/ef/bundle
          NATIVE=$(find /tmp/ef/bundle -type f -name 'config.arm64_v8a.apk' | head -n1)
          test -n "$NATIVE"
          unzip -q "$NATIVE" -d /tmp/ef/native
          sha256sum /tmp/ef/native/lib/arm64-v8a/libUE4.so > /tmp/out/efootball-p2p-vtable-crypto-sink-v11.sha256.txt
      - name: Trace runtime crypto sink
        run: |
          cat > /tmp/ef/v11.py <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          import re,struct

          p=Path('/tmp/ef/native/lib/arm64-v8a/libUE4.so'); raw=p.read_bytes()
          with p.open('rb') as f:
              e=ELFFile(f); t=e.get_section_by_name('.text'); tb=t.data(); tva=int(t['sh_addr']); tend=tva+len(tb)
              loads=[(int(s['p_vaddr']),int(s['p_offset']),int(s['p_filesz']),int(s['p_memsz'])) for s in e.iter_segments() if s['p_type']=='PT_LOAD']
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.detail=False
          def voff(va):
              for sv,so,fs,ms in loads:
                  if sv<=va<sv+fs:return so+(va-sv)
              return None
          def readq(va):
              o=voff(va)
              if o is None or o+8>len(raw):return None
              return struct.unpack_from('<Q',raw,o)[0]
          def cstr(va,n=180):
              o=voff(va)
              if o is None:return None
              b=raw[o:o+n].split(b'\0',1)[0]
              if len(b)<3:return None
              try:s=b.decode('ascii')
              except:return None
              return s if sum(32<=x<127 for x in b)/len(b)>.95 else None
          def dis(lo,hi):
              lo=max(lo,tva);hi=min(hi,tend)
              return list(md.disasm(tb[lo-tva:hi-tva],lo))
          def ispro(z): return z.mnemonic=='stp' and 'x29, x30' in z.op_str and '[sp, #-' in z.op_str and ']!' in z.op_str
          def fs(addr,span=0x3000):
              r=max(tva,addr-span)
              for z in dis(max(tva,addr-span),addr+4):
                  if ispro(z):r=z.address
              return r
          def fe(start,span=0x9000):
              for z in dis(start+4,min(tend,start+span)):
                  if ispro(z):return z.address
              return min(tend,start+span)
          def dump(o,title,lo,hi):
              o.append(f'\n=== {title} 0x{lo:x}-0x{hi:x} ===')
              pending={}
              for z in dis(lo,hi):
                  extra=''
                  if z.mnemonic=='adrp':
                      m=re.match(r'(x\d+), #0x([0-9a-f]+)',z.op_str)
                      if m:pending[m.group(1)]=int(m.group(2),16)
                  elif z.mnemonic=='add':
                      m=re.match(r'(x\d+), \1, #0x([0-9a-f]+)',z.op_str)
                      if m and m.group(1) in pending:
                          s=cstr(pending[m.group(1)]+int(m.group(2),16))
                          if s:extra=f' ; STR={s!r}'
                  o.append(f'0x{z.address:x}: {z.mnemonic:9} {z.op_str}{extra}')
          def all_calls():
              d={}
              for z in md.disasm(tb,tva):
                  if z.mnemonic=='bl':
                      m=re.fullmatch(r'#0x([0-9a-f]+)',z.op_str)
                      if m:d.setdefault(int(m.group(1),16),[]).append(z.address)
              return d
          calls=all_calls()
          def call_targets(lo,hi):
              r=[]
              for z in dis(lo,hi):
                  if z.mnemonic=='bl':
                      m=re.fullmatch(r'#0x([0-9a-f]+)',z.op_str)
                      if m:r.append((z.address,int(m.group(1),16)))
              return r

          o=[]
          o.append('V11 P2P VTABLE / SESSION-CRYPTO SINK TRACE')
          o.append('Known: direct-P2P transport stores profile pair into object; heap profile carries session cipher fields at +130/+134/+138/+140.')

          # 1) Exact typed copy/adaptor found by v10.
          conv=0x7b6ca9c; ce=fe(conv)
          dump(o,'STRICT SESSION PROFILE ADAPTER',conv,ce)
          o.append('\n=== ADAPTER DIRECT CALLERS ===')
          for a in calls.get(conv,[]):
              o.append(f'caller=0x{a:x} fn~=0x{fs(a):x}')
              dump(o,f'ADAPTER CALLER @0x{a:x}',max(fs(a),a-0x140),min(fe(fs(a)),a+0x1c0))

          # 2) The transport vtable installed by constructor 0x7c56740.
          vt=0x981f890
          o.append(f'\n=== VTABLE 0x{vt:x} RAW POINTERS ===')
          methods=[]
          for i in range(0,0x300,8):
              q=readq(vt+i)
              if q is None: break
              o.append(f'+0x{i:03x}: 0x{q:x}')
              if tva<=q<tend and q not in methods:methods.append(q)
          o.append(f'vtable_text_method_count={len(methods)}')

          # 3) Summarize each method, focusing on retrieval of profile pair from [this] and session field offsets.
          fieldoffs=(0x130,0x134,0x138,0x140,0x128,0x12c)
          mem=re.compile(r'\[(x\d+), #0x([0-9a-f]+)\]')
          o.append('\n=== VTABLE METHOD CRYPTO/PROFILE ACCESS SUMMARY ===')
          for maddr in methods:
              start=fs(maddr,0x400);end=fe(start,0x5000); body=dis(start,end)
              interesting=[]
              for z in body:
                  txt=z.mnemonic+' '+z.op_str
                  mm=mem.search(z.op_str)
                  profileish=(mm and int(mm.group(2),16) in fieldoffs)
                  thisload=(re.search(r'ldr\s+x\d+, \[x0(?:, #0x[0-9a-f]+)?\]',txt) is not None)
                  crypto_call=(z.mnemonic in ('bl','blr') and (0x7b00000<=z.address<=0x7d50000))
                  if profileish or thisload or crypto_call:interesting.append(z)
              if interesting:
                  o.append(f'\n-- vmethod entry=0x{maddr:x} fn~=0x{start:x}-0x{end:x} --')
                  for z in interesting[:220]:o.append(f'0x{z.address:x}: {z.mnemonic:9} {z.op_str}')

          # 4) Strict typed reads of final heap profile fields in the network/P2P code region.
          # Require all 4 on same base with exact load widths.
          region=dis(0x7b00000,0x7d50000); starts=[z.address for z in region if ispro(z)]+[0x7d50000]
          idx=0; strict=[]; req={('ldrb',0x130,'w'),('ldr',0x134,'w'),('ldrb',0x138,'w'),('ldr',0x140,'x')}
          for k in range(len(starts)-1):
              s,e2=starts[k],starts[k+1]
              if e2-s>0x18000:continue
              while idx<len(region) and region[idx].address<s:idx+=1
              j=idx; f=[]
              while j<len(region) and region[j].address<e2:f.append(region[j]);j+=1
              regs={}
              for z in f:
                  mm=mem.search(z.op_str)
                  if not mm:continue
                  off=int(mm.group(2),16)
                  if off not in fieldoffs:continue
                  first=z.op_str.split(',',1)[0].strip()
                  width=first[:1] if first else ''
                  regs.setdefault(mm.group(1),set()).add((z.mnemonic,off,width))
              for reg,got in regs.items():
                  if req<=got:strict.append((s,e2,reg,f))
              idx=j
          o.append('\n=== STRICT FINAL-HEAP SESSION-CIPHER READ FUNCTIONS ===')
          o.append(f'hit_count={len(strict)}')
          for s,e2,reg,f in strict:
              o.append(f'\n-- fn 0x{s:x}-0x{e2:x} base={reg} callers={",".join(hex(x) for x in calls.get(s,[])[:80])} --')
              keep=set()
              for i,z in enumerate(f):
                  mm=mem.search(z.op_str)
                  if mm and mm.group(1)==reg and int(mm.group(2),16) in fieldoffs:
                      for q in range(max(0,i-14),min(len(f),i+26)):keep.add(q)
                  if z.mnemonic in ('bl','blr'):keep.add(i)
              last=-2
              for q in sorted(keep):
                  if q>last+1:o.append('  ...')
                  z=f[q];o.append(f'  0x{z.address:x}: {z.mnemonic:9} {z.op_str}')
                  last=q

          # 5) Search for runtime users of the ADAPTER OUTPUT layout. Source fields shifted by -8:
          # alg presence/value +128/+12c, keylen presence/value +130/+138.
          req2={('ldrb',0x128,'w'),('ldr',0x12c,'w'),('ldrb',0x130,'w'),('ldr',0x138,'x')}
          idx=0; outusers=[]
          for k in range(len(starts)-1):
              s,e2=starts[k],starts[k+1]
              if e2-s>0x18000:continue
              while idx<len(region) and region[idx].address<s:idx+=1
              j=idx;f=[]
              while j<len(region) and region[j].address<e2:f.append(region[j]);j+=1
              regs={}
              for z in f:
                  mm=mem.search(z.op_str)
                  if not mm:continue
                  off=int(mm.group(2),16)
                  if off not in (0x128,0x12c,0x130,0x138):continue
                  first=z.op_str.split(',',1)[0].strip();width=first[:1] if first else ''
                  regs.setdefault(mm.group(1),set()).add((z.mnemonic,off,width))
              for reg,got in regs.items():
                  if req2<=got:outusers.append((s,e2,reg,f))
              idx=j
          o.append('\n=== STRICT ADAPTER-OUTPUT SESSION-CIPHER USERS ===')
          o.append(f'hit_count={len(outusers)}')
          for s,e2,reg,f in outusers:
              o.append(f'\n-- fn 0x{s:x}-0x{e2:x} base={reg} callers={",".join(hex(x) for x in calls.get(s,[])[:100])} --')
              for z in f:
                  mm=mem.search(z.op_str)
                  if (mm and mm.group(1)==reg and int(mm.group(2),16) in (0x128,0x12c,0x130,0x138)) or z.mnemonic in ('bl','blr'):
                      o.append(f'0x{z.address:x}: {z.mnemonic:9} {z.op_str}')

          # 6) Direct callers of the transport profile-store helper, and methods in same class region that touch [x0].
          helper=0x7c54ea0
          o.append('\n=== PROFILE-PAIR STORE HELPER DIRECT CALLERS ===')
          for a in calls.get(helper,[]):o.append(f'0x{a:x} fn~=0x{fs(a):x}')

          Path('/tmp/out/efootball-p2p-vtable-crypto-sink-v11.txt').write_text('\n'.join(o))
          print('\n'.join(o[:2200]))
          PY
          python3 /tmp/ef/v11.py
      - name: Commit report
        run: |
          set -euo pipefail
          mkdir -p analysis-output
          cp /tmp/out/efootball-p2p-vtable-crypto-sink-v11* analysis-output/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin efootball-score-wire-bridge-v3-2026-08-24
          git add analysis-output/
          git commit -m 'Report eFootball P2P vtable crypto sink v11' || exit 0
          git push
