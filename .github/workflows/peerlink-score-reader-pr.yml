name: PeerLink score reader isolated PR build

on:
  pull_request:
    branches: [ peerlink-score-reader-base-2026-08-24 ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peerlink-score-reader-2026-08-24
          fetch-depth: 0

      - name: Apply staged implementation patches
        run: |
          set -euo pipefail
          if [ -f .github/workflows/peerlink-score-reader-build.yml ]; then
            python3 - <<'PY'
          from pathlib import Path
          y = Path('.github/workflows/peerlink-score-reader-build.yml').read_text()
          marker = "python3 - <<'PY'\n"
          raw = y.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(compile(code, '<score-reader-stage>', 'exec'), {'__name__': '__main__'})
          PY
          fi
          if [ -f peerlink-source/tools/patch_direct_terminal_callback.py ]; then
            python3 peerlink-source/tools/patch_direct_terminal_callback.py
          fi

      - name: Build debug and minified release APKs
        run: |
          set -euo pipefail
          cd peerlink-source
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify JNI callback names survived R8
        run: |
          set -euo pipefail
          MAPPING=peerlink-source/app/build/outputs/mapping/release/mapping.txt
          test -f "$MAPPING"
          # These names are looked up from C++ with GetMethodID and therefore
          # must remain literal in the minified release build.
          ! grep -E 'preparePeerSocket\(|fabricateStunResponse\(|onNativeLog\(|onMatchTerminalDetected\(' "$MAPPING" | grep -E ' -> [^ ]+$' | grep -vE ' -> (preparePeerSocket|fabricateStunResponse|onNativeLog|onMatchTerminalDetected)$' || {
            echo 'A JNI callback method was renamed by R8.' >&2
            exit 1
          }

      - name: Upload PeerLink score-reader APKs
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-score-reader-apks
          path: |
            peerlink-source/app/build/outputs/apk/debug/app-debug.apk
            peerlink-source/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          rm -f .github/workflows/peerlink-score-reader-build.yml .github/workflows/peerlink-score-reader-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Make eFootball match-end callback fully event-driven"
          git push origin HEAD:peerlink-score-reader-2026-08-24
