name: PeerLink score reader isolated PR build

on:
  pull_request:
    branches: [ peerlink-score-reader-base-2026-08-24 ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peerlink-score-reader-2026-08-24
          fetch-depth: 0

      - name: Apply staged implementation patches
        run: |
          set -euo pipefail
          if [ -f .github/workflows/peerlink-score-reader-build.yml ]; then
            python3 - <<'PY'
          from pathlib import Path
          y = Path('.github/workflows/peerlink-score-reader-build.yml').read_text()
          marker = "python3 - <<'PY'\n"
          raw = y.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(compile(code, '<score-reader-stage>', 'exec'), {'__name__': '__main__'})
          PY
          fi
          if [ -f peerlink-source/tools/patch_direct_terminal_callback.py ]; then
            python3 peerlink-source/tools/patch_direct_terminal_callback.py
          fi

      - name: Build PeerLink debug APK
        run: |
          set -euo pipefail
          cd peerlink-source
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload PeerLink score-reader APK
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-score-reader-debug
          path: peerlink-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          rm -f .github/workflows/peerlink-score-reader-build.yml .github/workflows/peerlink-score-reader-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Make eFootball match-end callback fully event-driven"
          git push origin HEAD:peerlink-score-reader-2026-08-24
