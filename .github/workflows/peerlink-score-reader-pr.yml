name: PeerLink score reader isolated PR build

on:
  pull_request:
    branches: [ peerlink-score-reader-base-2026-08-24 ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peerlink-score-reader-2026-08-24
          fetch-depth: 0

      - name: Apply staged score-reader patch
        run: |
          set -euo pipefail
          if [ ! -f .github/workflows/peerlink-score-reader-build.yml ]; then
            echo "Staging workflow already consumed; validating committed source only."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          y = Path('.github/workflows/peerlink-score-reader-build.yml').read_text()
          marker = "python3 - <<'PY'\n"
          code = y.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(textwrap.dedent(code), {'__name__': '__main__'})
          PY

      - name: Build PeerLink debug APK
        run: |
          set -euo pipefail
          cd peerlink-source
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Commit verified implementation when staged
        run: |
          set -euo pipefail
          rm -f .github/workflows/peerlink-score-reader-build.yml .github/workflows/peerlink-score-reader-pr.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo "No staging changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add event-driven eFootball final score reader"
          git push origin HEAD:peerlink-score-reader-2026-08-24
