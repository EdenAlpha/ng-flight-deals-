name: Raw Utah FORGE independent Deflate64 extraction
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          pip install --quiet requests remotezip zipfile64 numpy segyio pysz
      - name: Build single-member ZIP from ranged raw Deflate64 bytes
        shell: bash
        run: |
          python - <<'PY'
          import requests, struct, json, zlib
          import zipfile64.zipfile
          from remotezip import RemoteZip
          url='https://gdr.openei.org/files/1015/1001-1122%20%281%29.zip'
          with RemoteZip(url) as z:
              infos=sorted([i for i in z.infolist() if not i.is_dir() and i.filename.lower().endswith(('.sgy','.segy','.seg'))], key=lambda i:i.filename)
              i=infos[len(infos)//2]
              meta={'count':len(infos),'name':i.filename,'file_size':int(i.file_size),'compress_size':int(i.compress_size),'method':int(i.compress_type),'crc':int(i.CRC),'header_offset':int(i.header_offset)}
          off=meta['header_offset']
          r=requests.get(url,headers={'Range':f'bytes={off}-{off+4095}'},timeout=30); r.raise_for_status(); h=r.content
          if h[:4]!=b'PK\x03\x04': raise RuntimeError(f'bad local header {h[:16].hex()}')
          sig,ver,flag,method,mt,md,crc_l,cs_l,us_l,nlen,xlen=struct.unpack('<IHHHHHIIIHH',h[:30])
          name=h[30:30+nlen]
          data_off=off+30+nlen+xlen
          end=data_off+meta['compress_size']-1
          rr=requests.get(url,headers={'Range':f'bytes={data_off}-{end}'},timeout=30); rr.raise_for_status(); payload=rr.content
          if len(payload)!=meta['compress_size']: raise RuntimeError((len(payload),meta['compress_size']))
          # Build a conventional one-member archive with no data descriptor and central-directory offset 0.
          fn=name
          local=struct.pack('<IHHHHHIIIHH',0x04034b50,21,0,meta['method'],mt,md,meta['crc'],meta['compress_size'],meta['file_size'],len(fn),0)+fn
          central=struct.pack('<IHHHHHHIIIHHHHHII',0x02014b50,20,21,0,meta['method'],mt,md,meta['crc'],meta['compress_size'],meta['file_size'],len(fn),0,0,0,0,0,0)+fn
          cd_off=len(local)+len(payload); eocd=struct.pack('<IHHHHIIH',0x06054b50,0,0,1,1,len(central),cd_off,0)
          open('single_deflate64.zip','wb').write(local+payload+central+eocd)
          meta.update({'local_version':ver,'local_flag':flag,'local_method':method,'local_name':name.decode('utf-8','replace'),'local_crc':crc_l,'local_comp_size':cs_l,'local_file_size':us_l,'name_len':nlen,'extra_len':xlen,'data_offset':data_off,'payload_len':len(payload),'mini_zip_bytes':len(local)+len(payload)+len(central)+len(eocd)})
          json.dump(meta,open('forge_7z_extract_meta.json','w'),indent=2); print(json.dumps(meta,indent=2),flush=True)
          PY
      - name: Independently test and extract with 7-Zip
        shell: bash
        run: |
          set -euxo pipefail
          7z t single_deflate64.zip | tee 7z_test.txt
          mkdir extracted
          7z x -y -oextracted single_deflate64.zip | tee 7z_extract.txt
          find extracted -type f -printf '%p %s bytes\n'
          cp "$(find extracted -type f | head -1)" forge_raw_shot.sgy
          sha256sum forge_raw_shot.sgy > forge_raw_shot.sha256
      - name: Inspect true extracted member and benchmark SZ3
        shell: bash
        run: |
          python - <<'PY'
          import json,os,numpy as np,segyio
          from pysz import sz,szConfig,szErrorBoundMode
          fn='forge_raw_shot.sgy'; out={'file_bytes':os.path.getsize(fn),'first64':open(fn,'rb').read(64).hex()}
          b=open(fn,'rb').read(3600); bh=b[3200:3600] if len(b)>=3600 else b''
          if len(bh)>=306:
              u16=lambda o:int.from_bytes(bh[o:o+2],'big',signed=False)
              i16=lambda o:int.from_bytes(bh[o:o+2],'big',signed=True)
              out['binary_header_raw']={'dt':u16(16),'ns':u16(20),'format':u16(24),'revision':u16(300),'fixed':u16(302),'extended_headers':i16(304)}
          try:
              with segyio.open(fn,'r',ignore_geometry=True) as s:
                  X=np.asarray(s.trace.raw[:],np.float32).copy(); out['segyio_shape']=list(X.shape); out['dt_us']=int(segyio.tools.dt(s))
                  std=float(X.astype(np.float64).std());eps=.1*std;cfg=szConfig();cfg.errorBoundMode=szErrorBoundMode.ABS;cfg.absErrorBound=eps;bb,_=sz.compress(np.ascontiguousarray(X),cfg);R,_=sz.decompress(bb,np.float32,X.shape);out['sz3']={'raw_bytes':int(X.nbytes),'std':std,'eps':eps,'bytes':int(bb.size),'ratio':float(X.nbytes/int(bb.size)),'maxerr':float(np.max(np.abs(X-R)))}
          except Exception as e: out['segyio_error']=repr(e)
          print(json.dumps(out,indent=2),flush=True);json.dump(out,open('forge_7z_inspect.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forge-raw-independent-deflate64
          path: |
            forge_7z_extract_meta.json
            forge_7z_inspect.json
            forge_raw_shot.sha256
            7z_test.txt
            7z_extract.txt
          retention-days: 7
