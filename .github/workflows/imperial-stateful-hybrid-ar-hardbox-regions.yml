name: Imperial stateful hybrid AR hardbox regions
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-full-array]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py pysz boto3 zstandard
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run exact stateful hybrid gate
        run: python research/imperial_stateful_hybrid_ar_hardbox_regions.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-stateful-hybrid-ar-hardbox-regions
          path: imperial_stateful_hybrid_ar_hardbox_regions.json
          retention-days: 7
