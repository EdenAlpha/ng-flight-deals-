name: Imperial Huber AR32 block Adaptive GPS full-hard
on:
  pull_request:
    branches: [imperial-huber-ar32-adaptive-gps-fullhard]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Encode Huber AR32 with session-block Adaptive GPS
        run: python research/imperial_huber_ar32_block_adaptive_gps_fullhard.py imperial.h5
      - name: Surface exact fair result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_huber_ar32_block_adaptive_gps_fullhard.json'));level='notice' if d['bytes']<d['fair_ar32_richmag_bytes'] else 'warning'
          print(f"::{level} title=Huber AR32 block Adaptive GPS::ours={d['bytes']} B fairAR32={d['fair_ar32_richmag_bytes']} B delta={d['delta_vs_fair_ar32']} B gain={d['gain_vs_fair_ar32']:.6f}x SZ3={d['matched_sz3_bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-huber-ar32-block-adaptive-gps-fullhard
          path: imperial_huber_ar32_block_adaptive_gps_fullhard.json
          if-no-files-found: ignore
          retention-days: 7
