name: Fast FORGE high-order tolerance lifting
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read, actions: read}
jobs:
  lift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: forge-subcube-cache
          path: data
          github-token: ${{ github.token }}
          repository: EdenAlpha/ng-flight-deals-
          run-id: 31459619473
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          pip install --quiet numpy numba pysz
      - run: |
          cat > /tmp/l.py <<'PY'
          import json,math,subprocess,numpy as np
          from numba import njit
          from pysz import sz,szConfig,szErrorBoundMode
          meta=json.load(open('data/forge_subcube_meta.json'));X=np.fromfile('data/forge_subcube_f32.bin','<f4').reshape(meta['shape']);eps=float(meta['eps_10pct_std']);raw=X.nbytes;ni,nj,nt=X.shape
          def z(a):return len(subprocess.run(['zstd','-q','-f','-19','-c'],input=np.ascontiguousarray(a).tobytes(),stdout=subprocess.PIPE,check=True).stdout)
          def si(a):
            lo=int(a.min()) if a.size else 0;hi=int(a.max()) if a.size else 0
            return a.astype(np.int8) if lo>=-128 and hi<=127 else a.astype(np.int16) if lo>=-32768 and hi<=32767 else a.astype(np.int32)
          def plan(S):
            anc=list(range(0,nt,S));
            if anc[-1]!=nt-1:anc.append(nt-1)
            depth=np.full(nt,32767,np.int16);depth[anc]=-1;rows=[]
            def rec(a,b,d):
              if b-a<=1:return
              m=(a+b)//2;depth[m]=min(depth[m],d);rows.append((d,m,a,b));rec(a,m,d+1);rec(m,b,d+1)
            for a,b in zip(anc[:-1],anc[1:]):rec(a,b,0)
            rows.sort();return np.asarray(anc,np.int32),np.asarray(rows,np.int32),depth
          @njit(cache=True)
          def rd(n,d):return (n+d//2)//d if n>=0 else -((-n+d//2)//d)
          @njit(cache=True)
          def known(depth,x,d):return x>=0 and x<depth.shape[0] and depth[x]<d
          @njit(cache=True)
          def predict(Q,i,j,d,a,b,depth,kind):
            h=b-a
            if kind>=8:
              p0=a-3*h;p1=a-2*h;p2=a-h;p3=a;p4=b;p5=b+h;p6=b+2*h;p7=b+3*h
              if known(depth,p0,d) and known(depth,p1,d) and known(depth,p2,d) and known(depth,p5,d) and known(depth,p6,d) and known(depth,p7,d):
                n=-5*Q[i,j,p0]+49*Q[i,j,p1]-245*Q[i,j,p2]+1225*Q[i,j,p3]+1225*Q[i,j,p4]-245*Q[i,j,p5]+49*Q[i,j,p6]-5*Q[i,j,p7];return rd(n,2048)
            if kind>=6:
              p0=a-2*h;p1=a-h;p2=a;p3=b;p4=b+h;p5=b+2*h
              if known(depth,p0,d) and known(depth,p1,d) and known(depth,p4,d) and known(depth,p5,d):
                n=3*Q[i,j,p0]-25*Q[i,j,p1]+150*Q[i,j,p2]+150*Q[i,j,p3]-25*Q[i,j,p4]+3*Q[i,j,p5];return rd(n,256)
            if kind>=4:
              p0=a-h;p1=a;p2=b;p3=b+h
              if known(depth,p0,d) and known(depth,p3,d):
                n=-Q[i,j,p0]+9*Q[i,j,p1]+9*Q[i,j,p2]-Q[i,j,p3];return rd(n,16)
            return rd(Q[i,j,a]+Q[i,j,b],2)
          @njit(cache=True)
          def encode(X,eps,alpha,anc,P,depth,kind):
            step=alpha*eps;Q=np.zeros(X.shape,np.int32);H=np.zeros(X.shape,np.int32)
            for k in range(anc.shape[0]):
              t=int(anc[k])
              for i in range(ni):
                for j in range(nj):
                  lo=math.ceil((X[i,j,t]-eps)/step-1e-7);hi=math.floor((X[i,j,t]+eps)/step+1e-7);q=int(round(X[i,j,t]/step))
                  if q<lo:q=lo
                  elif q>hi:q=hi
                  Q[i,j,t]=q
            for r in range(P.shape[0]):
              d=int(P[r,0]);m=int(P[r,1]);a=int(P[r,2]);b=int(P[r,3])
              for i in range(ni):
                for j in range(nj):
                  p=predict(Q,i,j,d,a,b,depth,kind);lo=math.ceil((X[i,j,m]-eps)/step-1e-7);hi=math.floor((X[i,j,m]+eps)/step+1e-7);q=p
                  if q<lo:q=lo
                  elif q>hi:q=hi
                  Q[i,j,m]=q;H[i,j,m]=q-p
            return Q,H,step
          def cbytes(A):
            m=A!=0;opts=[z(si(A)),z(si(np.transpose(A,(2,0,1)))),z(si(np.transpose(A,(0,2,1))))]
            Z=A.astype(np.int32).copy();Z[1:,1:]=A[1:,1:].astype(np.int32)-A[:-1,1:].astype(np.int32)-A[1:,:-1].astype(np.int32)+A[:-1,:-1].astype(np.int32);opts.append(z(si(Z)));opts.append(z(np.packbits(m.ravel(),bitorder='little'))+(z(si(A[m])) if m.any() else 0));return min(opts)
          cfg=szConfig();cfg.errorBoundMode=szErrorBoundMode.ABS;cfg.absErrorBound=eps;b,_=sz.compress(np.ascontiguousarray(X),cfg);D,_=sz.decompress(b,np.float32,X.shape);print('BASE',json.dumps({'bytes':int(b.size),'ratio':raw/int(b.size),'maxerr':float(np.max(np.abs(X-D)))}),flush=True)
          rows=[]
          for S in [2,4,8,16,32,64]:
            anc,P,depth=plan(S)
            for kind in [2,4,6,8]:
              for alpha in [1.95,1.75,1.5,1.25]:
                Q,H,step=encode(X,eps,alpha,anc,P,depth,kind);A=Q[:,:,anc];anchor=cbytes(A);detail=0;ev=[]
                for d in range(int(P[:,0].max())+1):
                  pos=P[P[:,0]==d,1];V=H[:,:,pos];detail+=cbytes(V);ev.append(float(np.mean(V!=0)))
                total=anchor+detail+80;me=float(np.max(np.abs(X-Q.astype(np.float32)*step)));r={'S':S,'kind':kind,'alpha':alpha,'bytes':total,'ratio':raw/total,'anchor':anchor,'detail':detail,'events':ev,'maxerr':me};rows.append(r);print('HLIFT',json.dumps(r),flush=True)
          rows.sort(key=lambda r:r['bytes']);print('BEST',json.dumps(rows[:15],indent=2),flush=True)
          PY
          python /tmp/l.py
