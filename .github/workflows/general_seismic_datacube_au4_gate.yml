name: General seismic San Emidio DataCube AU4 gate

on:
  pull_request:
    branches: [ general-seismic-benchmark-v1 ]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  datacube-au4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python gate dependencies
        run: pip install --quiet numpy boto3 obspy zstandard pysz
      - name: Extract one native AU4 member by S3 byte range
        run: |
          python - <<'PY'
          import boto3,json,os,re
          from botocore import UNSIGNED
          from botocore.config import Config
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED,retries={'max_attempts':10}))
          bucket='gdr-data-lake'
          key='wholescale/2021_seismic/WHOLESCALE_Data_seismic_2021_data_level0_datacube.tar'
          total=int(s3.head_object(Bucket=bucket,Key=key)['ContentLength'])
          pos=0;block=1024*1024;cache_start=-1;cache=b'';longname=None;found=None
          def pnum(raw):
              raw=raw.rstrip(b'\0 ').strip()
              return 0 if not raw else int(raw,8)
          while pos+512<=total:
              if not (cache_start<=pos and pos+512<=cache_start+len(cache)):
                  cache_start=pos;end=min(total-1,pos+block-1)
                  cache=s3.get_object(Bucket=bucket,Key=key,Range=f'bytes={pos}-{end}')['Body'].read()
              h=cache[pos-cache_start:pos-cache_start+512]
              if len(h)<512 or not h.strip(b'\0'):break
              name=h[:100].split(b'\0',1)[0].decode('utf-8','replace')
              prefix=h[345:500].split(b'\0',1)[0].decode('utf-8','replace')
              if prefix:name=prefix+'/'+name
              size=pnum(h[124:136]);typ=h[156:157];data_off=pos+512
              if typ==b'L':
                  end=min(total-1,data_off+size-1)
                  longname=s3.get_object(Bucket=bucket,Key=key,Range=f'bytes={data_off}-{end}')['Body'].read().split(b'\0',1)[0].decode('utf-8','replace')
              elif typ in (b'0',b'\0'):
                  if longname:name,longname=longname,None
                  if name.lower().endswith('.au4') and size>1_000_000:
                      found=(name,data_off,size);break
              else:longname=None
              pos=data_off+((size+511)//512)*512
          if not found:raise SystemExit('no AU4 member found')
          name,off,size=found;os.makedirs('au4',exist_ok=True);end=off+size-1
          print('AU4_MEMBER',name,'OFFSET',off,'SIZE',size,flush=True)
          body=s3.get_object(Bucket=bucket,Key=key,Range=f'bytes={off}-{end}')['Body']
          with open('au4/gate.AU4','wb') as f:
              while True:
                  b=body.read(8*1024*1024)
                  if not b:break
                  f.write(b)
          assert os.path.getsize('au4/gate.AU4')==size
          json.dump({'bucket':bucket,'tar_key':key,'member':name,'offset':off,'bytes':size},open('datacube_au4_input.json','w'),indent=2)
          PY
      - name: Install official GFZ GIPPtools 2026.167
        run: |
          curl -fL --retry 4 -o gipptools.tar.gz https://media.gfz.de/gfz/sec22/gipptools/gipptools-2026.167-unix.tar.gz
          mkdir gipptools
          tar -xzf gipptools.tar.gz -C gipptools --strip-components=1
          find gipptools -maxdepth 3 -type f -name 'cube2mseed*' -o -name 'cubeinfo*'
          CUBE2MSEED=$(find "$PWD/gipptools" -type f -name cube2mseed | head -1)
          CUBEINFO=$(find "$PWD/gipptools" -type f -name cubeinfo | head -1)
          test -n "$CUBE2MSEED" && test -n "$CUBEINFO"
          chmod +x "$CUBE2MSEED" "$CUBEINFO"
          echo "CUBE2MSEED=$CUBE2MSEED" >> "$GITHUB_ENV"
          echo "CUBEINFO=$CUBEINFO" >> "$GITHUB_ENV"
      - name: Decode real San Emidio AU4 to raw INT32 miniSEED
        run: |
          "$CUBEINFO" au4/gate.AU4 | tee datacube_cubeinfo.txt
          mkdir mseed
          "$CUBE2MSEED" --fringe-samples=NOMINAL --resample=SINC --output-dir=mseed --encoding=INT-32 au4/gate.AU4 | tee datacube_cube2mseed.txt
          find mseed -type f -ls
      - name: Verify integer counts and run portfolio vs matched SZ3 mechanics gate
        env:
          PYTHONPATH: research
        run: |
          python - <<'PY'
          import glob,json,numpy as np
          from obspy import read
          from general_seismic_codec_portfolio import load_config,encode_portfolio,decode_portfolio
          from general_seismic_numeric_io import matched_sz3
          fs=sorted(glob.glob('mseed/**/*',recursive=True));fs=[f for f in fs if not f.endswith('/')]
          if not fs:raise SystemExit('cube2mseed produced no files')
          traces=[]
          for f in fs:
              try:
                  st=read(f)
              except Exception:continue
              traces.extend(st)
          if not traces:raise SystemExit('no readable miniSEED traces')
          # Same native count stream, no engineering-unit conversion. Build a gate panel from
          # up to 128 traces/segments, common first 4096 samples.
          arr=[]
          for tr in traces:
              a=np.asarray(tr.data)
              if a.size>=4096:arr.append(a[:4096].astype(np.int32,copy=False))
              if len(arr)>=128:break
          if not arr:raise SystemExit('no >=4096-sample trace')
          P=np.ascontiguousarray(np.stack(arr));eps=.1*float(P.astype(np.float64).std());assert eps>0
          cfg=load_config('benchmarks/general_seismic_codec_portfolio_v1.json')
          blob,pm=encode_portfolio(P,eps,cfg,True);R=decode_portfolio(blob);me=float(np.max(np.abs(P.astype(np.float64)-np.asarray(R,np.float64))));assert me<=eps,(me,eps)
          szb,szme=matched_sz3(P,eps)
          out={'input':json.load(open('datacube_au4_input.json')),'n_mseed_files':len(fs),'n_readable_traces':len(traces),'panel_shape':list(P.shape),'dtype':str(P.dtype),'eps':eps,'selected_id':pm['selected_id'],'selected_engine':pm['selected_engine'],'portfolio_bytes':len(blob),'portfolio_bps':8*len(blob)/P.size,'portfolio_maxerr':me,'sz3_bytes':szb,'sz3_bps':8*szb/P.size,'sz3_maxerr':szme,'gain_sz3_over_portfolio':szb/len(blob),'scope':'San Emidio AU4 mechanics gate only; not headline benchmark'}
          json.dump(out,open('datacube_au4_gate.json','w'),indent=2);print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-seismic-datacube-au4-gate
          path: |
            datacube_au4_input.json
            datacube_cubeinfo.txt
            datacube_cube2mseed.txt
            datacube_au4_gate.json
          if-no-files-found: ignore
