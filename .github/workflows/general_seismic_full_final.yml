name: General seismic FINAL frozen benchmark

on:
  pull_request:
    branches: [ general-seismic-benchmark-v1 ]
  workflow_dispatch:

permissions: {contents: read}

env:
  BENCHMARK_DEFINITION_SHA: af580fd2e633531106ac74f7936d90231f6f773d
  SHARD_COUNT: '8'
  DATASETS: land_soda_lake_2010,land_teapot_dome_3d,land_san_emidio_2021,land_crescent_valley_2016,marine_waka_3d,marine_parihaka_3d,marine_opunake_3d,marine_tui_3d,marine_kahu_3d,das_imperial_valley_2020,das_porotomo_brady_dash,das_forge_neubrex_2024,das_egs_collab_exp2

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy boto3
      - name: Fetch exact corrected frozen definition
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_benchmark_manifest.json
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1_execution_amendments.json" > frozen_execution_amendments.json
          git show "$BENCHMARK_DEFINITION_SHA:research/general_seismic_v1_preflight.py" > frozen_preflight.py
      - name: Materialize pre-headline execution amendments
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open('frozen_benchmark_manifest.json'));a=json.load(open('frozen_execution_amendments.json'))
          for d in m['datasets']:
              if d['id'] in a.get('dataset_overrides',{}):d.update(a['dataset_overrides'][d['id']])
          m['execution_amendment']=a;m['benchmark_definition_sha']=os.environ['BENCHMARK_DEFINITION_SHA']
          json.dump(m,open('general_seismic_v1_effective_manifest.json','w'),indent=2)
          PY
      - name: Resolve exact frozen inventory
        run: python frozen_preflight.py general_seismic_v1_effective_manifest.json
      - name: Verify final 13-survey payload and shard policy
        env: {PYTHONPATH: research}
        run: |
          python - <<'PY'
          import json,os
          import general_seismic_sharded_runner_v2 as s
          m=json.load(open('general_seismic_v1_effective_manifest.json'));p=json.load(open('general_seismic_v1_preflight.json'));n=int(os.environ['SHARD_COUNT']);base=s.old.base
          assert m['benchmark_definition_sha']==os.environ['BENCHMARK_DEFINITION_SHA']
          assert len(p['datasets'])==13 and all(r['status']=='ok' for r in p['datasets']),p
          total=sum(float(r['selected_gb']) for r in p['datasets'])
          assert abs(total-274.688357807)<1e-6,total
          san=base.dataset_row(p,'land_san_emidio_2021')
          assert san['eligible_objects']==35 and san['duplicate_archive_copies']==35,san
          assert abs(float(san['selected_gb'])-14.860618093)<1e-9,san['selected_gb']
          for ds in m['datasets']:
              row=base.dataset_row(p,ds['id']);orig=base.records(row)
              if s._panel_shard_needed(row,ds,n):
                  for i in range(n):
                      q=s.shard_row(row,ds,i,n);assert base.records(q)==orig,(ds['id'],i)
                  assert sum(s.shard_row(row,ds,i,n)['selected_bytes'] for i in range(n))==int(row['selected_bytes'])
              else:
                  got=[]
                  for i in range(n):got.extend(base.records(s.shard_row(row,ds,i,n)))
                  def k(o):return (o.get('bucket'),o.get('key'),o.get('member'),o.get('member_offset'),int(o.get('size',0)))
                  assert sorted(map(k,got))==sorted(map(k,orig)),(ds['id'],len(orig),len(got))
                  assert len(got)==len({k(o) for o in got}),(ds['id'],'duplicate execution records')
          print('FINAL_FROZEN_SURVEYS 13 TOTAL_SELECTED_GB',total,'SAN_EMIDIO_UNIQUE_AU4',san['eligible_objects'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-frozen-plan
          path: |
            general_seismic_v1_effective_manifest.json
            general_seismic_v1_preflight.json
          retention-days: 30

  stats:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        dataset: [land_soda_lake_2010,land_teapot_dome_3d,land_san_emidio_2021,land_crescent_valley_2016,marine_waka_3d,marine_parihaka_3d,marine_opunake_3d,marine_tui_3d,marine_kahu_3d,das_imperial_valley_2020,das_porotomo_brady_dash,das_forge_neubrex_2024,das_egs_collab_exp2]
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: final-frozen-plan, path: frozen_plan}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy boto3 h5py 's3fs<2027' segyio obspy
      - uses: actions/setup-java@v4
        if: matrix.dataset == 'land_san_emidio_2021'
        with: {distribution: temurin, java-version: '17'}
      - name: Install official GFZ DATA-CUBE decoder
        if: matrix.dataset == 'land_san_emidio_2021'
        run: |
          curl -fL --retry 4 -o gipptools.tar.gz https://media.gfz.de/gfz/sec22/gipptools/gipptools-2026.167-unix.tar.gz
          mkdir gipptools;tar -xzf gipptools.tar.gz -C gipptools --strip-components=1
          CUBE2MSEED=$(find "$PWD/gipptools" -type f -name cube2mseed | head -1);test -n "$CUBE2MSEED";chmod +x "$CUBE2MSEED";echo "CUBE2MSEED=$CUBE2MSEED" >> "$GITHUB_ENV"
      - name: Statistics shard
        env: {PYTHONPATH: research}
        run: |
          mkdir -p results
          python research/general_seismic_sharded_runner_v2.py stats-shard --manifest frozen_plan/general_seismic_v1_effective_manifest.json --preflight frozen_plan/general_seismic_v1_preflight.json --config benchmarks/general_seismic_codec_portfolio_v1.json --dataset '${{ matrix.dataset }}' --shard-index '${{ matrix.shard }}' --shard-count "$SHARD_COUNT" --out 'results/stats_${{ matrix.dataset }}_${{ matrix.shard }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-stats-${{ matrix.dataset }}-${{ matrix.shard }}
          path: results/stats_${{ matrix.dataset }}_${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  global_epsilon:
    needs: stats
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy boto3
      - uses: actions/download-artifact@v4
        with: {pattern: final-stats-*, path: stats_results, merge-multiple: true}
      - name: Merge exact moments into one global epsilon per survey
        env: {PYTHONPATH: research}
        run: python research/general_seismic_sharded_runner_v2.py aggregate-stats --results stats_results --datasets "$DATASETS" --shard-count "$SHARD_COUNT" --out general_seismic_global_epsilon.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-global-epsilon
          path: general_seismic_global_epsilon.json
          if-no-files-found: warn
          retention-days: 30

  compress:
    needs: [plan,global_epsilon]
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        dataset: [land_soda_lake_2010,land_teapot_dome_3d,land_san_emidio_2021,land_crescent_valley_2016,marine_waka_3d,marine_parihaka_3d,marine_opunake_3d,marine_tui_3d,marine_kahu_3d,das_imperial_valley_2020,das_porotomo_brady_dash,das_forge_neubrex_2024,das_egs_collab_exp2]
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: final-frozen-plan, path: frozen_plan}
      - uses: actions/download-artifact@v4
        with: {name: final-global-epsilon, path: epsilon}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy zstandard pybind11 boto3 h5py 's3fs<2027' segyio pysz obspy
      - name: Compile bit-exact ZSM backend
        run: |
          EXT=$(python3-config --extension-suffix)
          c++ -O3 -march=x86-64 -shared -std=c++17 -fPIC $(python -m pybind11 --includes) research/general_seismic_fast_zsm.cpp -o research/general_seismic_fast_zsm${EXT}
      - uses: actions/setup-java@v4
        if: matrix.dataset == 'land_san_emidio_2021'
        with: {distribution: temurin, java-version: '17'}
      - name: Install official GFZ DATA-CUBE decoder
        if: matrix.dataset == 'land_san_emidio_2021'
        run: |
          curl -fL --retry 4 -o gipptools.tar.gz https://media.gfz.de/gfz/sec22/gipptools/gipptools-2026.167-unix.tar.gz
          mkdir gipptools;tar -xzf gipptools.tar.gz -C gipptools --strip-components=1
          CUBE2MSEED=$(find "$PWD/gipptools" -type f -name cube2mseed | head -1);test -n "$CUBE2MSEED";chmod +x "$CUBE2MSEED";echo "CUBE2MSEED=$CUBE2MSEED" >> "$GITHUB_ENV"
      - name: Compression shard with survey-global epsilon
        env: {PYTHONPATH: research}
        run: |
          mkdir -p results
          python research/general_seismic_sharded_runner_v2.py compress-shard --manifest frozen_plan/general_seismic_v1_effective_manifest.json --preflight frozen_plan/general_seismic_v1_preflight.json --config benchmarks/general_seismic_codec_portfolio_v1.json --epsilon-map epsilon/general_seismic_global_epsilon.json --dataset '${{ matrix.dataset }}' --shard-index '${{ matrix.shard }}' --shard-count "$SHARD_COUNT" --out 'results/compress_${{ matrix.dataset }}_${{ matrix.shard }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-compress-${{ matrix.dataset }}-${{ matrix.shard }}
          path: results/compress_${{ matrix.dataset }}_${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: compress
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy boto3
      - uses: actions/download-artifact@v4
        with: {name: final-frozen-plan, path: frozen_plan}
      - uses: actions/download-artifact@v4
        with: {name: final-global-epsilon, path: epsilon}
      - uses: actions/download-artifact@v4
        with: {pattern: final-compress-*, path: compression_results, merge-multiple: true}
      - name: Calculate preregistered 13-survey headline
        env: {PYTHONPATH: research}
        run: python research/general_seismic_sharded_runner_v2.py aggregate-compression --manifest frozen_plan/general_seismic_v1_effective_manifest.json --epsilon-map epsilon/general_seismic_global_epsilon.json --results compression_results --shard-count "$SHARD_COUNT" --out general_seismic_headline_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FINAL-general-seismic-headline-results
          path: general_seismic_headline_results.json
          if-no-files-found: warn
          retention-days: 90
