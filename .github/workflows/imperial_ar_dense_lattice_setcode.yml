name: Imperial dense lattice AR setcode
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Fetch Imperial record
        run: |
          python - <<'PY'
          import boto3, os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5') == 415030456
          PY
      - name: Run experiment
        run: python research/imperial_ar_dense_lattice_random_covering.py imperial.h5
      - name: Print compact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar_dense_lattice_random_covering.json'))
          for r in d['rows']:
              b=r['best']
              msg=(f"step={b['step']}, bytes={b['bytes']}, bps={b['bps']:.5f}, success={b['success_fraction']:.5f}, "
                   f"gain_same={b['gain_set_vs_same_step_greedy']:.6f}, gain_267={b['gain_set_vs_step267']:.6f}, "
                   f"gain_sz3={b['gain_set_vs_sz3']:.6f}, ratio_2x={b['ratio_to_2x_sz3_target']:.6f}")
              print(f"::notice title=dense-set {r['region']}::{msg}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-dense-lattice-ar-setcode
          path: imperial_ar_dense_lattice_random_covering.json
          if-no-files-found: ignore
          retention-days: 7
