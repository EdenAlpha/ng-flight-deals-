name: Imperial iso-amplitude transport tubes
on:
  pull_request:
    branches: [imperial-valley-frozen-brady-transfer]
permissions: {contents: read}
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake'; k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED)); s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Cover the wavefield with hard-error iso-amplitude transport tubes
        run: python research/imperial_isoamplitude_transport_tubes.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-isoamplitude-transport-tubes
          path: imperial_isoamplitude_transport_tubes.json
          retention-days: 7
