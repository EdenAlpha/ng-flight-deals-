name: eFootball score ownership v5

on:
  push:
    branches: [ efootball-score-wire-bridge-v3-2026-08-24 ]
    paths:
      - '.github/workflows/efootball-score-ownership-v5.yml'

permissions:
  contents: write

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl python3 python3-pip binutils >/dev/null
          python3 -m pip install --break-system-packages -q pyelftools==0.32 capstone==5.0.6
      - name: Download current eFootball native binary
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ef/bundle /tmp/ef/native /tmp/out
          curl -L --fail --retry 5 --retry-delay 2 -A 'Mozilla/5.0' -o /tmp/ef/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          unzip -q /tmp/ef/efootball.xapk -d /tmp/ef/bundle
          NATIVE=$(find /tmp/ef/bundle -type f -name 'config.arm64_v8a.apk' | head -n1)
          test -n "$NATIVE"
          unzip -q "$NATIVE" -d /tmp/ef/native
          sha256sum /tmp/ef/native/lib/arm64-v8a/libUE4.so | tee /tmp/out/libue4_sha256.txt
      - name: Trace score ownership and transport boundary
        run: |
          cat > /tmp/ef/ownership.py <<'PY'
          from pathlib import Path
          from collections import defaultdict, deque
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          import bisect,re

          p=Path('/tmp/ef/native/lib/arm64-v8a/libUE4.so'); raw=p.read_bytes()
          with p.open('rb') as f:
              e=ELFFile(f); text=e.get_section_by_name('.text')
              tb=text.data(); tva=int(text['sh_addr']); tend=tva+len(tb)
              loads=[(int(s['p_vaddr']),int(s['p_offset']),int(s['p_filesz'])) for s in e.iter_segments() if s['p_type']=='PT_LOAD']
              dyn=e.get_section_by_name('.dynsym')
              dyn_names=[s.name for s in dyn.iter_symbols()] if dyn else []
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)

          def vaoff(va):
              for sv,so,fs in loads:
                  if sv<=va<sv+fs:return so+va-sv
          def offva(off):
              for sv,so,fs in loads:
                  if so<=off<so+fs:return sv+off-so
          def cstr(va,n=220):
              o=vaoff(va)
              if o is None:return None
              b=raw[o:o+n].split(b'\0',1)[0]
              if len(b)<3:return None
              return b.decode('utf-8','replace')

          starts=[]; calls=[]
          ins=list(md.disasm(tb,tva))
          for z in ins:
              if z.mnemonic=='stp' and 'x29, x30' in z.op_str and '[sp' in z.op_str: starts.append(z.address)
              if z.mnemonic=='bl':
                  m=re.match(r'#0x([0-9a-f]+)',z.op_str)
                  if m:calls.append((z.address,int(m.group(1),16)))
          starts=sorted(set(starts))
          def fs(a):
              if not(tva<=a<tend):return a
              i=bisect.bisect_right(starts,a)-1
              return starts[i] if i>=0 else a
          def fe(a):
              i=bisect.bisect_right(starts,a)
              return starts[i] if i<len(starts) else tend
          graph=defaultdict(set);rev=defaultdict(set);sites=defaultdict(list)
          for site,dst in calls:
              s=fs(site); d=fs(dst)
              if s!=d:
                  graph[s].add(d);rev[d].add(s);sites[(s,d)].append(site)

          # Discover string VAs and the functions that materialize them via ADRP+ADD.
          needles=[
            'HOME_SCORE','AWAY_SCORE','GAME_PHASE','END_REASON','ROOM_GAME_PHASE_END','GameplayFinished','ResultPresentation','SendServerMatchEnd',
            'CMD_ADD_SCORE','CMD_GET_GAME_RESULT','CMD_SET_GAME_RESULT','CmdAddScore.php','CmdGetGameResult.php','CmdSetGameResult.php',
            'pes-custom-encrypt','SessionKeyEncryptionAlgorithm','KeyExchangeEncryptionAlgorithm','RP_RELIABILITY','RP_DATA_CAST','RP_JSON_DATA','P2P_LOW_LEVEL','P2P_HIGH_LEVEL'
          ]
          needle_vas=defaultdict(list)
          for nd in needles:
              b=nd.encode(); pos=0
              while True:
                  j=raw.find(b,pos)
                  if j<0:break
                  v=offva(j)
                  if v is not None:needle_vas[nd].append(v)
                  pos=j+1
          target_by_va={v:nd for nd,vals in needle_vas.items() for v in vals}
          refs=defaultdict(list); fn_strings=defaultdict(set)
          # Scan locally for adrp reg,page + add same reg,reg,#imm.
          for i,z in enumerate(ins):
              if z.mnemonic!='adrp':continue
              m=re.match(r'(x\d+), #0x([0-9a-f]+)',z.op_str)
              if not m:continue
              reg=m.group(1);page=int(m.group(2),16)
              for q in ins[i+1:i+7]:
                  if q.address-z.address>24:break
                  if q.mnemonic!='add':continue
                  m2=re.match(rf'{reg}, {reg}, #0x([0-9a-f]+)',q.op_str)
                  if not m2:continue
                  va=page+int(m2.group(1),16)
                  nd=target_by_va.get(va)
                  if nd:
                      f=fs(z.address); refs[nd].append((z.address,q.address,f)); fn_strings[f].add(nd)
                  break

          known={
            'result_serializer_A':fs(0x7d4724c),'result_serializer_B':fs(0x7d5b638),'add_score_handler':fs(0x75adb2c),
            'command_registry':fs(0x7d2c954),'crypto_config':fs(0x7c088e4),'crypto_transformer':fs(0x7c0c670),
            'transport_parent':fs(0x7c0dca0),'p2p_reliability':fs(0x7ceafc4),'reliability_parser':fs(0x7cf85d4)
          }
          out=[]
          out.append('=== STRING OWNERS ===')
          for nd in needles:
              rr=refs.get(nd,[])
              out.append(f'{nd}: '+(', '.join(f'fn=0x{f:x}@0x{a:x}' for a,b,f in rr[:30]) or 'NO_CODE_XREF'))

          out.append('\n=== KNOWN FUNCTION NORMALIZATION ===')
          for n,a in known.items():out.append(f'{n}=0x{a:x} end=0x{fe(a):x} strings={sorted(fn_strings.get(a,set()))}')

          def path(srcs,dsts,maxd=14):
              q=deque((s,[s]) for s in srcs); seen=set(srcs)
              while q:
                  n,pth=q.popleft()
                  if len(pth)-1>=maxd:continue
                  for z in graph.get(n,()):
                      if z in pth:continue
                      np=pth+[z]
                      if z in dsts:return np
                      if z not in seen:seen.add(z);q.append((z,np))
              return None
          def fmtpath(pth):
              if not pth:return 'NONE'
              inv={v:k for k,v in known.items()}
              return ' -> '.join(f'{inv.get(x,"fn")}@0x{x:x}' for x in pth)

          score_funcs={f for f,s in fn_strings.items() if s & {'HOME_SCORE','AWAY_SCORE','GAME_PHASE','END_REASON'}} | {known['result_serializer_A'],known['result_serializer_B']}
          server_funcs={f for f,s in fn_strings.items() if s & {'CMD_ADD_SCORE','CMD_GET_GAME_RESULT','CMD_SET_GAME_RESULT','CmdAddScore.php','CmdGetGameResult.php','CmdSetGameResult.php','SendServerMatchEnd'}} | {known['add_score_handler'],known['command_registry']}
          p2p_funcs={f for f,s in fn_strings.items() if s & {'P2P_LOW_LEVEL','P2P_HIGH_LEVEL','RP_RELIABILITY','RP_DATA_CAST','RP_JSON_DATA','pes-custom-encrypt','SessionKeyEncryptionAlgorithm','KeyExchangeEncryptionAlgorithm'}} | {known['crypto_config'],known['crypto_transformer'],known['transport_parent'],known['p2p_reliability'],known['reliability_parser']}

          out.append('\n=== DECISIVE DIRECT-CALL PATH TESTS ===')
          out.append('score -> server: '+fmtpath(path(score_funcs,server_funcs)))
          out.append('server -> score: '+fmtpath(path(server_funcs,score_funcs)))
          out.append('score -> p2p/crypto: '+fmtpath(path(score_funcs,p2p_funcs)))
          out.append('p2p/crypto -> score: '+fmtpath(path(p2p_funcs,score_funcs)))

          # Callsite neighborhoods around every direct caller of the two result serializers.
          out.append('\n=== RESULT SERIALIZER CALLSITES ===')
          for label in ('result_serializer_A','result_serializer_B'):
              target=known[label]
              out.append(f'-- {label} 0x{target:x} --')
              for caller in sorted(rev.get(target,())):
                  out.append(f'caller=0x{caller:x} strings={sorted(fn_strings.get(caller,set()))}')
                  for site in sites[(caller,target)]:
                      lo=max(tva,site-80);hi=min(tend,site+180)
                      for z in md.disasm(tb[lo-tva:hi-tva],lo):out.append(f'  0x{z.address:x}: {z.mnemonic:8} {z.op_str}')

          def dumpfn(label,a,limit=0x5000):
              end=min(fe(a),a+limit)
              out.append(f'\n=== {label} 0x{a:x}-0x{end:x} ===')
              body=list(md.disasm(tb[a-tva:end-tva],a))
              for i,z in enumerate(body):
                  extra=''
                  if z.mnemonic=='adrp':
                      m=re.match(r'(x\d+), #0x([0-9a-f]+)',z.op_str)
                      if m:
                          reg=m.group(1);page=int(m.group(2),16)
                          for q in body[i+1:i+7]:
                              m2=re.match(rf'{reg}, {reg}, #0x([0-9a-f]+)',q.op_str) if q.mnemonic=='add' else None
                              if m2:
                                  s=cstr(page+int(m2.group(1),16))
                                  if s and len(s)<160:extra=' ; STR='+repr(s)
                                  break
                  out.append(f'0x{z.address:x}: {z.mnemonic:9} {z.op_str}{extra}')

          dumpfn('RESULT_SERIALIZER_B',known['result_serializer_B'],0x3800)
          dumpfn('CRYPTO_TRANSFORMER',known['crypto_transformer'],0x2800)

          # Find functions that own both a score/server concept and P2P/crypto concept.
          out.append('\n=== STRING-LEVEL OWNERSHIP INTERSECTIONS ===')
          for f,s in sorted(fn_strings.items()):
              scoreish=s & {'HOME_SCORE','AWAY_SCORE','GAME_PHASE','END_REASON','CMD_ADD_SCORE','CMD_GET_GAME_RESULT','CMD_SET_GAME_RESULT','CmdAddScore.php','CmdGetGameResult.php','CmdSetGameResult.php','SendServerMatchEnd'}
              p2pish=s & {'P2P_LOW_LEVEL','P2P_HIGH_LEVEL','RP_RELIABILITY','RP_DATA_CAST','RP_JSON_DATA','pes-custom-encrypt','SessionKeyEncryptionAlgorithm','KeyExchangeEncryptionAlgorithm'}
              if scoreish and p2pish:out.append(f'fn=0x{f:x} SCORE={sorted(scoreish)} P2P={sorted(p2pish)}')

          out.append('\n=== DYNAMIC NETWORK/CRYPTO SYMBOLS ===')
          for n in dyn_names:
              if re.search(r'(^|_)(send|recv|write|read|socket|connect|ssl|crypto|evp|aes|chacha|encrypt|decrypt)',n,re.I):out.append(n)

          out.append('\n=== VERDICT ===')
          sp=path(score_funcs,p2p_funcs); ss=path(score_funcs,server_funcs)
          if sp:
              out.append('P2P_SCORE_STATIC_BRIDGE=FOUND')
              out.append('A direct static call path connects recovered score/result ownership to the P2P/crypto family; inspect exact callsites above before deriving bytes.')
          else:
              out.append('P2P_SCORE_STATIC_BRIDGE=NOT_FOUND')
              out.append('No direct static call bridge from recovered score/result ownership into the known P2P/crypto family within 14 calls.')
          if ss:
              out.append('SERVER_RESULT_BRIDGE=FOUND')
          else:
              out.append('SERVER_RESULT_BRIDGE=NOT_FOUND')
          out.append('Interpretation: if the server bridge is present while P2P remains absent, final score is likely application state/result serialization rather than a dedicated score field on the live P2P wire. That makes the one-shot terminal-triggered visual/UI read the correct production fallback while indirect-call/vtable analysis continues.')

          Path('/tmp/out/efootball-score-ownership-v5.txt').write_text('\n'.join(out))
          print('\n'.join(out[:900]))
          PY
          python3 /tmp/ef/ownership.py
      - name: Commit report
        run: |
          set -euo pipefail
          mkdir -p analysis-output
          cp /tmp/out/efootball-score-ownership-v5.txt analysis-output/
          cp /tmp/out/libue4_sha256.txt analysis-output/efootball-score-ownership-v5.sha256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis-output/efootball-score-ownership-v5.txt analysis-output/efootball-score-ownership-v5.sha256.txt
          git commit -m 'Add eFootball score ownership transport trace'
          git push
