name: Imperial near2 ZSM lattice search
on:
  pull_request:
    branches: [imperial-near2eps-learned-zsm-fullhard]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Search coordinate spacing under actual ZSM rate
        run: python research/imperial_near2eps_zsm_lattice_search.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_near2eps_zsm_lattice_search.json'))
          print(f"::notice title=full-hard ZSM lattice::learned={d['best_learned_bytes']} B, AR32+ZSM={d['historical_ar32_zsm_bytes']} B, gain={d['gain_vs_historical_ar32_zsm']:.6f}x")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-near2eps-zsm-lattice-search
          path: imperial_near2eps_zsm_lattice_search.json
          if-no-files-found: ignore
          retention-days: 7
