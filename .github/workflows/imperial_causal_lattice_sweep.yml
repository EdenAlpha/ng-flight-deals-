name: Imperial causal lattice sweep
on:
  pull_request:
    branches: [imperial-causal-aware-compact-nova]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Sweep legal lattice spacing under causal address search
        run: python research/imperial_causal_lattice_sweep.py imperial.h5
      - name: Surface exact sweep winner
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_causal_lattice_sweep.json'));b=d['best'];a=d['compact_ar32'];level='notice' if b['bytes']<a['bytes'] else 'warning'
          print(f"::{level} title=lattice-sweep hard::h/eps={b['h_factor']}, NOVA={b['bytes']} B, compactAR32={a['bytes']} B, delta={b['delta_vs_compact_ar32']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-causal-lattice-sweep
          path: imperial_causal_lattice_sweep.json
          if-no-files-found: ignore
          retention-days: 7
