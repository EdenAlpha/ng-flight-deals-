name: Kahu head Gaussian distillation v1

on:
  pull_request:
    branches: [kahu-head-dissection-v1]
    paths:
      - 'research/kahu_head_gaussian_distill_v1.py'
      - '.github/workflows/kahu_head_gaussian_distill_v1.yml'
  workflow_dispatch:

env:
  BENCHMARK_DEFINITION_SHA: 9b304e262182caa29a2c93e7e74e09ccb5715e92

jobs:
  gaussian-distill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: |
          pip install --quiet numpy boto3 pysz zstandard brotli scikit-learn
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize frozen benchmark manifest
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_manifest.json
      - name: Distill Gaussian scale law
        env: {PYTHONPATH: research}
        run: |
          python research/kahu_head_gaussian_distill_v1.py \
            --manifest frozen_manifest.json \
            --eps benchmarks/migrated_volume_global_eps_v1.json \
            --out kahu_head_gaussian_distill_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kahu-head-gaussian-distill-v1
          path: kahu_head_gaussian_distill_v1.json
          if-no-files-found: warn
          retention-days: 30
