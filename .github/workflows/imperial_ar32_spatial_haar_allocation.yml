name: Imperial AR32 spatial Haar allocation
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py pysz boto3 zstandard
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run Haar innovation pilot
        run: python research/imperial_ar32_spatial_haar_allocation.py imperial.h5
      - name: Surface compact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_spatial_haar_allocation.json'))
          for r in d['rows']:
              b=r['best'];print(f"::notice title=Haar allocation {r['region']}::g={b['g']} {b['label']}, bps={b['bps']:.5f}, step267={r['step267_bps']:.5f}, SZ3={r['sz3_bps']:.5f}, gain267={b['gain_vs_step267']:.6f}, gainSZ3={b['gain_vs_sz3']:.6f}, ratio2x={b['ratio_to_2x_target']:.6f}, steps={b['level_steps_root_then_fine_to_coarse']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-ar32-spatial-haar-allocation
          path: imperial_ar32_spatial_haar_allocation.json
          if-no-files-found: ignore
          retention-days: 7
