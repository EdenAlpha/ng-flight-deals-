name: Imperial AR32 Bayesian tuned activity

on:
  pull_request:
    paths:
      - 'research/imperial_ar32_bayesian_tuned_activity.py'
      - '.github/workflows/imperial_ar32_bayesian_tuned_activity.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run tuned Bayesian activity gate
        run: python research/imperial_ar32_bayesian_tuned_activity.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_bayesian_tuned_activity.json'))
          for r in d['rows']:
              t=r['tuned'];level='notice' if t['gain_vs_w8_mixer']>1 else 'warning'
              print(f"::{level} title=tuned-mixer {r['region']}::W={t['activity_window']}, bps={t['bps']:.5f}, W8={r['control_w8']['bps']:.5f}, baseline={r['baseline_bps']:.5f}, gainW8={t['gain_vs_w8_mixer']:.6f}, gainAR={t['gain_vs_baseline']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-bayesian-tuned-activity
          path: imperial_ar32_bayesian_tuned_activity.json
          retention-days: 7
