name: General seismic full frozen benchmark

on:
  workflow_dispatch:

permissions: {contents: read}

env:
  BENCHMARK_DEFINITION_SHA: 9b304e262182caa29a2c93e7e74e09ccb5715e92

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet boto3
      - name: Fetch the exact frozen benchmark definition
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_benchmark_manifest.json
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1_execution_amendments.json" > frozen_execution_amendments.json
          git show "$BENCHMARK_DEFINITION_SHA:research/general_seismic_v1_preflight.py" > frozen_preflight.py
          echo "PINNED_BENCHMARK_SHA=$BENCHMARK_DEFINITION_SHA"
      - name: Materialize pinned pre-result execution amendments
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open('frozen_benchmark_manifest.json'))
          a=json.load(open('frozen_execution_amendments.json'))
          for d in m['datasets']:
              if d['id'] in a.get('dataset_overrides',{}):d.update(a['dataset_overrides'][d['id']])
          m['execution_amendment']=a
          m['benchmark_definition_sha']=os.environ['BENCHMARK_DEFINITION_SHA']
          json.dump(m,open('general_seismic_v1_effective_manifest.json','w'),indent=2)
          PY
      - name: Resolve exact frozen objects and waveform members
        run: python frozen_preflight.py general_seismic_v1_effective_manifest.json
      - name: Require all 13 frozen surveys
        run: |
          python - <<'PY'
          import json,os
          x=json.load(open('general_seismic_v1_preflight.json'))
          assert len(x['datasets'])==13,x
          bad=[r for r in x['datasets'] if r['status']!='ok']
          assert not bad,bad
          print('PINNED_SHA',os.environ['BENCHMARK_DEFINITION_SHA'],'FROZEN_SURVEYS',len(x['datasets']),'SELECTED_GB',sum(r['selected_gb'] for r in x['datasets']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: general-seismic-frozen-plan
          path: |
            general_seismic_v1_effective_manifest.json
            general_seismic_v1_preflight.json
          retention-days: 30

  survey:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        dataset:
          - land_soda_lake_2010
          - land_teapot_dome_3d
          - land_san_emidio_2021
          - land_crescent_valley_2016
          - marine_waka_3d
          - marine_parihaka_3d
          - marine_opunake_3d
          - marine_tui_3d
          - marine_kahu_3d
          - das_imperial_valley_2020
          - das_porotomo_brady_dash
          - das_forge_neubrex_2024
          - das_egs_collab_exp2
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: general-seismic-frozen-plan
          path: frozen_plan
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install common numeric/codec readers
        run: pip install --quiet numpy zstandard pybind11 boto3 h5py 's3fs<2027' segyio pysz obspy
      - name: Compile bit-exact ZSM backend
        run: |
          EXT=$(python3-config --extension-suffix)
          c++ -O3 -march=x86-64 -shared -std=c++17 -fPIC $(python -m pybind11 --includes) research/general_seismic_fast_zsm.cpp -o research/general_seismic_fast_zsm${EXT}
      - uses: actions/setup-java@v4
        if: matrix.dataset == 'land_san_emidio_2021'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official GFZ DataCube decoder
        if: matrix.dataset == 'land_san_emidio_2021'
        run: |
          curl -fL --retry 4 -o gipptools.tar.gz https://media.gfz.de/gfz/sec22/gipptools/gipptools-2026.167-unix.tar.gz
          mkdir gipptools
          tar -xzf gipptools.tar.gz -C gipptools --strip-components=1
          CUBE2MSEED=$(find "$PWD/gipptools" -type f -name cube2mseed | head -1)
          test -n "$CUBE2MSEED"
          chmod +x "$CUBE2MSEED"
          echo "CUBE2MSEED=$CUBE2MSEED" >> "$GITHUB_ENV"
      - name: Run complete two-pass survey benchmark
        env:
          PYTHONPATH: research
        run: |
          mkdir -p results
          python research/general_seismic_benchmark_runner.py survey \
            --manifest frozen_plan/general_seismic_v1_effective_manifest.json \
            --preflight frozen_plan/general_seismic_v1_preflight.json \
            --config benchmarks/general_seismic_codec_portfolio_v1.json \
            --dataset '${{ matrix.dataset }}' \
            --out 'results/${{ matrix.dataset }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survey-${{ matrix.dataset }}
          path: results/${{ matrix.dataset }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: survey
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy boto3
      - uses: actions/download-artifact@v4
        with:
          pattern: survey-*
          path: survey_results
          merge-multiple: true
      - name: Require 13 completed surveys and calculate headline statistics
        env: {PYTHONPATH: research}
        run: python research/general_seismic_benchmark_runner.py aggregate --results survey_results --out general_seismic_headline_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-seismic-headline-results
          path: general_seismic_headline_results.json
          if-no-files-found: warn
          retention-days: 90
