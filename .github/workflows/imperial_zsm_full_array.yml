name: Imperial ZSM full array

on:
  pull_request:
    paths:
      - 'research/imperial_zsm_full_array.py'
      - '.github/workflows/imperial_zsm_full_array.yml'
  workflow_dispatch:

jobs:
  blocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slot: [0,1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run ZSM full-array slot
        run: python research/imperial_zsm_full_array.py imperial.h5 ${{ matrix.slot }}
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-zsm-full-${{ matrix.slot }}
          path: imperial_zsm_full_${{ matrix.slot }}.json
          retention-days: 7

  aggregate:
    needs: blocks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py
      - uses: actions/download-artifact@v4
        with:
          pattern: imperial-zsm-full-*
          merge-multiple: true
      - name: Aggregate full array
        run: python research/imperial_zsm_full_array.py aggregate
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_zsm_full_aggregate.json'))
          print(f"::notice title=ZSM full-array::bytes={d['zsm_bytes']}, bps={d['zsm_bps']:.6f}, activity={d['audited_activity_bytes']}, gainActivity={d['gain_zsm_vs_activity']:.6f}, gainSZ3={d['gain_zsm_vs_sz3']:.6f}, saved={d['bytes_saved_vs_activity']}, windows={d['window_counts']}, stillNeed={100*d['fraction_reduction_still_needed']:.2f}%")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-zsm-full-aggregate
          path: imperial_zsm_full_aggregate.json
          retention-days: 7
