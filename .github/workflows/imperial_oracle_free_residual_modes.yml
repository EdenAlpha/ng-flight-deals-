name: Imperial oracle free residual modes
on:
  pull_request:
    branches: [imperial-dyadic-shared-resonator]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: python -c "import boto3;from botocore import UNSIGNED;from botocore.config import Config;boto3.client('s3',config=Config(signature_version=UNSIGNED)).download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')"
      - name: Give residual spatial modes to the decoder for free
        run: python research/imperial_oracle_free_residual_modes.py imperial.h5
      - name: Surface oracle crossing
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_oracle_free_residual_modes.json'))
          print(f"::notice title=Free SVD modes aggregate::first_k={d['first_aggregate_free_modes_crossing_2x']}")
          for t in d['tiles']:
            print(f"::notice title=Free modes {t['tile']}::actual_k={t['first_free_modes_crossing_actual_bytes']}, entropy_k={t['first_free_modes_crossing_zero_order_entropy']}, target={t['strict_2x_target_bps']:.5f}")
          for r in d['aggregate']:
            if r['free_modes'] in (0,8,16,32,48,64,80,96,112,120,124,126,127,128): print(f"::notice title=oracle k={r['free_modes']}::bps={r['charged_bps']:.5f}, gainSZ3={r['gain_vs_sz3']:.5f}, crosses={r['crosses_2x_target']}, free_energy={r['mean_free_mode_energy_fraction']:.5f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-oracle-free-residual-modes
          path: imperial_oracle_free_residual_modes.json
          retention-days: 7
