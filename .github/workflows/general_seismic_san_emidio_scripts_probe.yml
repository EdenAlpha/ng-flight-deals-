name: General seismic San Emidio official-reader probe

on:
  pull_request:
    branches: [ general-seismic-benchmark-v1 ]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  official-reader-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch official WHOLESCALE raw-to-level1 scripts
        run: |
          python - <<'PY'
          import urllib.request
          u='https://gdr.openei.org/files/1463/scripts.zip'
          urllib.request.urlretrieve(u,'san_emidio_official_scripts.zip')
          PY
          unzip -q san_emidio_official_scripts.zip -d san_scripts
          find san_scripts -type f -maxdepth 6 -print | sort | tee san_emidio_script_files.txt
      - name: Surface only source and README text
        run: |
          python - <<'PY'
          import pathlib,json
          root=pathlib.Path('san_scripts');out={}
          for p in sorted(root.rglob('*')):
              if p.is_file() and (p.suffix.lower() in ('.py','.txt','.md') or 'readme' in p.name.lower()):
                  try:s=p.read_text(errors='replace')
                  except Exception:continue
                  out[str(p)]=s
                  print('\n===== '+str(p)+' =====\n')
                  print(s[:30000])
          json.dump(out,open('san_emidio_official_scripts.json','w'),indent=2)
          assert out,'no readable official scripts'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: san-emidio-official-reader-scripts
          path: |
            san_emidio_script_files.txt
            san_emidio_official_scripts.json
          retention-days: 14
