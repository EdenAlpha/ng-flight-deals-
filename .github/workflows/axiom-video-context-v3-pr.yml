name: AXIOM conditional-PPMd video benchmark
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xz-utils zstd brotli p7zip-full git
          python3 -m pip install -q numpy
      - name: Run conditional PPMd benchmark
        run: python3 video_context_v3_ppmd.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: axiom-video-context-v3-results
          path: video_context_v3_results.json
          retention-days: 7
