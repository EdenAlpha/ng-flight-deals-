name: AXIOM conditional video frontier
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xz-utils zstd brotli p7zip-full git
          python3 -m pip install -q numpy
      - name: Run conditional PPMd on natural video
        run: python3 video_context_v3_ppmd.py
      - name: Run context-v2 on deterministic hard video
        run: python3 video_context_hard_wrapper.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: axiom-video-frontier-results
          path: |
            video_context_v3_results.json
            video_context_hard_results.json
          retention-days: 7
