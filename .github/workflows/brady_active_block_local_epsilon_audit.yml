name: Brady active-block local epsilon audit
on:
  pull_request:
    branches: [imperial-valley-frozen-brady-transfer]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz
      - run: curl -L --fail --retry 5 --retry-delay 2 -o brady.sgy 'https://gdr.openei.org/files/849/PoroTomo_iDAS16043_160325140118.sgy'
      - run: python research/brady_active_block_local_epsilon_audit.py brady.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: brady-active-block-local-epsilon-audit
          path: brady_active_block_local_epsilon_audit.json
          retention-days: 7
