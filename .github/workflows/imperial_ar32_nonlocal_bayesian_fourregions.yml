name: Imperial AR32 nonlocal Bayesian four regions

on:
  pull_request:
    paths:
      - 'research/imperial_ar32_nonlocal_bayesian_fourregions.py'
      - '.github/workflows/imperial_ar32_nonlocal_bayesian_fourregions.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run four-regime nonlocal Bayesian stack
        run: python research/imperial_ar32_nonlocal_bayesian_fourregions.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_nonlocal_bayesian_fourregions.json'))
          for r in d['rows']:
              level='notice' if r['gain_stack_vs_baseline']>1 else 'warning'
              print(f"::{level} title=nonlocal+mixer {r['region']}::bps={r['nonlocal_mixer_bps']:.5f}, baseline={r['baseline_bps']:.5f}, mixer={r['baseline_mixer_bps']:.5f}, nonlocal={r['nonlocal_normal_bps']:.5f}, SZ3={r['sz3_bps']:.5f}, gainBase={r['gain_stack_vs_baseline']:.6f}, gainSZ3={r['gain_stack_vs_sz3']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-nonlocal-bayesian-fourregions
          path: imperial_ar32_nonlocal_bayesian_fourregions.json
          retention-days: 7
