name: Imperial compact NOVA container
on:
  pull_request:
    branches: [imperial-generator-causal-codesign]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Build parse and independently replay compact NOVA byte stream
        run: python research/imperial_compact_nova_container_fixed.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_compact_nova_container.json'));r=d['compact']
          level='notice' if r['bytes']<d['ar32']['bytes'] else 'warning'
          print(f"::{level} title=compact-NOVA hard::bytes={r['bytes']} B, AR32={d['ar32']['bytes']} B, delta={r['delta_vs_ar32']} B, SZ3={d['sz3']['bytes']} B, model={r['model_bytes']} B, defect={r['defect_bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-compact-nova-container
          path: imperial_compact_nova_container.json
          if-no-files-found: ignore
          retention-days: 7
