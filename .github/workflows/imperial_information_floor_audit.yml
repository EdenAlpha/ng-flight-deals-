name: Imperial information floor audit
on:
  pull_request:
    branches: [imperial-huber-ar32-component-zsm-gps]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3, os, hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Measure information floor diagnostics
        run: python research/imperial_information_floor_audit.py imperial.h5
      - name: Measure held-out quantized context rate
        run: python research/imperial_quantized_context_floor.py imperial.h5
      - name: Surface audit summary
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_information_floor_audit.json'))
          s=d['summary']
          q=s['best_actual_scalar_quantized_zstd']
          c=s['best_causal_residual_h0']
          o=s['noncausal_oracle_residual_h0']
          e=json.load(open('imperial_quantized_context_floor.json'))
          bc=e['best_causal']; bo=e['best_oracle']
          print(f"::notice title=Imperial information-floor audit::current={s['current_bps']:.4f} bps target2x={s['target_2x_bps']:.4f} bps scalar_actual={q['zstd_bps']:.4f} bps causal_H0={c['residual_h0_bps']:.4f} oracle_H0={o['residual_h0_bps']:.4f} ctx_causal={bc['heldout_bps']:.4f} ctx_oracle={bo['heldout_bps']:.4f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-information-floor-audit
          path: |
            imperial_information_floor_audit.json
            imperial_quantized_context_floor.json
          if-no-files-found: ignore
          retention-days: 7
