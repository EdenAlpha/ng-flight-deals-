name: Imperial super-oracle legal-set mass

on:
  pull_request:
    paths:
      - 'research/imperial_super_oracle_legal_set_mass.py'
      - '.github/workflows/imperial_super_oracle_legal_set_mass.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Sum all legal sequence probability mass
        run: python research/imperial_super_oracle_legal_set_mass.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_super_oracle_legal_set_mass.json'))
          for r in d['rows']:
              b=r['best']
              print(f"::notice title=legal-set super ceiling {r['region']}::step={b['step']}, setMass={b['legal_set_mass_bps']:.5f} bps, nearestModel={b['nearest_model_bps']:.5f}, MAP={b['map_model_bps']:.5f}, super267={r['super_oracle_step267_8ch_bps']:.5f}, target2x128={r['target_2x_128ch_bps']:.5f}, ratio2x128={b['ratio_to_128ch_2x_target']:.5f}, legalMean={b['mean_legal_states']:.3f}, multi={b['multi_fraction']:.3f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-super-oracle-legal-set-mass
          path: imperial_super_oracle_legal_set_mass.json
          retention-days: 7
