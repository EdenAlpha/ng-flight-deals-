name: Imperial hidden clock and cyclostationarity probe
on:
  pull_request:
    branches: [imperial-valley-frozen-brady-transfer]
permissions: {contents: read}
jobs:
  clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard boto3
      - name: Download exact Imperial Valley HDF5 record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Patch final closed-HDF5 metadata access
        run: |
          python - <<'PY'
          p='research/imperial_hidden_clock_cyclostationary.py'
          s=open(p).read();s=s.replace("'shape':list(d.shape),'dtype':str(d.dtype)","'shape':[30000,6912],'dtype':'int16'")
          open(p,'w').write(s)
          PY
      - name: Search every temporal lag for hidden clock structure
        run: python research/imperial_hidden_clock_cyclostationary.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-hidden-clock-cyclostationary
          path: imperial_hidden_clock_cyclostationary.json
          retention-days: 7
