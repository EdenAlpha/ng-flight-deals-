name: eFootball c670 APS diagnostics

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: efootball-c670-apsdiag-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apsdiag:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl python3 python3-pip >/dev/null
          python3 -m pip install --break-system-packages -q pyelftools==0.32 capstone==5.0.6
      - name: Download current eFootball arm64 binary (runner-side)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ef/bundle /tmp/ef/native /tmp/out
          curl -L --fail --retry 5 --retry-delay 2 -A 'Mozilla/5.0' -o /tmp/ef/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          unzip -q /tmp/ef/efootball.xapk -d /tmp/ef/bundle
          NATIVE=$(find /tmp/ef/bundle -type f -name 'config.arm64_v8a.apk' | head -n1)
          test -n "$NATIVE"
          unzip -q "$NATIVE" -d /tmp/ef/native
          sha256sum /tmp/ef/native/lib/arm64-v8a/libUE4.so | tee /tmp/out/libue4_sha256.txt
      - name: Diagnose APS stream structure
        run: |
          cat > /tmp/ef/aps_diag.py <<'PY'
          import struct,sys
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          p=Path('/tmp/ef/native/lib/arm64-v8a/libUE4.so')
          out=[]
          with p.open('rb') as f:
              e=ELFFile(f)
              secs=[(s.name,s.header['sh_type'],s.data(),s.header) for s in e.iter_sections() if s.header['sh_type'] in (0x60000002,4)]
          def sleb(data,pos):
              r=0;sh=0
              while True:
                  b=data[pos];pos+=1
                  r|=(b&0x7f)<<sh;sh+=7
                  if not b&0x80:
                      if b&0x40:r-=(1<<sh)
                      return r,pos

          for name,styp,d,hdr in secs:
              out.append(f'SECTION {name} type={hex(styp)} size={len(d)} sh_info={hdr["sh_info"]} magic={d[:4]!r}')
          d=[x[2] for x in secs if x[1]==0x60000002][0]

          pos=4
          toks=[]
          q=pos
          for i in range(120):
              v,q=sleb(d,q);toks.append(v)
          out.append(f'FIRST_120_SLEB_TOKENS_AFTER_MAGIC: {toks}')

          TARGET=0x7c0c670
          MAXOFF=p.stat().st_size

          def decode(order):
              # order: tuple of (size,flags) reading sequence names 'sf' or 'fs'
              pos=4
              count,pos=sleb(d,pos)
              res=[];offset=0;info=0;addend=0;n=0;badoff=0
              G_OD,G_I,G_AD=1,2,4
              try:
                  while n<count:
                      if order=='sf':
                          gsize,pos=sleb(d,pos);gflags,pos=sleb(d,pos)
                      else:
                          gflags,pos=sleb(d,pos);gsize,pos=sleb(d,pos)
                      gd=None
                      if gflags&G_OD:gd,pos=sleb(d,pos)
                      if gflags&G_I:info,pos=sleb(d,pos)
                      if gflags&G_AD:addend+=sleb(d,pos)[0]
                      for _ in range(gsize):
                          if gflags&G_OD:offset+=gd
                          else:
                              dl,pos=sleb(d,pos);offset+=dl
                          if not gflags&G_I:info,pos=sleb(d,pos)
                          if not gflags&G_AD:addend+=sleb(d,pos)[0]
                          n+=1
                          if not (0<=offset<MAXOFF):badoff+=1
                          if addend==TARGET:res.append((offset,info&0xffffffff))
                  return count,badoff,res
              except Exception as ex:
                  return n,-1,res

          for order in ('sf','fs'):
              cnt,bad,res=decode(order)
              out.append(f'ORDER_{order}: count={cnt} bad_offsets={bad} target_slots={[ (hex(a),t) for a,t in res[:20]]}')

          txt='\n'.join(out)
          Path('/tmp/out/c670_apsdiag.txt').write_text(txt)
          print(txt[:3000])
          PY
          python3 /tmp/ef/aps_diag.py
      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: efootball-c670-apsdiag
          path: /tmp/out/
          retention-days: 7
