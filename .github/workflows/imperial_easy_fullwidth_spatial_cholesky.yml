name: Imperial easy fullwidth spatial Cholesky
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Fetch Imperial
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run full-length spatial Cholesky gate
        run: python research/imperial_easy_fullwidth_spatial_cholesky.py imperial.h5
      - name: Surface result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_easy_fullwidth_spatial_cholesky.json'));b=d['best']
          print(f"::notice title=fullwidth spatial easy::order={b['order']}, width={b['width']}, bps={b['bps']:.5f}, step267={d['step267_bps']:.5f}, gain={b['gain_vs_step267']:.6f}, gainSZ3={b['gain_vs_sz3']:.6f}, ratio2x={b['ratio_to_2x']:.6f}, model={b['model_bytes']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-easy-fullwidth-spatial-cholesky
          path: imperial_easy_fullwidth_spatial_cholesky.json
          retention-days: 7