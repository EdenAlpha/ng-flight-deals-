name: Imperial AR32 activity reset arithmetic

on:
  pull_request:
    paths:
      - 'research/imperial_ar32_activity_reset_arithmetic.py'
      - '.github/workflows/imperial_ar32_activity_reset_arithmetic.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run activity probability reset gate
        run: python research/imperial_ar32_activity_reset_arithmetic.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_activity_reset_arithmetic.json'))
          for r in d['rows']:
              b=r['best'];level='notice' if b['gain_vs_no_reset_activity']>1 else 'warning'
              print(f"::{level} title=activity-reset {r['region']}::W={b['activity_window']}, reset={b['reset_samples']}, bps={b['bps']:.5f}, noReset={r['no_reset_activity']['bps']:.5f}, baseline={r['baseline_bps']:.5f}, gainReset={b['gain_vs_no_reset_activity']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-activity-reset-arithmetic
          path: imperial_ar32_activity_reset_arithmetic.json
          retention-days: 7
