name: Imperial GCA phase automaton fast
on:
  pull_request:
    branches: [imperial-gca-phase-automaton]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run compiled finite-state gate
        run: PYTHONPATH=research python research/imperial_gca_phase_automaton_fast.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_gca_phase_automaton_fast.json'))
          print(f"::notice title=Fast phase automaton::winner={d['winner']} bytes={d['bytes']} incumbent={d['incumbent_bytes']} delta={d['delta_vs_incumbent']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-gca-phase-automaton-fast
          path: imperial_gca_phase_automaton_fast.json
          if-no-files-found: ignore
          retention-days: 7
