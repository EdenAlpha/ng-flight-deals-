name: General seismic SEG-D v2 reader gate

on:
  pull_request:
    branches: [ general-seismic-benchmark-v1 ]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  segd-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy boto3 zstandard pysz
      - name: Download frozen Crescent SEG-D rev2 example
        run: |
          python - <<'PY'
          import boto3
          from botocore import UNSIGNED
          from botocore.config import Config
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s3.download_file('gdr-data-lake','wholescale/subter_seismic/crescent_valley/1359.sgd','crescent.sgd')
          PY
      - name: Parse strict rev2 boundaries and run real codec mechanics gate
        env:
          PYTHONPATH: research
        run: |
          python - <<'PY'
          import json,numpy as np
          from general_seismic_segd_rev2 import SegdRev2,segd_rev2_panels
          from general_seismic_codec_portfolio import load_config,encode_portfolio,decode_portfolio
          from general_seismic_numeric_io import matched_sz3
          s=SegdRev2('crescent.sgd');summary=s.summary();print(json.dumps(summary,indent=2))
          assert 1.0 <= summary['revision'] < 3.0,summary
          assert summary['format_code'] in (8036,8038,8058,8080),summary
          assert 0 <= summary['trailing_bytes'] < summary['file_size'],summary
          P,meta=next(segd_rev2_panels('crescent.sgd',time_limit=4096,max_panels=1))
          assert P.ndim==2 and P.size>0 and np.all(np.isfinite(P)),(P.shape,P.dtype)
          eps=.1*float(P.astype(np.float64).std());assert eps>0,eps
          cfg=load_config('benchmarks/general_seismic_codec_portfolio_v1.json')
          blob,pm=encode_portfolio(P,eps,cfg,bool(meta['source_integer']));R=decode_portfolio(blob)
          me=float(np.max(np.abs(P.astype(np.float64)-np.asarray(R,np.float64))));assert me<=eps,(me,eps)
          szb,szme=matched_sz3(P,eps)
          out={'summary':summary,'panel_meta':meta,'shape':list(P.shape),'eps':eps,'selected_id':pm['selected_id'],'selected_engine':pm['selected_engine'],'portfolio_bytes':len(blob),'portfolio_bps':8*len(blob)/P.size,'portfolio_maxerr':me,'sz3_bytes':szb,'sz3_bps':8*szb/P.size,'sz3_maxerr':szme,'gain_sz3_over_portfolio':szb/len(blob),'scope':'Crescent rev2 mechanics gate only; not headline benchmark'}
          json.dump(out,open('segd_v2_gate.json','w'),indent=2);print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: general-seismic-segd-v2-gate
          path: segd_v2_gate.json
