name: Imperial near2 phase search
on:
  pull_request:
    branches: [imperial-address-lattice-boundary]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Search 16 charged lattice phases
        run: python research/imperial_near2_phase_search.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_near2_phase_search.json'));b=d['best']
          print(f"::notice title=near2 phase hard::phase={b['phase_index']}/16, bytes={b['bytes']}, AR32={d['ar32']['bytes']}, SZ3={d['sz3']['bytes']}, gainAR={b['gain_ar32']:.6f}x")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-near2-phase-search
          path: imperial_near2_phase_search.json
          if-no-files-found: ignore
          retention-days: 7
