name: Inventory genuinely large public seismic targets
on:
  pull_request:
    branches: [soda-refined-wholefile-hard4]
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet boto3 requests
      - name: Rank large public seismic objects and archive members
        run: |
          python - <<'PY'
          import boto3,heapq,json,requests,struct
          from botocore import UNSIGNED
          from botocore.config import Config

          def human(n):
              u=['B','KiB','MiB','GiB','TiB'];x=float(n);i=0
              while x>=1024 and i<len(u)-1:x/=1024;i+=1
              return f'{x:.2f} {u[i]}'

          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED,read_timeout=90,connect_timeout=20,retries={'max_attempts':5}))
          bucket='gdr-data-lake'
          def s3_top(prefix,exts,n=20):
              heap=[];count=0;total=0
              for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
                  for o in pg.get('Contents',[]):
                      k=o['Key'];sz=int(o['Size'])
                      if k.lower().endswith(exts) and sz>0:
                          count+=1;total+=sz
                          item=(sz,k)
                          if len(heap)<n:heapq.heappush(heap,item)
                          elif item>heap[0]:heapq.heapreplace(heap,item)
              rows=[{'key':k,'bytes':sz,'human':human(sz)} for sz,k in sorted(heap,reverse=True)]
              return {'prefix':prefix,'matching_files':count,'matching_bytes':total,'matching_human':human(total),'top':rows}

          def zip_members(url,n=20):
              h=requests.head(url,allow_redirects=True,timeout=60);h.raise_for_status();size=int(h.headers.get('Content-Length','0'))
              if not size:raise RuntimeError(('no content length',url,h.headers))
              start=max(0,size-131072)
              r=requests.get(url,headers={'Range':f'bytes={start}-{size-1}'},timeout=90);r.raise_for_status();tail=r.content
              pos=tail.rfind(b'PK\x05\x06')
              if pos<0:raise RuntimeError(('EOCD not found',url,size,len(tail)))
              e=tail[pos:pos+22]
              if len(e)<22:raise RuntimeError('short EOCD')
              _,disk,cdisk,n_disk,n_total,cd_size,cd_off,comlen=struct.unpack('<4s4H2LH',e)
              rr=requests.get(url,headers={'Range':f'bytes={cd_off}-{cd_off+cd_size-1}'},timeout=120);rr.raise_for_status();cd=rr.content
              if len(cd)!=cd_size:raise RuntimeError(('central length',len(cd),cd_size))
              p=0;rows=[]
              while p+46<=len(cd):
                  if cd[p:p+4]!=b'PK\x01\x02':break
                  cs=struct.unpack_from('<I',cd,p+20)[0];us=struct.unpack_from('<I',cd,p+24)[0]
                  nl=struct.unpack_from('<H',cd,p+28)[0];xl=struct.unpack_from('<H',cd,p+30)[0];cl=struct.unpack_from('<H',cd,p+32)[0];off=struct.unpack_from('<I',cd,p+42)[0]
                  name=cd[p+46:p+46+nl].decode('utf-8','replace')
                  if name.lower().endswith(('.sgy','.segy','.seg')):rows.append({'name':name,'uncompressed_bytes':us,'uncompressed_human':human(us),'compressed_bytes':cs,'compressed_human':human(cs),'local_header_offset':off})
                  p+=46+nl+xl+cl
              rows.sort(key=lambda x:x['uncompressed_bytes'],reverse=True)
              return {'url':url,'archive_bytes':size,'archive_human':human(size),'segy_members':len(rows),'top':rows[:n]}

          out={}
          out['soda']=s3_top('soda_lake/raw_seismic/2010/v1.0.0/',('.sgy','.segy','.seg'),25)
          out['imperial_valley_das']=s3_top('imperialvalleydas/',('.h5','.hdf5'),25)
          forge_urls={
            'forge_1001_1122':'https://gdr.openei.org/files/1015/1001-1122%20%281%29.zip',
            'forge_2d':'https://gdr.openei.org/files/1015/2D_seismic_data.zip'
          }
          for key,url in forge_urls.items():
              try:out[key]=zip_members(url,25)
              except Exception as e:out[key]={'url':url,'error':repr(e)}
          print(json.dumps(out,indent=2),flush=True)
          json.dump(out,open('seismic_large_dataset_inventory.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seismic-large-dataset-inventory
          path: seismic_large_dataset_inventory.json
          retention-days: 7
