name: Imperial Huber AR32 coldstart arithmetic full array
on:
  pull_request:
    branches: [imperial-persistent-ar32-step267-full-array]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        slot: [0,1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run full-array promotion slot
        run: python research/imperial_huber_ar32_coldstart_arithmetic_full_array.py imperial.h5 ${{ matrix.slot }}
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-huber-ar32-coldstart-arithmetic-full-${{ matrix.slot }}
          path: imperial_huber_ar32_coldstart_arithmetic_full_${{ matrix.slot }}.json
          retention-days: 7
