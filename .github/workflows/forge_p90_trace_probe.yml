name: Probe nonstandard raw FORGE p90 trace layout
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          pip install --quiet numpy requests remotezip zipfile64
      - name: Fetch p90 member
        shell: bash
        run: |
          python - <<'PY'
          import struct,requests
          import zipfile64.zipfile
          from remotezip import RemoteZip
          url='https://gdr.openei.org/files/1015/1001-1122%20%281%29.zip'
          with RemoteZip(url) as z:
            infos=sorted([i for i in z.infolist() if not i.is_dir() and i.filename.lower().endswith(('.sgy','.segy','.seg')) and i.compress_size>=1048576],key=lambda i:i.filename)
          zi=infos[round((len(infos)-1)*.90)];name=zi.filename.encode();off=zi.header_offset
          h=requests.get(url,headers={'Range':f'bytes={off}-{off+29}'},timeout=30).content;nlen=int.from_bytes(h[26:28],'little');xlen=int.from_bytes(h[28:30],'little');do=off+30+nlen+xlen
          payload=requests.get(url,headers={'Range':f'bytes={do}-{do+zi.compress_size-1}'},timeout=180).content
          local=struct.pack('<IHHHHHIIIHH',0x04034b50,21,0,zi.compress_type,0,0,zi.CRC,zi.compress_size,zi.file_size,len(name),0)+name;central=struct.pack('<IHHHHHHIIIHHHHHII',0x02014b50,20,21,0,zi.compress_type,0,0,zi.CRC,zi.compress_size,zi.file_size,len(name),0,0,0,0,0,0)+name;cd=len(local)+len(payload);e=struct.pack('<IHHHHIIH',0x06054b50,0,0,1,1,len(central),cd,0);open('m.zip','wb').write(local+payload+central+e)
          PY
          mkdir out && 7z x -y -oout m.zip >/dev/null && mv out/*.sgy p90.sgy
      - name: Probe headers and payload
        run: |
          python - <<'PY'
          import json,os,numpy as np
          fn='p90.sgy';size=os.path.getsize(fn);raw=open(fn,'rb').read(min(size,3600+3*(240+4*16001)))
          def u16(b,o,bo):return int.from_bytes(b[o:o+2],bo,signed=False)
          def i16(b,o,bo):return int.from_bytes(b[o:o+2],bo,signed=True)
          def i32(b,o,bo):return int.from_bytes(b[o:o+4],bo,signed=True)
          bh=raw[3200:3600];out={'size':size,'binary':{}}
          for bo in ('little','big'):
            out['binary'][bo]={'dt':u16(bh,16,bo),'ns':u16(bh,20,bo),'fmt':u16(bh,24,bo),'rev':u16(bh,300,bo),'fixed':u16(bh,302,bo),'ext':i16(bh,304,bo)}
          stride=240+4*16001;out['size_hypothesis']={'stride':stride,'trace_count_if_16001':(size-3600)//stride,'remainder':(size-3600)%stride}
          out['traces']=[]
          for ti in range(3):
            o=3600+ti*stride;th=raw[o:o+240];tr={'i':ti}
            for bo in ('little','big'):
              tr[bo]={'seq':i32(th,0,bo),'offset':i32(th,36,bo),'scalco':i16(th,70,bo),'sx':i32(th,72,bo),'sy':i32(th,76,bo),'gx':i32(th,80,bo),'gy':i32(th,84,bo),'ns':u16(th,114,bo),'dt':u16(th,116,bo)}
            samp=raw[o+240:o+240+4*16001]
            for tag,dt in [('little','<f4'),('big','>f4')]:
              a=np.frombuffer(samp,dtype=dt,count=16001).astype(np.float64);finite=np.isfinite(a);aa=a[finite]
              tr['payload_'+tag]={'finite_fraction':float(finite.mean()),'zero_fraction':float(np.mean(a==0)),'abs_median':float(np.median(np.abs(aa))) if aa.size else None,'abs_q99':float(np.quantile(np.abs(aa),.99)) if aa.size else None,'maxabs':float(np.max(np.abs(aa))) if aa.size else None,'mean':float(np.mean(aa)) if aa.size else None,'std':float(np.std(aa)) if aa.size else None}
            out['traces'].append(tr)
          print(json.dumps(out,indent=2));json.dump(out,open('forge_p90_probe.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: forge-p90-trace-probe, path: forge_p90_probe.json, retention-days: 7}
