name: AXIOM specialist video baseline matrix
on:
  pull_request:
    branches: [main]
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg git
      - name: Run exact specialist matrix
        run: python3 video_baselines.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: axiom-video-baselines-results
          path: video_baselines_results.json
          retention-days: 7
