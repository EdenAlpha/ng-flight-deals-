name: Imperial nonlocal Bayesian medium far parallel

on:
  pull_request:
    paths:
      - '.github/workflows/imperial_ar32_nonlocal_bayesian_medium_far_parallel.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: medium
            c0: 4352
          - region: far
            c0: 6400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run exact promoted stack for one regime
        env:
          REGION: ${{ matrix.region }}
          C0: ${{ matrix.c0 }}
        run: |
          python - <<'PY'
          import os,sys
          sys.path.insert(0,'research')
          import imperial_ar32_nonlocal_bayesian_fourregions as q
          q.REGIONS=((os.environ['REGION'],int(os.environ['C0'])),)
          q.main('imperial.h5')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-nonlocal-bayesian-${{ matrix.region }}
          path: imperial_ar32_nonlocal_bayesian_fourregions.json
          retention-days: 7
