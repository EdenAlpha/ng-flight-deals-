name: Seismic phenotype blind validation v2

on:
  pull_request:
    paths:
      - 'research/compression_phenotype_blind_target_v2.py'
      - 'research/compression_phenotype_blind_classify_v2.py'
      - 'research/compression_phenotype_blind_judge_v2.py'
      - '.github/workflows/seismic-phenotype-blind-validation-v2.yml'

permissions:
  contents: read
  actions: read

env:
  FROZEN_PLAN_RUN: '31835067295'
  PROTOTYPE_RUN: '32513718543'
  SHARD_COUNT: '8'
  ALL_ENGINE_NATIVE_MAX_OBJECT_BYTES: '805306368'

jobs:
  target-phenotype:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        dataset:
          - land_teapot_dome_3d
          - land_san_emidio_2021
          - land_crescent_valley_2016
          - das_forge_neubrex_2024
          - das_egs_collab_exp2
          - marine_parihaka_3d
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy zstandard boto3 h5py 's3fs<2027' segyio obspy requests
      - uses: actions/download-artifact@v4
        with:
          name: final-frozen-plan
          path: frozen_plan
          repository: EdenAlpha/ng-flight-deals-
          run-id: ${{ env.FROZEN_PLAN_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: final-global-epsilon
          path: epsilon
          repository: EdenAlpha/ng-flight-deals-
          run-id: ${{ env.FROZEN_PLAN_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        if: matrix.dataset == 'land_san_emidio_2021'
        with: {distribution: temurin, java-version: '17'}
      - name: Install official GFZ DataCube decoder when required
        if: matrix.dataset == 'land_san_emidio_2021'
        run: |
          curl -fL --retry 4 -o gipptools.tar.gz https://media.gfz.de/gfz/sec22/gipptools/gipptools-2026.167-unix.tar.gz
          mkdir gipptools
          tar -xzf gipptools.tar.gz -C gipptools --strip-components=1
          CUBE2MSEED=$(find "$PWD/gipptools" -type f -name cube2mseed | head -1)
          test -n "$CUBE2MSEED"
          chmod +x "$CUBE2MSEED"
          echo "CUBE2MSEED=$CUBE2MSEED" >> "$GITHUB_ENV"
      - name: Measure target before any engine score is read
        env: {PYTHONPATH: research}
        run: |
          python research/compression_phenotype_blind_target_v2.py \
            --manifest frozen_plan/general_seismic_v1_effective_manifest.json \
            --preflight frozen_plan/general_seismic_v1_preflight.json \
            --config benchmarks/general_seismic_codec_portfolio_v1.json \
            --epsilon-map epsilon/general_seismic_global_epsilon.json \
            --dataset '${{ matrix.dataset }}' \
            --shard-count "$SHARD_COUNT" --shards 0,2,5,7 --tiles-per-shard 2 \
            --out 'blind_phenotype_${{ matrix.dataset }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: blind-phenotype-${{ matrix.dataset }}
          path: blind_phenotype_${{ matrix.dataset }}.json
          retention-days: 30

  classify:
    needs: target-phenotype
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy
      - name: Download the six frozen prototype phenotypes from v1
        uses: actions/download-artifact@v4
        with:
          pattern: compression-phenotype-*
          path: prototypes
          repository: EdenAlpha/ng-flight-deals-
          run-id: ${{ env.PROTOTYPE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: blind-phenotype-*
          path: targets
      - name: Freeze predictions before target engine bakeoff is consumed
        env: {PYTHONPATH: research}
        run: python research/compression_phenotype_blind_classify_v2.py --prototypes prototypes --targets targets --out blind_family_predictions_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: blind-family-predictions-v2
          path: blind_family_predictions_v2.json
          retention-days: 60

  bakeoff:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        dataset:
          - land_teapot_dome_3d
          - land_san_emidio_2021
          - land_crescent_valley_2016
          - das_forge_neubrex_2024
          - das_egs_collab_exp2
          - marine_parihaka_3d
        shard: [0,2,5,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy zstandard pybind11 boto3 h5py 's3fs<2027' segyio pysz obspy brotli requests
      - name: Compile bit-exact backend
        run: |
          EXT=$(python3-config --extension-suffix)
          c++ -O3 -march=x86-64 -shared -std=c++17 -fPIC $(python -m pybind11 --includes) research/general_seismic_fast_zsm.cpp -o research/general_seismic_fast_zsm${EXT}
      - uses: actions/download-artifact@v4
        with:
          name: final-frozen-plan
          path: frozen_plan
          repository: EdenAlpha/ng-flight-deals-
          run-id: ${{ env.FROZEN_PLAN_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: final-global-epsilon
          path: epsilon
          repository: EdenAlpha/ng-flight-deals-
          run-id: ${{ env.FROZEN_PLAN_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        if: matrix.dataset == 'land_san_emidio_2021'
        with: {distribution: temurin, java-version: '17'}
      - name: Install official GFZ DataCube decoder when required
        if: matrix.dataset == 'land_san_emidio_2021'
        run: |
          curl -fL --retry 4 -o gipptools.tar.gz https://media.gfz.de/gfz/sec22/gipptools/gipptools-2026.167-unix.tar.gz
          mkdir gipptools
          tar -xzf gipptools.tar.gz -C gipptools --strip-components=1
          CUBE2MSEED=$(find "$PWD/gipptools" -type f -name cube2mseed | head -1)
          test -n "$CUBE2MSEED"
          chmod +x "$CUBE2MSEED"
          echo "CUBE2MSEED=$CUBE2MSEED" >> "$GITHUB_ENV"
      - name: Force every existing engine after the blind classifier is fixed
        env: {PYTHONPATH: research}
        run: |
          python research/master_portfolio_v2_all_engine_bakeoff.py run-shard \
            --manifest frozen_plan/general_seismic_v1_effective_manifest.json \
            --preflight frozen_plan/general_seismic_v1_preflight.json \
            --config benchmarks/general_seismic_codec_portfolio_v1.json \
            --epsilon-map epsilon/general_seismic_global_epsilon.json \
            --dataset '${{ matrix.dataset }}' \
            --shard-index '${{ matrix.shard }}' --shard-count "$SHARD_COUNT" \
            --out 'blind_bakeoff_${{ matrix.dataset }}_${{ matrix.shard }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blind-bakeoff-${{ matrix.dataset }}-${{ matrix.shard }}
          path: blind_bakeoff_${{ matrix.dataset }}_${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate-bakeoff:
    needs: bakeoff
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy boto3
      - uses: actions/download-artifact@v4
        with:
          pattern: blind-bakeoff-*
          path: bakeoff-results
      - name: Aggregate exact engine rankings
        env: {PYTHONPATH: research}
        run: python research/master_portfolio_v2_all_engine_bakeoff.py aggregate --results bakeoff-results --out blind_all_engine_bakeoff_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: blind-all-engine-bakeoff-v2
          path: blind_all_engine_bakeoff_v2.json
          retention-days: 60

  judge:
    needs: [classify, aggregate-bakeoff]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {name: blind-family-predictions-v2, path: pred}
      - uses: actions/download-artifact@v4
        with: {name: blind-all-engine-bakeoff-v2, path: bake}
      - name: Reveal engine scores only after the prediction artifact exists
        run: python research/compression_phenotype_blind_judge_v2.py --predictions pred/blind_family_predictions_v2.json --bakeoff bake/blind_all_engine_bakeoff_v2.json --out blind_family_validation_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: blind-family-validation-v2
          path: blind_family_validation_v2.json
          retention-days: 90
