name: Imperial near-2epsilon learned-law ZSM full-hard
on:
  pull_request:
    branches: [imperial-near2eps-full-hard-128x30000]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Fetch canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Encode learned-law defect with exact historical ZSM
        run: python research/imperial_near2eps_learned_zsm_fullhard_fix.py imperial.h5
      - name: Surface result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_near2eps_learned_zsm_fullhard.json'))
          print(f"::notice title=learned+ZSM full-hard::zsm={d['zsm_bytes']} B dense={d['dense_bytes']} B historical={d['historical_huber_ar32_zsm_bytes']} B gain={d['gain_vs_historical_ar32_zsm']:.6f}x")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-near2eps-learned-zsm-fullhard
          path: imperial_near2eps_learned_zsm_fullhard.json
          if-no-files-found: ignore
          retention-days: 7
