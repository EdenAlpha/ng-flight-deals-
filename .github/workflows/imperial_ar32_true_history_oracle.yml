name: Imperial AR32 true history oracle
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-regions]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Give exact previous source history to AR32 for free
        run: python research/imperial_ar32_true_history_oracle.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_true_history_oracle.json'))
          for r in d['rows']:
              msg=(f"oracle={r['oracle_true_history_bps']:.5f} bps, real={r['real_bps']:.5f}, "
                   f"gain_real={r['oracle_gain_vs_real']:.6f}, SZ3={r['sz3_bps']:.5f}, "
                   f"gainSZ3={r['oracle_gain_vs_sz3']:.6f}, ratio2x={r['oracle_ratio_to_2x_sz3_target']:.6f}, "
                   f"zero {r['real_zero_fraction']:.4f}->{r['oracle_zero_fraction']:.4f}")
              print(f"::notice title=true-history oracle {r['region']}::{msg}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-true-history-oracle
          path: imperial_ar32_true_history_oracle.json
          retention-days: 7
