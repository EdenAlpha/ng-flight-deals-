name: Imperial conditional rank full 128x30000 hard
on:
  pull_request:
    branches: [imperial-ar32-conditional-bitplane-rank]
permissions: {contents: read}
jobs:
  full-hard:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Run full hard-block exact validation
        run: python research/imperial_ar32_conditional_rank_full_hard.py imperial.h5
      - name: Surface result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_conditional_rank_full_hard.json'))
          print(f"::notice title=full 128x30000 hard::conditional={d['conditional_bytes']} B, AR32={d['ar32_bytes']} B, SZ3={d['sz3_bytes']} B, gainAR={d['gain_vs_ar32']:.6f}x, gainSZ3={d['gain_vs_sz3']:.6f}x, rep={d['outer']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-conditional-rank-full-hard
          path: imperial_ar32_conditional_rank_full_hard.json
          if-no-files-found: ignore
          retention-days: 7
