name: Imperial Gaussian hardbox rate audit
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-full-array]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Compute Gaussian hard-box rate reference
        run: python research/imperial_gaussian_hardbox_rate_audit.py imperial.h5
      - name: Surface hard-box result
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('imperial_gaussian_hardbox_rate_audit.json'))
          msg=('hardbox_ref=%.6f bps, real=%.6f, 2x_target=%.6f, ref/2x=%.6f, real-ref=%.6f, MSE_RD+shape=%.6f' % (d['gaussian_hardbox_reference_mean_bps'],d['real_pr409_mean_bps'],d['two_x_sz3_target_bps'],d['hardbox_reference_over_2x_target'],d['real_minus_hardbox_reference_bps'],d['mse_rd_plus_shape_gap_bps']))
          print('::notice title=Gaussian hardbox full array::'+msg)
          for s in d['slots']:
           print('::notice title=hardbox slot %d::ref=%.6f bps, real=%.6f, gap=%.6f' % (s['slot'],s['hardbox_reference_bps'],s['real_bps'],s['gap_bps']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-gaussian-hardbox-rate-audit
          path: imperial_gaussian_hardbox_rate_audit.json
          retention-days: 7
