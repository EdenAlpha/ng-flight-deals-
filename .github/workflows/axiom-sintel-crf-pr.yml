name: AXIOM isolated Sintel residual export
on:
  pull_request:
    branches: [axiom-sintel-crf-base]
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build exact real Sintel pair
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg g++ curl
          curl -L --retry 3 -sS https://media.w3.org/2010/05/sintel/trailer.mp4 -o sintel.mp4
          ffmpeg -loglevel error -y -ss 0 -t 4 -i sintel.mp4 -vf scale=320:180 -r 24 -frames:v 96 -f rawvideo -pix_fmt yuv420p sintel.yuv
          g++ -O3 -std=c++17 axiom_video_residual_v2.cpp -o axiom_vres
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i sintel.yuv -frames:v 96 -c:v libaom-av1 -crf 7 -b:v 0 -cpu-used 2 -row-mt 1 -f ivf basis.ivf
          ffmpeg -loglevel error -y -i basis.ivf -f rawvideo -pix_fmt yuv420p basis.yuv
          ./axiom_vres e sintel.yuv basis.yuv residual.axr 320 180 96 2>stats.txt
          ./axiom_vres d residual.axr basis.yuv check.yuv 320 180 96
          cmp sintel.yuv check.yuv
          { sha256sum sintel.yuv basis.yuv; stat -c 'RAW %s' sintel.yuv; stat -c 'BASIS_IVF %s' basis.ivf; stat -c 'RESIDUAL %s' residual.axr; cat stats.txt; } | tee export_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-sintel-residual-lab
          path: |
            sintel.yuv
            basis.yuv
            basis.ivf
            residual.axr
            export_results.txt
          compression-level: 6
          retention-days: 7
