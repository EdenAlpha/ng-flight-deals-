name: Imperial hard shared AR8 address partition
on:
  pull_request:
    branches: [imperial-nova-ar-order-address-sweep]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Hold one AR8 model fixed and sweep only address width
        run: python research/imperial_hard_shared_ar8_address_partition.py imperial.h5
      - name: Surface exact result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_hard_shared_ar8_address_partition.json'));b=d['best']
          print(f"::notice title=hard shared-AR8 address scale::best={b['bytes']} B width={b['address_width']} kind={b['kind']}; legacyWhole={d['legacy_whole']['bytes']} B; SZ3={d['sz3']['bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-hard-shared-ar8-address-partition
          path: imperial_hard_shared_ar8_address_partition.json
          if-no-files-found: ignore
          retention-days: 7
