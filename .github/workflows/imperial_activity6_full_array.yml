name: Imperial activity6 full array
on:
  pull_request:
    branches: [imperial-huber-ar32-coldstart-arithmetic-full-array]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        slot: [0,1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run activity6 promotion slot
        run: python research/imperial_activity6_full_array.py imperial.h5 ${{ matrix.slot }}
      - name: Surface slot result
        run: |
          python - <<'PY'
          import json,os
          s=os.environ['SLOT'];d=json.load(open(f'imperial_activity6_full_{s}.json'))
          print(f"::notice title=activity6 slot {s}::bps={d['activity6_bps']:.5f}, baseline={d['baseline_bps']:.5f}, gain={d['gain_activity_vs_baseline']:.6f}, gainSZ3={d['gain_activity_vs_sz3']:.6f}, improved={d['improved_blocks']}/{d['channel_blocks'][1]-d['channel_blocks'][0]}")
          PY
        env:
          SLOT: ${{ matrix.slot }}
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-activity6-full-${{ matrix.slot }}
          path: imperial_activity6_full_${{ matrix.slot }}.json
          retention-days: 7