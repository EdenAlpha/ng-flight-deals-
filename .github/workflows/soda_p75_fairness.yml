name: Soda Lake p75 strongest baseline fairness
on:
  pull_request:
    branches: [soda-3shot-baseline-fairness]
permissions: {contents: read}
jobs:
  fairness:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build official HPEZ
        run: |
          git clone --depth 1 https://github.com/JLiu-1/HPEZ-QoZ2.0.git hpez-src
          cmake -S hpez-src -B hpez-src/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/hpez-install -DCMAKE_CXX_FLAGS="-include cstdint -include array"
          cmake --build hpez-src/build -j2
          cmake --install hpez-src/build
      - run: pip install --quiet numpy segyio zstandard pysz boto3
      - name: Download deterministic p75 shot
        shell: bash
        run: |
          python - <<'PY'
          import boto3,json
          from botocore import UNSIGNED
          from botocore.config import Config
          p=.75;s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*p);k,n=keys[i]
          print('SHOT',i,k,n,flush=True);s3.download_file(bucket,k,'shot.sgy');json.dump({'percentile':75,'index':i,'key':k,'size':n,'total':len(keys)},open('selection.json','w'),indent=2)
          PY
      - name: Run strongest geometry-aware HPEZ SZ3 hybrid dictionary
        shell: bash
        run: |
          set -euo pipefail
          export BIN=$PWD/hpez-install/bin/hpez
          python research/soda_grid_fairness.py prepare shot.sgy
          export EPS=$(python -c "import json;print(json.load(open('fair/prep.json'))['eps'])")
          bash fair/run_hpez.sh
          python research/soda_grid_fairness.py analyze shot.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-p75-fairness
          path: |
            selection.json
            soda_grid_fairness.json
          retention-days: 7
