name: Temporary seismic matched benchmark
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark deps
        run: pip install --quiet numpy zfpy pysz
      - name: Download two public marine SEG-Y lines
        run: |
          curl -L --fail --retry 5 --retry-delay 2 -o F1_shots.sgy 'https://zenodo.org/records/18407436/files/F1_shots.sgy?download=1'
          curl -L --fail --retry 5 --retry-delay 2 -o Tie_shots.sgy 'https://zenodo.org/records/18407436/files/Tie_shots.sgy?download=1'
          echo 'b706ed4c9b8179660c02b9d8df5f1e86  F1_shots.sgy' | md5sum -c -
          echo '3ad8937d783a3090dbb73de918282692  Tie_shots.sgy' | md5sum -c -
      - name: Benchmark ZFP SZ3 and frozen carrier certificate
        shell: bash
        run: |
          cat > bench.py <<'PY'
          import numpy as np, zfpy, zlib, json, time, os
          from pysz import sz, szConfig, szErrorBoundMode
          def load(fn,shots):
            ns=2000; stride=240+ns*4; size=os.path.getsize(fn); ntr=(size-3600)//stride
            mm=np.memmap(fn,dtype=np.uint8,mode='r')
            return np.ndarray((ntr,ns),dtype='<f4',buffer=mm,offset=3600+240,strides=(stride,4)).copy().reshape(shots,48,ns)
          def carrier(X,eps,M):
            ns=X.shape[2];idx=np.arange(0,ns,M,dtype=np.int32)
            if idx[-1]!=ns-1:idx=np.r_[idx,ns-1]
            A=np.rint(X[:,:,idx]/eps).astype(np.int16);Ad=A.astype(np.float32)*eps;P=np.empty_like(X)
            for j in range(len(idx)-1):
              a,b=int(idx[j]),int(idx[j+1]);L=b-a;u=np.arange(L,dtype=np.float32)/L
              P[:,:,a:b]=Ad[:,:,j,None]*(1-u)[None,None,:]+Ad[:,:,j+1,None]*u[None,None,:]
            P[:,:,-1]=Ad[:,:,-1];C=np.rint((X-P)/(2*eps)).astype(np.int16);K=np.empty_like(C);K[:,:,0]=C[:,:,0];K[:,:,1:]=C[:,:,1:]-C[:,:,:-1]
            ab=zlib.compress(A.tobytes(),6);kb=zlib.compress(K.tobytes(),6);total=len(ab)+len(kb)+64;R=P+C.astype(np.float32)*(2*eps)
            return total,float(np.max(np.abs(X-R))),len(ab),len(kb)
          out={'datasets':[]}
          for name,fn,shots in [('F1','F1_shots.sgy',246),('Tie','Tie_shots.sgy',247)]:
            X=load(fn,shots);raw=X.nbytes;d={'name':name,'shape':list(X.shape),'raw_bytes':raw,'results':[]}
            for eps,M in [(0.5,32),(1.0,48),(2.0,64)]:
              t=time.time();zb=zfpy.compress_numpy(X,tolerance=eps);zt=time.time()-t;t=time.time();Z=zfpy.decompress_numpy(zb);zd=time.time()-t;ze=float(np.max(np.abs(X-Z)))
              cfg=szConfig();cfg.errorBoundMode=szErrorBoundMode.ABS;cfg.absErrorBound=eps
              t=time.time();sb,sratio=sz.compress(X,cfg);st=time.time()-t;t=time.time();S,_=sz.decompress(sb,np.float32,X.shape);sd=time.time()-t;se=float(np.max(np.abs(X-S)))
              cb,ce,ab,kb=carrier(X,eps,M)
              d['results'].append({'eps':eps,'M':M,'zfp_bytes':len(zb),'zfp_ratio':raw/len(zb),'zfp_maxerr':ze,'zfp_compress_s':zt,'zfp_decompress_s':zd,'sz3_bytes':int(sb.size),'sz3_ratio':raw/int(sb.size),'sz3_reported_ratio':float(sratio),'sz3_maxerr':se,'sz3_compress_s':st,'sz3_decompress_s':sd,'carrier_bytes':cb,'carrier_ratio':raw/cb,'carrier_maxerr':ce,'carrier_anchor_bytes':ab,'carrier_correction_bytes':kb,'carrier_vs_zfp_multiplier':len(zb)/cb,'carrier_vs_sz3_multiplier':int(sb.size)/cb})
            out['datasets'].append(d);del X
          open('matched_results.json','w').write(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
          python bench.py
      - uses: actions/upload-artifact@v4
        with:
          name: seismic-matched-results
          path: matched_results.json
          retention-days: 1
