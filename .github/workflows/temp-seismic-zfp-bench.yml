name: Temporary seismic ZFP matched benchmark
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark deps
        run: pip install --quiet numpy zfpy
      - name: Download F1 field SEG-Y
        run: |
          curl -L --fail --retry 5 --retry-delay 2 -o F1_shots.sgy 'https://zenodo.org/records/18407436/files/F1_shots.sgy?download=1'
          echo 'b706ed4c9b8179660c02b9d8df5f1e86  F1_shots.sgy' | md5sum -c -
      - name: Benchmark ZFP and carrier certificate
        shell: bash
        run: |
          cat > bench.py <<'PY'
          import numpy as np, zfpy, zlib, json, time, os
          fn='F1_shots.sgy'; ns=2000; stride=240+ns*4
          size=os.path.getsize(fn); ntr=(size-3600)//stride
          mm=np.memmap(fn,dtype=np.uint8,mode='r')
          X=np.ndarray((ntr,ns),dtype='<f4',buffer=mm,offset=3600+240,strides=(stride,4)).copy().reshape(246,48,ns)
          raw=X.nbytes
          out={'shape':list(X.shape),'raw_bytes':raw,'results':[]}
          for eps,M in [(0.5,32),(1.0,48),(2.0,64)]:
            t=time.time(); zb=zfpy.compress_numpy(X,tolerance=eps); zt=time.time()-t
            t=time.time(); Z=zfpy.decompress_numpy(zb); zd=time.time()-t
            zerr=float(np.max(np.abs(X-Z)))
            idx=np.arange(0,ns,M,dtype=np.int32)
            if idx[-1] != ns-1: idx=np.r_[idx,ns-1]
            A=np.rint(X[:,:,idx]/eps).astype(np.int16)
            Ad=A.astype(np.float32)*eps
            P=np.empty_like(X)
            for j in range(len(idx)-1):
              a,b=int(idx[j]),int(idx[j+1]); L=b-a
              u=np.arange(L,dtype=np.float32)/L
              P[:,:,a:b]=Ad[:,:,j,None]*(1-u)[None,None,:]+Ad[:,:,j+1,None]*u[None,None,:]
            P[:,:,-1]=Ad[:,:,-1]
            C=np.rint((X-P)/(2*eps)).astype(np.int16)
            K=np.empty_like(C); K[:,:,0]=C[:,:,0]; K[:,:,1:]=C[:,:,1:]-C[:,:,:-1]
            ab=zlib.compress(A.tobytes(),6); kb=zlib.compress(K.tobytes(),6)
            cb=len(ab)+len(kb)+64
            R=P+C.astype(np.float32)*(2*eps)
            cerr=float(np.max(np.abs(X-R)))
            out['results'].append({'eps':eps,'M':M,'zfp_bytes':len(zb),'zfp_ratio':raw/len(zb),'zfp_maxerr':zerr,'zfp_compress_s':zt,'zfp_decompress_s':zd,'carrier_bytes':cb,'carrier_ratio':raw/cb,'carrier_maxerr':cerr,'carrier_anchor_bytes':len(ab),'carrier_correction_bytes':len(kb),'carrier_vs_zfp_ratio_multiplier':len(zb)/cb})
          open('zfp_carrier_results.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          python bench.py
      - uses: actions/upload-artifact@v4
        with:
          name: zfp-carrier-results
          path: zfp_carrier_results.json
          retention-days: 1
