name: Soda Lake frozen factor-backend codec on four hard shots
on:
  pull_request:
    branches: [soda-factor-backend-stack]
permissions: {contents: read}
jobs:
  hard4:
    strategy:
      fail-fast: false
      matrix: {p: [35,45,75,85]}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard pysz boto3 brotli
      - name: Download deterministic shot
        shell: bash
        env: {P: '${{ matrix.p }}'}
        run: |
          python - <<'PY'
          import boto3,json,os
          from botocore import UNSIGNED
          from botocore.config import Config
          p=int(os.environ['P']);expected={35:'F3622R1.SGY',45:'F4371R1.SGY',75:'F6618R1.SGY',85:'F7367R1.SGY'}
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*p/100);k,n=keys[i]
          if not k.endswith('/'+expected[p]):raise RuntimeError(('selection drift',p,i,k,expected[p]))
          print('SHOT',p,i,k,n,flush=True);s3.download_file(bucket,k,'shot.sgy');json.dump({'percentile':p,'index':i,'key':k,'size':n,'total':len(keys)},open('selection.json','w'),indent=2)
          PY
      - name: Run frozen exact codec and direct SZ3 audit
        env: {P: '${{ matrix.p }}'}
        run: python research/soda_factor_backend_hard4.py shot.sgy "$P"
      - uses: actions/upload-artifact@v4
        with:
          name: soda-factor-backend-hard-p${{ matrix.p }}
          path: |
            selection.json
            soda_factor_backend_p${{ matrix.p }}.json
          retention-days: 7
