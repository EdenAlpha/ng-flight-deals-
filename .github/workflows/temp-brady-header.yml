name: Temporary Brady signal-record benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  signal-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy zfpy pysz zstandard
      - run: curl -L --fail --retry 5 --retry-delay 2 -o land.sgy 'https://gdr.openei.org/files/849/PoroTomo_iDAS16043_160325140118.sgy'
      - name: Matched 10pct-std benchmark
        shell: bash
        run: |
          cat > b.py <<'PY'
          import os,json,numpy as np,zfpy,zstandard as zstd
          from pysz import sz,szConfig,szErrorBoundMode
          f='land.sgy';size=os.path.getsize(f);h=open(f,'rb').read(3600);C=[]
          for bo,nb in [('big','>'),('little','<')]:
            ns=int.from_bytes(h[3220:3222],bo);dt=int.from_bytes(h[3216:3218],bo);fmt=int.from_bytes(h[3224:3226],bo)
            if fmt==5 and ns>0:
              st=240+4*ns
              if (size-3600)%st==0:C.append((nb,ns,dt,(size-3600)//st,st))
          nb,ns,dt,ntr,st=C[0];mm=np.memmap(f,np.uint8,'r');X=np.ndarray((ntr,ns),dtype=np.dtype(nb+'f4'),buffer=mm,offset=3840,strides=(st,4)).astype(np.float32,copy=True);std=float(X.std());eps=.1*std;M=52;raw=X.nbytes
          idx=np.arange(0,ns,M,dtype=np.int32);idx=np.r_[idx,ns-1] if idx[-1]!=ns-1 else idx;Ai=np.rint(X[:,idx]/eps).astype(np.int16);Ad=Ai.astype(np.float32)*eps;P=np.empty_like(X)
          for j in range(len(idx)-1):
            a,b=int(idx[j]),int(idx[j+1]);L=b-a;u=np.arange(L,dtype=np.float32)/L;P[:,a:b]=Ad[:,j,None]*(1-u)[None,:]+Ad[:,j+1,None]*u[None,:]
          P[:,-1]=Ad[:,-1];S=np.rint((X-P)/(2*eps)).astype(np.int16);K=np.empty_like(S);K[:,0]=S[:,0];K[:,1:]=S[:,1:]-S[:,:-1];R=P+S.astype(np.float32)*(2*eps);zc=zstd.ZstdCompressor(level=3).compress
          D=Ai.astype(np.int32);D[:,1:]-=Ai[:,:-1].astype(np.int32);zz=((D<<1)^(D>>31)).astype(np.uint16);ab=sum(len(zc(np.packbits(((zz>>bit)&1).astype(np.uint8).reshape(-1)).tobytes())) for bit in range(16));mask=K!=0;mb=len(zc(np.packbits(mask.T.reshape(-1)).tobytes()));v=K[mask];vb=len(zc((v.astype(np.int8) if v.size and v.min()>=-128 and v.max()<=127 else v.astype(np.int16)).tobytes()));pb=ab+mb+vb
          zb=zfpy.compress_numpy(X,tolerance=eps);Z=zfpy.decompress_numpy(zb);cfg=szConfig();cfg.errorBoundMode=szErrorBoundMode.ABS;cfg.absErrorBound=eps;sb,_=sz.compress(X,cfg);Q,_=sz.decompress(sb,np.float32,X.shape)
          # local signal statistics by 5-second windows
          win=[]
          for a in range(0,ns,5000):
            q=X[:,a:min(a+5000,ns)];win.append({'t0_s':a*dt/1e6,'t1_s':min(a+5000,ns)*dt/1e6,'std':float(q.std()),'rms':float(np.sqrt(np.mean(q.astype(np.float64)**2)))})
          out={'file_bytes':size,'ntr':ntr,'ns':ns,'dt_us':dt,'std':std,'eps':eps,'windows':win,'pulse_ratio_M52_fastbackend':raw/pb,'pulse_bytes':pb,'pulse_maxerr':float(np.max(np.abs(X-R))),'event_fraction':float(v.size/X.size),'anchor_bytes':ab,'topology_bytes':mb,'value_bytes':vb,'zfp_ratio':raw/len(zb),'zfp_maxerr':float(np.max(np.abs(X-Z))),'sz3_ratio':raw/int(sb.size),'sz3_maxerr':float(np.max(np.abs(X-Q))),'pulse_vs_sz3':(raw/pb)/(raw/int(sb.size))};print(json.dumps(out,indent=2));open('signal.json','w').write(json.dumps(out,indent=2))
          PY
          python b.py
      - uses: actions/upload-artifact@v4
        with:
          name: brady-signal-results
          path: signal.json
          retention-days: 1
