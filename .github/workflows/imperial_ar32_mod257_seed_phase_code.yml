name: Imperial AR32 mod257 seed phase code
on:
  pull_request:
    branches: [imperial-persistent-ar32-step267-full-array]
permissions: {contents: read}
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Search procedural always-legal mod257 residue fields
        run: python research/imperial_ar32_mod257_seed_phase_code.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-mod257-seed-phase-code
          path: imperial_ar32_mod257_seed_phase_code.json
          retention-days: 7
