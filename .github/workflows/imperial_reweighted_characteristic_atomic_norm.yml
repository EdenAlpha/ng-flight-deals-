name: Imperial reweighted characteristic atomic norm
on:
  pull_request:
    branches: [imperial-sparse-characteristic-synthesis]
permissions: {contents: read}
# Retrigger only; experiment definition unchanged.
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy h5py boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Reweight characteristic atomic norm inside exact hard-error box
        run: python research/imperial_reweighted_characteristic_atomic_norm.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-reweighted-characteristic-atomic-norm
          path: imperial_reweighted_characteristic_atomic_norm.json
          retention-days: 7
