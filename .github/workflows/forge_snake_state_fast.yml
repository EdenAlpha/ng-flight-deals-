name: Fast FORGE adjacent-trace snake state codec
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  snake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          pip install --quiet numpy numba pysz segyio
      - run: |
          curl -L --fail --retry 5 --retry-delay 2 -o forge.zip 'https://gdr.openei.org/files/1141/2018-19%20Reflection%20Processing.zip'
          python - <<'PY'
          import zipfile
          n='2018-19 Reflection Processing/3D Survey/Forge3d_ANI_PSDM_Stack_UnEnh.segy';z=zipfile.ZipFile('forge.zip');z.extract(n,'.')
          PY
          cat > /tmp/snake.py <<'PY'
          import json,math,subprocess,numpy as np,segyio
          from numba import njit
          from pysz import sz,szConfig,szErrorBoundMode
          p='2018-19 Reflection Processing/3D Survey/Forge3d_ANI_PSDM_Stack_UnEnh.segy'
          with segyio.open(p,'r',strict=False,ignore_geometry=True) as f:T=np.asarray(f.trace.raw[:],dtype=np.float32).reshape(170,213,1001)
          std=float(np.std(T,dtype=np.float64));eps=.1*std;X=np.ascontiguousarray(T[53:117,74:138,244:756]);del T;raw=X.nbytes
          def z(a):return len(subprocess.run(['zstd','-q','-f','-19','-c'],input=np.ascontiguousarray(a).tobytes(),stdout=subprocess.PIPE,check=True).stdout)
          def si(a):
            lo=int(a.min()) if a.size else 0;hi=int(a.max()) if a.size else 0
            return a.astype(np.int8) if lo>=-128 and hi<=127 else a.astype(np.int16) if lo>=-32768 and hi<=32767 else a.astype(np.int32)
          @njit(cache=True)
          def pred(prev,t,s,gn):
            u=t+s
            if u<0:u=0
            elif u>=prev.shape[0]:u=prev.shape[0]-1
            v=int(prev[u])*gn
            return (v+4)//8 if v>=0 else -((-v+4)//8)
          @njit(cache=True)
          def encode(X,eps,alpha,SR,gains,ps,pg):
            ni,nj,nt=X.shape;step=alpha*eps;Q=np.zeros(X.shape,np.int32);DS=np.zeros(X.shape,np.int8);DG=np.zeros(X.shape,np.int8);DC=np.zeros(X.shape,np.int16);ROOT=np.zeros(nt,np.int16)
            # first trace persistent state from zero
            q=0;old=0
            for t in range(nt):
              lo=math.ceil((X[0,0,t]-eps)/step-1e-7);hi=math.floor((X[0,0,t]+eps)/step+1e-7)
              if q<lo:q=lo
              elif q>hi:q=hi
              Q[0,0,t]=q;ROOT[t]=q-old;old=q
            pi=0;pj=0
            for idx in range(1,ni*nj):
              i=idx//nj;r=idx%nj;j=r if (i%2)==0 else nj-1-r
              pidx=idx-1;ip=pidx//nj;rp=pidx%nj;jp=rp if (ip%2)==0 else nj-1-rp
              prev=Q[ip,jp];s=0;gi=2 if gains.shape[0]>=5 else gains.shape[0]//2;c=0
              for t in range(nt):
                pp=pred(prev,t,s,int(gains[gi]));lo=math.ceil((X[i,j,t]-eps)/step-1e-7);hi=math.floor((X[i,j,t]+eps)/step+1e-7);qq=pp+c
                if qq<lo or qq>hi:
                  bestcost=1<<30;bestd=1<<30;bests=s;bestg=gi;bestc=c;bestp=pp
                  for ss in range(-SR,SR+1):
                    for gg in range(gains.shape[0]):
                      pv=pred(prev,t,ss,int(gains[gg]));clo=lo-pv;chi=hi-pv;cc=c
                      if cc<clo:cc=clo
                      elif cc>chi:cc=chi
                      cost=ps*(1 if ss!=s else 0)+pg*(1 if gg!=gi else 0)+abs(cc-c);dist=abs(ss-s)+abs(gg-gi)
                      if cost<bestcost or (cost==bestcost and dist<bestd):bestcost=cost;bestd=dist;bests=ss;bestg=gg;bestc=cc;bestp=pv
                  DS[i,j,t]=bests-s;DG[i,j,t]=bestg-gi;DC[i,j,t]=bestc-c;s=bests;gi=bestg;c=bestc;pp=bestp
                Q[i,j,t]=pp+c
            return Q,ROOT,DS,DG,DC,step
          cfg=szConfig();cfg.errorBoundMode=szErrorBoundMode.ABS;cfg.absErrorBound=eps;b,_=sz.compress(X,cfg);Y,_=sz.decompress(b,np.float32,X.shape);print('BASE',json.dumps({'bytes':int(b.size),'ratio':raw/int(b.size),'maxerr':float(np.max(np.abs(X-Y)))}),flush=True)
          gains=np.array([6,7,8,9,10],np.int8)
          rows=[]
          for alpha in [1.95,1.75,1.5]:
            for SR in [1,2]:
              for ps,pg in [(1,1),(3,3),(6,3),(3,6)]:
                Q,R,DS,DG,DC,step=encode(X,eps,alpha,SR,gains,ps,pg);rb=min(z(si(R)),z(np.packbits(R!=0,bitorder='little'))+z(si(R[R!=0])))
                ev=(DS!=0)|(DG!=0)|(DC!=0);ev[0,0]=False;top=z(np.packbits(ev.ravel(),bitorder='little'));dsv=DS[ev];dgv=DG[ev];dcv=DC[ev];detail=top+z(dsv.astype(np.int8))+z(dgv.astype(np.int8))+(z(si(dcv)) if dcv.size else 0);total=rb+detail+96
                r={'alpha':alpha,'SR':SR,'ps':ps,'pg':pg,'bytes':total,'ratio':raw/total,'root':rb,'detail':detail,'events':float(ev.mean()),'shift_change':float(np.mean(dsv!=0)) if dsv.size else 0,'gain_change':float(np.mean(dgv!=0)) if dgv.size else 0,'maxerr':float(np.max(np.abs(X-Q.astype(np.float32)*step)))};rows.append(r);print('SNAKE',json.dumps(r),flush=True)
          rows.sort(key=lambda r:r['bytes']);print('BEST',json.dumps(rows[:10],indent=2),flush=True)
          PY
          python /tmp/snake.py
