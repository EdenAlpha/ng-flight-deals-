name: Waka deep steady-state tile export
on:
  push:
    branches: [migrated-volume-geometry-engine-v1]
    paths:
      - 'research/migrated_volume_waka_deep_export.py'
      - '.github/workflows/migrated_volume_waka_deep_export.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  BENCHMARK_DEFINITION_SHA: 9b304e262182caa29a2c93e7e74e09ccb5715e92
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy zstandard brotli boto3 pysz
      - name: Materialize exact frozen survey manifest
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_manifest.json
      - name: Export deterministic 16x32 Waka block
        env: {PYTHONPATH: research}
        run: |
          python research/migrated_volume_waka_deep_export.py \
            --manifest frozen_manifest.json \
            --eps benchmarks/migrated_volume_global_eps_v1.json \
            --out waka_deep_16x32.npz
      - uses: actions/upload-artifact@v4
        with:
          name: waka-deep-16x32
          path: waka_deep_16x32.npz
          retention-days: 30
