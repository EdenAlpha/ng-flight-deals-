name: Official HPEZ fairness on raw Utah FORGE
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build official HPEZ
        run: |
          git clone --depth 1 https://github.com/JLiu-1/HPEZ-QoZ2.0.git hpez-src
          cmake -S hpez-src -B hpez-src/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/hpez-install -DCMAKE_CXX_FLAGS="-include cstdint -include array"
          cmake --build hpez-src/build -j2
          cmake --install hpez-src/build
      - name: Install extraction and benchmark tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          pip install --quiet numpy segyio pysz requests
      - name: Extract deterministic nonzero-median Utah FORGE gather
        shell: bash
        run: |
          python - <<'PY'
          import requests,struct
          url='https://gdr.openei.org/files/1015/1001-1122%20%281%29.zip';name=b'1511994193_1017_50500_16500_20171202_220556_570.sgy';fs=112237868;cs=102933340;crc=226598985;method=9;off=1647386036
          r=requests.get(url,headers={'Range':f'bytes={off}-{off+cs-1}'},timeout=120);r.raise_for_status();payload=r.content
          if len(payload)!=cs:raise RuntimeError((len(payload),cs))
          local=struct.pack('<IHHHHHIIIHH',0x04034b50,21,0,method,0,0,crc,cs,fs,len(name),0)+name;central=struct.pack('<IHHHHHHIIIHHHHHII',0x02014b50,20,21,0,method,0,0,crc,cs,fs,len(name),0,0,0,0,0,0)+name;cd=len(local)+len(payload);eocd=struct.pack('<IHHHHIIH',0x06054b50,0,0,1,1,len(central),cd,0);open('member.zip','wb').write(local+payload+central+eocd)
          PY
          7z t member.zip
          mkdir x && 7z x -y -ox member.zip
          mv x/1511994193_1017_50500_16500_20171202_220556_570.sgy forge_raw.sgy
      - name: Independent parser agreement and matched SZ3
        run: python research/forge_raw_hpez_audit.py prepare forge_raw.sgy
      - name: Run official HPEZ q4 on both 2D axis orders
        shell: bash
        run: |
          BIN=$PWD/hpez-install/bin/hpez
          EPS=$(python -c "import json;print(json.load(open('fair/prep.json'))['eps'])")
          $BIN -f -i fair/file.bin -z fair/file.hpez -2 16001 1747 -M ABS "$EPS" -q 4
          $BIN -f -z fair/file.hpez -o fair/file.out -2 16001 1747
          $BIN -f -i fair/transposed.bin -z fair/transposed.hpez -2 1747 16001 -M ABS "$EPS" -q 4
          $BIN -f -z fair/transposed.hpez -o fair/transposed.out -2 1747 16001
      - name: Verify HPEZ hard error and report
        run: python research/forge_raw_hpez_audit.py analyze forge_raw.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: forge-raw-hpez-audit-results
          path: |
            forge_raw_hpez_audit.json
            fair/prep.json
          retention-days: 7
