name: Master Portfolio V2 selector gate

on:
  pull_request:
  push:
    branches: [general-seismic-master-portfolio-v2]

permissions:
  contents: read

jobs:
  selector-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify smallest-valid-stream dominance behavior
        run: python research/master_portfolio_v2_selector.py
