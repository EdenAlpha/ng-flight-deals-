name: Waka operator quotient v2 ARM gate
on:
  pull_request:
    branches: [migrated-volume-geometry-engine-v1]
  workflow_dispatch:
permissions: {contents: read}
env:
  BENCHMARK_DEFINITION_SHA: 9b304e262182caa29a2c93e7e74e09ccb5715e92
jobs:
  waka:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numeric dependencies
        run: pip install --quiet numpy zstandard brotli boto3 pysz
      - name: Sanity adaptive operator decoder
        env: {PYTHONPATH: research}
        run: python research/migrated_volume_3d_operator_quotient_v2.py
      - name: Materialize frozen survey manifest
        run: |
          git fetch --no-tags --depth=1 origin "$BENCHMARK_DEFINITION_SHA"
          git show "$BENCHMARK_DEFINITION_SHA:benchmarks/general_seismic_v1.json" > frozen_manifest.json
      - name: Waka real native 4x32 quotient gate
        env: {PYTHONPATH: research}
        run: python research/migrated_volume_opq2_waka_fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waka-opq2-arm
          path: waka_opq2_fast.json
          if-no-files-found: warn
          retention-days: 30
