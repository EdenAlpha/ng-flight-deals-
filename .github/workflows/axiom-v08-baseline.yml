name: AXIOM v0.8 baseline
on:
  pull_request:
    branches: [main]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install strong baselines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full brotli zstd xz-utils
      - name: Run benchmark
        run: bash axiom_v08_baseline.sh
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: axiom-v08-baseline
          path: out/results.txt
          retention-days: 7
