name: Tight-fidelity contextual Rice frame screen
on:
  pull_request:
    branches: [soda-frozen-eps-sweep]
permissions: {contents: read}
jobs:
  tight:
    strategy:
      fail-fast: false
      matrix:
        p: [45,75]
        frac: ['0.01','0.02','0.05']
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard pysz boto3 brotli
      - name: Download deterministic shot
        shell: bash
        env:
          P: '${{ matrix.p }}'
        run: |
          python - <<'PY'
          import boto3,json,os
          from botocore import UNSIGNED
          from botocore.config import Config
          p=int(os.environ['P']);s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*p/100);k,n=keys[i];expected={45:'soda_lake/raw_seismic/2010/v1.0.0/F4371R1.SGY',75:'soda_lake/raw_seismic/2010/v1.0.0/F6618R1.SGY'}[p]
          if len(keys)!=8321 or k!=expected:raise RuntimeError(('selection drift',p,len(keys),i,k,expected))
          print('SHOT',p,i,k,n,flush=True);s3.download_file(bucket,k,'shot.sgy');json.dump({'percentile':p,'index':i,'key':k,'size':n,'total':len(keys)},open('selection.json','w'),indent=2)
          PY
      - name: Run exact Rice representation dictionary
        run: python research/soda_tight_rice_frames.py shot.sgy ${{ matrix.frac }}
      - uses: actions/upload-artifact@v4
        with:
          name: soda-tight-rice-p${{ matrix.p }}-f${{ matrix.frac }}
          path: |
            selection.json
            soda_tight_rice_frames.json
          retention-days: 7
