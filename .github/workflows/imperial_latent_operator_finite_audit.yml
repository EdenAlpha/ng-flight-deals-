name: Imperial finite-safe latent operator audit
on:
  pull_request:
    branches: [imperial-latent-mixed-operator-codeword]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download exact Imperial Valley HDF5 record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Rerun latent operator with serialized scales and finite-only acceptance
        run: python research/imperial_latent_operator_finite_audit.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-latent-operator-finite-audit
          path: imperial_latent_operator_finite_audit.json
          retention-days: 7
