name: Decisive FORGE HPEZ error allocation audit
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read, actions: read}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {name: forge-subcube-cache, path: data, github-token: '${{ github.token }}', repository: EdenAlpha/ng-flight-deals-, run-id: 31459619473}
      - run: |
          pip install --quiet numpy
          git clone --depth 1 https://github.com/JLiu-1/HPEZ-QoZ2.0.git hpez-src
          python research/patch_hpez_dump_coords.py
          python research/patch_hpez_dump_eb.py
          cmake -S hpez-src -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/install -DCMAKE_CXX_FLAGS="-include cstdint -include array" >/dev/null
          cmake --build build -j2 >/dev/null && cmake --install build >/dev/null
      - run: |
          EPS=$(python -c "import json;print(json.load(open('data/forge_subcube_meta.json'))['eps_10pct_std'])")
          install/bin/hpez -f -i data/forge_subcube_f32.bin -z e.hpez -3 512 64 64 -M ABS "$EPS" -q 4 >/dev/null 2>eb.log
          install/bin/hpez -f -z e.hpez -o e_rec.bin -3 512 64 64 >/dev/null 2>>eb.log
          grep HPEZCOORD eb.log
          python - <<'PY'
          import json,numpy as np
          m=json.load(open('data/forge_subcube_meta.json'));eps=float(m['eps_10pct_std']);x=np.fromfile('data/forge_subcube_f32.bin','<f4');r=np.fromfile('e_rec.bin','<f4');me=float(np.max(np.abs(x-r)));print('MAXERR',me,'EPS',eps)
          if me>eps*1.00001:raise SystemExit('invalid reconstruction')
          PY
          python research/analyze_hpez_error_allocation.py
      - uses: actions/upload-artifact@v4
        with: {name: forge-hpez-eb-decisive, path: hpez_error_allocation_analysis.json, retention-days: 7}
