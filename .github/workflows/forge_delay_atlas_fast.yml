name: Fast FORGE delay-surface reflector atlas
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          pip install --quiet numpy pysz segyio
      - run: |
          curl -L --fail --retry 5 --retry-delay 2 -o forge.zip 'https://gdr.openei.org/files/1141/2018-19%20Reflection%20Processing.zip'
          python - <<'PY'
          import zipfile
          n='2018-19 Reflection Processing/3D Survey/Forge3d_ANI_PSDM_Stack_UnEnh.segy';z=zipfile.ZipFile('forge.zip');z.extract(n,'.')
          PY
          cat > /tmp/d.py <<'PY'
          import json,subprocess,numpy as np,segyio
          from pysz import sz,szConfig,szErrorBoundMode
          p='2018-19 Reflection Processing/3D Survey/Forge3d_ANI_PSDM_Stack_UnEnh.segy'
          with segyio.open(p,'r',strict=False,ignore_geometry=True) as f:T=np.asarray(f.trace.raw[:],dtype=np.float32).reshape(170,213,1001)
          std=float(np.std(T,dtype=np.float64));eps=.1*std;X=np.ascontiguousarray(T[53:117,74:138,244:756]);del T;raw=X.nbytes;ni,nj,nt=X.shape
          def z(a):return len(subprocess.run(['zstd','-q','-f','-19','-c'],input=np.ascontiguousarray(a).tobytes(),stdout=subprocess.PIPE,check=True).stdout)
          def comp(A,e):
            c=szConfig();c.errorBoundMode=szErrorBoundMode.ABS;c.absErrorBound=float(e);b,_=sz.compress(np.ascontiguousarray(A),c);D,_=sz.decompress(b,np.float32,A.shape);return int(b.size),D
          bb,D=comp(X,eps);print('BASE',json.dumps({'bytes':bb,'ratio':raw/bb,'maxerr':float(np.max(np.abs(X-D)))}),flush=True)
          def controls(n,S):
            a=list(range(0,n,S))
            if a[-1]!=n-1:a.append(n-1)
            return np.asarray(a,np.int32)
          def shifted(v,s):
            x=np.arange(v.size,dtype=np.float32);return np.interp(x-s,x,v,left=float(v[0]),right=float(v[-1])).astype(np.float32)
          def atlas(TS,W,CS,SR):
            M=np.zeros_like(X);templates=[];allS=[];allG=[]
            for i0 in range(0,ni,TS):
              i1=min(ni,i0+TS);si=i1-i0;gi=controls(si,CS)
              for j0 in range(0,nj,TS):
                j1=min(nj,j0+TS);sj=j1-j0;gj=controls(sj,CS)
                for t0 in range(0,nt,W):
                  t1=min(nt,t0+W);w=t1-t0;ci=i0+si//2;cj=j0+sj//2;ref=X[ci,cj,t0:t1].astype(np.float32).copy();refq=ref.astype(np.float16);ref=refq.astype(np.float32);templates.append(refq)
                  SS=np.zeros((len(gi),len(gj)),np.int8);GG=np.zeros_like(SS)
                  rr=float(np.dot(ref,ref))+1e-30
                  for a,ii in enumerate(gi):
                    for b,jj in enumerate(gj):
                      y=X[i0+ii,j0+jj,t0:t1].astype(np.float32);best=None
                      for s in range(-SR,SR+1):
                        v=shifted(ref,float(s));g=float(np.dot(y,v)/(np.dot(v,v)+1e-30));g=max(-2.0,min(2.0,g));gq=int(np.rint(g*32));gq=max(-64,min(64,gq));pred=v*(gq/32.0);e=float(np.mean((y-pred).astype(np.float64)**2));key=(e,abs(s),abs(gq-32))
                        if best is None or key<best[0]:best=(key,s,gq)
                      SS[a,b]=best[1];GG[a,b]=best[2]
                  allS.append(SS.copy());allG.append(GG.copy())
                  # separable interpolation of control fields then synthesize every trace in tile
                  xj=np.arange(sj);xi=np.arange(si);tmpS=np.empty((len(gi),sj));tmpG=np.empty_like(tmpS)
                  for a in range(len(gi)):
                    tmpS[a]=np.interp(xj,gj,SS[a]);tmpG[a]=np.interp(xj,gj,GG[a])
                  SF=np.empty((si,sj));GF=np.empty_like(SF)
                  for j in range(sj):
                    SF[:,j]=np.interp(xi,gi,tmpS[:,j]);GF[:,j]=np.interp(xi,gi,tmpG[:,j])
                  for ii in range(si):
                    for jj in range(sj):M[i0+ii,j0+jj,t0:t1]=shifted(ref,float(SF[ii,jj]))*(float(GF[ii,jj])/32.0)
            # ragged templates/controls serialized as concatenated arrays plus tiny shape metadata implicit in parameters
            tb=z(np.concatenate([x.reshape(-1) for x in templates]).astype(np.float16));sb=z(np.concatenate([x.reshape(-1) for x in allS]).astype(np.int8));gb=z(np.concatenate([x.reshape(-1) for x in allG]).astype(np.int8));model=tb+sb+gb+96
            rb,Rd=comp(np.ascontiguousarray(X-M),eps);Y=M+Rd;total=model+rb
            return {'TS':TS,'W':W,'CS':CS,'SR':SR,'bytes':total,'ratio':raw/total,'model':model,'templates':tb,'shifts':sb,'gains':gb,'residual':rb,'maxerr':float(np.max(np.abs(X-Y))),'rmse_model':float(np.sqrt(np.mean((X-M).astype(np.float64)**2)))}
          rows=[]
          for TS,W,CS,SR in [(16,64,4,4),(16,128,4,6),(32,64,4,4),(32,64,8,4),(32,128,8,6),(64,64,8,4),(64,128,8,6)]:
            r=atlas(TS,W,CS,SR);rows.append(r);print('ATLAS',json.dumps(r),flush=True)
          rows.sort(key=lambda r:r['bytes']);print('BEST',json.dumps(rows,indent=2),flush=True)
          PY
          python /tmp/d.py
