name: Imperial dense spectral budget sweep
on:
  pull_request:
    branches: [imperial-valley-frozen-brady-transfer]
permissions: {contents: read}
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - run: python -c "import boto3;from botocore import UNSIGNED;from botocore.config import Config;boto3.client('s3',config=Config(signature_version=UNSIGNED)).download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','das.h5')"
      - run: python research/imperial_dense_spectral_budget.py das.h5
      - name: Surface tradeoff
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_dense_spectral_budget.json'))
          for r in sorted(d['combos'],key=lambda x:x['N']):
            print(f"::notice title=spectral N={r['N']}::bytes={r['bytes']}, gainSZ3={r['gain_vs_sz3']:.6f}, model_med={r['median_model_bytes']:.0f}, corr_med={r['median_correction_bytes']:.0f}, corr_density={r['median_correction_density']:.5f}, min_gain={r['min_tile_gain']:.4f}, max_gain={r['max_tile_gain']:.4f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-dense-spectral-budget
          path: imperial_dense_spectral_budget.json
          retention-days: 7
