name: eFootball isolated surgical crypto v11

on:
  push:
    branches: [ efootball-crypto-surgical-v11-2026-08-25 ]
    paths:
      - '.github/workflows/efootball-crypto-surgical-v11.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl python3 python3-pip >/dev/null
          python3 -m pip install --break-system-packages -q pyelftools==0.32 capstone==5.0.6
      - name: Download current binary
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ef/bundle /tmp/ef/native /tmp/out
          curl -L --fail --retry 5 --retry-delay 2 -A 'Mozilla/5.0' -o /tmp/ef/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          unzip -q /tmp/ef/efootball.xapk -d /tmp/ef/bundle
          NATIVE=$(find /tmp/ef/bundle -type f -name 'config.arm64_v8a.apk' | head -n1)
          test -n "$NATIVE"
          unzip -q "$NATIVE" -d /tmp/ef/native
          sha256sum /tmp/ef/native/lib/arm64-v8a/libUE4.so > /tmp/out/efootball-crypto-surgical-v11.sha256.txt
      - name: Analyze
        run: |
          cat > /tmp/ef/a.py <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          import re,struct
          p=Path('/tmp/ef/native/lib/arm64-v8a/libUE4.so'); raw=p.read_bytes()
          with p.open('rb') as f:
              e=ELFFile(f); t=e.get_section_by_name('.text'); tb=t.data(); base=int(t['sh_addr']); end=base+len(tb)
              loads=[(int(s['p_vaddr']),int(s['p_offset']),int(s['p_filesz'])) for s in e.iter_segments() if s['p_type']=='PT_LOAD']
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.detail=False
          def dis(lo,hi):lo=max(base,lo);hi=min(end,hi);return list(md.disasm(tb[lo-base:hi-base],lo))
          def voff(v):
              for sv,so,fs in loads:
                  if sv<=v<sv+fs:return so+v-sv
          def q(v):
              x=voff(v);return None if x is None else struct.unpack_from('<Q',raw,x)[0]
          def pro(z):return z.mnemonic=='stp' and 'x29, x30' in z.op_str and '[sp, #-' in z.op_str and ']!' in z.op_str
          def fs(a,span=0x3000):
              r=max(base,a-span)
              for z in dis(max(base,a-span),a+4):
                  if pro(z):r=z.address
              return r
          def fe(s,span=0x9000):
              for z in dis(s+4,min(end,s+span)):
                  if pro(z):return z.address
              return min(end,s+span)
          def dump(o,title,lo,hi):
              o.append(f'\n=== {title} 0x{lo:x}-0x{hi:x} ===')
              for z in dis(lo,hi):o.append(f'0x{z.address:x}: {z.mnemonic:9} {z.op_str}')
          # fast BL caller map from raw opcodes
          callers={}
          for i in range(0,len(tb)-3,4):
              w=struct.unpack_from('<I',tb,i)[0]
              if (w&0xfc000000)==0x94000000:
                  imm=w&0x03ffffff
                  if imm&0x02000000:imm-=0x04000000
                  pc=base+i;tg=pc+(imm<<2);callers.setdefault(tg,[]).append(pc)
          mem=re.compile(r'\[(x\d+), #0x([0-9a-f]+)\]')
          o=[];o.append('ISOLATED V11: direct-P2P runtime profile / session-cipher sink')

          # Exact adapter from v10.
          conv=0x7b6ca9c; dump(o,'EXACT SESSION PROFILE ADAPTER',conv,fe(conv))
          o.append('\n=== ADAPTER CALLERS ===')
          for a in callers.get(conv,[]):
              o.append(f'call=0x{a:x} fn~=0x{fs(a):x}')
              dump(o,f'CALLER WINDOW 0x{a:x}',max(fs(a),a-0x180),min(fe(fs(a)),a+0x220))

          # Transport class vtable installed by 0x7c56740.
          vt=0x981f890; methods=[]
          o.append(f'\n=== P2P TRANSPORT VTABLE 0x{vt:x} ===')
          for off in range(0,0x300,8):
              x=q(vt+off)
              if x is None:break
              o.append(f'+0x{off:03x}=0x{x:x}')
              if base<=x<end and x not in methods:methods.append(x)
          o.append(f'method_count={len(methods)}')
          o.append('\n=== VTABLE METHOD PROFILE-FIELD WINDOWS ===')
          for a in methods:
              s=fs(a,0x500);e2=fe(s,0x5000);f=dis(s,e2)
              ids=[]
              for i,z in enumerate(f):
                  mm=mem.search(z.op_str)
                  if mm and int(mm.group(2),16) in (0x128,0x12c,0x130,0x134,0x138,0x140):
                      for k in range(max(0,i-10),min(len(f),i+18)):ids.append(k)
                  if re.search(r'ldr\s+x\d+, \[x0\]',z.mnemonic+' '+z.op_str):
                      for k in range(max(0,i-5),min(len(f),i+12)):ids.append(k)
              if ids:
                  o.append(f'\n-- entry=0x{a:x} fn~=0x{s:x}-0x{e2:x} --')
                  last=-2
                  for k in sorted(set(ids)):
                      if k>last+1:o.append('  ...')
                      z=f[k];o.append(f'  0x{z.address:x}: {z.mnemonic:9} {z.op_str}');last=k

          # Strict final heap profile typed reader (final: 130 byte,134 u32,138 byte,140 u64).
          region=dis(0x7b00000,0x7d50000); starts=[z.address for z in region if pro(z)]+[0x7d50000]
          req={(0x130,'ldrb','w'),(0x134,'ldr','w'),(0x138,'ldrb','w'),(0x140,'ldr','x')}
          req2={(0x128,'ldrb','w'),(0x12c,'ldr','w'),(0x130,'ldrb','w'),(0x138,'ldr','x')}
          def scan(req):
              idx=0;hits=[]
              for n in range(len(starts)-1):
                  s,e2=starts[n],starts[n+1]
                  if e2-s>0x18000:continue
                  while idx<len(region) and region[idx].address<s:idx+=1
                  j=idx;f=[]
                  while j<len(region) and region[j].address<e2:f.append(region[j]);j+=1
                  regs={}
                  for z in f:
                      mm=mem.search(z.op_str)
                      if not mm:continue
                      off=int(mm.group(2),16);dst=z.op_str.split(',',1)[0].strip();w=dst[:1]
                      regs.setdefault(mm.group(1),set()).add((off,z.mnemonic,w))
                  for r,g in regs.items():
                      if req<=g:hits.append((s,e2,r,f))
                  idx=j
              return hits
          for title,reqx in [('FINAL HEAP PROFILE STRICT READERS',req),('ADAPTER OUTPUT STRICT READERS',req2)]:
              hits=scan(reqx);o.append(f'\n=== {title} ===\nhit_count={len(hits)}')
              for s,e2,r,f in hits:
                  o.append(f'\n-- fn=0x{s:x}-0x{e2:x} base={r} callers={",".join(hex(x) for x in callers.get(s,[])[:80])} --')
                  for z in f:
                      mm=mem.search(z.op_str)
                      if (mm and mm.group(1)==r and any(int(mm.group(2),16)==x[0] for x in reqx)) or z.mnemonic in ('bl','blr'):
                          o.append(f'0x{z.address:x}: {z.mnemonic:9} {z.op_str}')

          # Profile store helper is simple ownership transfer; enumerate all runtime callers.
          o.append('\n=== PROFILE STORE HELPER 0x7c54ea0 CALLERS ===')
          for a in callers.get(0x7c54ea0,[]):o.append(f'0x{a:x} fn~=0x{fs(a):x}')

          Path('/tmp/out/efootball-crypto-surgical-v11.txt').write_text('\n'.join(o))
          print('\n'.join(o[:2500]))
          PY
          python3 /tmp/ef/a.py
      - name: Commit report
        run: |
          set -euo pipefail
          mkdir -p analysis-output
          cp /tmp/out/efootball-crypto-surgical-v11* analysis-output/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin efootball-crypto-surgical-v11-2026-08-25
          git add analysis-output/
          git commit -m 'Report isolated surgical P2P crypto sink v11' || exit 0
          git push
