name: Fast FORGE coarse-base persistent-refinement shell
on:
  pull_request:
    branches: [seismic-bench-base]
permissions: {contents: read}
jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          pip install --quiet numpy numba pysz segyio
      - run: |
          curl -L --fail --retry 5 --retry-delay 2 -o forge.zip 'https://gdr.openei.org/files/1141/2018-19%20Reflection%20Processing.zip'
          python - <<'PY'
          import zipfile
          n='2018-19 Reflection Processing/3D Survey/Forge3d_ANI_PSDM_Stack_UnEnh.segy';z=zipfile.ZipFile('forge.zip');z.extract(n,'.')
          PY
          cat > /tmp/e.py <<'PY'
          import json,math,subprocess,numpy as np,segyio
          from numba import njit
          from pysz import sz,szConfig,szErrorBoundMode
          p='2018-19 Reflection Processing/3D Survey/Forge3d_ANI_PSDM_Stack_UnEnh.segy'
          with segyio.open(p,'r',strict=False,ignore_geometry=True) as f:T=np.asarray(f.trace.raw[:],dtype=np.float32).reshape(170,213,1001)
          std=float(np.std(T,dtype=np.float64));eps=.1*std;X=np.ascontiguousarray(T[53:117,74:138,244:756]);del T;raw=X.nbytes
          def z(a):return len(subprocess.run(['zstd','-q','-f','-19','-c'],input=np.ascontiguousarray(a).tobytes(),stdout=subprocess.PIPE,check=True).stdout)
          def si(a):
            lo=int(a.min()) if a.size else 0;hi=int(a.max()) if a.size else 0
            return a.astype(np.int8) if lo>=-128 and hi<=127 else a.astype(np.int16) if lo>=-32768 and hi<=32767 else a.astype(np.int32)
          @njit(cache=True)
          def refine(X,M,eps,alpha):
            step=alpha*eps;ni,nj,nt=X.shape;C=np.zeros(X.shape,np.int16);E=np.zeros(X.shape,np.int16);me=0.0
            for i in range(ni):
              for j in range(nj):
                c=0;old=0
                for t in range(nt):
                  lo=math.ceil((X[i,j,t]-M[i,j,t]-eps)/step-1e-7);hi=math.floor((X[i,j,t]-M[i,j,t]+eps)/step+1e-7)
                  if c<lo:c=lo
                  elif c>hi:c=hi
                  C[i,j,t]=c;E[i,j,t]=c-old;old=c
                  e=abs(X[i,j,t]-(M[i,j,t]+c*step))
                  if e>me:me=e
            return C,E,step,me
          def ebytes(E):
            m=E!=0;vals=E[m]
            candidates=[z(si(E)),z(si(np.transpose(E,(2,0,1)))),z(si(np.transpose(E,(0,2,1))))]
            candidates.append(z(np.packbits(m.ravel(),bitorder='little'))+(z(si(vals)) if vals.size else 0))
            # separate topology/value in time-major order
            Mt=np.transpose(m,(2,0,1));Et=np.transpose(E,(2,0,1));vt=Et[Mt]
            candidates.append(z(np.packbits(Mt.ravel(),bitorder='little'))+(z(si(vt)) if vt.size else 0))
            return min(candidates),float(m.mean())
          cfg=szConfig();cfg.errorBoundMode=szErrorBoundMode.ABS;cfg.absErrorBound=eps;b,_=sz.compress(X,cfg);D,_=sz.decompress(b,np.float32,X.shape);print('BASE',json.dumps({'bytes':int(b.size),'ratio':raw/int(b.size),'maxerr':float(np.max(np.abs(X-D)))}),flush=True)
          rows=[]
          for beta in [1.5,2,3,4,6,8,12,16]:
            c=szConfig();c.errorBoundMode=szErrorBoundMode.ABS;c.absErrorBound=float(beta*eps);bb,_=sz.compress(X,c);M,_=sz.decompress(bb,np.float32,X.shape);base=int(bb.size);bme=float(np.max(np.abs(X-M)))
            for alpha in [1.95,1.75,1.5,1.25,1.0,.75,.5]:
              C,E,step,me=refine(X,M,eps,alpha);eb,nz=ebytes(E);total=base+eb+48
              r={'beta':beta,'alpha':alpha,'bytes':total,'ratio':raw/total,'base':base,'refine':eb,'event_fraction':nz,'base_maxerr':bme,'maxerr':float(me),'cmin':int(C.min()),'cmax':int(C.max())};rows.append(r);print('SHELL',json.dumps(r),flush=True)
          rows.sort(key=lambda r:r['bytes']);print('BEST',json.dumps(rows[:15],indent=2),flush=True)
          PY
          python /tmp/e.py
