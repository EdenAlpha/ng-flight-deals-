name: Imperial frozen lattice full array map

on:
  pull_request:
    paths:
      - 'research/imperial_frozen_lattice_full_array_map.py'
      - '.github/workflows/imperial_frozen_lattice_full_array_map.yml'
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slot: [0,1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Map frozen persistence
        run: python research/imperial_frozen_lattice_full_array_map.py imperial.h5 ${{ matrix.slot }}
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-frozen-lattice-full-${{ matrix.slot }}
          path: imperial_frozen_lattice_full_${{ matrix.slot }}.json
          retention-days: 7

  aggregate:
    needs: map
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: imperial-frozen-lattice-full-*
          merge-multiple: true
      - name: Aggregate structural ceiling
        run: python research/imperial_frozen_lattice_full_array_map.py aggregate
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_frozen_lattice_full_aggregate.json'))
          print(f"::notice title=frozen full-array::SZ3={d['sz3_bps']:.5f} bps, frozen={d['frozen_bps']:.5f}, hybrid={d['oracle_hybrid_bps']:.5f}, hybridGainSZ3={d['oracle_hybrid_gain_vs_sz3']:.6f}, frozenWins={d['blocks_frozen_beats_sz3']}/54, 2xBlocks={d['blocks_frozen_meets_2x_sz3']}/54, change[min/med/mean/max]={d['change_fraction_min']:.5f}/{d['change_fraction_median']:.5f}/{d['change_fraction_mean']:.5f}/{d['change_fraction_max']:.5f}, stillNeed={100*d['fraction_reduction_still_needed_from_hybrid']:.2f}%")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-frozen-lattice-full-aggregate
          path: imperial_frozen_lattice_full_aggregate.json
          retention-days: 7
