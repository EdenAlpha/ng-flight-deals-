name: AXIOM v0.13 Bunny natural-video verification
on:
  pull_request:
    branches: [axiom-bunny-v13-base]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and build corpus
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg g++ curl
          curl -L --retry 3 -sS https://media.w3.org/2010/05/bunny/trailer.mp4 -o bunny.mp4
          ffmpeg -loglevel error -y -ss 0 -t 4 -i bunny.mp4 -vf scale=320:180 -r 24 -frames:v 96 -f rawvideo -pix_fmt yuv420p bunny.yuv
          curl -L --retry 3 -sS https://raw.githubusercontent.com/EdenAlpha/ng-flight-deals-/axiom-v02-beast/bench/axiom_video_residual_v13.cpp -o residual.cpp
          g++ -O3 -std=c++17 residual.cpp -o residual
      - name: AXIOM ancestry and exact reconstruction
        run: |
          set -euxo pipefail
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i bunny.yuv -frames:v 96 -c:v libaom-av1 -crf 7 -b:v 0 -cpu-used 2 -row-mt 1 -f ivf basis.ivf
          ffmpeg -loglevel error -y -i basis.ivf -frames:v 96 -f rawvideo -pix_fmt yuv420p basis.yuv
          ./residual e bunny.yuv basis.yuv residual.axr 320 180 96
          ./residual d residual.axr basis.yuv axiom_recon.yuv 320 180 96
          cmp bunny.yuv axiom_recon.yuv
      - name: Exact specialist matrix
        run: |
          set -euxo pipefail
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i bunny.yuv -frames:v 96 -c:v ffv1 -level 3 -coder 1 -context 0 -g 1 ffv1.mkv
          ffmpeg -loglevel error -y -i ffv1.mkv -f rawvideo -pix_fmt yuv420p ffv1.yuv && cmp bunny.yuv ffv1.yuv
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i bunny.yuv -frames:v 96 -c:v libx264 -preset veryslow -qp 0 x264.mkv
          ffmpeg -loglevel error -y -i x264.mkv -f rawvideo -pix_fmt yuv420p x264.yuv && cmp bunny.yuv x264.yuv
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i bunny.yuv -frames:v 96 -c:v libx265 -preset veryslow -x265-params lossless=1 x265.mkv
          ffmpeg -loglevel error -y -i x265.mkv -f rawvideo -pix_fmt yuv420p x265.yuv && cmp bunny.yuv x265.yuv
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i bunny.yuv -frames:v 96 -c:v libvpx-vp9 -lossless 1 -deadline best -cpu-used 0 vp9.webm
          ffmpeg -loglevel error -y -i vp9.webm -f rawvideo -pix_fmt yuv420p vp9.yuv && cmp bunny.yuv vp9.yuv
          ffmpeg -loglevel error -y -f rawvideo -pix_fmt yuv420p -s 320x180 -r 24 -i bunny.yuv -frames:v 96 -c:v libaom-av1 -crf 0 -b:v 0 -cpu-used 4 av1.mkv
          ffmpeg -loglevel error -y -i av1.mkv -f rawvideo -pix_fmt yuv420p av1.yuv && cmp bunny.yuv av1.yuv
          { sha256sum bunny.yuv axiom_recon.yuv; stat -c 'RAW %s' bunny.yuv; stat -c 'BASIS %s' basis.ivf; stat -c 'RESIDUAL %s' residual.axr; echo "AXIOM_REP $(( $(stat -c%s basis.ivf) + $(stat -c%s residual.axr) + 48 ))"; stat -c 'FFV1 %s' ffv1.mkv; stat -c 'X264 %s' x264.mkv; stat -c 'X265 %s' x265.mkv; stat -c 'VP9 %s' vp9.webm; stat -c 'AV1_LOSSLESS %s' av1.mkv; } | tee results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-v13-bunny-results
          path: results.txt
          retention-days: 7
