name: Frozen PR161 record on four hard Soda shots
on:
  pull_request:
    branches: [soda-intergap-backend-hybrid]
permissions: {contents: read}
jobs:
  hard4:
    strategy:
      fail-fast: false
      matrix: {p: [35,45,75,85]}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build official HPEZ
        run: |
          git clone --depth 1 https://github.com/JLiu-1/HPEZ-QoZ2.0.git hpez-src
          cmake -S hpez-src -B hpez-src/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/hpez-install -DCMAKE_CXX_FLAGS="-include cstdint -include array"
          cmake --build hpez-src/build -j2
          cmake --install hpez-src/build
      - run: pip install --quiet numpy segyio zstandard pysz boto3 brotli
      - name: Download deterministic hard shot
        shell: bash
        env: {P: '${{ matrix.p }}'}
        run: |
          python - <<'PY'
          import boto3,json,os
          from botocore import UNSIGNED
          from botocore.config import Config
          p=int(os.environ['P']);expected={35:(2912,'soda_lake/raw_seismic/2010/v1.0.0/F3622R1.SGY'),45:(3744,'soda_lake/raw_seismic/2010/v1.0.0/F4371R1.SGY'),75:(6240,'soda_lake/raw_seismic/2010/v1.0.0/F6618R1.SGY'),85:(7072,'soda_lake/raw_seismic/2010/v1.0.0/F7367R1.SGY')}
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*p/100);k,n=keys[i];ei,ek=expected[p]
          if len(keys)!=8321 or i!=ei or k!=ek:raise RuntimeError(('hard-shot selection drift',p,len(keys),i,k,ei,ek))
          print('SHOT',p,i,k,n,flush=True);s3.download_file(bucket,k,'shot.sgy');json.dump({'percentile':p,'index':i,'key':k,'size':n,'total':len(keys)},open('selection.json','w'),indent=2)
          PY
      - name: Run frozen and adaptive PR161 codec arms
        run: python research/soda_hard4_frozen_record.py shot.sgy
      - name: Run official strongest HPEZ/SZ3 fairness dictionary
        shell: bash
        run: |
          set -euo pipefail
          export BIN=$PWD/hpez-install/bin/hpez
          python research/soda_grid_fairness.py prepare shot.sgy
          export EPS=$(python -c "import json;print(json.load(open('fair/prep.json'))['eps'])")
          bash fair/run_hpez.sh
          python research/soda_grid_fairness.py analyze shot.sgy
      - name: Combine codec and strongest-baseline audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          a=json.load(open('soda_hard4_frozen_record.json'));f=json.load(open('soda_grid_fairness.json'));s=f['strongest'];b=int(s['bytes'])
          for key in ('frozen','adaptive_backend_menu'):
              c=int(a[key]['container_bytes']);a[key]['strongest_baseline_kind']=s['kind'];a[key]['strongest_baseline_bytes']=b;a[key]['gain_vs_strongest']=b/c;a[key]['two_x_gate_bytes']=b/2;a[key]['clears_two_x_strongest']=bool(c<=b/2)
          a['fairness']={'strongest':s,'hpez_geometry':f.get('hpez_geometry'),'sz3_geometry':f.get('sz3_geometry'),'geometry_hybrid':f.get('geometry_hybrid'),'sz3_file_best':f.get('sz3_file_best')}
          print(json.dumps({'frozen_bytes':a['frozen']['container_bytes'],'adaptive_bytes':a['adaptive_backend_menu']['container_bytes'],'strongest':s,'frozen_gain':a['frozen']['gain_vs_strongest'],'adaptive_gain':a['adaptive_backend_menu']['gain_vs_strongest'],'frozen_2x':a['frozen']['clears_two_x_strongest'],'adaptive_2x':a['adaptive_backend_menu']['clears_two_x_strongest']},indent=2),flush=True)
          json.dump(a,open('soda_hard4_frozen_fair.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soda-hard4-frozen-p${{ matrix.p }}
          path: |
            selection.json
            soda_hard4_frozen_record.json
            soda_grid_fairness.json
            soda_hard4_frozen_fair.json
          retention-days: 7
