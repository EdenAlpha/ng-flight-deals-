name: Build CLM general-intelligence corpus

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dataset tools
        run: |
          python -m pip install --upgrade pip
          pip install datasets huggingface_hub zstandard sentencepiece
      - name: Build 200M-token high-quality mixture
        run: python scripts/build_clm_general_corpus.py
      - name: Upload corpus
        uses: actions/upload-artifact@v4
        with:
          name: clm-general-200m
          path: |
            clm_general_200m/
          compression-level: 6
          retention-days: 7
