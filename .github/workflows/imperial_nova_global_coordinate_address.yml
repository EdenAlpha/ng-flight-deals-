name: Imperial NOVA global coordinate address
on:
  pull_request:
    branches: [imperial-persistent-ar32-step267-full-array]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          h=hashlib.md5(open('imperial.h5','rb').read()).hexdigest()
          assert h=='8cb7ea8466ab48880f876fc43cb5ce75',h
          PY
      - name: Run decoder-real global coordinate address gate
        run: python research/imperial_nova_global_coordinate_address.py imperial.h5
      - name: Surface result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_nova_global_coordinate_address.json'))
          for r in d['rows']:
            b=r['best']
            print(f"::{ 'notice' if b['gain_vs_ar32']>1 else 'warning' } title=NOVA {r['region']}::NOVA={b['bytes']} B, AR32={r['ar32']['bytes']} B, SZ3={r['sz3']['bytes']} B, gainAR={b['gain_vs_ar32']:.6f}x, gainSZ3={b['gain_vs_sz3']:.6f}x, path={b['path']}, h/eps={b['fac']}, rep={b['address_rep']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-nova-global-coordinate-address
          path: imperial_nova_global_coordinate_address.json
          if-no-files-found: ignore
          retention-days: 7
