name: AXIOM cross-format benchmark
on:
  push:
    branches: [axiom-benchmark-20260810]
    paths-ignore:
      - 'axiom_bench/results/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: axiom-benchmark-20260810
      - name: Install benchmark tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd brotli ffmpeg xz-utils git curl
      - name: Run AXIOM benchmark
        run: |
          python3 axiom_bench/run_bench.py | tee axiom_bench/out/run.log
      - name: Save benchmark results to branch
        run: |
          mkdir -p axiom_bench/results
          cp axiom_bench/out/results.csv axiom_bench/results/results.csv
          cp axiom_bench/out/results.md axiom_bench/results/results.md
          cp axiom_bench/out/run.log axiom_bench/results/run.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add axiom_bench/results
          git commit -m 'Save AXIOM benchmark results [skip ci]'
          git push origin axiom-benchmark-20260810
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: axiom-cross-format-results
          path: |
            axiom_bench/out/results.csv
            axiom_bench/out/results.md
            axiom_bench/out/run.log
          retention-days: 7
