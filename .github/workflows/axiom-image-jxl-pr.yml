name: AXIOM JPEG XL prefilter benchmark
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libjxl-tools curl
          python3 -m pip install -q numpy
      - name: Run JPEG XL prefilter benchmark
        run: python3 image_jxl_prefilter_probe.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: axiom-image-jxl-results
          path: image_jxl_prefilter_results.json
          retention-days: 7
