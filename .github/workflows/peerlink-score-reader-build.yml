name: PeerLink score reader build

on:
  push:
    branches: [ peerlink-score-reader-2026-08-24 ]

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch event-driven match-end detector and score reader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('peerlink-source')
          cpp_path = root / 'app/src/main/jni/peerlink_backend.cpp'
          native_path = root / 'app/src/main/java/com/peerlink/app/tunnel/NativePeerLinkBackend.kt'
          service_path = root / 'app/src/main/java/com/peerlink/app/service/PeerLinkVpnService.kt'
          gradle_path = root / 'app/build.gradle.kts'
          score_path = root / 'app/src/main/java/com/peerlink/app/score/MatchScoreReader.kt'

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {n}')
              return text.replace(old, new, 1)

          cpp = cpp_path.read_text()
          cpp = replace_once(
              cpp,
              'constexpr uint64_t kGameplayPortAliasTtlMs = 15000ULL;\n',
              'constexpr uint64_t kGameplayPortAliasTtlMs = 15000ULL;\n'
              '// eFootball terminal signature recovered from a real PeerLink/PCAPDroid match:\n'
              '// once gameplay application payload stops, the custom P2P flow drains as\n'
              '// transport-only packets (mostly 26 bytes).  We observe UDP APPLICATION\n'
              '// payload length here, not the outer IP/tunnel length.\n'
              'constexpr size_t kMatchTerminalMaxUdpPayload = 36U;\n'
              'constexpr uint64_t kMatchTerminalArmAfterMs = 30000ULL;\n'
              'constexpr uint64_t kMatchTerminalSustainMs = 500ULL;\n'
              'constexpr uint32_t kMatchTerminalMinPackets = 8U;\n'
              'constexpr uint64_t kMatchTerminalCooldownMs = 30000ULL;\n',
              'terminal constants')

          cpp = replace_once(
              cpp,
              '    std::deque<uint64_t> recent_gameplay_udp_times_ms;\n',
              '    std::deque<uint64_t> recent_gameplay_udp_times_ms;\n\n'
              '    // Match-end detector is fed only from the already-classified outbound\n'
              '    // gameplay UDP hot path. Candidate fields are owned by the TUN reader\n'
              '    // thread; only the one-shot signal crosses threads atomically.\n'
              '    std::atomic<bool> match_terminal_detected{false};\n'
              '    uint64_t match_terminal_candidate_start_ms = 0;\n'
              '    uint32_t match_terminal_candidate_packets = 0;\n'
              '    uint64_t match_terminal_last_detected_ms = 0;\n'
              '    bool match_terminal_rearm_ready = true;\n',
              'terminal state')

          detector = r'''
void observe_match_terminal_outbound(BackendState *state,
                                     uint16_t local_port,
                                     uint16_t remote_port,
                                     size_t udp_payload_length,
                                     uint64_t now_ms) {
    if (state == nullptr || state->match_terminal_detected.load(std::memory_order_relaxed)) return;
    if (!stable_gameplay_known(state)) return;
    if (local_port != static_cast<uint16_t>(load_stable_game_port(state)) ||
        remote_port != static_cast<uint16_t>(load_stable_remote_port(state))) return;

    const uint64_t gameplay_start = state->game_traffic_start_ms.load(std::memory_order_acquire);
    if (gameplay_start == 0 || now_ms < gameplay_start ||
        (now_ms - gameplay_start) < kMatchTerminalArmAfterMs) return;

    if (udp_payload_length > kMatchTerminalMaxUdpPayload) {
        state->match_terminal_candidate_start_ms = 0;
        state->match_terminal_candidate_packets = 0;
        state->match_terminal_rearm_ready = true;
        return;
    }

    if (!state->match_terminal_rearm_ready) return;
    if (state->match_terminal_last_detected_ms != 0 &&
        now_ms >= state->match_terminal_last_detected_ms &&
        (now_ms - state->match_terminal_last_detected_ms) < kMatchTerminalCooldownMs) return;

    if (state->match_terminal_candidate_start_ms == 0) {
        state->match_terminal_candidate_start_ms = now_ms;
        state->match_terminal_candidate_packets = 1;
        return;
    }

    ++state->match_terminal_candidate_packets;
    const uint64_t sustained_ms = now_ms - state->match_terminal_candidate_start_ms;
    if (sustained_ms >= kMatchTerminalSustainMs &&
        state->match_terminal_candidate_packets >= kMatchTerminalMinPackets) {
        state->match_terminal_last_detected_ms = now_ms;
        state->match_terminal_candidate_start_ms = 0;
        state->match_terminal_candidate_packets = 0;
        state->match_terminal_rearm_ready = false;
        state->match_terminal_detected.store(true, std::memory_order_release);
    }
}

'''
          cpp = replace_once(cpp, '\nint resolve_inbound_gameplay_port(', '\n' + detector + 'int resolve_inbound_gameplay_port(', 'detector function insertion')

          cpp = replace_once(
              cpp,
              '                observe_gameplay_flow(state, parsed.source_port, parsed.dest_port, now_ms);\n                const int new_stable_port = load_stable_game_port(state);',
              '                observe_gameplay_flow(state, parsed.source_port, parsed.dest_port, now_ms);\n'
              '                observe_match_terminal_outbound(state, parsed.source_port, parsed.dest_port, parsed.udp_payload_length, now_ms);\n'
              '                const int new_stable_port = load_stable_game_port(state);',
              'IPv4 terminal hook')

          jni = r'''extern "C" JNIEXPORT jboolean JNICALL
Java_com_peerlink_app_tunnel_NativePeerLinkBackend_nativePollMatchTerminal(
        JNIEnv * /*env*/,
        jobject /*thiz*/,
        jlong handle) {
    BackendState *state = from_handle(handle);
    if (state == nullptr) return JNI_FALSE;
    return state->match_terminal_detected.exchange(false, std::memory_order_acq_rel) ? JNI_TRUE : JNI_FALSE;
}

'''
          cpp = replace_once(
              cpp,
              'extern "C" JNIEXPORT jstring JNICALL\nJava_com_peerlink_app_tunnel_NativePeerLinkBackend_nativeDumpUdpTrace(',
              jni + 'extern "C" JNIEXPORT jstring JNICALL\nJava_com_peerlink_app_tunnel_NativePeerLinkBackend_nativeDumpUdpTrace(',
              'JNI terminal poll insertion')
          cpp_path.write_text(cpp)

          native = native_path.read_text()
          native = replace_once(
              native,
              '        fun onStats(stats: NativeBackendStats) {}\n',
              '        fun onStats(stats: NativeBackendStats) {}\n        fun onMatchTerminalDetected() {}\n',
              'native callback interface')
          native = replace_once(
              native,
              '                        callbacks.onStats(stats)\n',
              '                        callbacks.onStats(stats)\n'
              '                        if (pollMatchTerminalDetected()) {\n'
              '                            AppState.appendLog("[MATCH-END  ] Native eFootball terminal signature confirmed")\n'
              '                            callbacks.onMatchTerminalDetected()\n'
              '                        }\n',
              'native stats detector poll')
          native = replace_once(
              native,
              '    fun dumpUdpTrace(): String {\n',
              '    fun pollMatchTerminalDetected(): Boolean {\n'
              '        val handle = nativeHandle\n'
              '        if (handle == 0L) return false\n'
              '        return nativePollMatchTerminal(handle)\n'
              '    }\n\n'
              '    fun dumpUdpTrace(): String {\n',
              'native public terminal poll')
          native = replace_once(
              native,
              '    private external fun nativeDumpUdpTrace(handle: Long): String\n',
              '    private external fun nativeDumpUdpTrace(handle: Long): String\n'
              '    private external fun nativePollMatchTerminal(handle: Long): Boolean\n',
              'native external terminal poll')
          native_path.write_text(native)

          service = service_path.read_text()
          service = replace_once(
              service,
              '                    override fun onStats(stats: NativeBackendStats) {\n                        AppState.tunneled.set(stats.totalTunneledPackets)\n                    }\n',
              '                    override fun onStats(stats: NativeBackendStats) {\n'
              '                        AppState.tunneled.set(stats.totalTunneledPackets)\n'
              '                    }\n\n'
              '                    override fun onMatchTerminalDetected() {\n'
              '                        AppState.appendLog("[MATCH-END  ] Triggering one-shot final-score capture")\n'
              '                        com.peerlink.app.score.MatchScoreReader.captureAtTerminal(this@PeerLinkVpnService)\n'
              '                    }\n',
              'service match-end callback')
          service_path.write_text(service)

          gradle = gradle_path.read_text()
          gradle = replace_once(
              gradle,
              '    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")\n',
              '    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")\n\n'
              '    // One-shot on-device OCR for the final eFootball scoreboard.\n'
              '    implementation("com.google.mlkit:text-recognition:16.0.1")\n',
              'ML Kit dependency')
          gradle_path.write_text(gradle)

          score_path.parent.mkdir(parents=True, exist_ok=True)
          score_path.write_text(r'''package com.peerlink.app.score

import android.content.Context
import android.graphics.Bitmap
import android.graphics.BitmapFactory
import android.graphics.Rect
import android.util.Base64
import com.google.android.gms.tasks.Tasks
import com.google.mlkit.vision.common.InputImage
import com.google.mlkit.vision.text.TextRecognition
import com.google.mlkit.vision.text.latin.TextRecognizerOptions
import com.peerlink.app.core.AppState
import com.peerlink.app.godmode.PrimeClient
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.SupervisorJob
import kotlinx.coroutines.launch
import java.util.concurrent.TimeUnit
import java.util.concurrent.atomic.AtomicBoolean
import kotlin.math.abs
import kotlin.math.max

/**
 * Event-driven final-score reader.
 *
 * The native packet path decides WHEN the match has entered eFootball's terminal
 * transport drain.  Only then do we take one screenshot.  There is no screenshot
 * polling loop, so gameplay pays no continuous image-capture/OCR cost.
 *
 * Prime shell is the first capture transport because PeerLink already owns that
 * authenticated loopback bridge.  A MediaProjection fallback can be added later
 * for users who never enable Prime Mode.
 */
object MatchScoreReader {
    data class MatchScore(val left: Int, val right: Int, val rawText: String)

    private data class Token(val value: Int, val box: Rect)

    private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
    private val captureInFlight = AtomicBoolean(false)

    @Volatile var latestScore: MatchScore? = null
        private set

    fun captureAtTerminal(context: Context) {
        if (!captureInFlight.compareAndSet(false, true)) return
        val app = context.applicationContext
        scope.launch {
            try {
                val bitmap = captureViaPrime()
                if (bitmap == null) {
                    AppState.appendLog("[MATCH-SCORE] Prime screenshot unavailable; packet end was still detected")
                    return@launch
                }
                val score = recognizeScore(bitmap)
                if (score == null) {
                    AppState.appendLog("[MATCH-SCORE] Screenshot captured but no confident score pair was found")
                    return@launch
                }
                latestScore = score
                app.getSharedPreferences("peerlink_match_score", Context.MODE_PRIVATE)
                    .edit()
                    .putInt("left", score.left)
                    .putInt("right", score.right)
                    .putLong("captured_at_ms", System.currentTimeMillis())
                    .putString("ocr_text", score.rawText.take(512))
                    .apply()
                AppState.appendLog("[MATCH-SCORE] Final score ${score.left}-${score.right}")
            } catch (t: Throwable) {
                AppState.appendLog("[MATCH-SCORE] Capture/OCR failed: ${t.javaClass.simpleName}: ${t.message}")
            } finally {
                captureInFlight.set(false)
            }
        }
    }

    private fun captureViaPrime(): Bitmap? {
        if (!PrimeClient.isAlive(700)) return null
        // toybox base64 differs across Android releases; stripping line breaks
        // with tr works on the supported API range and keeps the JSON response one line.
        val encoded = PrimeClient.execute("screencap -p | base64 | tr -d '\\n'", 10_000)
            ?.trim()
            ?.takeIf { it.length > 128 }
            ?: return null
        val bytes = runCatching { Base64.decode(encoded, Base64.DEFAULT) }.getOrNull() ?: return null
        return BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
    }

    private fun recognizeScore(bitmap: Bitmap): MatchScore? {
        // eFootball's live/final scoreboard is in the upper part of the landscape
        // frame. Cropping removes most shirt numbers, menu counters and footer text.
        val cropHeight = max(1, (bitmap.height * 45) / 100)
        val top = Bitmap.createBitmap(bitmap, 0, 0, bitmap.width, cropHeight)
        val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
        return try {
            val result = Tasks.await(
                recognizer.process(InputImage.fromBitmap(top, 0)),
                5,
                TimeUnit.SECONDS,
            )

            // Strong path: OCR saw an explicit score separator on a single line.
            val explicit = Regex("(?<!\\d)(\\d{1,2})\\s*[-–—:]\\s*(\\d{1,2})(?!\\d)")
            for (block in result.textBlocks) {
                for (line in block.lines) {
                    val m = explicit.find(line.text) ?: continue
                    val a = m.groupValues[1].toIntOrNull() ?: continue
                    val b = m.groupValues[2].toIntOrNull() ?: continue
                    // Reject match clocks such as 90:00 and implausible OCR noise.
                    if (a in 0..20 && b in 0..20) return MatchScore(a, b, result.text)
                }
            }

            // Fallback: score digits are often separate OCR elements. Pair two
            // similarly-sized integers on the same horizontal band and prefer the
            // upper/central pair. No answer is emitted unless geometry is plausible.
            val tokens = ArrayList<Token>()
            for (block in result.textBlocks) for (line in block.lines) for (element in line.elements) {
                val s = element.text.trim()
                if (!s.matches(Regex("\\d{1,2}"))) continue
                val v = s.toIntOrNull() ?: continue
                if (v !in 0..20) continue
                val box = element.boundingBox ?: continue
                if (box.height() <= 0 || box.width() <= 0) continue
                tokens += Token(v, box)
            }

            var best: Pair<Token, Token>? = null
            var bestCost = Long.MAX_VALUE
            for (i in 0 until tokens.size) for (j in i + 1 until tokens.size) {
                var a = tokens[i]
                var b = tokens[j]
                if (a.box.centerX() > b.box.centerX()) { val t = a; a = b; b = t }
                val yDelta = abs(a.box.centerY() - b.box.centerY())
                val h = max(a.box.height(), b.box.height())
                if (yDelta > max(18, h)) continue
                val gap = b.box.centerX() - a.box.centerX()
                if (gap < max(24, bitmap.width / 30) || gap > bitmap.width * 3 / 5) continue
                val midX = (a.box.centerX() + b.box.centerX()) / 2
                val midY = (a.box.centerY() + b.box.centerY()) / 2
                val cost = midY.toLong() * 5L +
                    abs(midX - bitmap.width / 2).toLong() * 2L +
                    abs(a.box.height() - b.box.height()).toLong() * 6L +
                    yDelta.toLong() * 8L
                if (cost < bestCost) {
                    bestCost = cost
                    best = a to b
                }
            }
            best?.let { MatchScore(it.first.value, it.second.value, result.text) }
        } finally {
            recognizer.close()
            if (top !== bitmap && !top.isRecycled) top.recycle()
        }
    }
}
''')

          notes = root / 'SCORE_READER_NOTES.md'
          notes.write_text('''# eFootball event-driven score reader\n\n'
          '## Recovered facts\n'
          '- Native eFootball result structure: `GAME_PHASE +0x48`, `HOME_SCORE +0x4B`, `AWAY_SCORE +0x4C`.\n'
          '- The observed 26-byte terminal UDP packets are transport/reliability header-only traffic, not score packets.\n'
          '- In the real custom-P2P capture, outbound application UDP payload stayed `<=36` bytes for about 1.38 s at match termination; after established gameplay there was no comparable outbound run.\n'
          '- The detector therefore arms after established gameplay, requires >=8 short packets sustained for 500 ms, and fires once.\n\n'
          '## Runtime path\n'
          'Native TUN gameplay classification -> terminal detector -> one-shot Kotlin callback -> one Prime `screencap` -> upper-frame ML Kit OCR -> persisted latest score.\n\n'
          'There is deliberately no periodic screenshot loop. A MediaProjection fallback remains to be added for devices where Prime Mode is not active.\n''')
          PY

      - name: Build PeerLink debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd peerlink-source
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Commit verified score-reader prototype
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/peerlink-score-reader-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add event-driven eFootball final score reader"
          git push origin HEAD:peerlink-score-reader-2026-08-24
