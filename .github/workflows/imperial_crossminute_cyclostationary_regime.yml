name: Imperial cross-minute cyclostationary regime audit
on:
  pull_request:
    branches: [imperial-corpus-self-dictionary]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py boto3
      - name: Download three consecutive records ending at canonical target
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';prefix='imperialvalleydas/v1.0.0/';target=prefix+'DF__UTC_20201113_235932.602.h5';s=boto3.client('s3',config=Config(signature_version=UNSIGNED));rows=[]
          for pg in s.get_paginator('list_objects_v2').paginate(Bucket=b,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].endswith('.h5'):rows.append((o['Key'],int(o['Size'])))
          rows.sort();keys=[x[0] for x in rows];i=keys.index(target);sel=rows[i-2:i+1]
          for j,(k,n) in enumerate(sel):s.download_file(b,k,f'r{j}.h5');assert os.path.getsize(f'r{j}.h5')==n
          print(sel)
          PY
      - name: Score target under previous-minute phase and channel regimes only
        run: python research/imperial_crossminute_cyclostationary_regime.py r0.h5 r1.h5 r2.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-crossminute-cyclostationary-regime
          path: imperial_crossminute_cyclostationary_regime.json
          retention-days: 7
