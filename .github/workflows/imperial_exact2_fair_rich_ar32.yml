name: Imperial exact2 fair rich AR32
on:
  pull_request:
    branches: [imperial-ar32-rich-causal-audit]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download and verify canonical Imperial record
        run: |
          python - <<'PY'
          import boto3,os,hashlib
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          assert hashlib.md5(open('imperial.h5','rb').read()).hexdigest()=='8cb7ea8466ab48880f876fc43cb5ce75'
          PY
      - name: Compare exact-2epsilon NOVA representations with rich causal AR32
        run: python research/imperial_exact2_fair_rich_ar32.py imperial.h5
      - name: Surface fair result
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_exact2_fair_rich_ar32.json'));b=d['best_nova'];a=d['rich_causal_ar32'];level='notice' if b['bytes']<a['bytes'] else 'warning'
          print(f"::{level} title=exact2 NOVA vs rich AR32::compact={d['exact2_compact_nova']['bytes']} B, richNOVA={d['exact2_rich_nova']['bytes']} B, richAR32={a['bytes']} B, best={b['bytes']} B ({d['best_nova_rep']}), delta={b['bytes']-a['bytes']} B")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-exact2-fair-rich-ar32
          path: imperial_exact2_fair_rich_ar32.json
          if-no-files-found: ignore
          retention-days: 7
