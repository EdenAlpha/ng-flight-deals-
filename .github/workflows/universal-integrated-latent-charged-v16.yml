name: Universal integrated latent charged v16

on:
  pull_request:
    paths:
      - 'research/universal_integrated_latent_charged_v16b.py'
      - 'research/download_imperial_v13.py'
      - '.github/workflows/universal-integrated-latent-charged-v16.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py boto3 pysz zstandard brotli numba
      - run: python research/download_imperial_v13.py imperial.h5
      - run: PYTHONPATH=research python research/universal_integrated_latent_charged_v16b.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: universal-integrated-latent-charged-v16
          path: universal_integrated_latent_charged_v16.json
          retention-days: 30
