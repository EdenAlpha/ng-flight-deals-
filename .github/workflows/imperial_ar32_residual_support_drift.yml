name: Imperial AR32 residual support drift
on:
  pull_request:
    branches: [imperial-ar32-procedural-random-cover]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy h5py pysz boto3 zstandard
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Measure exact residual support drift and hard-box intersections
        run: python research/imperial_ar32_residual_support_drift.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-residual-support-drift
          path: imperial_ar32_residual_support_drift.json
          retention-days: 7
