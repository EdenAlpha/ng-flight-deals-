name: Assemble PeerLink source snapshot

on:
  push:
    branches: [ peerlink-latest-source-2026-08-23 ]
    paths:
      - '.handoff/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peerlink-latest-source-2026-08-23
      - name: Reconstruct and publish PeerLink source
        shell: bash
        run: |
          set -euxo pipefail
          test -f .handoff/READY
          cat .handoff/peerlink_source.b64.part* | base64 -d > /tmp/peerlink-source.tar.xz
          echo 'd1828e5be78a48e0252c5ff81234f65eefa27056158817ed57268eec91b0d8eb  /tmp/peerlink-source.tar.xz' | sha256sum -c -
          rm -rf peerlink-source /tmp/unpack
          mkdir -p /tmp/unpack
          tar -xJf /tmp/peerlink-source.tar.xz -C /tmp/unpack
          mv /tmp/unpack/PeerLink-latest peerlink-source
          cat > PEERLINK_SOURCE_SNAPSHOT.md <<'EOF'
          # PeerLink latest recovered source snapshot

          This branch contains the latest PeerLink source snapshot that was recoverable from the user's project files on 2026-08-23.

          Source provenance: `PeerLink-UX-jitter-full.zip`, produced 2026-08-09. It was byte-compared against the comprehensive `PeerLink-UX-jitter-fixed-files.zip` patch: every patch file already matched and the deletion manifest was already satisfied, so this is the post-jitter/post-cleanup tree rather than the older pre-patch tree.

          Full browsable source project: `peerlink-source/`

          The only omitted file is `gradle/wrapper/gradle-wrapper.jar`, a generated third-party Gradle binary rather than PeerLink source. `gradle-wrapper.properties`, `gradlew`, all Kotlin/Java/C/C++ source, Android resources, Gradle build files, and project documentation are preserved.

          Important native networking source: `peerlink-source/app/src/main/jni/peerlink_backend.cpp`

          eFootball reverse-engineering material remains on branch `efootball-packet-analysis-2026-08-23` / PR #771.
          EOF
          rm -rf .handoff
          rm -f .github/workflows/assemble-peerlink-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish latest PeerLink source snapshot'
          git push origin HEAD:peerlink-latest-source-2026-08-23
