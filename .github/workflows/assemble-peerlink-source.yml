name: Assemble PeerLink source snapshot

on:
  push:
    branches: [ peerlink-latest-source-2026-08-23 ]
    paths:
      - '.handoff/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peerlink-latest-source-2026-08-23
      - name: Reconstruct and publish full PeerLink source
        shell: bash
        run: |
          set -euxo pipefail
          test -f .handoff/READY
          cat .handoff/peerlink_source.b64.part* | base64 -d > /tmp/peerlink-source.tar.xz
          echo 'eedc02267803092ed6ac9bc6f712af9131567133cc4585636dc2469dd0fa5651  /tmp/peerlink-source.tar.xz' | sha256sum -c -
          rm -rf peerlink-source /tmp/unpack
          mkdir -p /tmp/unpack
          tar -xJf /tmp/peerlink-source.tar.xz -C /tmp/unpack
          mv /tmp/unpack/PeerLink-latest peerlink-source
          cat > PEERLINK_SOURCE_SNAPSHOT.md <<'EOF'
          # PeerLink latest recovered source snapshot

          This branch contains the latest full PeerLink source snapshot recoverable from the project files available on 2026-08-23.

          Source snapshot provenance: `PeerLink-UX-jitter-full.zip` produced 2026-08-09. It was compared against `PeerLink-UX-jitter-fixed-files.zip`: every fixed/changed file already matched and every obsolete-file deletion was already satisfied. Therefore this is the post-jitter/post-cleanup source tree, not an older unpatched copy.

          Full browsable project: `peerlink-source/`

          Important native networking source: `peerlink-source/app/src/main/jni/peerlink_backend.cpp`

          The complete Gradle wrapper and project files are retained. The eFootball reverse-engineering material remains on branch `efootball-packet-analysis-2026-08-23` / PR #771.
          EOF
          rm -rf .handoff
          rm -f .github/workflows/assemble-peerlink-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish latest full PeerLink source snapshot'
          git push origin HEAD:peerlink-latest-source-2026-08-23
