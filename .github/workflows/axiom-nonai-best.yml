name: AXIOM isolated strongest non-AI benchmark
on:
  pull_request:
    branches: [axiom-nonai-best-base]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install benchmark tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake git p7zip-full brotli zstd xz-utils zpaq
      - name: Build exact pinned Android corpus
        run: |
          set -euxo pipefail
          git clone -q --depth 1 https://github.com/android/architecture-samples.git /tmp/android-src
          rm -rf /tmp/android-src/.git
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 -cf /tmp/android.tar -C /tmp/android-src app build.gradle.kts settings.gradle.kts gradle.properties 2>/dev/null || tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 -cf /tmp/android.tar -C /tmp/android-src app
          echo '73529d3651eb4d3942f2175ca36d89a95dcbf0e43ec4f95ee5206a7ba7446a75  /tmp/android.tar' | sha256sum -c -
          cp /tmp/android.tar /tmp/android.source
      - name: Conventional and context-mixing opponents
        run: |
          set -euxo pipefail
          xz -9e -k -f /tmp/android.tar
          brotli -q 11 -f /tmp/android.source -o /tmp/android.br
          zstd -22 --ultra -q -f /tmp/android.source -o /tmp/android.zst
          7z a -bd -y -t7z -m0=lzma2 -mx=9 -md=256m -mfb=273 -ms=on /tmp/android_lzma2.7z /tmp/android.source >/dev/null
          7z a -bd -y -t7z -m0=PPMd -mmem=512m -mo=16 /tmp/android_ppmd.7z /tmp/android.source >/dev/null
          zpaq a /tmp/android.zpaq /tmp/android.source -method 5 >/tmp/zpaq.log 2>&1
      - name: Build current PAQ8px and benchmark with LSTM disabled
        run: |
          set -euxo pipefail
          git clone -q --depth 1 https://github.com/hxim/paq8px.git /tmp/paq8px-src
          cd /tmp/paq8px-src/build
          bash build-linux-with-cmake.sh >/dev/null
          BIN="$PWD/paq8px"
          "$BIN" -8 /tmp/android.source /tmp/android.paq8px8 >/tmp/paq8.log
          "$BIN" -8B /tmp/android.source /tmp/android.paq8px8B >/tmp/paq8B.log
          "$BIN" -10 /tmp/android.source /tmp/android.paq8px10 >/tmp/paq10.log
          "$BIN" -10B /tmp/android.source /tmp/android.paq8px10B >/tmp/paq10B.log
          mkdir -p /tmp/paqout
          "$BIN" -d /tmp/android.paq8px10B /tmp/paqout/android.source >/dev/null
          cmp /tmp/android.source /tmp/paqout/android.source
      - name: Record results
        run: |
          mkdir -p results
          python3 - <<'PY' > results/android_best_nonai.txt
          import os
          axiom=157322
          vals={
            'XZ-9e':os.path.getsize('/tmp/android.tar.xz'),
            'Brotli-11':os.path.getsize('/tmp/android.br'),
            'Zstd-22':os.path.getsize('/tmp/android.zst'),
            '7z-LZMA2-max':os.path.getsize('/tmp/android_lzma2.7z'),
            '7z-PPMd-max':os.path.getsize('/tmp/android_ppmd.7z'),
            'ZPAQ-method5':os.path.getsize('/tmp/android.zpaq'),
            'PAQ8px-v216-nonLSTM--8':os.path.getsize('/tmp/android.paq8px8'),
            'PAQ8px-v216-nonLSTM--8B':os.path.getsize('/tmp/android.paq8px8B'),
            'PAQ8px-v216-nonLSTM--10':os.path.getsize('/tmp/android.paq8px10'),
            'PAQ8px-v216-nonLSTM--10B':os.path.getsize('/tmp/android.paq8px10B'),
          }
          best=min(vals,key=vals.get)
          print('corpus_sha256=73529d3651eb4d3942f2175ca36d89a95dcbf0e43ec4f95ee5206a7ba7446a75')
          print('original=696320')
          print('axiom=157322')
          for k,v in sorted(vals.items(),key=lambda kv:kv[1]): print(f'{k}={v}')
          print(f'best_opponent={best}')
          print(f'best_opponent_bytes={vals[best]}')
          print(f'axiom_smaller_pct={(vals[best]-axiom)*100/vals[best]:.4f}')
          PY
          cat results/android_best_nonai.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-isolated-nonai-best
          path: results/android_best_nonai.txt
          retention-days: 7
