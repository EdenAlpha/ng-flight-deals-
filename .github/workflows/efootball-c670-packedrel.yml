name: eFootball c670 packed-reloc vtable trace

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: efootball-c670-packedrel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packedrel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl python3 python3-pip >/dev/null
          python3 -m pip install --break-system-packages -q pyelftools==0.32 capstone==5.0.6
      - name: Download current eFootball arm64 binary (runner-side)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ef/bundle /tmp/ef/native /tmp/out
          curl -L --fail --retry 5 --retry-delay 2 -A 'Mozilla/5.0' -o /tmp/ef/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          unzip -q /tmp/ef/efootball.xapk -d /tmp/ef/bundle
          NATIVE=$(find /tmp/ef/bundle -type f -name 'config.arm64_v8a.apk' | head -n1)
          test -n "$NATIVE"
          unzip -q "$NATIVE" -d /tmp/ef/native
          sha256sum /tmp/ef/native/lib/arm64-v8a/libUE4.so | tee /tmp/out/libue4_sha256.txt
      - name: Decode packed RELA, find vtable + dispatch of 0x7c0c670
        run: |
          cat > /tmp/ef/packedrel_trace.py <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          import re,bisect,collections

          p=Path('/tmp/ef/native/lib/arm64-v8a/libUE4.so')
          raw=p.read_bytes()
          with p.open('rb') as f:
              e=ELFFile(f)
              text=e.get_section_by_name('.text')
              tb=text.data(); tva=int(text['sh_addr']); tend=tva+len(tb)
              loads=[(int(s['p_vaddr']),int(s['p_offset']),int(s['p_filesz'])) for s in e.iter_segments() if s['p_type']=='PT_LOAD']
              android_rela=[s.data() for s in e.iter_sections() if s.header['sh_type']==0x60000002]
              plain_rela=[s.data() for s in e.iter_sections() if s.header['sh_type']==4]

          TARGET=0x7c0c670
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.detail=False
          hexmem=re.compile(r'\[[wx][0-9]+, #0x([0-9a-f]+)\]')

          def vaoff(va):
              for sv,so,fs in loads:
                  if sv<=va<sv+fs:return so+va-sv
          def cstr(va,maxlen=120):
              o=vaoff(va)
              if o is None:return None
              b=raw[o:o+maxlen].split(b'\0',1)[0]
              if len(b)<4:return None
              if sum(32<=x<127 for x in b)/len(b)<.92:return None
              return b.decode('ascii','replace')

          out=[]
          out.append(f'android_rela_sections={len(android_rela)} plain={len(plain_rela)}')
          for i,d in enumerate(android_rela):
              out.append(f'ANDROID_RELA[{i}] magic={d[:4]!r} size={len(d)}')

          def sleb128(data,pos):
              result=0;shift=0
              while True:
                  b=data[pos];pos+=1
                  result|=(b&0x7f)<<shift;shift+=7
                  if not (b&0x80):
                      if b&0x40:result-=(1<<shift)
                      return result,pos

          import struct,sys
          def unpack_android_rela(d,want):
              # Android packed RELA (APS) or plain-after-magic (APA).
              # want(addend) -> bool ; keeps only matching entries
              res=[]
              if d[:4]==b'APA\x00':
                  for o in range(4,len(d)-23,24):
                      ro,ri,ra=struct.unpack_from('<QQq',d,o)
                      if want(ra):res.append((ro,ri&0xffffffff,ra))
                  return res,'APA'
              if not d[:3]==b'APS':
                  return None,d[:4].decode('latin1')
              pos=4
              count,pos=sleb128(d,pos)
              print(f'  packed count={count}',file=sys.stderr,flush=True)
              offset=0;info=0;addend=0
              G_OFFSET_DELTA=1;G_INFO=2;G_ADDEND=4
              n=0;checked=0
              while n<count:
                  gsize,pos=sleb128(d,pos)
                  gflags,pos=sleb128(d,pos)
                  gd=None
                  if gflags & G_OFFSET_DELTA:
                      gd,pos=sleb128(d,pos)
                  if gflags & G_INFO:
                      gi,pos=sleb128(d,pos)
                  if gflags & G_ADDEND:
                      addend+=sleb128(d,pos)[0]
                  for _ in range(gsize):
                      if gflags & G_OFFSET_DELTA:
                          offset+=gd
                      else:
                          delta,pos=sleb128(d,pos);offset+=delta
                      if not (gflags & G_INFO):
                          info,pos=sleb128(d,pos)
                      if not (gflags & G_ADDEND):
                          addend+=sleb128(d,pos)[0]
                      checked+=1
                      if want(addend):res.append((offset,info&0xffffffff,addend))
                      if checked % 500000==0:
                          print(f'  {checked}/{count} relocs',file=sys.stderr,flush=True)
                  n+=gsize
              print(f'  done {checked} relocs',file=sys.stderr,flush=True)
              return res,'APS'

          entries=[]
          for d in android_rela+plain_rela:
              print('unpacking reloc section...',file=sys.stderr,flush=True)
              r,magic=unpack_android_rela(d,lambda ra: ra==TARGET or 0x7c0c000<=ra<0x7c0e000)
              if r is None:
                  out.append(f'UNPACK_FAILED magic={magic!r}')
                  continue
              out.append(f'reloc_section magic={magic} matching={len(r)}')
              entries.extend(r)
          out.append(f'total_matching_relocations={len(entries)}')
          out.append(f'total_relocations_decoded={len(entries)}')

          slots=[(ro,rt) for ro,rt,ra in entries if ra==TARGET]
          out.append(f'SLOTS_WITH_ADDEND_{hex(TARGET)}: {[(hex(a),t) for a,t in slots]}')
          # also: any relocation pointing INTO target function region or nearby methods
          near=[(hex(ra),hex(ro),rt) for ro,rt,ra in entries if 0x7c0c000<=ra<0x7c0e000][:60]
          out.append(f'RELOCS_INTO_0x7c0c000-0x7c0e000 ({len(near)}): {near}')

          def rd64(va):
              o=vaoff(va)
              return int.from_bytes(raw[o:o+8],'little') if o is not None else None
          slot_vas=[a for a,_ in slots]
          for sl in sorted(set(slot_vas)):
              out.append(f'\n=== VTABLE WINDOW around {hex(sl)} ===')
              for va in range(sl-0x100,sl+0x108,8):
                  v=rd64(va)
                  mark=' <<<< TARGET SLOT' if va==sl else ''
                  out.append(f'{hex(va)}: {hex(v) if v is not None else "?"}{mark}')

          starts=[]
          for addr,size,mnem,ops in md.disasm_lite(tb,tva):
              if mnem=='stp' and 'x29, x30' in ops and '[sp' in ops:
                  starts.append(addr)
          starts=sorted(set(starts))
          def fstart(a):
              j=bisect.bisect_right(starts,a)-1
              return starts[j] if j>=0 else tva
          def fend(fs):
              j=bisect.bisect_right(starts,fs)
              return starts[j] if j<len(starts) else tend

          # direct bl AND tail-call b to TARGET
          direct=[]
          for addr,size,mnem,ops in md.disasm_lite(tb,tva):
              if mnem in ('bl','b') and ops.startswith('#'):
                  try:t=int(ops[1:],16)
                  except:continue
                  if t==TARGET:direct.append((addr,mnem))
          out.append(f'DIRECT_BL_OR_B_TO_TARGET: {[(hex(a),m) for a,m in direct]} callers={[hex(fstart(a)) for a,_ in direct]}')

          disp_set={sl & 0xFFF for sl in slot_vas}
          pending=collections.defaultdict(list);dispatch=[]
          for addr,size,mnem,ops in md.disasm_lite(tb,tva):
              mm=re.match(r'([x]\d+), \[(x\d+)(?:, #(0x[0-9a-f]+))?\]$',ops) if mnem=='ldr' else None
              if mm:
                  reg=mm.group(1)
                  disp=int(mm.group(3),16) if mm.group(3) else 0
                  if disp in disp_set:pending[reg].append((addr,disp))
                  continue
              if mnem=='blr':
                  for la,dd in pending.get(ops,[])[-3:]:
                      if addr-la<0x60:dispatch.append((la,addr,dd))
              if mnem in ('ldr','mov','add','adrp') and ops:
                  pending.pop(ops.split(',')[0],None)
          seen=set();dc=[]
          for la,ba,dd in dispatch:
              if (la,ba) not in seen:seen.add((la,ba));dc.append((la,ba,dd))
          out.append(f'\nDISPATCH_CANDIDATES={len(dc)}')
          ranked=collections.defaultdict(list)
          for la,ba,dd in dc:ranked[fstart(la)].append((la,ba,dd))
          scored=[]
          for fs,sites in ranked.items():
              fe=min(fend(fs),fs+0x2000)
              n_a0=sum(1 for z in md.disasm_lite(tb[fs-tva:fe-tva],fs) if hexmem.search(z[3]) and hexmem.search(z[3]).group(1)=='a0') if True else 0
              score=len(sites)*10+n_a0*15+(40 if 0x7b00000<=fs<0x7d00000 else 0)+(30 if 0x7e00000<=fs<0x8300000 else 0)
              scored.append((score,fs,sites,n_a0))
          scored.sort(reverse=True,key=lambda x:x[0])
          for score,fs,sites,n_a0 in scored[:40]:
              out.append(f'DISPATCH fn=0x{fs:x} score={score} sites={[f"ldr@0x{la:x}/blr@0x{ba:x}/disp=0x{dd:x}" for la,ba,dd in sites]} a0_reads={n_a0}')

          for score,fs,sites,n_a0 in scored[:12]:
              fe2=min(fend(fs),fs+0x1500)
              out.append(f'\n--- DISPATCH SURGERY 0x{fs:x}-0x{fe2:x} score={score} ---')
              ann={}
              bl=list(md.disasm(tb[fs-tva:fe2-tva],fs))
              for i,z in enumerate(bl):
                  if z.mnemonic!='adrp':continue
                  m=re.match(r'(x\d+), #0x([0-9a-f]+)',z.op_str)
                  if not m:continue
                  reg=m.group(1);page=int(m.group(2),16)
                  for q in bl[i+1:i+8]:
                      mm=re.match(rf'{reg}, {reg}, #0x([0-9a-f]+)',q.op_str) if q.mnemonic=='add' else None
                      if mm:
                          va=page+int(mm.group(1),16);s=cstr(va)
                          if s:ann[q.address]=f' ; STR@0x{va:x}={s!r}'
                          break
              site_addrs={la for la,_,_ in sites}|{ba for _,ba,_ in sites}
              for z in bl:
                  tag=''
                  h=hexmem.search(z.op_str)
                  off=int(h.group(1),16) if h else None
                  if off in (0x80,0x88,0xa0,0xa8):tag+=f' <COMPACT+{hex(off)}>'
                  if off in (0xf4,0x100,0x11c,0x128):tag+=f' <LARGE+{hex(off)}>'
                  if z.address in site_addrs:tag+=' <<< DISPATCH SITE'
                  if z.mnemonic in ('cmp','cbz','cbnz','tbz','tbnz','blr','br') or z.mnemonic.startswith('bl ') or tag or z.address in ann:
                      out.append(f'0x{z.address:x}: {z.mnemonic:9} {z.op_str}{ann.get(z.address,"")}{tag}')

          txt='\n'.join(out)
          Path('/tmp/out/c670_packedrel.txt').write_text(txt)
          print(f'report bytes={len(txt)}')
          PY
          python3 /tmp/ef/packedrel_trace.py
      - name: Show compact summary
        run: |
          grep -E "ANDROID_RELA|total_relocations|SLOTS_WITH|RELOCS_INTO|VTABLE WINDOW|TARGET SLOT|DIRECT_BL_OR_B|DISPATCH_CANDIDATES|DISPATCH fn=" /tmp/out/c670_packedrel.txt | head -60 || true
      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: efootball-c670-packedrel
          path: /tmp/out/
          retention-days: 7
