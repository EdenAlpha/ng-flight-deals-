name: Imperial fine-control tolerance bridge
on:
  pull_request:
    branches: [imperial-anchor-bridge-codeword]
permissions: {contents: read}
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py zstandard numba pysz boto3
      - name: Download exact Imperial Valley HDF5 record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Spend fine anchor error-box freedom to erase omitted channels
        run: python research/imperial_anchor_bridge_codeword.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-anchor-bridge-fine-control
          path: imperial_anchor_bridge_codeword.json
          retention-days: 7
