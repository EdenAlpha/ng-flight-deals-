name: Imperial full-cable Gaussian RD map
on:
  pull_request:
    branches: [imperial-gaussian-rd-waterfill-audit]
permissions: {contents: read}
jobs:
  map:
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy scipy h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley HDF5 record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';k='imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file(b,k,'imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Map Gaussian RD and matched SZ3 across cable partition
        run: python research/imperial_full_cable_gaussian_rd_map.py imperial.h5 ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-full-cable-gaussian-rd-${{ matrix.part }}
          path: imperial_full_cable_gaussian_rd_${{ matrix.part }}.json
          retention-days: 7
