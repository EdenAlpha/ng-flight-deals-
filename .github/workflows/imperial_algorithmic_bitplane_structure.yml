name: Imperial algorithmic bitplane structure audit
on:
  pull_request:
    branches: [imperial-probability-shaped-legal-paths]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy h5py boto3
      - name: Download three consecutive Imperial records
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          b='gdr-data-lake';prefix='imperialvalleydas/v1.0.0/';target=prefix+'DF__UTC_20201113_235932.602.h5'
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED));rows=[]
          for pg in s.get_paginator('list_objects_v2').paginate(Bucket=b,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].endswith('.h5'):rows.append((o['Key'],int(o['Size'])))
          rows.sort();keys=[x[0] for x in rows];i=keys.index(target);sel=rows[i-2:i+1]
          for j,(k,n) in enumerate(sel):s.download_file(b,k,f'r{j}.h5');assert os.path.getsize(f'r{j}.h5')==n
          print(sel)
          PY
      - name: Search finite-field recurrences in legal reconstruction states
        run: python research/imperial_algorithmic_bitplane_structure.py r0.h5 r1.h5 r2.h5
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-algorithmic-bitplane-structure
          path: imperial_algorithmic_bitplane_structure.json
          retention-days: 7
