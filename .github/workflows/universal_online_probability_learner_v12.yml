name: Universal online probability learner v12
on:
  pull_request:
    branches: [universal-auto-entropy-context-v7]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy h5py boto3 pysz zstandard brotli numba
      - run: python research/download_imperial.py imperial.h5
      - run: PYTHONPATH=research python research/universal_online_probability_learner_v12.py imperial.h5
      - uses: actions/upload-artifact@v4
        with:
          name: universal-online-probability-learner-v12
          path: universal_online_probability_learner_v12.json
          retention-days: 30
