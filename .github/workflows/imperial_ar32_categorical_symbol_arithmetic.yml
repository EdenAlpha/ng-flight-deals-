name: Imperial AR32 categorical symbol arithmetic

on:
  pull_request:
    paths:
      - 'research/imperial_ar32_categorical_symbol_arithmetic.py'
      - '.github/workflows/imperial_ar32_categorical_symbol_arithmetic.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy numba h5py zstandard pysz boto3
      - name: Download canonical Imperial Valley record
        run: |
          python - <<'PY'
          import boto3,os
          from botocore import UNSIGNED
          from botocore.config import Config
          s=boto3.client('s3',config=Config(signature_version=UNSIGNED))
          s.download_file('gdr-data-lake','imperialvalleydas/v1.0.0/DF__UTC_20201113_235932.602.h5','imperial.h5')
          assert os.path.getsize('imperial.h5')==415030456
          PY
      - name: Run categorical symbol arithmetic
        run: python research/imperial_ar32_categorical_symbol_arithmetic.py imperial.h5
      - name: Surface compact result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('imperial_ar32_categorical_symbol_arithmetic.json'))
          for r in d['rows']:
              b=r['best'];level='notice' if b['gain_vs_bitwise_baseline']>1 else 'warning'
              print(f"::{level} title=categorical-K {r['region']}::{b['context']} bps={b['bps']:.5f}, bitwise={r['bitwise_baseline_bps']:.5f}, SZ3={r['sz3_bps']:.5f}, gainBitwise={b['gain_vs_bitwise_baseline']:.6f}, alphabet={b['alphabet_size']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imperial-ar32-categorical-symbol-arithmetic
          path: imperial_ar32_categorical_symbol_arithmetic.json
          retention-days: 7
