name: GCA4 real Volve versus HPEZ QoZ2

on:
  push:
    branches: [general-seismic-master-portfolio-v2]
    paths:
      - 'research/gca_factor_context_v4.py'
      - '.github/workflows/gca2_real_volve_hpez.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-hpez:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout GCA4 implementation
        uses: actions/checkout@v4
      - name: Checkout official HPEZ QoZ2 source
        uses: actions/checkout@v4
        with:
          repository: JLiu-1/HPEZ-QoZ2.0
          ref: 291699d06d754f58e074d2b2a3a355f45a239e34
          path: hpez_source
      - name: Sparse checkout pinned real Volve SEG-Y
        uses: actions/checkout@v4
        with:
          repository: trhallam/segysak
          ref: 798307eeaf84b63a71272ba638863c538a814f26
          path: segysak_source
          sparse-checkout: |
            examples/data/volve10r12-full-twt-sub3d.sgy
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and codec dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake make g++ pkg-config
          pip install --quiet numpy numba
      - name: Build official HPEZ
        run: |
          cmake -S hpez_source -B hpez_source/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/hpez_install"
          cmake --build hpez_source/build -j2
          cmake --install hpez_source/build
          "$PWD/hpez_install/bin/hpez" -h | head -80
      - name: Extract exact numeric cube and epsilon
        run: |
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          p=Path('segysak_source/examples/data/volve10r12-full-twt-sub3d.sgy')
          NI,NX,NT=61,202,850
          assert p.stat().st_size==44855680
          X=np.empty((NI,NX,NT),np.float32)
          with p.open('rb') as f:
              f.seek(3600)
              for k in range(NI*NX):
                  f.read(240)
                  X.reshape(-1,NT)[k]=np.frombuffer(f.read(4*NT),dtype='>f4').astype(np.float32)
          X.tofile('volve_f32.bin')
          eps=.1*float(X.astype(np.float64).std())
          Path('eps.txt').write_text(repr(eps))
          print({'shape':X.shape,'numeric_bytes':X.nbytes,'epsilon':eps})
          PY
      - name: Run full-paper HPEZ q4 at matched ABS epsilon
        run: |
          EPS="$(cat eps.txt)"
          "$PWD/hpez_install/bin/hpez" -f -i volve_f32.bin -z volve.hpez -3 850 202 61 -M ABS "$EPS" -q 4
          "$PWD/hpez_install/bin/hpez" -f -z volve.hpez -o volve.hpez.out -3 850 202 61 -M ABS "$EPS"
          ls -l volve.hpez volve.hpez.out
      - name: Run GCA4 and verify both decoded outputs
        run: |
          python research/gca_factor_context_v4.py \
            segysak_source/examples/data/volve10r12-full-twt-sub3d.sgy \
            --stream volve_gca4.bin --json gca4.json
          python - <<'PY'
          import json, numpy as np, os
          from pathlib import Path
          X=np.fromfile('volve_f32.bin',dtype=np.float32).reshape(61,202,850)
          H=np.fromfile('volve.hpez.out',dtype=np.float32).reshape(61,202,850)
          eps=float(Path('eps.txt').read_text())
          hme=float(np.max(np.abs(X.astype(np.float64)-H.astype(np.float64))))
          if hme > eps*(1+3e-6): raise RuntimeError(('HPEZ hard bound',hme,eps))
          g=json.loads(Path('gca4.json').read_text())
          hb=os.path.getsize('volve.hpez'); gb=os.path.getsize('volve_gca4.bin')
          out={
            'source':'trhallam/segysak@798307eeaf84b63a71272ba638863c538a814f26:examples/data/volve10r12-full-twt-sub3d.sgy',
            'hpez_source_commit':'JLiu-1/HPEZ-QoZ2.0@291699d06d754f58e074d2b2a3a355f45a239e34',
            'hpez_level':4,'shape':[61,202,850],'numeric_bytes':int(X.nbytes),'epsilon':eps,
            'gca4_bytes':gb,'gca4_maxerr':g['maxerr'],'gca4_decoder_valid':g['decoder_valid'],
            'hpez_bytes':hb,'hpez_maxerr':hme,'gain_hpez_over_gca4':hb/gb,
            'gca4_reduction_percent_vs_hpez':100*(1-gb/hb)
          }
          Path('volve_gca4_vs_hpez.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gca4-real-volve-vs-hpez
          path: volve_gca4_vs_hpez.json
          retention-days: 30
