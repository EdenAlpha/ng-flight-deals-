name: eFootball APK analysis PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip binutils file ripgrep python3 python3-pip openjdk-17-jre-headless
          curl -L --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip
          mkdir -p /opt/jadx && unzip -q /tmp/jadx.zip -d /opt/jadx
          echo /opt/jadx/bin >> "$GITHUB_PATH"
          python3 -m pip install --break-system-packages androguard==4.1.3 lief==0.17.0 pyelftools==0.32 capstone==5.0.6
      - name: Download eFootball 11.0.1 XAPK
        run: |
          set -euxo pipefail
          mkdir -p work/download work/bundle work/apks work/unpacked work/jadx report hits/native
          curl -L --fail --retry 5 --retry-delay 3 -A 'Mozilla/5.0' -o work/download/efootball.xapk 'https://d.apkpure.net/b/XAPK/jp.konami.pesam?version=latest'
          file work/download/efootball.xapk
          ls -lh work/download/efootball.xapk
          unzip -q work/download/efootball.xapk -d work/bundle
          find work/bundle -type f -name '*.apk' -exec cp '{}' work/apks/ \;
          find work/apks -type f -printf '%f %s\n' | sort
      - name: Verify and inventory APKs
        run: |
          set -euxo pipefail
          sha256sum work/apks/*.apk > hits/apk_sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          from androguard.core.apk import APK
          o=[]
          for p in sorted(Path('work/apks').glob('*.apk')):
            try:
              a=APK(str(p)); o += [f'FILE={p.name}', f'package={a.get_package()} version={a.get_androidversion_name()} code={a.get_androidversion_code()}', 'permissions='+','.join(sorted(a.get_permissions())), 'activities='+','.join(sorted(a.get_activities())), 'services='+','.join(sorted(a.get_services())), '']
            except Exception as e: o += [f'FILE={p.name} ERROR={e}','']
          Path('hits/android_inventory.txt').write_text('\n'.join(o),errors='ignore')
          PY
          for a in work/apks/*.apk; do echo "### $a"; keytool -printcert -jarfile "$a" 2>&1 | sed -n '1,35p'; done > hits/certificates.txt || true
      - name: Decompile Java and resources
        run: |
          set -euxo pipefail
          mapfile -t APKS < <(find work/apks -type f -name '*.apk' | sort)
          jadx --no-debug-info --show-bad-code --deobf -j 4 -d work/jadx "${APKS[@]}" 2>&1 | tee hits/jadx.log || true
          echo "files=$(find work/jadx -type f | wc -l)" >> hits/jadx.log
      - name: Extract and inspect native libraries
        run: |
          set -euxo pipefail
          n=0; for a in work/apks/*.apk; do n=$((n+1)); mkdir -p "work/unpacked/$n"; unzip -q -o "$a" -d "work/unpacked/$n" || true; done
          find work/unpacked -type f -name '*.so' -printf '%p %s\n' | sort -k2 -nr > hits/native_libraries.txt
          find work/unpacked -type f -printf '%p %s\n' | sort -k2 -nr | head -300 > hits/largest_files.txt
          find work/unpacked -type f -name '*.so' -print0 | while IFS= read -r -d '' so; do
            k=$(echo "$so" | tr '/ ' '__')
            { echo "FILE=$so"; file "$so"; sha256sum "$so"; readelf -d "$so" 2>/dev/null | grep -E 'NEEDED|SONAME' || true; readelf -Ws "$so" 2>/dev/null | grep -Ei 'stun|turn|ice|dtls|ssl|tls|udp|socket|sendto|recvfrom|connect|bind|score|match|result|winner|clock' | head -1500 || true; } > "hits/native/$k.elf.txt"
            strings -a -n 5 "$so" > "hits/native/$k.strings.txt" || true
          done
      - name: Surgical keyword and endpoint scan
        run: |
          set -euxo pipefail
          P='stun|turn\.konami|turn|ice|relay|dtls|boringssl|openssl|xor.?mapped|mapped.?address|message.?integrity|fingerprint|change.?request|response.?port|bc\.googleusercontent|googleusercontent|udp|datagram|socket|peer.?to.?peer|p2p|friend.?match|match.?result|final.?score|score|winner|loser|victory|defeat|draw|half.?time|full.?time|extra.?time|added.?time|stoppage|abbrev|abbreviation|short.?name|team.?code|match.?clock|game.?clock|pause|resume'
          rg -n -i --hidden --glob '!*.so' "$P" work/jadx > hits/jadx_hits.txt || true
          cat hits/native/*.strings.txt 2>/dev/null | grep -Ein "$P" | head -50000 > hits/native_hits.txt || true
          cat hits/native/*.strings.txt 2>/dev/null | grep -Eio '([a-z0-9-]+\.)+(konami\.com|googleusercontent\.com|googleapis\.com|gstatic\.com)' | sort -u > hits/endpoints.txt || true
          python3 - <<'PY'
          from pathlib import Path
          pats={n:bytes.fromhex(h) for n,h in {'080Abe':'080a','090Abe':'090a','080Bbe':'080b','090Bbe':'090b','080Cbe':'080c','090Cbe':'090c','080Ale':'0a08','090Ale':'0a09','080Ble':'0b08','090Ble':'0b09','080Cle':'0c08','090Cle':'0c09'}.items()}
          r=[]
          for p in Path('work/unpacked').rglob('*'):
            if p.is_file() and p.suffix in {'.so','.dex','.bin','.dat','.pak'} and p.stat().st_size < 650_000_000:
              try:d=p.read_bytes()
              except:continue
              c={k:d.count(v) for k,v in pats.items()}
              if any(c.values()): r.append(f'{p} size={len(d)} '+' '.join(f'{k}={v}' for k,v in c.items()))
          Path('hits/connectivity_constants.txt').write_text('\n'.join(r))
          PY
      - name: Resolve live LAN and result code references
        run: |
          set -euxo pipefail
          SO="$(find work/unpacked -type f -name libUE4.so | head -n1)"
          export SO
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM,arm64
          p=Path(os.environ['SO']); d=p.read_bytes()
          terms=['P2P_ADHOC_WIFIDIRECTLAN','P2P_ADHOC_LAN','direct_online_turn_mode','LOCAL_GAMERELAY','CMD_SET_LOCAL_GAMERELAY_LIST','TaskEvCompeLocalGamerelay','CMD_CHANGE_GAMEPHASE','CMD_GET_GAME_RESULT','CMD_SET_GAME_RESULT','CMD_ADD_SCORE','MatchScoreChanged','m_homeScore','m_awayScore','GetGameScore','SetHomeScore','SetAwayScore','EPKR_GamePhase::GameplayFinished','EPKR_GamePhase::ResultPresentation','EMatchFlowTask::SendServerMatchEnd','MatchResultTimeUpDemo','Match/End/MatchEnd','ROOM_GAME_PHASE_END','NUM_GUESTS_END_MATCH','ADDED_TIME','m_isExtraTime','HOST_DIRECT','HOST_RELAY','PUNCHING_FINISHED','START_UDP_HOLE_PUNCHING','OnlineSystemMultiplaySessionStrategyP2pFullMeshWithTurn.cpp']
          with p.open('rb') as f:
            e=ELFFile(f); text=e.get_section_by_name('.text'); tb=text.data(); tva=int(text['sh_addr'])
            loads=[(int(s['p_offset']),int(s['p_filesz']),int(s['p_vaddr'])) for s in e.iter_segments() if s['p_type']=='PT_LOAD']
          def ova(o):
            for po,sz,va in loads:
              if po<=o<po+sz:return va+o-po
          inst=[]
          for t in terms:
            s=0
            while True:
              o=d.find(t.encode(),s)
              if o<0:break
              inst.append((t,o,ova(o)));s=o+1
          labels={va:(t,o) for t,o,va in inst if va is not None};pages={a&~0xfff for a in labels}
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM);md.detail=True;regs={};refs=[];n=0
          for i in md.disasm(tb,tva):
            n+=1
            for r,(pg,k) in list(regs.items()):
              if n-k>8:regs.pop(r,None)
            ops=i.operands
            if i.mnemonic=='adrp' and len(ops)>=2 and ops[0].type==arm64.ARM64_OP_REG and ops[1].type==arm64.ARM64_OP_IMM:
              pg=int(ops[1].imm)
              if pg in pages:regs[ops[0].reg]=(pg,n)
            elif i.mnemonic=='add' and len(ops)>=3 and ops[1].type==arm64.ARM64_OP_REG and ops[2].type==arm64.ARM64_OP_IMM and ops[1].reg in regs:
              a=regs[ops[1].reg][0]+int(ops[2].imm)
              if a in labels:refs.append((i.address,a,'ADRP+ADD'))
            elif i.mnemonic=='adr' and len(ops)>=2 and ops[1].type==arm64.ARM64_OP_IMM:
              a=int(ops[1].imm)
              if a in labels:refs.append((i.address,a,'ADR'))
          by={}
          for pc,a,k in refs:by.setdefault(a,[]).append((pc,k))
          out=['=== TARGETS / CODE XREFS ===']
          for t,o,va in inst:
            rr=by.get(va,[]);out.append(f'{t}\toff=0x{o:x}\tva=0x{va:x}\txrefs={len(rr)}\t'+','.join(f'0x{x:x}:{k}' for x,k in rr[:30]))
          out.append('\n=== NEARBY ENUM/CONFIG STRINGS ===')
          for t,o,va in inst:
            out.append(f'\n--- {t} @ 0x{o:x} ---')
            lo=max(0,o-450);hi=min(len(d),o+450)
            for m in re.finditer(rb'[ -~]{4,}',d[lo:hi]):out.append(f'0x{lo+m.start():x} '+m.group().decode('ascii','ignore'))
          Path('hits/xref_direct.txt').write_text('\n'.join(out),errors='ignore')
          print('\n'.join(out))
          PY
      - name: Assemble report
        run: |
          {
            echo '# eFootball current Android package static analysis'; date -u
            echo '## APK inventory'; cat hits/android_inventory.txt
            echo '## Certificates'; cat hits/certificates.txt
            echo '## Native libraries'; cat hits/native_libraries.txt
            echo '## Largest files'; sed -n '1,180p' hits/largest_files.txt
            echo '## Endpoints'; cat hits/endpoints.txt
            echo '## Connectivity constant counts'; cat hits/connectivity_constants.txt
            echo '## Direct LAN/result xrefs'; cat hits/xref_direct.txt
            echo '## Java/resource high-value hits'; sed -n '1,1800p' hits/jadx_hits.txt
            echo '## Native high-value hits'; sed -n '1,3500p' hits/native_hits.txt
            echo '## JADX tail'; tail -200 hits/jadx.log
          } > report/report.md
          cat report/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: efootball-static-analysis
          path: |
            report/
            hits/
          retention-days: 7
