name: Soda Lake causal range-coded support edge sweep
on:
  pull_request:
    branches: [soda-grid-lattice]
permissions: {contents: read}
jobs:
  edge:
    strategy:
      fail-fast: false
      matrix:
        p: [35,45,75,85]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard pysz boto3 'constriction~=0.4.2'
      - name: Download deterministic edge shot
        shell: bash
        env:
          P: ${{ matrix.p }}
        run: |
          python - <<'PY'
          import boto3,os,json
          from botocore import UNSIGNED
          from botocore.config import Config
          p=int(os.environ['P']);s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*p/100);k,n=keys[i];print('SHOT',p,i,k,n,flush=True);s3.download_file(bucket,k,'shot.sgy');json.dump({'percentile':p,'index':i,'key':k,'size':n,'total':len(keys)},open('selection.json','w'),indent=2)
          PY
      - run: python research/soda_causal_range_support.py shot.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-causal-range-p${{ matrix.p }}
          path: |
            selection.json
            soda_causal_range_support.json
          retention-days: 7
