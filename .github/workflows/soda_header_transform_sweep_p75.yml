name: Soda p75 exact SEG-Y header transform sweep
on:
  pull_request:
    branches: [soda-record-standalone-p75]
permissions: {contents: read}
jobs:
  header:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet numpy segyio zstandard pysz boto3 brotli
      - name: Download deterministic p75 shot
        shell: bash
        run: |
          python - <<'PY'
          import boto3,json
          from botocore import UNSIGNED
          from botocore.config import Config
          s3=boto3.client('s3',config=Config(signature_version=UNSIGNED));bucket='gdr-data-lake';prefix='soda_lake/raw_seismic/2010/v1.0.0/';keys=[]
          for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
            for o in pg.get('Contents',[]):
              if o['Key'].lower().endswith(('.sgy','.segy','.seg')) and o['Size']>3600:keys.append((o['Key'],int(o['Size'])))
          keys.sort();i=round((len(keys)-1)*.75);k,n=keys[i]
          if len(keys)!=8321 or i!=6240 or k!='soda_lake/raw_seismic/2010/v1.0.0/F6618R1.SGY':raise RuntimeError(('p75 drift',len(keys),i,k))
          s3.download_file(bucket,k,'shot.sgy');print('SHOT',i,k,n,flush=True)
          PY
      - name: Sweep exact reversible header transforms
        run: python research/soda_header_transform_sweep.py shot.sgy
      - uses: actions/upload-artifact@v4
        with:
          name: soda-header-transform-sweep-p75
          path: soda_header_transform_sweep.json
          retention-days: 7
